// ── Cross-stitch: canvas editor ────────────────────────────────────────────
const XS_DEFAULT_CODES = ["310","B5200","666","797","700","726","435","3806","3846","971"];
const XS_FONTS = {
  serif:  { label: "Serif",  family: '"BC Civitas", serif',        weight: 400 },
  sans:   { label: "Sans",   family: '"Söhne", sans-serif',        weight: 600 },
  script: { label: "Script", family: '"Dancing Script", cursive',  weight: 700 },
};
// Render text to an offscreen canvas at 1px-per-stitch and return the list of
// [dx,dy] cell offsets that are "on" — i.e. the text as stitches.
function rasterizeText(text, font, sizeCells) {
  if (!text) return [];
  const f = XS_FONTS[font] || XS_FONTS.sans;
  const fontStr = `${f.weight} ${Math.max(6, sizeCells)}px ${f.family}`;
  const cv = document.createElement('canvas');
  let ctx = cv.getContext('2d');
  ctx.font = fontStr;
  const m = ctx.measureText(text);
  const asc = Math.ceil(m.actualBoundingBoxAscent || sizeCells * 0.8);
  const desc = Math.ceil(m.actualBoundingBoxDescent || sizeCells * 0.25);
  const w = Math.max(1, Math.ceil(m.width) + 2), h = Math.max(1, asc + desc + 2);
  cv.width = w; cv.height = h;
  ctx = cv.getContext('2d');
  ctx.font = fontStr;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#000';
  ctx.fillText(text, 1, asc + 1);
  let data;
  try { data = ctx.getImageData(0, 0, w, h).data; } catch (e) { return []; }
  const out = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { if (data[(y * w + x) * 4 + 3] >= 128) out.push([x, y]); }
  return out;
}
// Small canvas preview of a stitch grid (used in the saved-designs list/preview).
function StitchThumb({ w, h, cells, size = 64, bg = '#FFFFFF' }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const ctx = cv.getContext('2d');
    const scale = Math.min(size / w, size / h);
    const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    cv.width = cw; cv.height = ch;
    ctx.clearRect(0, 0, cw, ch);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);
    for (let i = 0; i < cells.length; i++) {
      if (!cells[i]) continue;
      ctx.fillStyle = cells[i];
      ctx.fillRect((i % w) * scale, Math.floor(i / w) * scale, Math.ceil(scale), Math.ceil(scale));
    }
  }, [w, h, cells, size, bg]);
  return <canvas ref={ref} style={{ width: size, height: 'auto', display: 'block', imageRendering: 'pixelated', borderRadius: 4 }}/>;
}

function CrossStitchApp({ preset, palette, bgImage, autoGrid, initialDesign = null, onBack }) {
  // Board dimensions are stateful (not fixed to the initial preset) so a saved
  // design opened via loadDesign can restore the exact size it was made at,
  // rather than being forced into the currently active canvas size.
  const [dims, setDims] = useState({ w: preset.w, h: preset.h, name: preset.name });
  const W = dims.w, H = dims.h;
  const [panelOpen, setPanelOpen] = useState(() => (typeof window === 'undefined' || window.innerWidth > 900));
  const isMobile = useIsMobile();
  // Mobile bottom-sheet router: null | 'palette' | 'text' | 'materials'
  const [sheet, setSheet] = useState(null);
  const defaultPalette = useMemo(() => XS_DEFAULT_CODES.map(dmcByCode).filter(Boolean), []);
  const initPalette = useMemo(() => {
    const base = (palette && palette.length) ? palette.slice() : defaultPalette.slice();
    // Make sure every color present in an auto-generated design is selectable.
    if (autoGrid) {
      const have = new Set(base.map(c => c.hex));
      for (const hex of autoGrid) {
        if (hex && !have.has(hex)) { const d = DMC.find(c => c.hex === hex); if (d) { have.add(hex); base.push(d); } }
      }
    }
    return base;
  }, [palette, autoGrid, defaultPalette]);

  const [pal, setPal] = useState(initPalette);
  const [color, setColor] = useState(initPalette[0] || dmcByCode("310"));
  const [tool, setTool] = useState("pen");
  const [bg, setBg] = useState(bgImage || null);
  const [showBg, setShowBg] = useState(!!bgImage);
  const [bgOpacity, setBgOpacity] = useState(0.5);
  const [showGrid, setShowGrid] = useState(true);
  const [cellSize, setCellSize] = useState(12);
  const [showPicker, setShowPicker] = useState(false);
  const [pickerSearch, setPickerSearch] = useState("");
  const [confirmClear, setConfirmClear] = useState(false);
  const [zoom, setZoom] = useState(1);
  const adjustZoom = useCallback((delta) => {
    setZoom(z => Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +(z + delta).toFixed(2))));
  }, []);
  const resetZoom = useCallback(() => setZoom(1), []);
  const [fabric, setFabric] = useState(AIDA_FABRICS[0]);
  const [showFabric, setShowFabric] = useState(false);
  const [text, setText] = useState("");
  const [textFont, setTextFont] = useState("sans");
  const [textSize, setTextSize] = useState(14);
  const textStamp = useMemo(() => rasterizeText(text, textFont, textSize), [text, textFont, textSize]);
  // Materials + save state (mirrors the quilt flow, device-local).
  const [version, setVersion] = useState(0);
  const bump = useCallback(() => setVersion(v => v + 1), []);
  const [savedStitches, setSavedStitches] = useState(loadSavedStitches);
  const [saveError, setSaveError] = useState("");
  const [showSave, setShowSave] = useState(false);
  const [saveName, setSaveName] = useState("");
  const [showMyStitches, setShowMyStitches] = useState(false);
  const [viewStitch, setViewStitch] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [materialsOpen, setMaterialsOpen] = useState(true);
  // Id of the saved design currently open, so "Save" updates it in place.
  const [currentStitchId, setCurrentStitchId] = useState(null);
  const [justSaved, setJustSaved] = useState(false);
  const savedFlashRef = useRef(null);
  const flashSaved = useCallback(() => {
    setJustSaved(true);
    if (savedFlashRef.current) clearTimeout(savedFlashRef.current);
    savedFlashRef.current = setTimeout(() => setJustSaved(false), 1600);
  }, []);
  const currentStitch = savedStitches.find(d => d.id === currentStitchId) || null;
  // Color library popover (mirrors the quilt "My palette" + / library pattern).
  const [search, setSearch] = useState("");
  const [grp, setGrp] = useState("All");
  const [xsCustoms, setXsCustoms] = useState([]);
  const [picker, setPicker] = useState(null);
  const libraryAnchorRef = useRef(null);
  const openLibrary = useCallback((anchorRef) => {
    if (anchorRef && anchorRef.current) libraryAnchorRef.current = anchorRef.current;
    setPicker({});
  }, []);
  const closePicker = useCallback(() => setPicker(null), []);
  const allColors = useMemo(() => [...DMC, ...xsCustoms], [xsCustoms]);
  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return allColors.filter(c =>
      (grp === "All" || c.group === grp) &&
      (!q || c.name.toLowerCase().includes(q) || (c.code && c.code.toLowerCase().includes(q))));
  }, [allColors, search, grp]);
  const dmcSuggested = useMemo(() => DMC_PALETTES.map(p => ({ name: p.name, colors: resolveDmcPalette(p) })), []);
  useEffect(() => {
    const ok = persistSavedStitches(savedStitches);
    setSaveError(ok ? "" : "Couldn't save — this device's storage may be full.");
  }, [savedStitches]);

  const cellsRef = useRef(autoGrid ? autoGrid.slice() : new Array(W * H).fill(null));
  const previewRef = useRef(null);
  const canvasRef = useRef(null);
  const wrapRef = useRef(null);
  const bgImgRef = useRef(null);
  const rafRef = useRef(0);
  const undoRef = useRef([]);
  const drawingRef = useRef(false);
  const startRef = useRef(null);
  const lastRef = useRef(null);
  // Selection = one or more color groups. Stored as a Map of cell index -> hex
  // so a selection can span multiple colors (shift-add or marquee).
  const selRef = useRef(null);   // {cells:Map<number,string>, minX,minY,maxX,maxY} | null
  const dragRef = useRef(null);  // {dx,dy} in cells, while moving
  const movingRef = useRef(false);
  const dupRef = useRef(false);    // Alt/Option held → the drag leaves the original behind
  const pressRef = useRef(null);   // press awaiting the drag threshold: tap = pick a color group, drag = marquee
  const marqueeRef = useRef(null); // {x0,y0,x1,y1,add} while rubber-band selecting
  const antsRef = useRef(0);       // marching-ants dash offset
  const [hasSel, setHasSel] = useState(false);
  const [selCursor, setSelCursor] = useState(null); // 'move' | 'copy' when hovering the selection

  const stats = useMemo(() => computeStitchStats(cellsRef.current, W, H, pal), [version, pal, W, H]);

  const idx = (x, y) => y * W + x;

  const redraw = useCallback(() => {
    const cv = canvasRef.current; if (!cv) return;
    const ctx = cv.getContext('2d');
    const cs = cellSize;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = fabric.hex;
    ctx.fillRect(0, 0, cv.width, cv.height);
    if (showBg && bgImgRef.current) {
      const img = bgImgRef.current;
      ctx.save();
      ctx.globalAlpha = bgOpacity;
      const scale = Math.max(cv.width / img.width, cv.height / img.height);
      const dw = img.width * scale, dh = img.height * scale;
      ctx.drawImage(img, (cv.width - dw) / 2, (cv.height - dh) / 2, dw, dh);
      ctx.restore();
    }
    const cells = cellsRef.current;
    const sel = selRef.current;
    // A move lifts the stitches off the board; a duplicate leaves them in place.
    const lifting = movingRef.current && sel && !dupRef.current;
    for (let i = 0; i < cells.length; i++) {
      if (!cells[i]) continue;
      if (lifting && sel.cells.has(i)) continue;
      ctx.fillStyle = cells[i];
      ctx.fillRect((i % W) * cs, Math.floor(i / W) * cs, cs, cs);
    }
    const pv = previewRef.current;
    if (pv) { ctx.fillStyle = color.hex; for (const [x, y] of pv) ctx.fillRect(x * cs, y * cs, cs, cs); }
    if (sel) {
      const dxo = movingRef.current && dragRef.current ? dragRef.current.dx : 0;
      const dyo = movingRef.current && dragRef.current ? dragRef.current.dy : 0;
      for (const [i, hex] of sel.cells) {
        ctx.fillStyle = hex;
        ctx.fillRect(((i % W) + dxo) * cs, (Math.floor(i / W) + dyo) * cs, cs, cs);
      }
      const inSel = (xx, yy) => xx >= 0 && yy >= 0 && xx < W && yy < H && sel.cells.has(idx(xx, yy));
      const edge = new Path2D();
      for (const i of sel.cells.keys()) {
        const x = i % W, y = Math.floor(i / W);
        const px = (x + dxo) * cs, py = (y + dyo) * cs;
        if (!inSel(x, y - 1)) { edge.moveTo(px, py); edge.lineTo(px + cs, py); }
        if (!inSel(x, y + 1)) { edge.moveTo(px, py + cs); edge.lineTo(px + cs, py + cs); }
        if (!inSel(x - 1, y)) { edge.moveTo(px, py); edge.lineTo(px, py + cs); }
        if (!inSel(x + 1, y)) { edge.moveTo(px + cs, py); edge.lineTo(px + cs, py + cs); }
      }
      // Marching ants: a light underlay plus animated dark dashes, so the
      // boundary stays legible over both pale fabric and dark stitches.
      ctx.save();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.92)';
      ctx.stroke(edge);
      ctx.strokeStyle = '#1B1917';
      ctx.setLineDash([4, 4]);
      ctx.lineDashOffset = -antsRef.current;
      ctx.stroke(edge);
      ctx.restore();
    }
    const mq = marqueeRef.current;
    if (mq) {
      const x = Math.min(mq.x0, mq.x1), y = Math.min(mq.y0, mq.y1);
      const w = Math.abs(mq.x1 - mq.x0) + 1, h = Math.abs(mq.y1 - mq.y0) + 1;
      ctx.save();
      ctx.fillStyle = 'rgba(37,99,235,0.12)';
      ctx.fillRect(x * cs, y * cs, w * cs, h * cs);
      ctx.strokeStyle = '#2563EB';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(x * cs + 0.5, y * cs + 0.5, w * cs - 1, h * cs - 1);
      ctx.restore();
    }
    if (showGrid && cs >= 5) {
      ctx.strokeStyle = 'rgba(46,41,37,0.12)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x <= W; x++) { ctx.moveTo(x * cs + 0.5, 0); ctx.lineTo(x * cs + 0.5, H * cs); }
      for (let y = 0; y <= H; y++) { ctx.moveTo(0, y * cs + 0.5); ctx.lineTo(W * cs, y * cs + 0.5); }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(46,41,37,0.34)';
      ctx.beginPath();
      for (let x = 0; x <= W; x += 10) { ctx.moveTo(x * cs + 0.5, 0); ctx.lineTo(x * cs + 0.5, H * cs); }
      for (let y = 0; y <= H; y += 10) { ctx.moveTo(0, y * cs + 0.5); ctx.lineTo(W * cs, y * cs + 0.5); }
      ctx.stroke();
    }
  }, [cellSize, showBg, bgOpacity, showGrid, color, fabric, W, H]);

  // Keep a ref to the latest redraw so a queued animation frame always paints
  // with current state. Without this, the rafRef dedupe guard below can let a
  // frame scheduled at a stale cell size (e.g. mid-resize during loadDesign)
  // fire last and repaint the board at the wrong size.
  const redrawRef = useRef(redraw);
  useLayoutEffect(() => { redrawRef.current = redraw; }, [redraw]);
  const scheduleRedraw = useCallback(() => {
    if (rafRef.current) return;
    rafRef.current = requestAnimationFrame(() => { rafRef.current = 0; redrawRef.current(); });
  }, []);

  const cancelPointerInteraction = useCallback(() => {
    drawingRef.current = false;
    movingRef.current = false;
    dupRef.current = false;
    pressRef.current = null;
    dragRef.current = null;
    marqueeRef.current = null;
    previewRef.current = null;
    startRef.current = null;
    lastRef.current = null;
    scheduleRedraw();
  }, [scheduleRedraw]);
  const { isGestureActive } = useCanvasPinchZoom(wrapRef, zoom, setZoom, cancelPointerInteraction);

  // Fit the grid to the available space; recompute on resize.
  useLayoutEffect(() => {
    const fit = () => {
      const wrap = wrapRef.current; if (!wrap) return;
      const availW = wrap.clientWidth - 48, availH = wrap.clientHeight - 48;
      const cs = Math.max(3, Math.min(30, Math.floor(Math.min(availW / W, availH / H))));
      setCellSize(cs);
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, [W, H]);

  // Layout effect (not passive) so the redraw runs for every committed render,
  // including the settled size after loadDesign resizes the board — a passive
  // effect can be coalesced away when the fit effect triggers a second render
  // before paint, leaving the canvas drawn at a stale cell size.
  useLayoutEffect(() => { redraw(); }, [redraw]);

  // Crawl the selection outline while a selection exists.
  useEffect(() => {
    if (!hasSel) { antsRef.current = 0; return undefined; }
    const t = setInterval(() => { antsRef.current = (antsRef.current + 1) % 8; scheduleRedraw(); }, 110);
    return () => clearInterval(t);
  }, [hasSel, scheduleRedraw]);

  useEffect(() => {
    if (!bg) { bgImgRef.current = null; redraw(); return; }
    const img = new Image();
    img.onload = () => { bgImgRef.current = img; redraw(); };
    img.src = bg;
  }, [bg, redraw]);

  const pushUndo = () => { undoRef.current.push(cellsRef.current.slice()); if (undoRef.current.length > 40) undoRef.current.shift(); };
  const undo = useCallback(() => {
    if (!undoRef.current.length) return;
    cellsRef.current = undoRef.current.pop();
    // The stitches the selection referred to may not exist any more, so drop it.
    selRef.current = null; movingRef.current = false; dupRef.current = false;
    dragRef.current = null; marqueeRef.current = null; pressRef.current = null;
    setHasSel(false); setSelCursor(null);
    redraw(); bump();
  }, [redraw, bump]);

  const cellFromEvent = (e) => {
    const cv = canvasRef.current; const rect = cv.getBoundingClientRect();
    const cs = cellSize * zoom;
    const x = Math.floor((e.clientX - rect.left) / cs);
    const y = Math.floor((e.clientY - rect.top) / cs);
    if (x < 0 || y < 0 || x >= W || y >= H) return null;
    return [x, y];
  };
  const cellClamped = (e) => {
    const cv = canvasRef.current; const rect = cv.getBoundingClientRect();
    const cs = cellSize * zoom;
    let x = Math.floor((e.clientX - rect.left) / cs);
    let y = Math.floor((e.clientY - rect.top) / cs);
    return [Math.max(0, Math.min(W - 1, x)), Math.max(0, Math.min(H - 1, y))];
  };

  const lineCells = (x0, y0, x1, y1) => {
    const out = []; let dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    let sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;
    while (true) { out.push([x0, y0]); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 > -dy) { err -= dy; x0 += sx; } if (e2 < dx) { err += dx; y0 += sy; } }
    return out;
  };
  const rectCells = (x0, y0, x1, y1) => {
    const out = []; const xa = Math.min(x0, x1), xb = Math.max(x0, x1), ya = Math.min(y0, y1), yb = Math.max(y0, y1);
    for (let x = xa; x <= xb; x++) { out.push([x, ya]); out.push([x, yb]); }
    for (let y = ya; y <= yb; y++) { out.push([xa, y]); out.push([xb, y]); }
    return out;
  };
  const ellipseCells = (x0, y0, x1, y1) => {
    const out = []; const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
    if (rx < 0.5 || ry < 0.5) return lineCells(x0, y0, x1, y1);
    const steps = Math.ceil(2 * Math.PI * Math.max(rx, ry));
    const seen = new Set();
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * 2 * Math.PI;
      const x = Math.round(cx + rx * Math.cos(t)), y = Math.round(cy + ry * Math.sin(t));
      const k = x + ',' + y; if (!seen.has(k) && x >= 0 && y >= 0 && x < W && y < H) { seen.add(k); out.push([x, y]); }
    }
    return out;
  };

  const applyCells = (list, hex) => { for (const [x, y] of list) { if (x >= 0 && y >= 0 && x < W && y < H) cellsRef.current[idx(x, y)] = hex; } };

  // Bucket fill: flood the contiguous region of cells matching the clicked
  // cell's value (empty by default) with `hex`, bounded by differently-colored
  // stitches. 4-connectivity.
  const floodFill = (sx, sy, hex) => {
    const cells = cellsRef.current;
    const target = cells[idx(sx, sy)];
    if (target === hex) return;
    const stack = [[sx, sy]];
    while (stack.length) {
      const [x, y] = stack.pop();
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const k = idx(x, y);
      if (cells[k] !== target) continue;
      cells[k] = hex;
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
  };

  // Collect the connected group of same-color stitches touching (sx,sy).
  // Returns a list of cell indices (empty when the cell is unstitched).
  const collectRegion = (sx, sy) => {
    const cells = cellsRef.current;
    const target = cells[idx(sx, sy)];
    if (!target) return [];
    const set = new Set();
    const out = [];
    const stack = [[sx, sy]];
    while (stack.length) {
      const [x, y] = stack.pop();
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      const k = idx(x, y);
      if (set.has(k) || cells[k] !== target) continue;
      set.add(k); out.push(k);
      stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
    }
    return out;
  };

  // Wrap a cell-index -> hex Map into a selection object (or null when empty),
  // computing the bounding box used to clamp moves to the grid.
  const makeSel = (map) => {
    if (!map || map.size === 0) return null;
    let minX = W, minY = H, maxX = 0, maxY = 0;
    for (const i of map.keys()) {
      const x = i % W, y = Math.floor(i / W);
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
    return { cells: map, minX, minY, maxX, maxY };
  };

  const deselect = () => {
    selRef.current = null; movingRef.current = false; dupRef.current = false;
    dragRef.current = null; marqueeRef.current = null; pressRef.current = null;
    setHasSel(false); setSelCursor(null); scheduleRedraw();
  };

  // Write the selected stitches at an offset as a single undo step. 'move'
  // lifts them (source cells cleared first, so a selection can overlap its own
  // old footprint); 'copy' leaves the originals behind. Either way the
  // selection follows the stitches so it can be dragged again right away.
  const commitSelection = (dx, dy, mode) => {
    const sel = selRef.current;
    if (!sel || (dx === 0 && dy === 0)) return;
    pushUndo();
    const cells = cellsRef.current;
    const entries = [...sel.cells];
    if (mode === 'move') for (const [i] of entries) cells[i] = null;
    const next = new Map();
    for (const [i, hex] of entries) {
      const nk = idx((i % W) + dx, Math.floor(i / W) + dy);
      cells[nk] = hex; next.set(nk, hex);
    }
    selRef.current = makeSel(next);
    setHasSel(true);
    redraw(); bump();
  };

  const deleteSelection = () => {
    const sel = selRef.current; if (!sel) return;
    pushUndo();
    const cells = cellsRef.current;
    for (const i of sel.cells.keys()) cells[i] = null;
    selRef.current = null; movingRef.current = false; dupRef.current = false; dragRef.current = null;
    setHasSel(false); setSelCursor(null);
    redraw(); bump();
  };

  // Duplicate via the toolbar button or Cmd/Ctrl-D — the touch path, since a
  // phone has no Option key. Drops the copy two stitches down-right, or back
  // up-left when the selection already sits against the bottom/right edge.
  const duplicateSelection = () => {
    const sel = selRef.current; if (!sel) return;
    let dx = Math.min(2, W - 1 - sel.maxX), dy = Math.min(2, H - 1 - sel.maxY);
    if (dx === 0 && dy === 0) { dx = Math.max(-2, -sel.minX); dy = Math.max(-2, -sel.minY); }
    commitSelection(dx, dy, 'copy');
  };

  // Recolor the active selection to `c` (used when a "My palette" chip is
  // clicked while cells are selected). Repaints the selected cells and keeps
  // the selection active with its new color.
  const recolorSelection = (c) => {
    const sel = selRef.current;
    if (!sel || sel.cells.size === 0 || !c) return;
    pushUndo();
    const cells = cellsRef.current;
    const map = new Map();
    for (const i of sel.cells.keys()) { cells[i] = c.hex; map.set(i, c.hex); }
    selRef.current = { ...sel, cells: map };
    setHasSel(true);
    redraw(); bump();
  };

  const onPointerDown = (e) => {
    if (isGestureActive() || !e.isPrimary) {
      cancelPointerInteraction();
      return;
    }
    const cell = cellFromEvent(e); if (!cell) return;
    if (tool === 'text') {
      if (!textStamp.length) return;
      pushUndo();
      applyCells(textStamp.map(([dx, dy]) => [cell[0] + dx, cell[1] + dy]), color.hex);
      previewRef.current = null; redraw(); bump();
      return;
    }
    if (tool === 'fill') {
      pushUndo();
      floodFill(cell[0], cell[1], color.hex);
      redraw(); bump();
      return;
    }
    if (tool === 'select') {
      const k = idx(cell[0], cell[1]);
      const sel = selRef.current;
      e.currentTarget.setPointerCapture(e.pointerId);
      if (sel && sel.cells.has(k) && !e.shiftKey) {
        // Grab the existing selection to move it (Alt/Option leaves a copy).
        movingRef.current = true; dupRef.current = e.altKey;
        startRef.current = cell; dragRef.current = { dx: 0, dy: 0 };
        scheduleRedraw(); return;
      }
      // Anywhere else the press is still ambiguous: a drag becomes a marquee,
      // a tap picks the color group under the finger. Resolved in move/up.
      pressRef.current = {
        cell, x: e.clientX, y: e.clientY, add: e.shiftKey,
        slop: e.pointerType === 'mouse' ? 3 : 8,
      };
      return;
    }
    e.currentTarget.setPointerCapture(e.pointerId);
    drawingRef.current = true; startRef.current = cell; lastRef.current = cell;
    pushUndo();
    if (tool === 'pen') { cellsRef.current[idx(cell[0], cell[1])] = color.hex; scheduleRedraw(); }
    else if (tool === 'eraser') { cellsRef.current[idx(cell[0], cell[1])] = null; scheduleRedraw(); }
  };
  const onPointerMove = (e) => {
    if (isGestureActive()) return;
    if (tool === 'select') {
      if (movingRef.current) {
        const [cx, cy] = cellClamped(e);
        const s = startRef.current, sel = selRef.current;
        // Clamp the offset to the grid: the group slides along the edge rather
        // than being clipped, so no stitches are ever lost off-board.
        let dx = Math.max(-sel.minX, Math.min(W - 1 - sel.maxX, cx - s[0]));
        let dy = Math.max(-sel.minY, Math.min(H - 1 - sel.maxY, cy - s[1]));
        dragRef.current = { dx, dy };
        dupRef.current = e.altKey; // Option can be pressed or released mid-drag
        setSelCursor(e.altKey ? 'copy' : 'move');
        scheduleRedraw();
        return;
      }
      if (marqueeRef.current) {
        const [cx, cy] = cellClamped(e);
        marqueeRef.current = { ...marqueeRef.current, x1: cx, y1: cy };
        scheduleRedraw();
        return;
      }
      const p = pressRef.current;
      if (p) {
        // Past the slop radius the press was a drag after all — rubber-band
        // from where it started, over stitches or bare fabric alike.
        if (Math.abs(e.clientX - p.x) > p.slop || Math.abs(e.clientY - p.y) > p.slop) {
          pressRef.current = null;
          const [cx, cy] = cellClamped(e);
          marqueeRef.current = { x0: p.cell[0], y0: p.cell[1], x1: cx, y1: cy, add: p.add };
          scheduleRedraw();
        }
        return;
      }
      const hover = cellFromEvent(e);
      const over = !!(hover && selRef.current && selRef.current.cells.has(idx(hover[0], hover[1])));
      setSelCursor(over ? (e.altKey ? 'copy' : 'move') : null);
      return;
    }
    if (tool === 'text' && !drawingRef.current) {
      const cell = cellFromEvent(e);
      previewRef.current = (cell && textStamp.length) ? textStamp.map(([dx, dy]) => [cell[0] + dx, cell[1] + dy]) : null;
      scheduleRedraw();
      return;
    }
    if (!drawingRef.current) return;
    const cell = cellFromEvent(e); if (!cell) return;
    const last = lastRef.current;
    if (tool === 'pen' || tool === 'eraser') {
      const hex = tool === 'pen' ? color.hex : null;
      if (last) applyCells(lineCells(last[0], last[1], cell[0], cell[1]), hex);
      lastRef.current = cell; scheduleRedraw();
    } else {
      const s = startRef.current;
      previewRef.current = tool === 'line' ? lineCells(s[0], s[1], cell[0], cell[1])
        : tool === 'rect' ? rectCells(s[0], s[1], cell[0], cell[1])
        : ellipseCells(s[0], s[1], cell[0], cell[1]);
      lastRef.current = cell; scheduleRedraw();
    }
  };
  const onPointerUp = () => {
    if (isGestureActive()) {
      cancelPointerInteraction();
      return;
    }
    if (tool === 'select') {
      if (movingRef.current) {
        const d = dragRef.current || { dx: 0, dy: 0 };
        const dup = dupRef.current;
        movingRef.current = false; dupRef.current = false; dragRef.current = null;
        commitSelection(d.dx, d.dy, dup ? 'copy' : 'move');
        redraw();
        return;
      }
      if (marqueeRef.current) {
        const mq = marqueeRef.current; marqueeRef.current = null;
        const x0 = Math.min(mq.x0, mq.x1), x1 = Math.max(mq.x0, mq.x1);
        const y0 = Math.min(mq.y0, mq.y1), y1 = Math.max(mq.y0, mq.y1);
        const cells = cellsRef.current;
        const map = (mq.add && selRef.current) ? new Map(selRef.current.cells) : new Map();
        for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
          const k = idx(x, y); const hex = cells[k]; if (hex) map.set(k, hex);
        }
        selRef.current = makeSel(map); setHasSel(!!selRef.current);
        redraw();
        return;
      }
      const p = pressRef.current;
      if (p) {
        pressRef.current = null;
        const hex = cellsRef.current[idx(p.cell[0], p.cell[1])];
        if (hex) {
          // Tap a stitch: take its whole contiguous color group. With Shift the
          // group toggles in and out of the current selection.
          const region = collectRegion(p.cell[0], p.cell[1]);
          const map = (p.add && selRef.current) ? new Map(selRef.current.cells) : new Map();
          const allIn = p.add && region.every(i => map.has(i));
          for (const i of region) { if (allIn) map.delete(i); else map.set(i, hex); }
          selRef.current = makeSel(map); setHasSel(!!selRef.current);
        } else if (!p.add) {
          deselect();
        }
        redraw();
      }
      return;
    }
    if (!drawingRef.current) return;
    drawingRef.current = false;
    if (previewRef.current) { applyCells(previewRef.current, color.hex); previewRef.current = null; }
    redraw(); bump();
  };
  const onPointerLeave = (e) => {
    if (tool === 'select') {
      if (movingRef.current || marqueeRef.current) onPointerUp(e);
      else { pressRef.current = null; setSelCursor(null); }
      return;
    }
    if (drawingRef.current) { onPointerUp(e); }
    else if (previewRef.current) { previewRef.current = null; scheduleRedraw(); }
  };

  // Clear any hover/preview (and any selection) when switching tools.
  useEffect(() => {
    previewRef.current = null;
    selRef.current = null; movingRef.current = false; dupRef.current = false;
    dragRef.current = null; marqueeRef.current = null; pressRef.current = null;
    setHasSel(false); setSelCursor(null);
    scheduleRedraw();
  }, [tool, scheduleRedraw]);

  useEffect(() => {
    const onKey = (e) => {
      const tag = e.target.tagName;
      const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
      if ((e.metaKey || e.ctrlKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); adjustZoom(+ZOOM_STEP); return; }
      if ((e.metaKey || e.ctrlKey) && (e.key === '-' || e.key === '_')) { e.preventDefault(); adjustZoom(-ZOOM_STEP); return; }
      if ((e.metaKey || e.ctrlKey) && e.key === '0') { e.preventDefault(); resetZoom(); return; }
      if (typing) return;
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd' && selRef.current) {
        e.preventDefault(); duplicateSelection(); return;
      }
      if (e.key === 'Escape' && selRef.current) { deselect(); return; }
      if ((e.key === 'Delete' || e.key === 'Backspace') && selRef.current) {
        e.preventDefault();
        deleteSelection();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [undo, redraw, bump, adjustZoom, resetZoom]);

  const addColor = (dmc) => {
    setPal(prev => prev.some(c => c.code === dmc.code) ? prev : [...prev, dmc]);
    setColor(dmc);
    setShowPicker(false); setPickerSearch("");
  };
  const clearAll = () => { pushUndo(); cellsRef.current = new Array(W * H).fill(null); previewRef.current = null; redraw(); bump(); setConfirmClear(false); };

  // Snapshot the design; `id`/`name` come from the caller so the same builder
  // powers both "save new" and "update in place".
  const buildStitchRecord = (id, name) => {
    const grid = serializeGrid(cellsRef.current);
    const s = computeStitchStats(cellsRef.current, W, H, pal);
    return {
      id, name, presetName: dims.name, w: W, h: H,
      palette: pal, grid, bgImage: bg || null, fabric,
      stitches: s.total, colorsUsed: s.colors.length, colors: s.colors,
      updatedAt: Date.now(),
    };
  };
  const saveNewDesign = () => {
    const name = saveName.trim(); if (!name) return;
    const id = Date.now();
    setSavedStitches(p => [buildStitchRecord(id, name), ...p]);
    setCurrentStitchId(id);
    setShowSave(false); setSaveName('');
    flashSaved();
  };
  const updateCurrentDesign = () => {
    if (currentStitchId == null) return;
    setSavedStitches(p => p.map(x => x.id === currentStitchId ? buildStitchRecord(currentStitchId, x.name) : x));
    flashSaved();
  };

  const loadDesign = (d) => {
    if (!d) return;
    setCurrentStitchId(d.id ?? null);
    undoRef.current = [];
    // Restore the design at its saved size. Setting dims re-runs the fit and
    // redraw effects (both keyed on W/H), so the board resizes to match the
    // grid instead of the grid being squeezed into the active canvas size.
    if (typeof d.w === 'number' && typeof d.h === 'number') {
      setDims({ w: d.w, h: d.h, name: d.presetName || 'Custom' });
    }
    cellsRef.current = deserializeGrid(d.grid, d.w * d.h);
    previewRef.current = null;
    if (Array.isArray(d.palette) && d.palette.length) { setPal(d.palette); setColor(d.palette[0]); }
    setBg(d.bgImage || null); setShowBg(!!d.bgImage);

        {/* Right column (desktop only; mobile uses the bottom toolbar + sheets) */}
        {!isMobile && (<>

        {!panelOpen && (

            <div className="rp-rail-stat">
              <b>{stats.total}</b>
              <span>sts</span>
            </div>
            <div className="rp-rail-stat">
              <b>{stats.colors.length}</b>
              <span>cols</span>
            </div>

        <div id="xs-detail-panel" className="xs-panel">
          {tool === 'text' && (
            <div style={{ borderBottom: '1px solid var(--warm-divider-soft)' }}>

            onOpenLibrary={openLibrary}/>
          <FabricRow
            label="Aida"
            fabric={fabric}
            detail={`${fabric.name} · 14-count`}
            onClick={() => setShowFabric(true)}/>
          <div className="card">
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
              <div className="label" style={{ marginBottom: 0 }}>Materials</div>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--warm-muted)' }}>14 ct</span>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div>
                <div style={{ fontSize: 11, color: 'var(--warm-muted)', marginBottom: 2 }}>Stitches</div>

                <div style={{ fontSize: 11, color: 'var(--warm-muted)' }}>of {stats.possible}</div>

                <div style={{ fontSize: 11, color: 'var(--warm-muted)' }}>used</div>

                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>DMC {c.code}</div>
                  <div style={{ fontSize: 11, color: 'var(--warm-muted)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{c.name}</div>
                </div>
                <div style={{ fontSize: 14, fontWeight: 600, fontVariantNumeric: 'tabular-nums', color: 'var(--warm-fg)' }}>{c.count}</div>
              </div>
            ))}
          </div>
        </div>
        </>)}

        {/* Mobile bottom toolbar (Canva-style): tools + extras that open sheets */}
        {isMobile && (
          <MobileToolbar items={[
            ...TOOLS.map(t => ({ id: t.id, label: t.label, icon: t.icon, active: tool === t.id,
              onClick: () => { setTool(t.id); if (t.id === 'text') setSheet('text'); } })),
            { id:'d1', divider:true },
            { id:'palette', label:'My palette', active: sheet==='palette',
              icon:<span className={`mt-swatch${color?'':' empty'}`} style={color?{background:color.hex}:undefined}/>,
              onClick:()=>setSheet(s=>s==='palette'?null:'palette') },
            { id:'fabric', label:'Aida fabric', icon:<IcTiles/>, onClick:()=>setShowFabric(true) },
            { id:'materials', label:'Materials', icon:<IcList/>, active: sheet==='materials', onClick:()=>setSheet(s=>s==='materials'?null:'materials') },
            { id:'d2', divider:true },
            { id:'grid', label:'Grid', icon:<IcGrid/>, active: showGrid, onClick:()=>setShowGrid(v=>!v) },
            ...(bg ? [{ id:'trace', label: showBg?'Hide trace':'Trace image', icon:<IcImage/>, active: showBg, onClick:()=>setShowBg(v=>!v) }] : []),
          ]}/>
        )}
      </div>

      {/* Mobile bottom sheets (desktop shows this content in the right panel). */}
      {isMobile && sheet === 'palette' && (
        <BottomSheet onClose={()=>setSheet(null)} title="My palette">
          <MyPaletteCard color={color} pinned={pal} setPinned={setPal} setColor={setColor}
            onRecolor={hasSel ? recolorSelection : undefined} onOpenLibrary={openLibrary}/>
        </BottomSheet>
      )}
      {isMobile && sheet === 'text' && (
        <BottomSheet onClose={()=>setSheet(null)} title="Text">
          <div style={{ padding: '2px 16px 12px', display: 'flex', flexDirection: 'column', gap: 8 }}>
            <input type="text" placeholder="Type text…" value={text} onChange={e => setText(e.target.value)}/>
            <div style={{ display: 'flex', gap: 6 }}>
              {Object.keys(XS_FONTS).map(id => (
                <button key={id} className={`btn btn-sm${textFont === id ? ' btn-dark' : ''}`}
                  style={{ flex: 1, fontFamily: XS_FONTS[id].family, fontSize: 14 }}
                  onClick={() => setTextFont(id)}>{XS_FONTS[id].label}</button>
              ))}
            </div>
            <label className="xs-ctrl" style={{ gap: 8 }}>
              <span style={{ fontSize: 11, color: 'var(--warm-muted)' }}>Height</span>
              <input type="range" min={6} max={40} value={textSize} onChange={e => setTextSize(+e.target.value)} style={{ flex: 1 }}/>
              <span style={{ fontSize: 11, fontVariantNumeric: 'tabular-nums' }}>{textSize}</span>

            <div style={{ fontSize: 11, color: 'var(--warm-muted)' }}>Hover the canvas to place it, then click to stitch the text.</div>

      {isMobile && sheet === 'materials' && (

      )}

      {showFabric && (
        <div className="xs-picker" onClick={() => setShowFabric(false)}>
          <div className="xs-picker-card" onClick={e => e.stopPropagation()}>
            <div style={{ padding: 14, borderBottom: '1px solid var(--warm-divider-soft)', display: 'flex', gap: 8, alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ fontFamily: 'var(--font-display)', fontSize: 20 }}>Aida fabric color</div>
              <button onClick={() => setShowFabric(false)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--warm-muted)', display: 'flex' }}><IcX/></button>
            </div>
            <div className="xs-picker-list">
              {AIDA_FABRICS.map(f => (
                <div key={f.name} className="xs-picker-item" onClick={() => { setFabric(f); setShowFabric(false); }}>
                  <span className="xs-picker-dot" style={{ background: f.hex }}/>
                  <span className="xs-picker-name" style={{ fontSize: 12, color: fabric.name === f.name ? 'var(--warm-fg)' : undefined, fontWeight: fabric.name === f.name ? 600 : 400 }}>{f.name}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Save dialog */}
      {showSave && (
        <div className="overlay" onClick={() => setShowSave(false)}>
          <div onClick={e => e.stopPropagation()}
            style={{ background: '#FFFFFF', border: '1px solid #E2DDD2', borderRadius: 8, padding: 24, maxWidth: 380, width: '100%', margin: 16, boxShadow: '0 8px 32px rgba(46,41,37,0.14)' }}>
            <div style={{ fontWeight: 400, fontSize: 24, marginBottom: 16, fontFamily: 'var(--font-display)', lineHeight: 1.1 }}>{currentStitch ? 'Save a copy' : 'Save your design'}</div>
            <input type="text" placeholder="Give your design a name…" value={saveName} onChange={e => setSaveName(e.target.value)}
              autoFocus onKeyDown={e => { if (e.key === 'Enter') saveNewDesign(); }} style={{ marginBottom: 16 }}/>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
              <button className="btn" onClick={() => setShowSave(false)}>Cancel</button>
              <button className="btn btn-dark" onClick={saveNewDesign}>Save</button>
            </div>
          </div>
        </div>
      )}

      {/* My designs list */}
      {showMyStitches && (
        <div className="overlay" onClick={() => setShowMyStitches(false)}>
          <div onClick={e => e.stopPropagation()}
            style={{ background: '#FFFFFF', border: '1px solid #E2DDD2', borderRadius: 8, padding: 24, maxWidth: 500, width: '100%', margin: 16, boxShadow: '0 8px 32px rgba(46,41,37,0.14)', maxHeight: '80vh', overflowY: 'auto' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
              <div style={{ fontWeight: 400, fontSize: 24, fontFamily: 'var(--font-display)', lineHeight: 1.1 }}>My designs</div>
              <button onClick={() => setShowMyStitches(false)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--warm-muted)', display: 'flex' }}><IcX/></button>
            </div>
            {saveError && (
              <div style={{ fontSize: 12, color: 'var(--metime-tomato)', background: '#FBECE8', border: '1px solid #F3C9BF', borderRadius: 6, padding: '8px 10px', marginBottom: 12 }}>{saveError}</div>
            )}
            {savedStitches.length === 0 ? (
              <div style={{ fontSize: 13, color: 'var(--warm-muted)', fontStyle: 'italic', padding: '20px 0', textAlign: 'center' }}>No saved designs yet</div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                {savedStitches.map(d => (
                  <div key={d.id} style={{ display: 'flex', gap: 12, alignItems: 'center', padding: 12, border: '1px solid #E2DDD2', borderRadius: 6, cursor: 'pointer', transition: 'background .1s' }}
                    onClick={() => { setViewStitch(d); setShowMyStitches(false); }} title="Preview"
                    onMouseEnter={e => e.currentTarget.style.background = '#EFE9DD'}
                    onMouseLeave={e => e.currentTarget.style.background = '#FFFFFF'}>
                    <div style={{ width: 64, height: 64, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#FFFFFF', borderRadius: 4, overflow: 'hidden' }}>
                      <StitchThumb w={d.w} h={d.h} cells={deserializeGrid(d.grid, d.w * d.h)} size={64} bg={(d.fabric && d.fabric.hex) || '#FFFFFF'}/>
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 500, fontSize: 14, marginBottom: 2 }}>{d.name}</div>
                      <div style={{ fontSize: 12, color: 'var(--warm-muted)' }}>{d.w} × {d.h} stitches · {d.presetName}</div>
                      <div style={{ fontSize: 12, color: 'var(--warm-muted)' }}>{d.colorsUsed} color{d.colorsUsed !== 1 ? 's' : ''} · {d.stitches} stitches</div>
                    </div>
                    {confirmDeleteId === d.id ? (
                      <div style={{ display: 'flex', gap: 6, alignItems: 'center' }} onClick={e => e.stopPropagation()}>
                        <button className="btn btn-sm" onClick={() => setConfirmDeleteId(null)}>Cancel</button>
                        <button className="btn btn-sm btn-dark" onClick={() => { setSavedStitches(p => p.filter(x => x.id !== d.id)); setConfirmDeleteId(null); }}>Delete</button>
                      </div>
                    ) : (
                      <div style={{ display: 'flex', gap: 2, alignItems: 'center' }}>
                        <button title="Delete design" onClick={e => { e.stopPropagation(); setConfirmDeleteId(d.id); }}
                          style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--warm-muted)', display: 'flex', padding: 4 }}
                          onMouseEnter={e => e.currentTarget.style.color = 'var(--metime-tomato)'}
                          onMouseLeave={e => e.currentTarget.style.color = 'var(--warm-muted)'}><IcTrash/></button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Design preview */}
      {viewStitch && (() => {
        const d = viewStitch;
        return (
          <div className="overlay" onClick={() => setViewStitch(null)}>
            <div onClick={e => e.stopPropagation()}
              style={{ background: '#FFFFFF', border: '1px solid #E2DDD2', borderRadius: 8, maxWidth: 640, width: '100%', margin: 16, boxShadow: '0 8px 32px rgba(46,41,37,0.14)', maxHeight: '90vh', overflowY: 'auto' }}>
              <div style={{ padding: '20px 24px 16px', borderBottom: '1px solid #EFE9DD', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <div>
                  <div style={{ fontWeight: 400, fontSize: 24, fontFamily: 'var(--font-display)', lineHeight: 1.1 }}>{d.name}</div>
                  <div style={{ fontSize: 13, color: 'var(--warm-muted)', marginTop: 2 }}>{d.w} × {d.h} stitches · {d.colorsUsed} colors{d.fabric ? ` · ${d.fabric.name} Aida` : ''}</div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <button className="btn" onClick={() => loadDesign(d)}>Open on canvas</button>
                  <button onClick={() => setViewStitch(null)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--warm-muted)', display: 'flex' }}><IcX/></button>
                </div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0 }}>
                <div style={{ padding: 24, borderRight: '1px solid #EFE9DD', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <div style={{ width: '100%', maxWidth: 280, border: '1px solid #E2DDD2', borderRadius: 4, overflow: 'hidden' }}>
                    <StitchThumb w={d.w} h={d.h} cells={deserializeGrid(d.grid, d.w * d.h)} size={280} bg={(d.fabric && d.fabric.hex) || '#FFFFFF'}/>
                  </div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column' }}>
                  <div style={{ padding: '16px 20px 8px' }}>
                    <div className="label" style={{ marginBottom: 4 }}>Floss list</div>
                    <div style={{ fontSize: 12, color: 'var(--warm-muted)' }}>{d.colors.length} color{d.colors.length !== 1 ? 's' : ''}</div>
                  </div>
                  <div style={{ flex: 1, overflowY: 'auto', maxHeight: 340 }}>
                    {d.colors.map(c => (
                      <div key={c.hex} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 20px', borderBottom: '1px solid #EFE9DD' }}>
                        <div style={{ width: 24, height: 24, background: c.hex, border: '1px solid rgba(46,41,37,0.10)', borderRadius: 3, flexShrink: 0 }}/>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 12, fontWeight: 500 }}>DMC {c.code}</div>
                          <div style={{ fontSize: 11, color: 'var(--warm-muted)' }}>{c.name}</div>
                        </div>
                        <div style={{ fontSize: 13, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{c.count}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ padding: '12px 20px', borderTop: '1px solid #EFE9DD', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <div>
                      <div style={{ fontSize: 11, color: 'var(--warm-muted)' }}>Total stitches</div>
                      <div style={{ fontSize: 20, fontWeight: 600, fontVariantNumeric: 'tabular-nums' }}>{d.stitches}</div>
                    </div>
                    <KitCheckoutButton type="cross-stitch" design={d} savedId={d.apiId}
                      onSaved={id=>setSavedStitches(p=>p.map(x=>x.id===d.id?{...x,apiId:id}:x))}/>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// Depth of each step in the setup flow, so the History integration can tell a
// forward move (push a new entry) from a backward move (reverse one step).
const STEP_DEPTH = {
  'craft': 0,
  'q-size': 1, 'q-backing': 2, 'q-palette': 3, 'q-template': 4, 'q-editor': 5,
  'xs-size': 1, 'xs-template': 2, 'xs-palette': 3, 'xs-editor': 4,
  'saved': 1,
};

function Root() {
  const [craft, setCraft] = React.useState(null);
  const [selectedPreset, setSelectedPreset] = React.useState(null);
  const [templateDone, setTemplateDone] = React.useState(false);
  const [quiltTemplate, setQuiltTemplate] = React.useState(null);
  const [paletteDone, setPaletteDone] = React.useState(false);
  const [palette, setPalette] = React.useState(null);
  const [backingFabric, setBackingFabric] = React.useState(null);
  const [quiltBackingDone, setQuiltBackingDone] = React.useState(false);
  // Cross-stitch flow state
  const [xsPreset, setXsPreset] = React.useState(null);
  const [xsTemplateDone, setXsTemplateDone] = React.useState(false);
  const [xsTemplate, setXsTemplate] = React.useState(null);
  const [xsPhoto, setXsPhoto] = React.useState(null);
  const [xsDone, setXsDone] = React.useState(false);
  const [xsPalette, setXsPalette] = React.useState(null);
  const [xsOpts, setXsOpts] = React.useState({});
  // A saved item opened straight from the landing page: { type, item }.
  const [openSaved, setOpenSaved] = React.useState(null);

  const resetAll = () => {
    setCraft(null); setSelectedPreset(null); setTemplateDone(false); setQuiltTemplate(null);
    setPaletteDone(false); setPalette(null); setBackingFabric(null); setQuiltBackingDone(false);
    setXsPreset(null); setXsTemplateDone(false); setXsTemplate(null); setXsPhoto(null);
    setXsDone(false); setXsPalette(null); setXsOpts({});
    setOpenSaved(null);
  };

  // ── Browser Back = previous step ──────────────────────────────────────────
  // The screens above are a plain state machine with no URL, so the browser's
  // Back button used to leave the app entirely. We mirror the current step into
  // the History API: push an entry when the user moves forward, and reverse
  // exactly one step on `popstate`. The in-app "Back" links route through
  // history.back() too, so both paths behave identically and stay in sync.
  const stepKey = React.useMemo(() => {
    if (openSaved) return 'saved';
    if (!craft) return 'craft';
    if (craft === 'cross-stitch') {
      if (!xsPreset) return 'xs-size';
      if (!xsTemplateDone) return 'xs-template';
      if (!xsDone) return 'xs-palette';
      return 'xs-editor';
    }
    if (!selectedPreset) return 'q-size';
    if (!quiltBackingDone) return 'q-backing';
    if (!paletteDone) return 'q-palette';
    if (!templateDone) return 'q-template';
    return 'q-editor';
  }, [openSaved, craft, xsPreset, xsTemplateDone, xsDone, selectedPreset, quiltBackingDone, paletteDone, templateDone]);

  const stepRef = React.useRef(stepKey); stepRef.current = stepKey;
  const prevStepRef = React.useRef(stepKey);
  const isPoppingRef = React.useRef(false);

  // Reverse a single step. Returns true if it actually moved (so popstate knows
  // whether a transition happened); 'craft' returns false to let the browser
  // navigate away from the site as usual.
  const goBack = () => {
    switch (stepRef.current) {
      case 'q-editor':    setTemplateDone(false); return true;
      case 'q-template':  setPaletteDone(false); return true;
      case 'q-palette':   setQuiltBackingDone(false); return true;
      case 'q-backing':   setSelectedPreset(null); return true;
      case 'q-size':      setCraft(null); return true;
      case 'xs-editor':   setXsDone(false); return true;
      case 'xs-palette':  setXsTemplateDone(false); return true;
      case 'xs-template': setXsPreset(null); return true;
      case 'xs-size':     setCraft(null); return true;
      case 'saved':       resetAll(); return true;
      default:            return false;
    }
  };
  const goBackRef = React.useRef(goBack); goBackRef.current = goBack;

  React.useEffect(() => {
    if (typeof window === 'undefined') return;
    window.history.replaceState({ step: stepRef.current }, '');
    const onPop = () => { if (goBackRef.current()) isPoppingRef.current = true; };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  React.useEffect(() => {
    if (typeof window === 'undefined') return;
    // A popstate-driven change already consumed a history entry — don't push.
    if (isPoppingRef.current) { isPoppingRef.current = false; prevStepRef.current = stepKey; return; }
    if (stepKey === prevStepRef.current) return;
    const d = STEP_DEPTH[stepKey] ?? 0, pd = STEP_DEPTH[prevStepRef.current] ?? 0;
    // Forward move: add an entry so Back returns here. Backward/reset not via a
    // pop (e.g. the editor's "Back to projects"): collapse onto the current entry.
    if (d > pd) window.history.pushState({ step: stepKey }, '');
    else window.history.replaceState({ step: stepKey }, '');
    prevStepRef.current = stepKey;
  }, [stepKey]);

  // Opening a saved design bypasses the craft/size/palette steps and drops the
  // user straight onto the matching editor with that design loaded.
  if (openSaved) {
    if (openSaved.type === 'quilt') {
      return (
        <>
          <App initialPreset={openSaved.item.preset || 'Throw'}
            initialPalette={openSaved.item.pinned || null}
            initialQuilt={openSaved.item} onBack={resetAll}/>
          <TweaksPanel/>
        </>
      );
    }
    return (
      <CrossStitchApp
        preset={{ name: openSaved.item.presetName || 'Custom', w: openSaved.item.w, h: openSaved.item.h }}
        palette={openSaved.item.palette}
        initialDesign={openSaved.item} onBack={resetAll}/>
    );
  }

  if (!craft) {
    return <CraftSelector onSelect={setCraft} onOpenSaved={(type, item) => setOpenSaved({ type, item })}/>;
  }

  if (craft === 'cross-stitch') {
    if (!xsPreset) {
      return <CrossStitchSizeSelector onBack={() => window.history.back()}
        onSelect={name => setXsPreset(STITCH_PRESETS.find(p => p.name === name))}/>;
    }
    if (!xsTemplateDone) {
      return (
        <CrossStitchTemplateSelector
          preset={xsPreset}
          onBack={() => window.history.back()}
          onChoose={({ template, photo }) => {
            setXsTemplate(template);
            setXsPhoto(photo || null);
            if (template) {
              // Seed the design from the template grid; color work is next.
              const grid = template.build(xsPreset);
              const hasCells = grid && grid.some(Boolean);
              setXsOpts({ bgImage: null, autoGrid: hasCells ? grid : null });
            } else {
              // Photo (or nothing yet): the design + trace are built on the palette step.
              setXsOpts({});
            }
            setXsTemplateDone(true);
          }}
          onSkip={() => { setXsTemplate(null); setXsPhoto(null); setXsOpts({}); setXsTemplateDone(true); }}/>
      );
    }
    if (!xsDone) {
      return (
        <CrossStitchPaletteSelector
          preset={xsPreset}
          photo={xsPhoto}
          template={xsTemplate}
          onBack={() => window.history.back()}
          onChoose={(pal, extra) => {
            const colors = pal && pal.length ? pal : null;
            setXsPalette(colors);
            setXsOpts(o => {
              const next = { ...o, ...(extra || null) };
              // A chosen palette overrides the template's default brand colors.
              // We always re-dress the template's own chart rather than whatever
              // grid is in state, so stepping back here and picking a different
              // palette recolors the original instead of a recolored copy.
              // (A photo-traced design is already built from the palette.)
              if (xsTemplate) {
                const chart = xsTemplate.build(xsPreset);
                next.autoGrid = colors ? xsRecolorGrid(chart, colors) : chart;
              }
              return next;
            });
            setXsDone(true);
          }}
          onSkip={() => {
            setXsPalette(null);
            setXsOpts(o => {
              const next = { ...o };
              if (xsPhoto) next.bgImage = xsPhoto;
              // No palette — back to the template's brand colors.
              if (xsTemplate) next.autoGrid = xsTemplate.build(xsPreset);
              return next;
            });
            setXsDone(true);
          }}/>
      );
    }
    return (
      <CrossStitchApp preset={xsPreset} palette={xsPalette}
        bgImage={xsOpts.bgImage} autoGrid={xsOpts.autoGrid} onBack={resetAll}/>
    );
  }

  if (!selectedPreset) {
    return <ProjectSelector onSelect={setSelectedPreset} onBack={() => window.history.back()}/>;
  }
  if (!quiltBackingDone) {
    return (
      <QuiltBackingSelector
        preset={selectedPreset}
        onBack={() => window.history.back()}
        onChoose={b => { setBackingFabric(b); setQuiltBackingDone(true); }}
        onSkip={() => { setBackingFabric(null); setQuiltBackingDone(true); }}/>
    );
  }
  if (!paletteDone) {
    return (
      <PaletteSelector
        presetName={selectedPreset}
        backing={backingFabric}
        onBack={() => window.history.back()}
        onChoose={pal => { setPalette(pal); setPaletteDone(true); }}
        onSkip={() => { setPalette(null); setPaletteDone(true); }}/>
    );
  }
  if (!templateDone) {
    return (
      <TemplateSelector
        preset={selectedPreset}
        palette={palette}
        onBack={() => window.history.back()}
        onChoose={t => { setQuiltTemplate(t); setTemplateDone(true); }}
        onSkip={() => { setQuiltTemplate(null); setTemplateDone(true); }}/>
    );
  }
  return (
    <>
      <App initialPreset={selectedPreset} initialPalette={palette} initialBacking={backingFabric} initialTemplate={quiltTemplate} onBack={resetAll}/>
      <TweaksPanel/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
