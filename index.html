// ── Canvas pinch / ctrl-wheel zoom (shared by quilt + cross-stitch) ───────
// Zoom is applied by resizing content; pan is the scroll container. Pinch and
// ctrl/cmd+wheel update zoom while anchoring the focal point under the fingers
// (or cursor). Two-finger drag also pans. The Move-canvas tool enables one-
// finger pan. Drawing tools must bail while a multi-touch gesture is active —
// call isGestureActive() from pointer handlers.
function clampZoom(z) {
  return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +(+z).toFixed(3)));
}
function useCanvasPinchZoom(scrollRef, zoom, onZoomChange, onGestureStart, panMode = false) {
  const zoomRef = useRef(zoom);
  const pointersRef = useRef(new Map());
  const pinchRef = useRef(null);
  const panRef = useRef(null);
  const pendingScrollRef = useRef(null);
  const activeRef = useRef(false);
  const onZoomChangeRef = useRef(onZoomChange);
  const onGestureStartRef = useRef(onGestureStart);
  const panModeRef = useRef(panMode);

  useEffect(() => { zoomRef.current = zoom; }, [zoom]);
  useEffect(() => { onZoomChangeRef.current = onZoomChange; }, [onZoomChange]);
  useEffect(() => { onGestureStartRef.current = onGestureStart; }, [onGestureStart]);
  useEffect(() => { panModeRef.current = panMode; }, [panMode]);

  useLayoutEffect(() => {
    const p = pendingScrollRef.current;
    if (!p) return;
    pendingScrollRef.current = null;
    p.el.scrollLeft = p.left;
    p.el.scrollTop = p.top;
  }, [zoom]);

  useEffect(() => {
    const el = scrollRef.current;
    if (!el || !onZoomChange) return undefined;

    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

    const setZoomAnchored = (nextZoom, clientX, clientY) => {
      const prev = zoomRef.current;
      const z = clampZoom(nextZoom);
      if (Math.abs(z - prev) < 0.001) return;
      const rect = el.getBoundingClientRect();
      const vx = clientX - rect.left;
      const vy = clientY - rect.top;
      pendingScrollRef.current = {
        el,
        left: (el.scrollLeft + vx) * (z / prev) - vx,
        top: (el.scrollTop + vy) * (z / prev) - vy,
      };
      zoomRef.current = z;
      onZoomChangeRef.current(z);
    };

    const beginPinch = () => {
      const pts = [...pointersRef.current.values()];
      if (pts.length < 2) return;
      pinchRef.current = {
        startDist: Math.max(1, dist(pts[0], pts[1])),
        startZoom: zoomRef.current,
        lastMid: mid(pts[0], pts[1]),
      };
      if (!activeRef.current) {
        activeRef.current = true;
        onGestureStartRef.current?.();
      }
    };

    const onPointerDown = (e) => {
      if (e.pointerType === 'mouse' && !panModeRef.current) return;
      pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointersRef.current.size >= 2) {
        panRef.current = null;
        beginPinch();
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      if (panModeRef.current && e.isPrimary) {
        panRef.current = { x: e.clientX, y: e.clientY };
        if (!activeRef.current) {
          activeRef.current = true;
          onGestureStartRef.current?.();
        }
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
        e.preventDefault();
        e.stopPropagation();
      }
    };

    const onPointerMove = (e) => {
      if (!pointersRef.current.has(e.pointerId)) return;
      pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointersRef.current.size >= 2 && pinchRef.current) {
        e.preventDefault();
        const pts = [...pointersRef.current.values()];
        const m = mid(pts[0], pts[1]);
        const p = pinchRef.current;
        el.scrollLeft += p.lastMid.x - m.x;
        el.scrollTop += p.lastMid.y - m.y;
        p.lastMid = m;
        setZoomAnchored(p.startZoom * (dist(pts[0], pts[1]) / p.startDist), m.x, m.y);
        return;
      }
      if (panRef.current && pointersRef.current.size <= 1) {
        e.preventDefault();
        el.scrollLeft += panRef.current.x - e.clientX;
        el.scrollTop += panRef.current.y - e.clientY;
        panRef.current = { x: e.clientX, y: e.clientY };
      }
    };

    const endPointer = (e) => {
      if (!pointersRef.current.has(e.pointerId)) return;
      pointersRef.current.delete(e.pointerId);
      panRef.current = null;
      if (pointersRef.current.size >= 2) {
        beginPinch();
      } else {
        pinchRef.current = null;
        if (pointersRef.current.size === 0) activeRef.current = false;
      }
    };

    const onWheel = (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      const factor = Math.exp(-e.deltaY * 0.01);
      setZoomAnchored(zoomRef.current * factor, e.clientX, e.clientY);
    };

    // Safari page-zoom gesture — keep it from hijacking the canvas.
    const onGesture = (e) => { e.preventDefault(); };

    el.addEventListener('pointerdown', onPointerDown, true);
    el.addEventListener('pointermove', onPointerMove, true);
    el.addEventListener('pointerup', endPointer, true);
    el.addEventListener('pointercancel', endPointer, true);
    el.addEventListener('wheel', onWheel, { passive: false });
    el.addEventListener('gesturestart', onGesture, { passive: false });
    el.addEventListener('gesturechange', onGesture, { passive: false });

    return () => {
      el.removeEventListener('pointerdown', onPointerDown, true);
      el.removeEventListener('pointermove', onPointerMove, true);
      el.removeEventListener('pointerup', endPointer, true);
      el.removeEventListener('pointercancel', endPointer, true);
      el.removeEventListener('wheel', onWheel);
      el.removeEventListener('gesturestart', onGesture);
      el.removeEventListener('gesturechange', onGesture);
    };
  }, [scrollRef, onZoomChange, panMode]);

  const isGestureActive = useCallback(() => activeRef.current, []);
  return { isGestureActive };
}

// ── App ───────────────────────────────────────────────────────────────────
function App({ initialPreset = "Throw", initialPalette = null, initialBacking = null, initialQuilt = null, initialTemplate = null, onBack }) {
  const _initP = PRESETS.find(x => x.name === initialPreset) || PRESETS.find(x => x.name === "Throw") || PRESETS[0];
  // Clamp the starting block size to what this preset allows (Coaster tops out
  // at 2" and can go to 1"), so the size control opens in a coherent range.
  const _initMinBs = initialPreset === 'Coaster' ? 1 : 2;
  const _initMaxBs = Math.max(_initMinBs, Math.min(12, Math.floor(Math.min(_initP.w, _initP.h) / 2)));
  const _initBs = Math.max(_initMinBs, Math.min(_initMaxBs, 3));
  const _initCols = Math.min(MAX, Math.max(2, Math.round(_initP.w / _initBs)));
  const _initRows = Math.min(MAX, Math.max(2, Math.round(_initP.h / _initBs)));
  const [cols, setCols] = useState(_initCols);
  const [rows, setRows] = useState(_initRows);
  const [bs, setBs] = useState(_initBs);
  const [panelOpen, setPanelOpen] = useState(() => (typeof window === 'undefined' || window.innerWidth > 900));
  const isMobile = useIsMobile();
  // Mobile bottom-sheet router: null | 'palette' | 'size' | 'fabrics' | 'pattern' | 'materials'
  const [sheet, setSheet] = useState(null);
  const coasterUnitsRef = useRef(null);
  const undoStacksRef = useRef(Array.from({ length: COASTER_COUNT }, () => []));
  const [activeCoaster, setActiveCoaster] = useState(0);
  const [coasterRev, setCoasterRev] = useState(0);
  const activeCoasterRef = useRef(0);
  activeCoasterRef.current = activeCoaster;
  const [shapes, _setShapes] = useState(() => {
    const seed = (initialTemplate && typeof initialTemplate.build === 'function')
      ? initialTemplate.build({ cols: _initCols, rows: _initRows, palette: initialPalette })
      : [];
    if (!initialQuilt && isCoasterSize(initialPreset)) {
      const units = seedCoasterUnits(seed);
      coasterUnitsRef.current = units;
      return units[0];
    }
    return seed;
  });
  const historyRef = useRef([]);
  const setShapes = useCallback(updater => {
    _setShapes(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      historyRef.current.push(prev);
      if (historyRef.current.length > 100) historyRef.current.shift();
      return next;
    });
  }, []);
  const undo = useCallback(() => {
    if (historyRef.current.length === 0) return;
    const prev = historyRef.current.pop();
    _setShapes(prev);
    setSelIds(new Set());
  }, []);
  const [selIds, setSelIds] = useState(new Set());
  const [color, setColor] = useState(
    (initialPalette && initialPalette[0]) || KONA.find(c=>c.name==="Navy") || KONA[0]
  );
  const [tool, setTool] = useState("paint");
  const [search, setSearch] = useState("");
  const [grp, setGrp] = useState("All");
  const [customs, setCustoms] = useState([]);
  const [pinned, setPinned] = useState(
    (initialPalette && initialPalette.length) ? initialPalette : [
      KONA.find(c=>c.name==="White"), KONA.find(c=>c.name==="Black"),
      KONA.find(c=>c.name==="Natural"), KONA.find(c=>c.name==="Navy"),
      KONA.find(c=>c.name==="Rich Red"), KONA.find(c=>c.name==="Mustard"),
    ].filter(Boolean)
  );
  const [preset, setPreset] = useState(initialPreset);
  const [backing, setBacking] = useState(initialBacking);
  const [binding, setBinding] = useState(null);
  const [qPattern, setQPattern] = useState("none");
  const [qSpacing, setQSpacing] = useState(2);
  const [qColor, setQColor] = useState({ name:"White", hex:"#fff" });
  const [showQ, setShowQ] = useState(true);
  const [confirmClear, setConfirmClear] = useState(false);
  const auth = useAuth();
  const user = auth && auth.user;
  const cloudEnabled = !!(auth && auth.cloudEnabled);
  const cloudBlocked = !!(auth && auth.cloudBlocked);
  // The drawer is live while signed in — or always, when Supabase isn't
  // configured and there is no account to gate on.
  const libraryOn = !!(auth && auth.libraryOn);
  const [savedQuilts, setSavedQuilts] = useState([]);
  const [saveError, setSaveError] = useState("");
  const quiltCacheReady = useRef(false);
  // Cache on this device only while the drawer is live so a signed-out empty
  // list cannot wipe someone else's library.
  useEffect(() => {
    if (!libraryOn || !quiltCacheReady.current) return;
    const ok = persistSavedQuilts(savedQuilts);
    setSaveError(ok ? "" : "Couldn't save — this device's storage may be full.");
  }, [savedQuilts, libraryOn]);
  useEffect(() => {
    if (!libraryOn) { quiltCacheReady.current = false; setSavedQuilts([]); return; }
    setSavedQuilts(loadSavedQuilts());
    quiltCacheReady.current = true;
  }, [libraryOn, auth && auth.libraryTick]);
  useEffect(() => {
    if (!auth || !auth.lastSaved || auth.lastSaved.type !== "quilt") return;
    setCurrentQuiltId(auth.lastSaved.record.id);
    flashSaved();
    auth.consumeLastSaved();
  }, [auth && auth.lastSaved]);
  const [showSave, setShowSave] = useState(false);
  const [saveName, setSaveName] = useState("");
  const [viewQuilt, setViewQuilt] = useState(null);
  const [showMyQuilts, setShowMyQuilts] = useState(false);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [showBackingPicker, setShowBackingPicker] = useState(false);
  const [inspectBacking, setInspectBacking] = useState(null);
  // Id of the saved quilt currently open on the canvas (null for an unsaved
  // design). Lets "Save" update in place instead of spawning a duplicate.
  const [currentQuiltId, setCurrentQuiltId] = useState(null);
  const [justSaved, setJustSaved] = useState(false);
  const savedFlashRef = useRef(null);
  const flashSaved = useCallback(() => {
    setJustSaved(true);
    if (savedFlashRef.current) clearTimeout(savedFlashRef.current);
    savedFlashRef.current = setTimeout(() => setJustSaved(false), 1600);
  }, []);
  const currentQuilt = savedQuilts.find(q => q.id === currentQuiltId) || null;
  // Snapshot every piece of editor state we persist. `id`/`name` are supplied
  // by the caller so the same builder serves both "save new" and "update".
  const buildQuiltRecord = (id, name) => {
    const record = {
      id, name, shapes: [...shapes], cols, rows, bs, preset, backing, binding, pinned: [...pinned],
      qPattern, qSpacing, qColor, showQ, materials: { ...materials }, fw, fh, backCalc, bindCalc, grandTotal,
      updatedAt: Date.now(),
    };
    if (isCoasterSize(preset) && coasterUnitsRef.current) {
      coasterUnitsRef.current[activeCoaster] = shapes;
      record.units = coasterUnitsRef.current.map(s => ({ shapes: s }));
      record.activeUnit = activeCoaster;
    }
    return record;
  };
  // Writes the design to the account, then to this device. With Supabase
  // unconfigured the cloud leg is skipped and the save is local-only, which is
  // how the studio worked before accounts existed.
  const commitQuiltSave = async (record, isNew) => {
    const store = (apiId) => {
      const saved = apiId ? { ...record, apiId } : record;
      setSavedQuilts(p => isNew ? [saved, ...p] : p.map(x => x.id === record.id ? saved : x));
      if (isNew) setCurrentQuiltId(saved.id);
      flashSaved();
    };
    if (!cloudEnabled) {
      store(null);
      setSaveError(cloudBlocked ? ACCOUNTS_OFFLINE_SAVE_MSG : "");
      return;
    }
    try {
      store(await upsertCloudDesign("quilt", record));
      setSaveError("");
    } catch (e) {
      console.warn("Quilt cloud save failed:", e);
      setSaveError("Couldn't save to your account — check your connection and try again.");
    }
  };
  const saveNewQuilt = () => {
    const name = saveName.trim(); if (!name) return;
    const id = Date.now();
    const record = buildQuiltRecord(id, name);
    setShowSave(false); setSaveName("");
    // Save is the only account wall: designing, resizing, PDFs, and kit checkout
    // all work without one.
    if (cloudEnabled && !user) {
      stashPendingSave({ type: "quilt", record, mode: "new" });
      auth.openAuth();
      return;
    }
    commitQuiltSave(record, true);
  };
  const updateCurrentQuilt = () => {
    if (currentQuiltId == null) return;
    const record = buildQuiltRecord(currentQuiltId, (currentQuilt && currentQuilt.name) || "Untitled");
    if (currentQuilt && currentQuilt.apiId) record.apiId = currentQuilt.apiId;
    if (cloudEnabled && !user) {
      stashPendingSave({ type: "quilt", record, mode: "update" });
      auth.openAuth();
      return;
    }
    commitQuiltSave(record, false);
  };

  // Restore a saved quilt back onto the editor canvas. Rebuilds every piece of
  // editor state we persisted so the design opens exactly as it was saved.
  const loadQuilt = useCallback((q) => {
    if (!q) return;
    setCurrentQuiltId(q.id ?? null);
    historyRef.current = [];
    undoStacksRef.current = Array.from({ length: COASTER_COUNT }, () => []);
    setSelIds(new Set());
    if (typeof q.cols === 'number') setCols(q.cols);
    if (typeof q.rows === 'number') setRows(q.rows);
    if (typeof q.bs === 'number') setBs(q.bs);
    if (q.preset) setPreset(q.preset);
    if (isCoasterSize(q.preset || '')) {
      const units = (Array.isArray(q.units) && q.units.length === COASTER_COUNT)
        ? q.units.map(u => Array.isArray(u.shapes) ? u.shapes : [])
        : seedCoasterUnits(Array.isArray(q.shapes) ? q.shapes : []);
      coasterUnitsRef.current = units;
      const idx = Math.min(COASTER_COUNT - 1, Math.max(0, q.activeUnit || 0));
      setActiveCoaster(idx);
      activeCoasterRef.current = idx;
      _setShapes(units[idx]);
    } else {
      coasterUnitsRef.current = null;
      setActiveCoaster(0);
      activeCoasterRef.current = 0;
      _setShapes(Array.isArray(q.shapes) ? q.shapes : []);
    }
    setBacking(q.backing || null);
    setBinding(q.binding || null);
    // Palette: prefer the saved "My palette", else rebuild it from the colors
    // actually used in the design (covers quilts saved before palette storage).
    let pal = Array.isArray(q.pinned) ? q.pinned.filter(Boolean) : [];
    if (!pal.length && Array.isArray(q.shapes)) {
      const seen = new Set();
      pal = [];
      for (const s of q.shapes) {
        if (s && s.color && s.color.hex && !seen.has(s.color.hex)) {
          seen.add(s.color.hex);
          pal.push(s.color);
        }
      }
    }
    if (pal.length) setPinned(pal);
    if (q.qPattern) setQPattern(q.qPattern);
    if (typeof q.qSpacing === 'number') setQSpacing(q.qSpacing);
    if (q.qColor) setQColor(q.qColor);
    if (typeof q.showQ === 'boolean') setShowQ(q.showQ);
    setViewQuilt(null);
    setShowMyQuilts(false);
    setConfirmDeleteId(null);
  }, []);
  // When launched from the landing page's saved list, drop that quilt onto the
  // canvas immediately.
  useEffect(() => { if (initialQuilt) loadQuilt(initialQuilt); }, []);
  const [showHints, setShowHints] = useState(false);
  // The library popover doubles as a fabric picker. `picker` is null when
  // closed, otherwise an object describing the active picker config:
  //   { onPick?, onClear?, showMyPalette?, title? }
  // (Empty object => default paint behaviour from the My palette + button.)
  const [picker, setPicker] = useState(null);
  const helpAnchor = useRef(null);
  const libraryAnchorRef = useRef(null);
  const backingRowRef = useRef(null);
  const bindingRowRef = useRef(null);

  const openLibrary = useCallback((anchorRef) => {
    if (anchorRef && anchorRef.current) libraryAnchorRef.current = anchorRef.current;
    setPicker({});
  }, []);

  // Generic "color picker" popover with the My palette section pinned at the
  // top. Used for fabrics (backing/binding) and the thread color.
  const openColorPicker = useCallback((anchorRef, onPick, onClear, title) => {
    if (anchorRef && anchorRef.current) libraryAnchorRef.current = anchorRef.current;
    setPicker({ onPick, onClear, showMyPalette: true, title });
  }, []);

  const closePicker = useCallback(() => setPicker(null), []);

  const handleSwapTriColors = useCallback(() => {
    const sel = shapes.filter(s => selIds.has(s.id));
    const pids = new Set();
    for (const s of sel) if (s.pairId) pids.add(s.pairId);
    if (pids.size === 0) return;
    const colorByPair = new Map();
    for (const s of shapes) if (s.pairId && pids.has(s.pairId)) {
      if (!colorByPair.has(s.pairId)) colorByPair.set(s.pairId, {});
      colorByPair.get(s.pairId)[s.half] = s.color;
    }
    setShapes(p => p.map(s => {
      if (!s.pairId || !pids.has(s.pairId)) return s;
      const c = colorByPair.get(s.pairId);
      return { ...s, color: s.half === 'a' ? c.b : c.a };
    }));
  }, [shapes, selIds, setShapes]);

  const swapDisabled = useMemo(() => {
    if (selIds.size === 0) return true;
    return !shapes.some(s => selIds.has(s.id) && s.type === 'tri' && s.pairId);
  }, [shapes, selIds]);

  useEffect(() => {
    const handleKey = e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        undo();
      }
    };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [undo]);

  const [zoom, setZoom] = useState(1);
  const adjustZoom = useCallback(delta => {
    setZoom(z => Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +(z + delta).toFixed(2))));
  }, []);
  const resetZoom = useCallback(() => setZoom(1), []);

  useEffect(() => {
    const onKey = e => {
      if (!(e.metaKey || e.ctrlKey)) return;
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      if (e.key === '=' || e.key === '+') { e.preventDefault(); adjustZoom(+ZOOM_STEP); }
      else if (e.key === '-' || e.key === '_') { e.preventDefault(); adjustZoom(-ZOOM_STEP); }
      else if (e.key === '0') { e.preventDefault(); resetZoom(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [adjustZoom, resetZoom]);

  // Dismiss the selection (and its floating toolbar) when the user mouses down
  // anywhere outside the canvas frame, the toolbar itself, popovers, or modals.
  useEffect(() => {
    if (selIds.size === 0) return undefined;
    const onDown = e => {
      const t = e.target;
      if (!(t instanceof Element)) return;
      if (t.closest('.canvas-frame, .selection-toolbar, .popover, .popover-backdrop, .overlay, .my-palette')) return;
      setSelIds(new Set());
    };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [selIds.size]);

  const allColors = useMemo(()=>[...customs,...KONA],[customs]);
  const filtered = useMemo(()=>{
    let l=allColors;
    if(grp!=="All") l=l.filter(c=>c.group===grp);
    if(search.trim()){const q=search.toLowerCase();l=l.filter(c=>c.name.toLowerCase().includes(q)||(c.code&&c.code.includes(q)));}
    return l;
  },[allColors,grp,search]);

  useEffect(()=>{
    const clamp = s => ({...s,r:Math.min(s.r,rows-1),c:Math.min(s.c,cols-1),h:Math.max(1,Math.min(s.h,rows-Math.min(s.r,rows-1))),w:Math.max(1,Math.min(s.w,cols-Math.min(s.c,cols-1)))});
    if (coasterUnitsRef.current) {
      const active = activeCoasterRef.current;
      coasterUnitsRef.current = coasterUnitsRef.current.map((u, i) => i === active ? u : u.map(clamp));
    }
    setShapes(p=>p.map(clamp));
    setSelIds(new Set());
  },[rows,cols]);

  // Kit fabric multiplier: e.g. a Coaster kit ships 4 backing/binding panels.
  // Patch yardage for a set is the sum of the four designs, not 4× one design.
  const kitQty = (PRESETS.find(x=>x.name===preset)?.kitQty) || 1;
  const isCoasterKit = isCoasterSize(preset);

  const selectCoaster = (i) => {
    if (!coasterUnitsRef.current || i === activeCoaster) return;
    coasterUnitsRef.current[activeCoaster] = shapes;
    undoStacksRef.current[activeCoaster] = historyRef.current;
    setActiveCoaster(i);
    activeCoasterRef.current = i;
    historyRef.current = undoStacksRef.current[i] || [];
    _setShapes(coasterUnitsRef.current[i]);
    setSelIds(new Set());
  };
  const copyCoasterToAll = () => {
    if (!coasterUnitsRef.current) return;
    coasterUnitsRef.current = coasterUnitsRef.current.map((_, i) =>
      i === activeCoaster ? shapes : cloneQuiltShapes(shapes));
    undoStacksRef.current = undoStacksRef.current.map((stack, i) => i === activeCoaster ? stack : []);
    setCoasterRev(n => n + 1);
  };

  const materials = useMemo(()=>{
    const map=new Map();
    const add=(col,amt)=>{if(!col)return;if(!map.has(col.name))map.set(col.name,{...col,count:0});map.get(col.name).count+=amt;};
    const all = (isCoasterKit && coasterUnitsRef.current)
      ? coasterUnitsRef.current.flatMap((u, i) => i === activeCoaster ? shapes : u)
      : shapes;
    for(const s of all){
      const area=s.h*s.w;
      if(s.type==='tri') add(s.color,area*0.5);
      else add(s.color,area);
    }
    const patchQty = isCoasterKit ? 1 : kitQty;
    const items=Array.from(map.values()).map(c=>({...c,...calcYardage(c.count,bs,patchQty)})).sort((a,b)=>b.count-a.count);
    const total=all.reduce((sum,s)=>sum+(s.type==='tri'?s.h*s.w*0.5:s.h*s.w),0);
    const possible = rows*cols*(isCoasterKit ? COASTER_COUNT : 1);
    return{items,total,possible,yards:items.reduce((s,x)=>s+x.yards,0)};
  },[shapes,bs,rows,cols,kitQty,isCoasterKit,activeCoaster,coasterRev]);

  const fw=cols*bs, fh=rows*bs;
  const backCalc=useMemo(()=>calcBacking(fw,fh,kitQty),[fw,fh,kitQty]);
  const bindCalc=useMemo(()=>calcBinding(fw,fh,kitQty),[fw,fh,kitQty]);
  const grandTotal=materials.yards+(backing?backCalc.yards:0)+(binding?bindCalc.yards:0);

  // Smallest allowed block size. Most quilts stop at 2" blocks, but Coasters
  // are small enough that 1" blocks are useful, so we relax the floor there.
  const minBsFor = name => (name === 'Coaster' ? 1 : 2);
  const minBs = useMemo(() => minBsFor(preset), [preset]);

  const maxBs = useMemo(() => {
    const p = PRESETS.find(x => x.name === preset);
    if (!p) return 12;
    return Math.max(minBs, Math.min(12, Math.floor(Math.min(p.w, p.h) / 2)));
  }, [preset, minBs]);

  const applyPreset = name => {
    const p = PRESETS.find(x => x.name === name);
    if (!p) return;
    if (isCoasterSize(name) && !coasterUnitsRef.current) {
      coasterUnitsRef.current = seedCoasterUnits(shapes);
      undoStacksRef.current = Array.from({ length: COASTER_COUNT }, () => []);
      historyRef.current = [];
      setActiveCoaster(0);
      activeCoasterRef.current = 0;
    } else if (!isCoasterSize(name)) {
      if (coasterUnitsRef.current) coasterUnitsRef.current[activeCoaster] = shapes;
      coasterUnitsRef.current = null;
      setActiveCoaster(0);
      activeCoasterRef.current = 0;
    }
    setPreset(name);
    if (!p) return;
    const presetMinBs = minBsFor(name);
    const presetMaxBs = Math.max(presetMinBs, Math.min(12, Math.floor(Math.min(p.w, p.h) / 2)));
    const v = Math.max(presetMinBs, Math.min(presetMaxBs, bs));
    if (v !== bs) setBs(v);
    setCols(Math.min(MAX, Math.max(2, Math.round(p.w / v))));
    setRows(Math.min(MAX, Math.max(2, Math.round(p.h / v))));
  };

  const handleBsChange = newBs => {
    const v = Math.max(minBs, Math.min(maxBs, Math.round(newBs)));
    setBs(v);
    const p = PRESETS.find(x => x.name === preset);
    if (!p) return;
    setCols(Math.min(MAX, Math.max(2, Math.round(p.w / v))));
    setRows(Math.min(MAX, Math.max(2, Math.round(p.h / v))));
  };

  return (
    <div className="app">

      {/* Header */}
      <header>
        <div className="header-left" style={{display:'flex',alignItems:'center',gap:8}}>
          {onBack && (
            <button className="icon-btn" onClick={onBack} title="Back to projects" style={{marginRight:2}}>
              <i className="iconoir-arrow-left" style={{fontSize:18}}/>
            </button>
          )}
          <a className="brand" href="/" aria-label="metime — home">
            <MetimeLogo/>
          </a>
        </div>
        <div className="header-center">
          <PresetPill
            preset={preset}
            fw={fw} fh={fh}
            onApply={applyPreset}/>
        </div>
        <div className="header-right">
          <AccountChip/>
          <button className="icon-btn rp-toggle-header" aria-expanded={panelOpen} aria-controls="quilt-detail-panel"
            title={panelOpen ? 'Hide details panel' : 'Show details panel'}
            onClick={()=>setPanelOpen(v=>!v)}>
            <IcPanel/>
          </button>
          {savedQuilts.length>0 && (
            <button className="btn" style={{display:'flex',alignItems:'center',gap:5}} onClick={()=>setShowMyQuilts(true)}>
              <IcBook/> My quilts ({savedQuilts.length})
            </button>
          )}
          {currentQuilt ? (
            <>
              <button className="btn" title="Save as a new copy"
                onClick={()=>{setSaveName(((currentQuilt.name||'')+' copy').trim());setShowSave(true);}}>
                Save as…
              </button>
              <button className="btn btn-dark" title={`Update “${currentQuilt.name}”`} onClick={updateCurrentQuilt}>
                {justSaved ? 'Saved ✓' : 'Save'}
              </button>
            </>
          ) : (
            <button className="btn btn-dark" onClick={()=>{setSaveName('');setShowSave(true);}}>
              {justSaved ? 'Saved ✓' : 'Save quilt'}
            </button>
          )}
        </div>
      </header>

      {/* Body */}
      <div className={`body${panelOpen ? '' : ' rp-closed'}`}>

        {/* Left tool rail (desktop only; mobile uses the bottom toolbar) */}
        {!isMobile && (
          <ToolRail
            tool={tool}
            setTool={setTool}
            onToggleHints={()=>setShowHints(v=>!v)}
            hintsOn={showHints}
            helpRef={helpAnchor}/>
        )}

        {/* Center: canvas */}
        <div className="panel" style={{display:'flex',flexDirection:'column',background:'var(--app-bg)',borderRight:'none'}}>
          {isCoasterKit && (
            <CoasterTabs active={activeCoaster} onSelect={selectCoaster} onCopyAll={copyCoasterToAll}/>
          )}
          <SizeBar
            bs={bs}
            minBs={minBs}
            maxBs={maxBs}
            onBsChange={handleBsChange}
            fw={fw} fh={fh}
            cols={cols} rows={rows}
            onUndo={undo}
            undoDisabled={historyRef.current.length === 0}
            onClear={()=>setConfirmClear(true)}
            clearDisabled={shapes.length === 0}/>
          <div style={{flex:1,minHeight:0,position:'relative'}}>
            <GridCanvas cols={cols} rows={rows} shapes={shapes} setShapes={setShapes}
              selIds={selIds} setSelIds={setSelIds}
              tool={tool} selectedColor={color}
              quiltPattern={qPattern} quiltSpacing={qSpacing} quiltColor={qColor} showQuilting={showQ}
              zoom={zoom} onZoomChange={setZoom} pinned={pinned} isMobile={isMobile}/>
            {showHints && (
              <div className="hint-overlay">
                <span>Click to select · Drag to marquee</span>
                <span>·</span>
                <span>Shift+click to add/remove</span>
                <span>·</span>
                <span>Arrow keys to move · Delete to remove</span>
                <span>·</span>
                <span>Drag handles to resize · F to flip triangles</span>
              </div>
            )}
          </div>
          <ZoomBar
            zoom={zoom}
            onZoomChange={setZoom}
            onReset={resetZoom}
            onStep={adjustZoom}/>
        </div>

        {/* Right column (desktop only; mobile uses the bottom toolbar + sheets) */}
        {!isMobile && (<>
        {panelOpen && <div className="rp-backdrop" onClick={()=>setPanelOpen(false)}/>}
        {panelOpen && (
          <button className="rp-close icon-btn" title="Close panel" aria-label="Close panel" onClick={()=>setPanelOpen(false)}>
            <IcX/>
          </button>
        )}
        {!panelOpen && (
          <div className="rp-rail">
            <button className="icon-btn" aria-expanded={false} aria-controls="quilt-detail-panel"
              title="Expand details panel" aria-label="Expand details panel" onClick={()=>setPanelOpen(true)}>
              <IcPanel/>
            </button>
            <div className="rail-divider"/>
            <button className={`rp-rail-swatch${color ? '' : ' empty'}`} onClick={()=>setPanelOpen(true)}
              title={color ? `Current color: ${color.name}` : 'No color selected'}
              style={color ? {background:color.hex} : undefined}/>
            <div className="rp-rail-stat">
              <b>{Math.round(grandTotal * 10) / 10}</b>
              <span>yd</span>
            </div>
          </div>
        )}
        <div id="quilt-detail-panel" className="panel right-panel">
          <MyPaletteCard
            color={color}
            pinned={pinned}
            setPinned={setPinned}
            setColor={setColor}
            selIds={selIds}
            setShapes={setShapes}
            onOpenLibrary={openLibrary}/>
          <FabricRow
            ref={backingRowRef}
            label="Backing"
            fabric={backing}
            detail={backing ? `${backCalc.backingW}"×${backCalc.backingH}" · ${backCalc.widths}w · ${fmtY(backCalc.yards)}` : ''}
            onClick={() => setShowBackingPicker(true)}
            onSwatchClick={fabricFullSrc(backing) ? () => setInspectBacking(backing) : null}/>
          <FabricRow
            ref={bindingRowRef}
            label="Binding"
            fabric={binding}
            detail={binding ? `${bindCalc.strips} strips · ${bindCalc.perimeter}" perim. · ${fmtY(bindCalc.yards)}` : ''}
            onClick={() => openColorPicker(
              bindingRowRef,
              setBinding,
              binding ? () => setBinding(null) : null,
              'Binding fabric')}/>
          <QuiltPatternBlock
            qPattern={qPattern} setQPattern={setQPattern}
            qSpacing={qSpacing} setQSpacing={setQSpacing}
            qColor={qColor} setQColor={setQColor}
            onPickColor={openColorPicker}
            showQ={showQ} setShowQ={setShowQ}/>
          <MaterialsBlock materials={materials} grandTotal={grandTotal} fmtY={fmtY}/>
          <div style={{borderTop:'1px solid var(--warm-divider-soft)',flex:1,overflowY:'auto'}}>
            <div style={{padding:'10px 16px 4px'}}>
              <div className="label">Quilt top · by color</div>
            </div>
            {materials.items.length===0 ? (
              <div style={{padding:'12px 16px',fontSize:12,color:'var(--warm-muted)',fontStyle:'italic'}}>Draw shapes to see your fabric list.</div>
            ) : materials.items.map(item=>(
              <div key={item.name} className="mat-row">
                <div style={{width:26,height:26,background:item.hex,border:'1px solid rgba(0,0,0,0.10)',borderRadius:3,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                  <div style={{fontSize:11,color:'var(--warm-muted)',fontFamily:'var(--font-mono)'}}>{item.count} pcs · {item.strips} strip{item.strips!==1?'s':''}</div>
                </div>
                <div style={{fontSize:14,fontWeight:600,fontVariantNumeric:'tabular-nums',color:'var(--warm-fg)'}}>{fmtY(item.yards)}</div>
              </div>
            ))}
            <div style={{padding:'12px 16px',fontSize:11,color:'var(--warm-muted)',lineHeight:1.6}}>
              Assumes 40" WOF, ¼" seam allowance. Backing adds 4" per side. Binding: 2.5" double-fold strips. Add 10–15% for shrinkage.
            </div>
          </div>
        </div>
        </>)}

        {/* Mobile bottom toolbar (Canva-style): tools + extras that open sheets */}
        {isMobile && (
          <MobileToolbar items={[
            { id:'select', label:'Select', icon:<IcCursor/>, active: tool==='select', onClick:()=>setTool('select') },
            { id:'pan', label:'Move canvas', icon:<IcHand/>, active: tool==='pan', onClick:()=>setTool('pan') },
            { id:'paint', label:'Square', icon:<IcSquare/>, active: tool==='paint', onClick:()=>setTool('paint') },
            { id:'hst', label:'Triangle', icon:<IcTri/>, active: tool==='hst', onClick:()=>setTool('hst') },
            { id:'d1', divider:true },
            { id:'palette', label:'My palette', active: sheet==='palette',
              icon:<span className={`mt-swatch${color?'':' empty'}`} style={color?{background:color.hex}:undefined}/>,
              onClick:()=>setSheet(s=>s==='palette'?null:'palette') },
            { id:'size', label:'Quilt size', icon:<IcRuler/>, active: sheet==='size', onClick:()=>setSheet(s=>s==='size'?null:'size') },
            { id:'fabrics', label:'Backing & binding', icon:<IcTiles/>, active: sheet==='fabrics', onClick:()=>setSheet(s=>s==='fabrics'?null:'fabrics') },
            { id:'pattern', label:'Quilt pattern', icon:<IcGrid/>, active: sheet==='pattern', onClick:()=>setSheet(s=>s==='pattern'?null:'pattern') },
            { id:'materials', label:'Materials', icon:<IcList/>, active: sheet==='materials', onClick:()=>setSheet(s=>s==='materials'?null:'materials') },
            { id:'d2', divider:true },
            { id:'hints', label: showHints?'Hide hints':'Show hints', icon:<IcHelp/>, active: showHints, onClick:()=>setShowHints(v=>!v) },
          ]}/>
        )}
      </div>

      {/* Mobile bottom sheets (desktop shows this content in the right panel). */}
      {isMobile && sheet === 'palette' && (
        <BottomSheet onClose={()=>setSheet(null)} title="My palette">
          <MyPaletteCard color={color} pinned={pinned} setPinned={setPinned} setColor={setColor}
            selIds={selIds} setShapes={setShapes} onOpenLibrary={openLibrary}
            onAfterPick={()=>setSheet(null)}/>
        </BottomSheet>
      )}
      {isMobile && sheet === 'size' && (
        <BottomSheet onClose={()=>setSheet(null)} title="Quilt size">
          <div style={{ padding: '4px 6px 12px' }}>
            {PRESETS.map(p => (
              <button key={p.name} onClick={()=>{ applyPreset(p.name); setSheet(null); }}
                style={{ display:'flex', justifyContent:'space-between', alignItems:'center', width:'100%',
                  padding:'11px 12px', borderRadius:6, border:'none',
                  background: preset===p.name ? 'var(--warm-hover)' : 'transparent', cursor:'pointer',
                  fontFamily:'var(--font-sans)', fontSize:14, color:'var(--warm-fg)', textAlign:'left' }}>
                <span style={{ fontWeight: preset===p.name ? 500 : 400 }}>{p.name}</span>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:12, color:'var(--warm-muted)' }}>{p.w}" × {p.h}"</span>
              </button>
            ))}
          </div>
        </BottomSheet>
      )}
      {isMobile && sheet === 'fabrics' && (
        <BottomSheet onClose={()=>setSheet(null)} title="Backing & binding">
          <FabricRow ref={backingRowRef} label="Backing" fabric={backing}
            detail={backing ? `${backCalc.backingW}"×${backCalc.backingH}" · ${backCalc.widths}w · ${fmtY(backCalc.yards)}` : ''}
            onClick={() => { setSheet(null); setShowBackingPicker(true); }}
            onSwatchClick={fabricFullSrc(backing) ? () => setInspectBacking(backing) : null}/>
          <FabricRow ref={bindingRowRef} label="Binding" fabric={binding}
            detail={binding ? `${bindCalc.strips} strips · ${bindCalc.perimeter}" perim. · ${fmtY(bindCalc.yards)}` : ''}
            onClick={() => openColorPicker(bindingRowRef, setBinding, binding ? () => setBinding(null) : null, 'Binding fabric')}/>
        </BottomSheet>
      )}
      {isMobile && sheet === 'pattern' && (
        <BottomSheet onClose={()=>setSheet(null)} title="Quilt pattern">
          <QuiltPatternBlock qPattern={qPattern} setQPattern={setQPattern} qSpacing={qSpacing} setQSpacing={setQSpacing}
            qColor={qColor} setQColor={setQColor} onPickColor={openColorPicker} showQ={showQ} setShowQ={setShowQ}/>
        </BottomSheet>
      )}
      {isMobile && sheet === 'materials' && (
        <BottomSheet onClose={()=>setSheet(null)} title="Materials">
          <MaterialsBlock materials={materials} grandTotal={grandTotal} fmtY={fmtY}/>
          <div style={{borderTop:'1px solid var(--warm-divider-soft)'}}>
            <div style={{padding:'10px 16px 4px'}}><div className="label">Quilt top · by color</div></div>
            {materials.items.length===0 ? (
              <div style={{padding:'12px 16px',fontSize:12,color:'var(--warm-muted)',fontStyle:'italic'}}>Draw shapes to see your fabric list.</div>
            ) : materials.items.map(item=>(
              <div key={item.name} className="mat-row">
                <div style={{width:26,height:26,background:item.hex,border:'1px solid rgba(0,0,0,0.10)',borderRadius:3,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                  <div style={{fontSize:11,color:'var(--warm-muted)',fontFamily:'var(--font-mono)'}}>{item.count} pcs · {item.strips} strip{item.strips!==1?'s':''}</div>
                </div>
                <div style={{fontSize:14,fontWeight:600,fontVariantNumeric:'tabular-nums',color:'var(--warm-fg)'}}>{fmtY(item.yards)}</div>
              </div>
            ))}
          </div>
        </BottomSheet>
      )}

      {/* Library popover. Anchored to whatever invoked it (My palette + or a
          fabric row); doubles as a fabric picker when `picker.onPick` is set. */}
      {picker && libraryAnchorRef.current && (
        <LibraryPopover
          anchorRef={libraryAnchorRef}
          onClose={closePicker}
          search={search} setSearch={setSearch}
          grp={grp} setGrp={setGrp}
          filtered={filtered}
          color={color} setColor={setColor}
          selIds={selIds} setShapes={setShapes}
          customs={customs} setCustoms={setCustoms}
          setPinned={setPinned}
          allColors={allColors}
          pinned={pinned}
          showMyPalette={picker.showMyPalette}
          onPick={picker.onPick}
          onClear={picker.onClear}
          title={picker.title}
          isMobile={isMobile}
          afterPick={isMobile ? () => setSheet(null) : undefined}/>
      )}

      {showBackingPicker && (
        <BackingPickerOverlay
          current={backing}
          onChoose={fab => { setBacking(fab); setShowBackingPicker(false); }}
          onClear={backing ? () => setBacking(null) : null}
          onClose={() => setShowBackingPicker(false)}/>
      )}
      {inspectBacking && (
        <FabricEnlargeOverlay
          fabric={inspectBacking}
          onClose={() => setInspectBacking(null)}/>
      )}

      {/* Clear confirm */}
      {confirmClear && (
        <div className="overlay" onClick={()=>setConfirmClear(false)}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:'#FFFFFF',border:'1px solid #CCD6EB',borderRadius:8,padding:24,maxWidth:340,width:'100%',margin:16,boxShadow:'0 8px 32px rgba(0,0,0,0.14)'}}>
            <div style={{fontWeight:400,fontSize:24,marginBottom:8,fontFamily:"var(--font-display)",lineHeight:1.1}}>{isCoasterKit ? 'Clear this coaster?' : 'Clear the quilt?'}</div>
            <div style={{fontSize:13,color:'#3D4E70',marginBottom:20,lineHeight:1.5}}>{isCoasterKit ? 'This will remove all shapes from this coaster. The rest of the set is unchanged.' : 'This will remove all shapes from your design. This cannot be undone.'}</div>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <button className="btn" onClick={()=>setConfirmClear(false)}>Cancel</button>
              <button className="btn btn-dark" onClick={()=>{setShapes([]);setSelIds(new Set());setConfirmClear(false);}}>{isCoasterKit ? 'Clear coaster' : 'Clear all'}</button>
            </div>
          </div>
        </div>
      )}

      {/* Save dialog */}
      {showSave && (
        <div className="overlay" onClick={()=>setShowSave(false)}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:'#FFFFFF',border:'1px solid #CCD6EB',borderRadius:8,padding:24,maxWidth:380,width:'100%',margin:16,boxShadow:'0 8px 32px rgba(0,0,0,0.14)'}}>
            <div style={{fontWeight:400,fontSize:24,marginBottom:16,fontFamily:"var(--font-display)",lineHeight:1.1}}>{currentQuilt?'Save a copy':'Save your quilt'}</div>
            <AccountsOfflineNote/>
            <input type="text" placeholder="Give your quilt a name…" value={saveName} onChange={e=>setSaveName(e.target.value)}
              autoFocus onKeyDown={e=>{if(e.key==='Enter')saveNewQuilt();}}
              style={{marginBottom:16}}/>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <button className="btn" onClick={()=>setShowSave(false)}>Cancel</button>
              <button className="btn btn-dark" onClick={saveNewQuilt}>Save</button>
            </div>
          </div>
        </div>
      )}

      {/* My quilts list */}
      {showMyQuilts && (
        <div className="overlay" onClick={()=>setShowMyQuilts(false)}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:'#FFFFFF',border:'1px solid #CCD6EB',borderRadius:8,padding:24,maxWidth:500,width:'100%',margin:16,boxShadow:'0 8px 32px rgba(0,0,0,0.14)',maxHeight:'80vh',overflowY:'auto'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
              <div style={{fontWeight:400,fontSize:24,fontFamily:"var(--font-display)",lineHeight:1.1}}>My quilts</div>
              <button onClick={()=>setShowMyQuilts(false)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--warm-muted)',display:'flex'}}><IcX/></button>
            </div>
            {saveError && (
              <div style={{fontSize:12,color:'var(--metime-tomato)',background:'#FBECE8',border:'1px solid #F3C9BF',borderRadius:6,padding:'8px 10px',marginBottom:12}}>{saveError}</div>
            )}
            {savedQuilts.length===0 ? (
              <div style={{fontSize:13,color:'var(--warm-muted)',fontStyle:'italic',padding:'20px 0',textAlign:'center'}}>No saved quilts yet</div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                {savedQuilts.map(q=>(
                  <div key={q.id} style={{display:'flex',gap:12,alignItems:'center',padding:12,border:'1px solid #CCD6EB',borderRadius:6,cursor:'pointer',transition:'background .1s'}}
                    onClick={()=>{setViewQuilt(q);setShowMyQuilts(false);}} title="Preview"
                    onMouseEnter={e=>e.currentTarget.style.background='#EDF2FC'}
                    onMouseLeave={e=>e.currentTarget.style.background='#FFFFFF'}>
                    <div style={{width:64,height:64,flexShrink:0,position:'relative',background:'#FFFFFF',borderRadius:4,overflow:'hidden'}}>
                      <svg viewBox={`0 0 ${q.cols} ${q.rows}`} width="64" height="64" preserveAspectRatio="xMidYMid meet">
                        {q.shapes.map((s,i)=>s.type==='tri'?(
                          <polygon key={i} points={s.dir==='/'?(s.half==='a'?`${s.c},${s.r} ${s.c+s.w},${s.r} ${s.c},${s.r+s.h}`:`${s.c+s.w},${s.r} ${s.c+s.w},${s.r+s.h} ${s.c},${s.r+s.h}`):(s.half==='a'?`${s.c},${s.r} ${s.c+s.w},${s.r} ${s.c+s.w},${s.r+s.h}`:`${s.c},${s.r} ${s.c},${s.r+s.h} ${s.c+s.w},${s.r+s.h}`)} fill={s.color.hex}/>
                        ):<rect key={i} x={s.c} y={s.r} width={s.w} height={s.h} fill={s.color.hex} stroke="rgba(0,0,0,0.08)" strokeWidth="0.05"/>)}
                      </svg>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:500,fontSize:14,marginBottom:2}}>{q.name}</div>
                      <div style={{fontSize:12,color:'var(--warm-muted)'}}>{q.fw}" × {q.fh}" · {q.preset !== 'Custom' ? q.preset : 'Custom size'}</div>
                      <div style={{fontSize:12,color:'var(--warm-muted)'}}>{q.materials.items.length} color{q.materials.items.length!==1?'s':''} · {fmtY(q.grandTotal)} total</div>
                    </div>
                    {confirmDeleteId===q.id ? (
                      <div style={{display:'flex',gap:6,alignItems:'center'}} onClick={e=>e.stopPropagation()}>
                        <button className="btn btn-sm" onClick={()=>setConfirmDeleteId(null)}>Cancel</button>
                        <button className="btn btn-sm btn-dark" onClick={()=>{deleteCloudDesign(q.apiId);setSavedQuilts(p=>p.filter(x=>x.id!==q.id));setConfirmDeleteId(null);}}>Delete</button>
                      </div>
                    ) : (
                      <div style={{display:'flex',gap:2,alignItems:'center'}}>
                        <button title="Delete quilt"
                          onClick={e=>{e.stopPropagation();setConfirmDeleteId(q.id);}}
                          style={{background:'none',border:'none',cursor:'pointer',color:'var(--warm-muted)',display:'flex',padding:4}}
                          onMouseEnter={e=>e.currentTarget.style.color='var(--metime-tomato)'}
                          onMouseLeave={e=>e.currentTarget.style.color='var(--warm-muted)'}><IcTrash/></button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Quilt preview */}
      {viewQuilt && (()=>{
        const q = viewQuilt;
        const allItems = [
          ...q.materials.items.map(m=>({type:'Quilt top',name:m.name,hex:m.hex,detail:`${m.count} pcs · ${m.strips} strip${m.strips!==1?'s':''}`,yards:m.yards})),
          ...(q.backing ? [{type:'Backing',name:q.backing.name,hex:q.backing.hex,detail:`${q.backCalc.backingW}"×${q.backCalc.backingH}" · ${q.backCalc.widths}w`,yards:q.backCalc.yards}] : []),
          ...(q.binding ? [{type:'Binding',name:q.binding.name,hex:q.binding.hex,detail:`${q.bindCalc.strips} strips · ${q.bindCalc.perimeter}" perim.`,yards:q.bindCalc.yards}] : []),
        ];
        return (
          <div className="overlay" onClick={()=>setViewQuilt(null)}>
            <div onClick={e=>e.stopPropagation()}
              style={{background:'#FFFFFF',border:'1px solid #CCD6EB',borderRadius:8,maxWidth:720,width:'100%',margin:16,boxShadow:'0 8px 32px rgba(0,0,0,0.14)',maxHeight:'90vh',overflowY:'auto'}}>

              {/* Top bar */}
              <div style={{padding:'20px 24px 16px',borderBottom:'1px solid #EDF2FC',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div>
                  <div style={{fontWeight:400,fontSize:24,fontFamily:"var(--font-display)",lineHeight:1.1}}>{q.name}</div>
                  <div style={{fontSize:13,color:'var(--warm-muted)',marginTop:2}}>{q.fw}" × {q.fh}" · {q.preset !== 'Custom' ? q.preset : 'Custom size'} · {q.bs}" blocks</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <button className="btn" onClick={()=>loadQuilt(q)}>Open on canvas</button>
                  <button onClick={()=>setViewQuilt(null)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--warm-muted)',display:'flex'}}><IcX/></button>
                </div>
              </div>

              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:0}}>
                {/* Preview */}
                <div style={{padding:24,borderRight:'1px solid #EDF2FC',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <div style={{width:'100%',maxWidth:320,background:'#FFFFFF',borderRadius:4,overflow:'hidden',border:'1px solid #CCD6EB'}}>
                    <svg viewBox={`0 0 ${q.cols} ${q.rows}`} width="100%" preserveAspectRatio="xMidYMid meet" style={{display:'block'}}>
                      <rect width={q.cols} height={q.rows} fill="#FFFFFF"/>
                      {Array.from({length:q.cols+1},(_,i)=><line key={`v${i}`} x1={i} y1={0} x2={i} y2={q.rows} stroke="#EDF2FC" strokeWidth="0.04"/>)}
                      {Array.from({length:q.rows+1},(_,i)=><line key={`h${i}`} x1={0} y1={i} x2={q.cols} y2={i} stroke="#EDF2FC" strokeWidth="0.04"/>)}
                      {q.shapes.map((s,i)=>s.type==='tri'?(
                        <polygon key={i} points={s.dir==='/'?(s.half==='a'?`${s.c},${s.r} ${s.c+s.w},${s.r} ${s.c},${s.r+s.h}`:`${s.c+s.w},${s.r} ${s.c+s.w},${s.r+s.h} ${s.c},${s.r+s.h}`):(s.half==='a'?`${s.c},${s.r} ${s.c+s.w},${s.r} ${s.c+s.w},${s.r+s.h}`:`${s.c},${s.r} ${s.c},${s.r+s.h} ${s.c+s.w},${s.r+s.h}`)} fill={s.color.hex}/>
                      ):<rect key={i} x={s.c} y={s.r} width={s.w} height={s.h} fill={s.color.hex} stroke="rgba(0,0,0,0.08)" strokeWidth="0.05"/>)}
                    </svg>
                  </div>
                </div>

                {/* Supplies list */}
                <div style={{display:'flex',flexDirection:'column'}}>
                  <div style={{padding:'16px 20px 8px'}}>
                    <div className="label" style={{marginBottom:4}}>Supplies list</div>
                    <div style={{fontSize:12,color:'var(--warm-muted)'}}>{allItems.length} item{allItems.length!==1?'s':''}</div>
                  </div>
                  <div style={{flex:1,overflowY:'auto',maxHeight:320}}>
                    {allItems.map((item,i)=>(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 20px',borderBottom:'1px solid #EDF2FC'}}>
                        <div style={{width:24,height:24,background:item.hex,border:'1px solid rgba(0,0,0,0.10)',borderRadius:3,flexShrink:0}}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                          <div style={{fontSize:11,color:'var(--warm-muted)'}}>{item.type} · {item.detail}</div>
                        </div>
                        <div style={{fontSize:13,fontWeight:600,fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap'}}>{fmtY(item.yards)}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{padding:'12px 20px',borderTop:'1px solid #EDF2FC',display:'flex',flexDirection:'column',gap:12}}>
                    <QuiltPdfButtons design={q}/>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                      <div>
                        <div style={{fontSize:11,color:'var(--warm-muted)'}}>Grand total</div>
                        <div style={{fontSize:20,fontWeight:600,fontVariantNumeric:'tabular-nums'}}>{fmtY(q.grandTotal)}</div>
                      </div>
                      <KitCheckoutButton type="quilt" design={q} savedId={q.apiId}
                        onSaved={id=>setSavedQuilts(p=>p.map(x=>x.id===q.id?{...x,apiId:id}:x))}/>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

// ── Tweaks ────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "borderColor": "#000000",
  "borderWidth": "1",
  "appBg": "#F9FBFE",
  "canvasBg": "#FFFFFF",
  "radius": "4"
}/*EDITMODE-END*/;

function applyTweaks(t) {
  const b = `${t.borderWidth}px solid ${t.borderColor}`;
  const root = document.documentElement;
  root.style.setProperty('--div-border', b);
  root.style.setProperty('--app-bg', t.appBg);
  root.style.setProperty('--canvas-bg', t.canvasBg);
  let s = document.getElementById('_tweak_s');
  if (!s) { s = document.createElement('style'); s.id = '_tweak_s'; document.head.appendChild(s); }
  s.textContent = `.btn, input[type=text], input[type=email], select, .chip { border-radius: ${t.radius}px !important; } .pill { border-radius: 2px !important; } body { background: ${t.appBg}; }`;
}

function TweaksPanel() {
  const [open, setOpen] = React.useState(false);
  const [t, setT] = React.useState(TWEAK_DEFAULTS);

  React.useEffect(() => {
    applyTweaks(TWEAK_DEFAULTS);
    const handler = (e) => {
      if (e.data && e.data.type === '__activate_edit_mode') setOpen(true);
      if (e.data && e.data.type === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const set = (key, val) => {
    const next = { ...t, [key]: val };
    setT(next);
    applyTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  if (!open) return null;

  const Row = ({ label, children }) => (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
      <span style={{ fontSize:11, color:'#3D4E70' }}>{label}</span>
      {children}
    </div>
  );

  return (
    <div style={{
      position:'fixed', bottom:16, right:16, zIndex:200,
      background:'#FFFFFF', border:'1px solid #000000', borderRadius:4,
      padding:'14px 16px', width:230,
      boxShadow:'0 4px 20px rgba(0,0,0,0.12)',
      fontFamily:"var(--font-sans)",
    }}>
      <div style={{ fontSize:11, fontWeight:600, marginBottom:14, letterSpacing:'0.08em', textTransform:'uppercase', color:'#000000' }}>Tweaks</div>

      <Row label="Border color">
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <input type="color" value={t.borderColor} onChange={e=>set('borderColor',e.target.value)}
            style={{ width:28, height:24, padding:2, border:'1px solid #CCD6EB', borderRadius:3, cursor:'pointer', background:'none' }}/>
          <span style={{ fontSize:10, fontFamily:"var(--font-mono)", color:'var(--warm-muted)' }}>{t.borderColor}</span>
        </div>
      </Row>

      <Row label="Border width">
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <input type="range" min={0} max={4} step={0.5} value={t.borderWidth} onChange={e=>set('borderWidth',e.target.value)}
            style={{ width:80, accentColor:'#000000' }}/>
          <span style={{ fontSize:10, fontFamily:"var(--font-mono)", color:'var(--warm-muted)', minWidth:28 }}>{t.borderWidth}px</span>
        </div>
      </Row>

      <Row label="Corner radius">
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <input type="range" min={0} max={12} step={1} value={t.radius} onChange={e=>set('radius',e.target.value)}
            style={{ width:80, accentColor:'#000000' }}/>
          <span style={{ fontSize:10, fontFamily:"var(--font-mono)", color:'var(--warm-muted)', minWidth:28 }}>{t.radius}px</span>
        </div>
      </Row>

      <Row label="Background">
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <input type="color" value={t.appBg} onChange={e=>set('appBg',e.target.value)}
            style={{ width:28, height:24, padding:2, border:'1px solid #CCD6EB', borderRadius:3, cursor:'pointer', background:'none' }}/>
          <span style={{ fontSize:10, fontFamily:"var(--font-mono)", color:'var(--warm-muted)' }}>{t.appBg}</span>
        </div>
      </Row>

      <Row label="Canvas bg">
        <div style={{ display:'flex', alignItems:'center', gap:6 }}>
          <input type="color" value={t.canvasBg} onChange={e=>set('canvasBg',e.target.value)}
            style={{ width:28, height:24, padding:2, border:'1px solid #CCD6EB', borderRadius:3, cursor:'pointer', background:'none' }}/>
          <span style={{ fontSize:10, fontFamily:"var(--font-mono)", color:'var(--warm-muted)' }}>{t.canvasBg}</span>
        </div>
      </Row>

      <button onClick={()=>{ setT(TWEAK_DEFAULTS); applyTweaks(TWEAK_DEFAULTS); }}
        style={{ marginTop:6, width:'100%', padding:'5px 0', fontSize:11, background:'none', border:'1px solid #CCD6EB', borderRadius:4, cursor:'pointer', color:'var(--warm-muted)', fontFamily:"var(--font-sans)" }}>
        Reset defaults
      </button>
    </div>
  );
}

function QuiltThumb({ preset }) {
  const theme = PRESET_THEMES[preset.name] || { c1:"#2C3E50", c2:"#8FAABF" };
  const aspect = preset.h / preset.w;
  const W = 200, H = Math.round(W * aspect);
  // Five patches across, matching the block scale of the photographed quilts —
  // any finer and the thumb reads as gingham rather than as a quilt.
  const cellSize = W / 5;
  const cols = Math.ceil(W / cellSize);
  const rows = Math.ceil(H / cellSize);
  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const even = (r + c) % 2 === 0;
      cells.push(
        <rect key={`${r}-${c}`}
          x={c * cellSize} y={r * cellSize}
          width={cellSize} height={cellSize}
          fill={even ? theme.c1 : theme.c2}/>
      );
    }
  }
  return (
    <svg viewBox={`0 0 ${W} ${H}`} xmlns="http://www.w3.org/2000/svg">
      {cells}
      <rect width={W} height={H} fill="none" stroke="rgba(0,0,0,0.15)" strokeWidth="1"/>
    </svg>
  );
}

// Supabase throttles OTP emails per address (one a minute by default), so the
// Resend button counts down rather than letting someone earn a 429.
const RESEND_COOLDOWN_SEC = 60;

// Copy for every failure the OTP flow can actually produce. Split by step
// because the same normalized code means different things when sending vs
// verifying ("too many codes sent" / "too many tries").
const AUTH_ERROR_COPY = {
  send: {
    rate_limited: "Too many codes requested — wait a minute and try again.",
    signups_disabled: "New accounts are turned off for this studio right now.",
    email_send_failed: "We couldn't send the email — the studio's email delivery isn't set up yet. Your design stays on this device.",
    network: "Couldn't reach the network — check your connection and try again.",
    not_configured: "Accounts aren't set up yet — your design stays on this device.",
    unknown: "Couldn't send a code — try again.",
  },
  verify: {
    invalid_code: "That code didn't match. Check the digits and try again.",
    expired: "That code has expired — send a fresh one.",
    rate_limited: "Too many tries — wait a minute and try again.",
    network: "Couldn't reach the network — check your connection and try again.",
    not_configured: "Accounts aren't set up yet — your design stays on this device.",
    unknown: "That code didn't work. Try again.",
  },
};

function AuthOverlay() {
  const auth = useAuth();
  const [step, setStep] = useState("email");
  const [email, setEmail] = useState("");
  const [code, setCode] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");
  const [cooldown, setCooldown] = useState(0);

  useEffect(() => {
    if (auth && auth.authOpen) {
      setStep("email");
      setCode("");
      setError("");
      setNotice("");
      setBusy(false);
      setCooldown(0);
    }
  }, [auth && auth.authOpen]);

  useEffect(() => {
    if (cooldown <= 0) return;
    const t = setTimeout(() => setCooldown(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [cooldown]);

  if (!auth || !auth.authOpen) return null;

  const sendCode = async (isResend) => {
    const trimmed = email.trim();
    if (!trimmed || (isResend && cooldown > 0)) return;
    setBusy(true); setError(""); setNotice("");
    const result = await requestAuthCode(trimmed);
    setBusy(false);
    if (!result.ok) {
      setError(AUTH_ERROR_COPY.send[result.error] || AUTH_ERROR_COPY.send.unknown);
      // A 429 means Supabase already sent one recently, so still start the
      // countdown — retrying sooner can only fail again.
      if (result.error === "rate_limited") setCooldown(RESEND_COOLDOWN_SEC);
      return;
    }
    setEmail(trimmed);
    setStep("code");
    setCode("");
    setCooldown(RESEND_COOLDOWN_SEC);
    if (isResend) setNotice("New code sent.");
  };

  const submitCode = async () => {
    if (code.replace(/\D/g, "").length !== 6) return;
    setBusy(true); setError(""); setNotice("");
    const result = await verifyAuthCode(email, code);
    if (!result.ok) {
      setBusy(false);
      setError(AUTH_ERROR_COPY.verify[result.error] || AUTH_ERROR_COPY.verify.unknown);
      if (result.error === "expired") setCooldown(0);
      setCode("");
      return;
    }
    // completeAuth uploads the pending design and pulls the library down, so the
    // button stays busy until the save has actually landed.
    await auth.completeAuth(result.user);
  };

  const resendLabel = cooldown > 0 ? `Resend in ${cooldown}s` : "Resend";

  return (
    <div className="overlay" onClick={auth.closeAuth}>
      <div onClick={e => e.stopPropagation()}
        style={{ background: "#FFFFFF", border: "1px solid #CCD6EB", borderRadius: 8, padding: 24, maxWidth: 400, width: "100%", margin: 16, boxShadow: "0 8px 32px rgba(0,0,0,0.14)" }}>
        <div style={{ fontWeight: 400, fontSize: 24, marginBottom: 8, fontFamily: "var(--font-display)", lineHeight: 1.1 }}>
          {step === "email" ? "Save to your account" : "Enter your code"}
        </div>
        <div style={{ fontSize: 13, color: "#3D4E70", marginBottom: 16, lineHeight: 1.5 }}>
          {step === "email"
            ? "We'll email a 6-digit code so you can reopen this design on any device. No password."
            : `We sent a code to ${email}. Check your inbox — it expires shortly.`}
        </div>
        {step === "email" ? (
          <input type="email" placeholder="you@email.com" value={email} autoFocus
            onChange={e => setEmail(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") sendCode(false); }}
            style={{ marginBottom: 16 }}/>
        ) : (
          <input className="auth-code" type="text" inputMode="numeric" autoComplete="one-time-code"
            placeholder="000000" maxLength={6} value={code} autoFocus
            onChange={e => setCode(e.target.value.replace(/\D/g, "").slice(0, 6))}
            onKeyDown={e => { if (e.key === "Enter") submitCode(); }}
            style={{ marginBottom: 16 }}/>
        )}
        {error && (
          <div className="err-msg" style={{ fontSize: 12, marginBottom: 12 }}>{error}</div>
        )}
        {!error && notice && (
          <div style={{ fontSize: 12, color: "#3D4E70", marginBottom: 12 }}>{notice}</div>
        )}
        <div style={{ display: "flex", gap: 8, justifyContent: "flex-end", alignItems: "center" }}>
          {step === "code" && (
            <button className="btn" type="button" disabled={busy || cooldown > 0} onClick={() => sendCode(true)}>{resendLabel}</button>
          )}
          <button className="btn" type="button" onClick={auth.closeAuth}>Cancel</button>
          {step === "email" ? (
            <button className="btn btn-dark" type="button" disabled={busy || !email.trim()} onClick={() => sendCode(false)}>
              {busy ? "Sending…" : "Send code"}
            </button>
          ) : (
            <button className="btn btn-dark" type="button" disabled={busy || code.length !== 6} onClick={submitCode}>
              {busy ? "Saving…" : "Verify"}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function AuthProvider({ children }) {
  const [user, setUser] = useState(undefined);
  const [authOpen, setAuthOpen] = useState(false);
  const [libraryTick, setLibraryTick] = useState(0);
  const [lastSaved, setLastSaved] = useState(null);
  // Normally settled on the first render, since supabase-js is a synchronous
  // <script> in <head>. It's state rather than a constant so that a slow or
  // late-arriving client can still switch accounts on instead of disabling
  // them for the rest of the page's life.
  const [cloudEnabled, setCloudEnabled] = useState(supabaseConfigured);
  // The one case worth complaining about: real keys, no client.
  const [cloudBlocked, setCloudBlocked] = useState(false);

  const bumpLibrary = useCallback(() => setLibraryTick(t => t + 1), []);

  // Keys are filled in but the global isn't here. Look again for a few seconds,
  // then give up and let the UI say so — falling back to local-only saves in
  // silence is what makes a correctly configured studio look broken. A studio
  // with no keys at all never gets here and is never nagged.
  useEffect(() => {
    if (cloudEnabled || !supabaseKeysPresent()) return;
    const recheck = () => {
      if (!supabaseConfigured()) return false;
      setCloudEnabled(true);
      setCloudBlocked(false);
      return true;
    };
    const poll = setInterval(() => { if (recheck()) clearInterval(poll); }, 250);
    const giveUp = setTimeout(() => {
      clearInterval(poll);
      if (!recheck()) { setCloudBlocked(true); warnSupabaseUnreachable(); }
    }, SUPABASE_LOAD_GRACE_MS);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, [cloudEnabled]);

  const hydrate = useCallback(async (keep) => {
    if (!cloudEnabled) { bumpLibrary(); return; }
    const records = await listCloudDesigns();
    hydrateLocalLibrary(records, keep);
    bumpLibrary();
  }, [bumpLibrary, cloudEnabled]);

  // Everything that has to happen the moment a session exists, in order:
  // claim this device's local designs, finish the save that triggered sign-in,
  // then rebuild the on-device cache from the account. Claiming has to come
  // before hydrating, which overwrites that cache.
  const syncAccount = useCallback(async (account) => {
    if (!account || !cloudEnabled) return;
    let keep = [];
    try {
      const pending = readPendingSave();
      const claim = await claimLocalDesigns(account.id, pending && pending.record && pending.record.id);
      keep = claim.keep;
    } catch (e) {
      console.warn("Could not claim this device's designs:", e);
    }
    try {
      const flushed = await flushPendingSave();
      if (flushed) setLastSaved(flushed);
    } catch (e) {
      console.warn("Could not finish saving after sign-in:", e);
    }
    try {
      await hydrate(keep);
    } catch (e) {
      console.warn("Could not load saved designs:", e);
    }
  }, [hydrate, cloudEnabled]);

  const completeAuth = useCallback(async (nextUser) => {
    setUser(nextUser);
    setAuthOpen(false);
    await syncAccount(nextUser);
  }, [syncAccount]);

  const signOut = useCallback(async () => {
    await logoutUser();
    setUser(null);
    setLastSaved(null);
    // The cache belongs to the account that just left; the designs themselves
    // are safe in Supabase and come back on the next sign-in, anywhere.
    persistSavedQuilts([]);
    persistSavedStitches([]);
    persistSavedPunch([]);
    bumpLibrary();
  }, [bumpLibrary]);

  useEffect(() => {
    if (!cloudEnabled) { setUser(null); return; }
    let cancelled = false;
    (async () => {
      // supabase-js restores (and refreshes) the stored session, which is what
      // makes a returning visit already signed in.
      const me = await fetchMe();
      if (cancelled) return;
      setUser(me);
      if (me) await syncAccount(me);
    })();
    return () => { cancelled = true; };
  }, [syncAccount, cloudEnabled]);

  // Keeps the chip honest if the session ends outside this tab — signing out in
  // another tab, or a refresh token that can no longer be renewed.
  useEffect(() => {
    const client = sb();
    if (!client) return;
    const { data } = client.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") setUser(null);
      else if (session && session.user) setUser(toStudioUser(session.user));
    });
    return () => { if (data && data.subscription) data.subscription.unsubscribe(); };
  }, [cloudEnabled]);

  const value = {
    user: user === undefined ? null : user,
    userReady: user !== undefined,
    // False when Supabase isn't configured: no account wall, no cloud sync, and
    // the on-device library behaves the way it did before accounts existed.
    cloudEnabled,
    // Configured, but the client never showed up — the save UI explains itself
    // instead of pretending nothing happened.
    cloudBlocked,
    // Whether the saved-design drawers should be readable/writable right now.
    libraryOn: !cloudEnabled || !!user,
    authOpen,
    openAuth: () => setAuthOpen(true),
    closeAuth: () => setAuthOpen(false),
    completeAuth,
    signOut,
    libraryTick,
    lastSaved,
    consumeLastSaved: () => setLastSaved(null),
    hydrate,
  };

  return (
    <AuthContext.Provider value={value}>
      {children}
      <AuthOverlay/>
    </AuthContext.Provider>
  );
}

// Split a length into `n` near-equal integer segments → [[start,size],…].
function tplSegments(total, n) {
