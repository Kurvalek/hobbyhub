  }
  .pal-upload-sheet .bottom-sheet-head { padding: 4px 16px 8px; }
  .pal-upload-sheet-body { display: flex; flex-direction: column; gap: 8px; padding: 4px 16px 16px; }
  .pal-upload-sheet-hint { font-family: var(--font-sans); font-size: 13px; font-weight: 400; color: var(--warm-muted); line-height: 1.35; margin: -2px 0 4px; }
  .pal-upload-method {
    display: flex; align-items: flex-start; gap: 12px; width: 100%;
    padding: 12px 14px; text-align: left; cursor: pointer;
    font: inherit; color: inherit;
    background: var(--metime-white); border: 1px solid var(--metime-black); border-radius: var(--btn-radius);
  }
  .pal-upload-method:hover { background: var(--color-linen-300); }
  .pal-upload-method[aria-pressed="true"] { background: var(--metime-ice); border-color: var(--metime-almost-black); }
  .pal-upload-method:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .pal-upload-method:disabled { opacity: 0.5; cursor: default; }
  .pal-upload-method-icon { display: inline-flex; flex-shrink: 0; color: var(--metime-almost-black); margin-top: 1px; }
  .pal-upload-method-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pal-upload-method-title { font-family: var(--font-sans); font-size: 14px; font-weight: 500; color: var(--metime-black); line-height: 1.25; }
  .pal-upload-method-sub { font-family: var(--font-sans); font-size: 12px; font-weight: 400; color: var(--warm-muted); line-height: 1.3; }
  .pal-upload-method-block { display: flex; flex-direction: column; gap: 8px; }
  .pal-upload-method-block .pal-upload-url { padding: 0; background: transparent; border-radius: 0; }
  .pal-upload-method-block .pal-upload-url-row { flex-direction: column; }
  .pal-upload-method-block .pal-upload-url-row button { width: 100%; }
  .bottom-sheet-backdrop.is-lift { z-index: 240; }
  .bottom-sheet.is-lift { z-index: 241; }
  .pal-upload-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: flex-start; }
  /* Import actions — Secondary buttons (Medium), not filter pills. */
  .pal-upload-pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    box-sizing: border-box; height: 36px; padding: 0 18px;
    font-family: var(--font-sans); font-size: 14px; font-weight: 500; line-height: 1;
    color: var(--btn-secondary-fg); background: var(--btn-secondary-bg);
    border: var(--btn-stroke-w) solid var(--btn-secondary-border); border-radius: var(--pill-radius); cursor: pointer;
    transition: background .12s, box-shadow .12s;
  }
  .pal-upload-pill:hover { background: var(--btn-secondary-bg-hover); }
  .pal-upload-pill:active,
  .pal-upload-pill[aria-pressed="true"] { background: var(--btn-secondary-bg-active); }
  .pal-upload-pill:focus-visible { outline: none; box-shadow: var(--btn-focus-shadow); }
  .pal-upload-pill:disabled { background: transparent; border-color: var(--btn-disabled-border); color: var(--btn-disabled-fg); cursor: not-allowed; }
  .pal-upload-url {
    position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    width: 100%; padding: 10px; box-sizing: border-box;
    background: var(--color-linen-500); border-radius: 6px;
    cursor: default; text-align: left;
  }
  .pal-upload-url-label {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .pal-upload-url-row { display: flex; gap: 6px; width: 100%; }
  .pal-upload-url-row input {
    flex: 1; min-width: 0; height: 32px; padding: 0 10px;
    font-family: var(--font-sans); font-size: 13px; font-weight: 400;

    background: var(--metime-white); color: var(--warm-fg);
  }
  .pal-upload-url-row input:focus { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .pal-upload-url-row input:disabled { opacity: 0.6; }
  .pal-upload-url-row button {
    flex-shrink: 0; box-sizing: border-box; height: 32px; padding: 0 14px;
    font-family: var(--font-sans); font-size: 13px; font-weight: 500;
    border: var(--btn-stroke-w) solid var(--btn-secondary-border); border-radius: var(--pill-radius);
    background: var(--btn-secondary-bg); color: var(--btn-secondary-fg); cursor: pointer;
  }
  .pal-upload-url-row button:hover:not(:disabled) { background: var(--btn-secondary-bg-hover); }
  .pal-upload-url-row button:active:not(:disabled) { background: var(--btn-secondary-bg-active); }
  .pal-upload-url-row button:focus-visible { outline: none; box-shadow: var(--btn-focus-shadow); }
  .pal-upload-url-row button:disabled { border-color: var(--btn-disabled-border); color: var(--btn-disabled-fg); cursor: default; }
  .err-msg {
    background: var(--metime-grapefruit); color: var(--metime-white);

  .pal-upload-error {

  .pal-result { display: flex; gap: 20px; align-items: flex-start; background: var(--metime-white); border: 1px solid #707F87; border-radius: 4px; padding: 16px; }
  /* outline (not a border) so the stroke paints over the image content */
  .pal-result-preview { width: 120px; height: 120px; object-fit: cover; flex-shrink: 0; display: block; box-sizing: border-box; border: none; outline: 1px solid rgba(0, 0, 0, 0.5); outline-offset: -1px; }
  .pal-result-main { flex: 1; min-width: 0; }
  .pal-result-swatches { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }

  /* Suggested palette from image — Figma metime design system node 2151:24 */
  .pal-from-image {
    display: flex; gap: 20px; align-items: flex-start;
    background: var(--metime-white); border: 1px solid #707F87;
    border-radius: 4px; padding: 25px 16px 16px; box-sizing: border-box;
    width: fit-content; max-width: 100%;
  }
  .pal-from-image-preview {
    width: 100px; height: 100px; object-fit: cover; flex-shrink: 0;
    border: none; display: block; box-sizing: border-box;
    background-color: var(--ice-100);
    background-image:
      linear-gradient(45deg, var(--ice-200) 25%, transparent 25%),
      linear-gradient(-45deg, var(--ice-200) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--ice-200) 75%),
      linear-gradient(-45deg, transparent 75%, var(--ice-200) 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    /* outline (not inset box-shadow) so the stroke paints over the image content */
    outline: 1px solid rgba(0, 0, 0, 0.5); outline-offset: -1px;
  }
  .pal-from-image-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
  .pal-from-image-swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pal-from-image-swatch {
    position: relative; width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0;
    border: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
    box-sizing: border-box; padding: 0; cursor: pointer; overflow: hidden;
    transition: opacity var(--art-dur) var(--ease-out), transform var(--art-dur) var(--ease-out);
  }
  /* Held under the row until its turn comes, so the colors lift out of the
     photo one after another instead of all appearing at once. */
  .pal-from-image-swatch.rising { opacity: 0; transform: translateY(10px) scale(0.86); }
  .pal-from-image-x {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(245, 243, 238, 0.72); color: var(--metime-almost-black);
    opacity: 0; transition: opacity .12s; pointer-events: none;
  }
  .pal-from-image-x svg { width: 22px; height: 22px; }
  @media (hover: hover) and (pointer: fine) {

  }
  .pal-from-image-swatch.armed .pal-from-image-x { opacity: 1; }
  .pal-from-image-add {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    border: 1px dashed var(--ice-400); background: var(--metime-white);
    color: #3D4E70; font-size: 20px; line-height: 1; font-weight: 400;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; font-family: inherit;

  .pal-from-image-use {
    box-sizing: border-box; min-height: 44px; padding: 0 22px; border-radius: var(--pill-radius); font-size: 16px; font-weight: 500; line-height: normal;
  }
  .pal-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .pal-chip-check { width: 14px; height: 14px; accent-color: var(--color-taupe-900); cursor: pointer; margin: 0; }
  .pal-chip-color { width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.12); transition: box-shadow 0.12s, border-color 0.12s; }
  .pal-chip.locked .pal-chip-color { border-color: var(--metime-almost-black); box-shadow: 0 0 0 2px var(--metime-almost-black); }
  .pal-chip-label { font-size: 10px; color: var(--warm-muted); font-family: var(--font-sans); }
  .pal-chip.locked .pal-chip-label { color: var(--warm-fg); font-weight: 500; }
  .pal-check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--warm-fg); cursor: pointer; margin-bottom: 14px; user-select: none; }
  .pal-check input { width: 15px; height: 15px; accent-color: var(--color-taupe-900); cursor: pointer; }
  .pal-actions { display: flex; gap: 10px; align-items: center; }
  /* Setup-flow buttons — Medium size (36px). .pal-btn is Primary, .pal-btn.secondary
     and .pal-skip-btn are Secondary. */
  .pal-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; min-height: 36px; padding: 0 18px; border-radius: var(--pill-radius); font: inherit; font-size: 14px; font-weight: 500; line-height: normal; cursor: pointer; border: var(--btn-stroke-w) solid var(--btn-stroke); background: var(--btn-primary-bg); color: var(--btn-primary-fg); transition: background 0.12s, border-color 0.12s, box-shadow 0.12s, transform var(--press-dur) var(--ease-out); }
  .pal-btn:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-primary-bg-hover); }
  .pal-btn:active { background: var(--btn-primary-bg-active); border-color: var(--btn-primary-bg-active); }
  .pal-btn:focus-visible { outline: none; box-shadow: var(--btn-focus-shadow); }
  .pal-btn:disabled { background: var(--btn-primary-bg-disabled); border-color: var(--btn-primary-bg-disabled); color: var(--btn-disabled-fg); cursor: not-allowed; }
  .pal-btn.secondary { background: var(--btn-secondary-bg); border-color: var(--btn-secondary-border); color: var(--btn-secondary-fg); }
  .pal-btn.secondary:hover { background: var(--btn-secondary-bg-hover); }
  .pal-btn.secondary:active { background: var(--btn-secondary-bg-active); }
  .pal-btn.secondary:disabled { background: transparent; border-color: var(--btn-disabled-border); color: var(--btn-disabled-fg); }
  .pal-skip-row { display: flex; justify-content: flex-end; margin-top: 8px; margin-bottom: 0; }
  .pal-skip-btn {
    display: inline-flex; align-items: center; justify-content: center;
    box-sizing: border-box; min-height: 36px; padding: 0 18px; border-radius: var(--pill-radius);
    border: var(--btn-stroke-w) solid var(--btn-secondary-border); background: var(--btn-secondary-bg);
    color: var(--btn-secondary-fg); font-family: var(--font-sans); font-size: 14px; font-weight: 500;
    line-height: normal; cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s, box-shadow 0.12s, transform var(--press-dur) var(--ease-out);
  }
  .pal-skip-btn:hover { background: var(--btn-secondary-bg-hover); }
  .pal-skip-btn:active { background: var(--btn-secondary-bg-active); }
  .pal-skip-btn:focus-visible { outline: none; box-shadow: var(--btn-focus-shadow); }
  .pal-busy { font-size: 13px; color: var(--warm-muted); padding: 8px 0; }

  /* Template selector */
  .tmpl-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 900px) { .tmpl-grid { grid-template-columns: repeat(2, 1fr); } }
  .tmpl-card { background: var(--metime-white); border: 1px solid #707F87; border-radius: 4px; overflow: hidden; cursor: pointer; transition: box-shadow 0.15s, transform 0.12s; text-align: left; font: inherit; color: inherit; padding: 0; }
  .tmpl-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.13); transform: translateY(-2px); }
  .tmpl-card:active { transform: translateY(0); }
  .tmpl-card-thumb { background: var(--metime-cream); height: 230px; display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; }
  .tmpl-card-thumb svg { display: block; width: 100%; height: 100%; }
  /* Templates that know their own grid size (--tmpl-ar = width/height, set per
     card) preview at that proportion instead of inside a fixed box, so a 30x120
     bookmark chart reads as a tall strip. Height is capped at --tmpl-thumb-h and
     the strip is centered, keeping cards a sane size; no plate behind the art. */
  .tmpl-card-thumb.is-ratio { background: var(--metime-cream); height: auto; }
  .tmpl-card-thumb.is-ratio svg { width: min(100%, calc(var(--tmpl-thumb-h, 300px) * var(--tmpl-ar))); height: auto; aspect-ratio: var(--tmpl-ar); }
  .tmpl-card-body { padding: 12px 15px 15px; }
  .tmpl-card-name { font-size: 14px; font-weight: 500; color: #000000; line-height: normal; margin-bottom: 4px; }
  .tmpl-card-desc { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; }
  /* Back link — tertiary text style (Figma Button Tertiary Medium): Söhne Kräftig 14, taupe-900.
     Chevron sits outside the underline so only the label is underlined. */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-sans); font-size: 14px; font-weight: 500; line-height: 20px;
    color: var(--color-taupe-900); cursor: pointer;
    border: none; border-radius: 0;
    background: none; padding: 0; margin-bottom: 14px;
  }
  .back-link svg { width: 16px; height: 16px; flex-shrink: 0; }
  .back-link span { border-bottom: 1px solid currentColor; padding-bottom: 1px; }
  .back-link:hover { color: var(--color-taupe-600); }
  .back-link:active { color: var(--color-taupe-700); }

  /* Editable "suggested palette" (photo → palette step): swap or remove each floss. */
  .pal-suggest { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; align-items: flex-start; }
  .pal-suggest-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pal-suggest-swatch { width: 44px; height: 44px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.15); cursor: pointer; padding: 0; transition: transform .1s; }
  .pal-suggest-swatch:hover { transform: scale(1.06); }
  .pal-suggest-rm { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; border: none; background: var(--metime-black); color: var(--metime-white); font-size: 11px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .pal-suggest-code { font-size: 10px; color: var(--warm-muted); font-family: var(--font-sans); }
  .pal-suggest-add { width: 44px; height: 44px; border-radius: var(--btn-radius); border: 1px dashed var(--warm-muted); background: none; color: var(--warm-fg-2); font-size: 20px; line-height: 1; cursor: pointer; }
  .pal-suggest-add:hover { border-color: var(--metime-almost-black); color: var(--warm-fg); }

  /* Backing-fabric picker: Ice filter pills + dense swatch grid. */
  .fabric-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .fabric-filter-count { font-size: 13px; font-weight: 400; opacity: 0.7; }
  .fabric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .fabric-card { padding: 0; border: 1px solid #707F87; border-radius: 4px; overflow: hidden; cursor: pointer; background: var(--metime-cream); font: inherit; transition: box-shadow .15s, transform .12s; }
  .fabric-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.13); transform: translateY(-2px); }
  .fabric-card:active { transform: translateY(0); }
  .fabric-card.selected { box-shadow: 0 0 0 2px var(--metime-almost-black); }
  .fabric-thumb { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }

  /* Full-res fabric enlarge (studio swatch + picker confirm). Sits above
     bottom sheets so it still works from the mobile fabrics sheet. */
  .overlay-lift { z-index: 220; }
  .fabric-enlarge {
    background: var(--metime-white); border: 1px solid #CCD6EB; border-radius: 8px;
    padding: 20px 24px; max-width: min(720px, calc(100vw - 32px)); width: 100%;
    max-height: 90vh; overflow: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.14);
    box-sizing: border-box;
  }
  .fabric-enlarge-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .fabric-enlarge-name { font-family: var(--font-display); font-size: 24px; font-weight: 400; line-height: 1.1; color: #000000; min-width: 0; }
  .fabric-enlarge-img {
    display: block; width: 100%; max-height: min(70vh, 640px); object-fit: contain;
    background: var(--metime-cream); border: 1px solid #707F87; border-radius: 4px;
  }
  .fabric-enlarge-swatch {
    width: 100%; max-height: min(70vh, 640px); aspect-ratio: 1; border: 1px solid #707F87; border-radius: 4px;
  }
  .fabric-enlarge-stage { position: relative; }
  .fabric-enlarge-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 1;
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; padding: 0;
    background: var(--metime-white); border: 1px solid var(--metime-black); border-radius: 4px;
    color: var(--metime-black); cursor: pointer;
  }
  .fabric-enlarge-nav.is-prev { left: 8px; }
  .fabric-enlarge-nav.is-next { right: 8px; }
  .fabric-enlarge-nav:hover { background: #EDF2FC; }
  .fabric-enlarge-nav:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .fabric-enlarge-count {
    font-family: var(--font-sans); font-size: 13px; font-weight: 400;
    color: #3D4E70; white-space: nowrap; margin-left: auto; margin-right: 8px;
  }
  .fabric-enlarge-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  /* In-studio backing picker (reuses the setup catalog). */
  .backing-picker-dialog {
    background: var(--metime-white); border: 1px solid #CCD6EB; border-radius: 8px;
    max-width: 860px; width: 100%; margin: 16px; max-height: 90vh;
    box-shadow: 0 8px 32px rgba(0,0,0,0.14); display: flex; flex-direction: column;
    overflow: hidden; box-sizing: border-box;
  }
  .backing-picker-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 20px 24px 12px; border-bottom: 1px solid #EDF2FC; flex-shrink: 0;
  }
  .backing-picker-title { font-family: var(--font-display); font-size: 24px; font-weight: 400; line-height: 1.1; color: #000000; }
  .backing-picker-body { overflow-y: auto; padding: 20px 24px 24px; flex: 1; min-height: 0; }
  .backing-picker-dialog .pal-upload { width: 100%; max-width: 360px; }
  .backing-current {
    display: block; width: 100%; margin: 0 0 20px; padding: 0; border: 1px solid #707F87;
    border-radius: 4px; overflow: hidden; background: var(--metime-white); cursor: zoom-in;
    font: inherit; color: inherit; text-align: left;
  }
  .backing-current:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.13); }
  .backing-current-img { display: block; width: 100%; height: 220px; object-fit: cover; }
  .backing-current-caption { padding: 10px 12px; font-size: 13px; color: #3D4E70; }
  .fabric-row-swatch.can-enlarge { cursor: zoom-in; }
  .fabric-row-swatch.can-enlarge:hover { outline: 2px solid var(--selection); outline-offset: 1px; }

  /* Mobile-friendly project setup screens (size / template / palette steps). */
  @media (max-width: 640px) {
    .fabric-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .fabric-filters { gap: 8px; }
    .proj-body { padding: 24px 16px 56px; }
    .proj-heading { font-size: 28px; }
    .proj-intro { margin-bottom: 28px; }
    .pal-head-row { flex-direction: column; align-items: flex-start; gap: 12px; }
    .pal-section { margin-bottom: 28px; }
    .pal-section-title { font-size: 18px; }
    .pal-upload { width: 100%; max-width: none; }
    .tmpl-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; --tmpl-thumb-h: 240px; }
    .tmpl-page .tmpl-grid { gap: 0; }
    .pal-grid { gap: 12px; }
    .pal-result { flex-direction: column; gap: 14px; }
    .pal-result-preview { width: 100%; height: 160px; }
    .pal-actions { flex-wrap: wrap; }
    .pal-from-image { flex-direction: column; gap: 16px; padding: 14px; width: 100%; }
    .pal-from-image-preview { width: 100%; height: auto; aspect-ratio: 1; max-width: 220px; }
    .pal-from-image-main { gap: 20px; width: 100%; }
    .pal-from-image-swatch, .pal-from-image-add { width: 48px; height: 48px; }
    .pal-from-image-add { font-size: 20px; }
    .pal-from-image-use { width: 100%; justify-content: center; }
    .backing-current-img { height: 160px; }
    .fabric-enlarge-name, .backing-picker-title { font-size: 22px; }
  }

  /* ── Press feedback ────────────────────────────────────────────────────────
     Everything pickable dips under the pointer so a tap reads as a press
     before the next screen arrives. These rules sit last in the sheet on
     purpose: the band-card steps flatten the boxed-card hover lift with
     `transform: none`, and the dip has to land after that to win. Cards
     marked "coming soon" aren't pickable, so they stay put. */
  .size-card, .land-craft, .saved-card {
    transition: transform var(--press-dur) var(--ease-out);
  }
  .back-skip { transition: background .12s, box-shadow .12s, transform var(--press-dur) var(--ease-out); }
  .btn:active, .icon-btn:active, .xs-tool:active, .filter-pill:active, .chip:active,
  .fabric-row:active,
  .pal-btn:active, .pal-skip-btn:active, .pal-suggest-swatch:active {
    transform: scale(var(--press-scale));
  }
  /* Already centered on its own transform, so the dip has to compose with it. */
  .back-skip:active { transform: translateY(-50%) scale(var(--press-scale)); }

  /* On the boxed cards the dip replaces the hover lift rather than stacking on
     it, since a bare scale() drops the hover's translateY. */
  .proj-card:not(.is-soon):active, .pal-card:active, .tmpl-card:active, .fabric-card:active,
  .size-card:active, .land-craft:not(.is-soon):active, .saved-card:active,
  .pal-page .pal-card:active, .tmpl-page .tmpl-card:active, .back-grid .fabric-card:active {
    transform: scale(var(--press-scale-card));
  }

  /* ── Step-to-step transitions ──────────────────────────────────────────────
     Every setup step is its own component, so React remounts the page root on
     each move and these enter animations run once per screen. The steps all
     share the same furniture though — olive header, grapefruit hero, golden
     footer — so animating the whole page made identical pixels flicker every
     time, which is what read as a jump. Only what actually changes moves: the
     step title crossfades and the card artwork drifts up into place. The
     studios are a genuinely different screen, so those fade in whole. */
  .app, .xs-app {
    animation: step-fade var(--step-dur) var(--ease-out) both;
  }
  .brand-head-text {
    animation: head-enter var(--step-dur) var(--ease-out) both;
  }
  .land-craft-visual, .size-card-visual,
  .tmpl-page .tmpl-card-thumb, .pal-page .pal-swatches {
    animation: art-rise var(--art-dur) var(--ease-out) both;
    animation-delay: calc(var(--art-i, 0) * var(--art-stagger));
  }
  /* Each card hands its position to the art inside it, so a row fills in one
     card after the next rather than landing as a single block. Anything past
     the first row shares the last delay — the stagger is there to soften the
     arrival, not to march down a long grid. */
  :is(.land-crafts, .size-row, .tmpl-page .tmpl-grid, .pal-page .pal-grid) > :nth-child(2) { --art-i: 1; }
  :is(.land-crafts, .size-row, .tmpl-page .tmpl-grid, .pal-page .pal-grid) > :nth-child(3) { --art-i: 2; }
  :is(.land-crafts, .size-row, .tmpl-page .tmpl-grid, .pal-page .pal-grid) > :nth-child(4) { --art-i: 3; }
  :is(.land-crafts, .size-row, .tmpl-page .tmpl-grid, .pal-page .pal-grid) > :nth-child(n+5) { --art-i: 4; }

  @keyframes step-fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes head-enter {
    from { transform: translate3d(0, 6px, 0); }
    to   { transform: none; }
  }
  @keyframes art-rise {
    from { transform: translate3d(0, var(--art-rise), 0); }
    to   { transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --press-scale: 1; --press-scale-card: 1; }
    .app, .xs-app, .brand-head-text, .land-craft-visual, .size-card-visual,
    .tmpl-page .tmpl-card-thumb, .pal-page .pal-swatches { animation: none; }
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     BRAND LAYER
     ───────────────────────────────────────────────────────────────────────────
     STUDIO BOUNDARY: every selector below is nested under .brand-shell, which
     only the presentation page roots carry (craft picker, size, backing,
     template, palette). The studios mount as .app / .xs-app and never get it,
     so nothing here — type, buttons, spacing, colour — can reach the canvas,
     the tool rails or the panels. Add the class to a new screen to opt in; it
     is never applied globally.

     Note the near-miss this protects against: .size-hero / .size-card are setup
     furniture but .size-bar is the studio's block-size slider. Scoping by
     ancestor rather than by prefix keeps those apart.

     STRUCTURE: flat panels, hairline rules, inset colour fields, no drop
     shadows, square-to-2px corners. One colour field per screen (the heading
     band); content areas stay paper so artwork and swatches carry the colour.
     ═════════════════════════════════════════════════════════════════════════ */

  .brand-shell {
    font-family: var(--brand-font);
    font-size: var(--brand-body);
    line-height: var(--brand-leading-body);
    color: var(--brand-ink);
    background: var(--brand-paper);
    -webkit-font-smoothing: antialiased;
    /* A nowrap heading or 1px rule can overshoot the viewport by a few pixels
       and the resulting scrollbar then eats width, which overshoots again. */
    overflow-x: clip;
  }
  .brand-shell :is(h1, h2, h3, h4) {
    font-family: var(--brand-font);
    font-weight: 700;
    letter-spacing: var(--brand-track-display);
    line-height: var(--brand-leading-display);
    color: var(--brand-ink);
  }
  /* Setup screens are edge-to-edge bands, so the shell itself owns no padding;
     each band pulls the shared gutter instead. */
  .brand-shell .brand-bleed { padding-inline: var(--brand-gutter); }

  /* ── Motifs ───────────────────────────────────────────────────────────────
     The wiggle (the thread mark carried in the wordmark) and the stitch X.
     Both are pure decoration: aria-hidden at the call site, and inert here so
     they can never eat a click or be mistaken for a close control. The X in
     particular sits near copy, never on or beside a dismissable surface. */
  .brand-shell .brand-wiggle,
  .brand-shell .brand-x,
  .brand-shell .brand-xrule {
    pointer-events: none;
    user-select: none;
    flex: none;
  }
  .brand-shell .brand-wiggle {
    display: block;
    height: 14px;
    width: auto;
    color: var(--brand-tomato);
    overflow: visible;
  }
  .brand-shell .brand-wiggle.is-lg { height: 20px; }
  .brand-shell .brand-wiggle.is-sm { height: 10px; }
  .brand-shell .brand-xrule {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--brand-tomato);
  }
  .brand-shell .brand-x { display: block; }

  /* ── Editorial labels ─────────────────────────────────────────────────────
     Small caps micro-labels. Ink rather than tomato: at 12px, tomato on paper
     is ~3.2:1, which clears the 3:1 bar for graphics but not the 4.5:1 one for
     text. Tomato stays on the motifs and on display-size numerals. */
  .brand-shell .brand-eyebrow {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin: 0 0 16px;
    font-size: var(--brand-eyebrow);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--brand-ink);
  }
  .brand-shell .brand-eyebrow-num { color: var(--brand-ink); opacity: 0.55; }
  .brand-shell .brand-eyebrow.is-plain {
    font-family: "Bodoni Moda", "Times New Roman", serif;
    font-style: italic;
    font-optical-sizing: auto;
    font-weight: 400;
    font-size: 21px;
    line-height: 1.3;
    letter-spacing: 0;
    text-transform: none;
  }

  /* Caption: the small factual line that gives the editorial read. */
  .brand-shell .brand-caption {
    font-size: var(--brand-eyebrow);
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brand-muted-2);
  }

  /* Label / value rows under a hairline — used for real metadata only. */
  .brand-shell .brand-specs { display: block; width: 100%; margin-top: 14px; }
  .brand-shell .brand-spec {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 7px 0;
    border-top: 1px solid var(--brand-rule-2);
    font-size: 13px;
    line-height: 1.3;
  }
  .brand-shell .brand-spec-k {
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--brand-muted-2);
    font-weight: 500;
  }
  .brand-shell .brand-spec-v {
    font-weight: 500;
    color: var(--brand-ink);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* ── Navigation ───────────────────────────────────────────────────────────
     Paper, one hairline, wordmark left. The real logo asset is used as-is; its
     own tomato wiggle is the mark's thread, so no extra wiggle here. */
  .brand-shell .brand-nav {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
    min-height: 74px;
    padding-block: 14px;
    background: var(--brand-paper);
    border-bottom: 1px solid var(--brand-ink);
    box-shadow: none;
  }
  .brand-shell .brand-nav-logo {
    display: inline-flex;
    align-items: center;
    line-height: 0;
    text-decoration: none;
    border-radius: 2px;
  }
  .brand-shell .brand-nav-logo img { display: block; width: 104px; height: auto; }
  .brand-shell .brand-nav-note {
    flex: 1 1 auto;
    text-align: center;
    min-width: 0;
  }
  .brand-shell .brand-nav-right {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-left: auto;
  }
  /* The auth trigger + account chip live in the nav; give them the brand's
     interface-label treatment without touching the studio's copy of them. */
  .brand-shell .brand-nav .land-login,
  .brand-shell .brand-nav .account-menu-btn {
    font-family: var(--brand-font);
    font-size: var(--brand-label);
    font-weight: 500;
    color: var(--brand-ink);
  }

  /* ── Heading band ─────────────────────────────────────────────────────────
     The one colour field per screen. Left-aligned, generous, with the wiggle
     sitting under the heading. Height is content-driven so a two-line title
     wraps instead of overflowing a fixed band. */
  .brand-shell .brand-head {
    position: relative;
    display: block;
    flex-shrink: 0;
    height: auto;
    overflow-x: clip;
    padding-block: clamp(20px, 2.4vw, 36px);
    background: var(--brand-cream);
    border-bottom: 1px solid var(--brand-ink);
  }
  .brand-shell .brand-head.tone-olive  { background: var(--brand-olive); }
  .brand-shell .brand-head.tone-butter { background: var(--brand-butter); }
  .brand-shell .brand-head.tone-blue   { background: var(--brand-blue); }
  .brand-shell .brand-head.tone-lilac  { background: var(--brand-lilac); }
  .brand-shell .brand-head.tone-cream  { background: var(--brand-cream); }
  .brand-shell .brand-head.tone-paper  { background: var(--brand-paper); }

  /* Utility row above the heading: back on the left, step actions on the
     right. Sits on the colour field, so it uses ink at full strength. */
  .brand-shell .brand-head-top {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: 34px;
    margin-bottom: clamp(16px, 2vw, 30px);
  }
  .brand-shell .brand-head-top-end { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  /* Grid rather than flex so the heading column has a real measure: the title
     runs at display size while the sub-copy beside it stays at body size, and a
     `ch` measure on either would be relative to the wrong font. With no aside
     the heading simply occupies the first column and the colour field carries
     the rest, which is where the composition wants the space anyway. */
  .brand-shell .brand-head-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.72fr);
    align-items: end;
    gap: clamp(20px, 4vw, 56px);
  }
  .brand-shell .brand-head-text { min-width: 0; }
  /* Long titles ("Choose a starting point") take the full band width; the
     sub-copy keeps its own measure so the paragraph never runs edge to edge. */
  .brand-shell .brand-head-text.is-wide { grid-column: 1 / -1; }
  .brand-shell .brand-head-aside {
    min-width: 0;
    padding-bottom: 6px;
    text-align: right;
  }
  /* Reuses .size-title so the existing step-title crossfade keeps working. */
  .brand-shell .brand-title,
  .brand-shell h1.size-title {
    margin: 0;
    font-family: var(--brand-font);
    font-weight: 700;
    font-size: var(--brand-display-l);
    line-height: var(--brand-leading-display);
    letter-spacing: var(--brand-track-display);
    color: var(--brand-ink);
    text-align: left;
    text-wrap: balance;
  }
  .brand-shell .brand-title.is-xl,
  .brand-shell h1.size-title.is-xl {
    font-size: var(--brand-display-xl);
    max-width: 100%;
    white-space: nowrap;
  }
  @media (max-width: 899px) {
    .brand-shell .brand-title.is-xl,
    .brand-shell h1.size-title.is-xl { white-space: normal; text-wrap: balance; }
  }
  .brand-shell .brand-head-wiggle { margin-top: clamp(14px, 1.6vw, 22px); }
  .brand-shell .brand-head-sub {
    margin-top: 16px;
    max-width: 52ch;
    font-size: var(--brand-body-s);
    line-height: var(--brand-leading-body);
    color: var(--brand-ink);
  }

  /* A compact band, for a screen whose job is the content below it rather than
     the heading itself. Everything folds onto one line — title, the craft beside
     it, and what the design actually is pushed to the far end — which turns a
     250px colour field into something closer to 100px. Titles here are short and
     fixed, so there's none of the wrapping the tall band exists to allow.

     The wiggle sits this one out. It's the brand's flourish and it earns its
     space where a screen opens; on a working screen it would be 35px of
     decoration taken from the list someone is trying to read. */
  .brand-shell .brand-head.is-compact { padding-block: clamp(12px, 1.2vw, 18px); }
  .brand-shell .is-compact .brand-head-top {
    min-height: 0;
    margin-bottom: 8px;
  }
  .brand-shell .is-compact .brand-head-main { display: block; }
  .brand-shell .is-compact .brand-head-text {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 16px;
  }
  .brand-shell .is-compact .brand-title { font-size: var(--brand-display-m); }
  .brand-shell .is-compact .brand-eyebrow { margin: 0; }
  .brand-shell .is-compact .brand-head-wiggle { display: none; }
  /* Pushed to the end on a wide row, but it's the first thing to wrap, so on a
     narrow one it drops to its own line and loses the auto margin with it. */
  .brand-shell .is-compact .brand-head-sub {
    margin: 0 0 0 auto;
    max-width: none;
  }
  @media (max-width: 720px) {
    .brand-shell .is-compact .brand-head-sub { margin-left: 0; }
  }

  /* Back link — inherits ink on whatever colour field it lands on. */
  .brand-shell .size-back {
    position: static;
    transform: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--brand-ink);
    border-radius: var(--btn-radius);
  }
  .brand-shell .size-back-label {
    font-family: var(--brand-font);
    font-size: var(--brand-label);
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: 0.02em;
    border-bottom: 1px solid currentColor;
  }
  .brand-shell .size-back-icon { width: 16px; height: 16px; }
  .brand-shell .size-back-icon .ic { width: 14px; height: 14px; }

  /* ── Controls ─────────────────────────────────────────────────────────────
     Design system V1 buttons at Large (44px): fully rounded, 1px outline,
     black and neutral. No offset shadows anywhere. */
  .brand-shell .brand-btn,
  .brand-shell .back-skip,
  .brand-shell .tmpl-upload-use,
  .brand-shell .tmpl-upload-another,
  .brand-shell .pal-page .pal-from-image-use {
    /* .back-skip is absolutely placed in the pre-brand hero; pin it back into
       the heading's flex row so it cannot sit on top of the title. */
    position: static;
    transform: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-sizing: border-box;
    min-width: 0;
    width: auto;
    height: 44px;
    padding: 0 22px;
    background: var(--btn-secondary-bg);
    border: var(--btn-stroke-w) solid var(--btn-secondary-border);
    border-radius: var(--pill-radius);
    box-shadow: none;
    font-family: var(--brand-font);
    font-size: 16px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--btn-secondary-fg);
    cursor: pointer;
    transition: background 0.14s, border-color 0.14s, color 0.14s, box-shadow 0.12s;
  }
  .brand-shell .brand-btn:hover,
  .brand-shell .back-skip:hover,
  .brand-shell .tmpl-upload-another:hover { background: var(--btn-secondary-bg-hover); }
  .brand-shell .brand-btn:active,
  .brand-shell .back-skip:active,
  .brand-shell .tmpl-upload-another:active { background: var(--btn-secondary-bg-active); }
  .brand-shell .back-skip:active { transform: none; }
  .brand-shell .brand-btn.is-primary,
  .brand-shell .tmpl-upload-use,
  .brand-shell .pal-page .pal-from-image-use {
    background: var(--btn-primary-bg);
    border-color: var(--btn-primary-bg);
    color: var(--btn-primary-fg);
  }
  .brand-shell .brand-btn.is-primary:hover:not(:disabled),
  .brand-shell .tmpl-upload-use:hover:not(:disabled),
  .brand-shell .pal-page .pal-from-image-use:hover:not(:disabled) { background: var(--btn-primary-bg-hover); border-color: var(--btn-primary-bg-hover); }
  .brand-shell .brand-btn.is-primary:active:not(:disabled),
  .brand-shell .tmpl-upload-use:active:not(:disabled),
  .brand-shell .pal-page .pal-from-image-use:active:not(:disabled) { background: var(--btn-primary-bg-active); border-color: var(--btn-primary-bg-active); }
  .brand-shell .brand-btn:disabled {
    background: transparent; border-color: var(--btn-disabled-border); color: var(--btn-disabled-fg); cursor: default;
  }
  .brand-shell .brand-btn.is-primary:disabled,
  .brand-shell .pal-page .pal-from-image-use:disabled {
    background: var(--btn-primary-bg-disabled); border-color: var(--btn-primary-bg-disabled); color: var(--btn-disabled-fg); cursor: default;
  }

  /* One focus treatment across the shell: a 2px ink ring, offset so it reads
     on both paper and colour fields. */
  .brand-shell :is(a, button, [role="button"], input, label):focus-visible {
    outline: 2px solid var(--brand-ink);
    outline-offset: 2px;
    box-shadow: none;
  }
  .brand-shell .land-craft:focus-visible,
  .brand-shell .size-card:focus-visible,
  .brand-shell .tmpl-card:focus-visible,
  .brand-shell .pal-card:focus-visible,
  .brand-shell .saved-card:focus-visible {
    outline: 2px solid var(--brand-ink);
    outline-offset: -4px;
    box-shadow: none;
  }
  /* Buttons and filter pills keep the design system's tomato focus ring. */
  .brand-shell :is(.btn, .brand-btn, .back-skip, .tmpl-upload-use, .tmpl-upload-another, .pal-from-image-use, .pal-btn, .pal-skip-btn, .pal-upload-pill, .filter-pill):focus-visible {
    outline: none;
    box-shadow: var(--btn-focus-shadow);
  }

  /* ── Product bands (shared by craft / size / template / palette) ──────────
     Edge-to-edge columns split by hairlines. Flat, no lift on hover; hover
     just warms the cell so the artwork stays the thing you look at. */
  .brand-shell :is(.land-crafts, .size-row, .tmpl-grid, .pal-grid) { background: var(--brand-paper); }
  .brand-shell :is(.land-craft, .size-card, .tmpl-card, .pal-card) {
    background: var(--brand-paper);
    border-radius: 0;
    box-shadow: none;
    transform: none;
    transition: background 0.16s;
  }
  .brand-shell :is(.land-craft, .size-card, .tmpl-card, .pal-card):hover { background: var(--brand-cream); box-shadow: none; transform: none; }
  .brand-shell :is(.land-craft, .size-card, .tmpl-card, .pal-card).is-soon:hover { background: var(--brand-paper); }

  /* Card copy: bold grotesk name, comfortable description, numbered label. */
  .brand-shell :is(.land-craft-name, .size-card-name, .tmpl-card-name, .pal-card-name) {
    font-family: var(--brand-font);
    font-size: var(--brand-display-s);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.018em;
    color: var(--brand-ink);
  }
  .brand-shell :is(.land-craft-desc, .size-card-dims, .tmpl-card-desc, .pal-card-meta) {
    font-family: var(--brand-font);
    font-size: var(--brand-body-s);
    font-weight: 400;
    line-height: 1.4;
    color: var(--brand-muted);
  }
  /* Small numbered category label at the top of each product cell.
     Written last inside its card and pulled up here with `order`, so a card's
     text content still begins with the item's name — the existing check
     scripts select cards by leading text. It's aria-hidden either way, so the
     DOM/visual mismatch isn't exposed to assistive tech. */
  .brand-shell .brand-index {
    order: -1;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: clamp(14px, 1.6vw, 22px);
    font-size: var(--brand-eyebrow);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brand-ink);
  }
  /* `order` only applies to flex/grid children. .land-craft, .size-card and
     .pal-card are already one or the other; .tmpl-card is a plain button, so
     give it a column so its label can be hoisted too. */
  .brand-shell .tmpl-card { display: flex; flex-direction: column; }
  .brand-shell .brand-index-n { color: var(--brand-ink); opacity: 0.5; font-variant-numeric: tabular-nums; }
  .brand-shell .brand-index-kind { color: var(--brand-muted-2); }

  /* Artwork sits on paper — no inset plate. Transparent cutouts come next. */
  .brand-shell .brand-plate { background: none; border: none; }

  /* Hover arrow: keep the existing affordance, just quieter and ink-coloured. */
  .brand-shell :is(.land-craft-arrow, .size-card-arrow, .saved-card-arrow) .ic { opacity: 0.85; }

  /* ── Craft selection ─────────────────────────────────────────────────────
     The olive heading band is this screen's colour moment, so the craft cells
     stay paper and the project photography does the talking. */
  .brand-shell.land-page { background: var(--brand-paper); }
  /* Drop the old 360px floor — with the taller heading it pushes the page a
     sliver past the viewport and you get a dead 80–160px scroll. */
  .brand-shell .land-main,
  .brand-shell .land-crafts { min-height: 0; }
  .brand-shell .land-crafts { border-bottom: 1px solid var(--brand-ink); }
  .brand-shell .land-craft {
    padding: clamp(22px, 2.4vw, 34px) var(--brand-gutter) clamp(26px, 2.6vw, 36px);
    border-left: 1px solid var(--brand-ink);
  }
  .brand-shell .land-craft:first-child { border-left: none; }
  /* The old 1px pseudo-divider is replaced by a real border above. */
  .brand-shell .land-craft + .land-craft::before { display: none; }
  /* Inset field padding belongs on the plate, not the image: a max-height:100%
     image with its own padding measures 100% + padding and overflows the box. */
  .brand-shell .land-craft-visual {
    padding: 0;
    margin-bottom: clamp(20px, 2.2vw, 30px);
    background: none;
    border: none;
    min-height: 0;
  }
  .brand-shell .land-craft-visual img {
    max-width: min(300px, 100%);
    max-height: min(240px, 28vh);
    padding: 0;
  }
  .brand-shell .land-craft-desc-row { align-items: flex-start; gap: 12px; margin-top: 8px; }
  .brand-shell .land-craft-arrow { width: 36px; height: 36px; margin-top: 0; }
  .brand-shell .land-craft-arrow .ic { width: 20px; height: 20px; }

  /* ── Size band ───────────────────────────────────────────────────────────── */
  .brand-shell.size-page { background: var(--brand-paper); }
  .brand-shell .size-row { border-bottom: 1px solid var(--brand-ink); }
  .brand-shell .size-card {
    padding: clamp(22px, 2.2vw, 30px) clamp(20px, 2.2vw, 32px) clamp(24px, 2.4vw, 32px);
    border-left: 1px solid var(--brand-ink);
  }
  .brand-shell .size-card:first-child { border-left: none; }
  .brand-shell .size-card-visual {
    padding: 0;
    background: none;
    border: none;
    height: clamp(120px, 18vh, 190px);
  }
  .brand-shell .size-card-visual img,
  .brand-shell .size-card-visual svg { max-height: 100%; max-width: 100%; }
  .brand-shell .size-card-copy { margin-top: clamp(18px, 2vw, 26px); align-items: flex-start; }
  .brand-shell .size-card-dims { margin-top: 7px; }
  .brand-shell .size-card-price { font-family: var(--brand-font); font-size: var(--brand-body-s); font-weight: 500; line-height: 1.4; color: var(--brand-ink); margin-top: 7px; }
  .brand-shell .size-card-arrow { width: 36px; height: 36px; }
  .brand-shell .size-card-arrow .ic { width: 20px; height: 20px; }

  /* ── Utility strip ───────────────────────────────────────────────────────
     One compact row for the secondary actions a step supports (image import,
     blank canvas). Cream so it reads as a tool shelf, not as content. */
  .brand-shell .brand-utility {
    display: block;
    flex: 0 0 auto;
    padding-block: 16px;
    background: var(--brand-cream);
    border-bottom: 1px solid var(--brand-ink);
  }
  .brand-shell .brand-utility-intake,
  .brand-shell .brand-utility-result {
    display: flex;
    align-items: center;
    gap: clamp(14px, 2vw, 28px);
    flex-wrap: wrap;
  }
  /* The URL field and any error open on their own line rather than squeezing
     the source buttons. */
  .brand-shell .brand-utility-url,
  .brand-shell .brand-utility-intake .err-msg { flex: 1 0 100%; }
  .brand-shell .brand-utility-url .pal-upload-url-row { max-width: 520px; }
  .brand-shell .brand-utility-intake .err-msg {
    background: var(--brand-tomato);
    color: #fff;
    border-radius: 2px;
    font-family: var(--brand-font);
    font-size: 13px;
  }
  .brand-shell .brand-utility-result .tmpl-upload-preview {
    width: 96px;
    height: 96px;
    border: 1px solid var(--brand-ink);
  }
  .brand-shell .brand-utility-result-meta { flex: 1 1 220px; min-width: 0; }
  .brand-shell .brand-utility-result-meta .tmpl-upload-file-name {
    font-family: var(--brand-font);
    font-size: var(--brand-label);
    font-weight: 700;
    line-height: 1.25;
    color: var(--brand-ink);
    max-width: none;
  }
  .brand-shell .brand-utility-result-meta .brand-specs { margin-top: 8px; max-width: 280px; }
  .brand-shell .brand-utility-result-meta .switch {
    gap: 10px;
    margin-top: 12px;
    font-family: var(--brand-font);
    font-size: 13px;
    color: var(--brand-ink);
  }
  .brand-shell .brand-utility-text { min-width: 0; flex: 0 1 auto; }
  .brand-shell .brand-utility-title {
    font-size: var(--brand-label);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: 0.01em;
    color: var(--brand-ink);
  }
  /* Label-sized rather than body-sized: this is a hint attached to the adjacent
     controls, and the strip has to stay compact next to the template grid. */
  .brand-shell .brand-utility-sub {
    margin-top: 3px;
    font-size: var(--brand-label);
    line-height: 1.4;
    color: var(--brand-muted);
  }
  .brand-shell .brand-utility-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  /* Import actions are Secondary buttons (Small) beside the heading. */
  .brand-shell .pal-upload-pill {
    height: 30px;
    padding: 0 14px;
    font-family: var(--brand-font);
    font-size: 13px;
  }
  .brand-shell .pal-upload-url { background: transparent; padding: 0; border-radius: 0; }
  .brand-shell .pal-upload-url-row input {
    height: 34px;
    padding: 0 10px;
    background: var(--brand-paper);
    border: 1px solid var(--brand-ink);
    border-radius: 2px;
    font-family: var(--brand-font);
    font-size: var(--brand-body-s);
    color: var(--brand-ink);
  }
  .brand-shell .pal-upload-url-row button {
    height: 34px;
    border-radius: var(--pill-radius);
    border: var(--btn-stroke-w) solid var(--btn-secondary-border);
    background: var(--btn-secondary-bg);
    font-family: var(--brand-font);
    font-size: 13px;
    font-weight: 500;
  }
  .brand-shell .tmpl-upload-drop { gap: 10px; }
  .brand-shell .tmpl-upload-title { font-size: var(--brand-label); font-weight: 500; color: var(--brand-ink); }
  .brand-shell .tmpl-upload-sub { font-size: 13px; color: var(--brand-muted); }

  /* ── Template step ───────────────────────────────────────────────────────
     Bigger, quieter thumbs on a cream plate; metadata only where it exists. */
  .brand-shell.tmpl-page { background: var(--brand-paper); }
  .brand-shell .tmpl-page .tmpl-grid,
  .brand-shell .tmpl-grid { border-bottom: 1px solid var(--brand-ink); gap: 0; }
  .brand-shell .tmpl-page .tmpl-card,
  .brand-shell .tmpl-card {
    padding: clamp(22px, 2.2vw, 32px) clamp(20px, 2.2vw, 32px) clamp(24px, 2.4vw, 32px);
    border-right: 1px solid var(--brand-ink);
    /* Rows close themselves, so a part-filled last row reads as a short row in
       a ruled table rather than as a staircase of dangling column rules. The
       grid's own bottom border completes that last rule across the full width. */
    border-bottom: 1px solid var(--brand-ink);
    overflow: visible;
  }
  .brand-shell .tmpl-page .tmpl-card-thumb,
  .brand-shell .tmpl-card-thumb {
    height: clamp(190px, 27vh, 280px);
    padding: 0;
    box-sizing: border-box;
    background: var(--brand-cream);
    border: none;
  }
  .brand-shell .tmpl-page .tmpl-card-thumb.is-ratio,
  .brand-shell .tmpl-card-thumb.is-ratio {
    height: clamp(190px, 27vh, 280px);
    background: var(--brand-cream);
  }
  .brand-shell .tmpl-page .tmpl-card-body,
  .brand-shell .tmpl-card-body {
    display: block;
    margin-top: clamp(18px, 2vw, 26px);
    padding: 0;
  }
  .brand-shell .tmpl-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }
  .brand-shell .tmpl-page .tmpl-card-desc,
  .brand-shell .tmpl-card-desc { margin-top: 7px; }
  .brand-shell .tmpl-card .size-card-arrow { width: 32px; height: 32px; margin-top: 2px; }
  .brand-shell .tmpl-card .size-card-arrow .ic { width: 19px; height: 19px; }

  /* ── Palette step ────────────────────────────────────────────────────────
     Two clearly separated zones: what you're making (preview + chosen colours)
     and how it converts. Suggested palettes come last, under their own rule. */
  .brand-shell.pal-page { background: var(--brand-paper); }
  .brand-shell .brand-section {
    flex: 0 0 auto;
    padding-block: clamp(22px, 2.6vw, 38px);
    background: var(--brand-paper);
    border-bottom: 1px solid var(--brand-ink);
  }
  .brand-shell .brand-section.is-quiet { background: var(--brand-cream); }
  .brand-shell .brand-section-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px 24px;
    flex-wrap: wrap;
    margin-bottom: clamp(16px, 2vw, 26px);
    padding-bottom: 12px;
    border-bottom: 1px solid var(--brand-rule);
  }
  .brand-shell .brand-section-head-text { min-width: 0; }
  .brand-shell .brand-section-head-text .brand-section-note { margin-top: 6px; }
  .brand-shell .brand-section-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  /* A section with no children is a labelled header for the full-bleed band
     that follows it (the palette grid), so its own rule becomes that band's
     top edge and the inner divider is redundant. */
  .brand-shell .brand-section.is-head-only { padding-bottom: clamp(16px, 1.8vw, 24px); }
  .brand-shell .brand-section.is-head-only .brand-section-head {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
  }

  /* Project focus pair: the live chart beside the colours going into it. */
  .brand-shell .brand-project {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: start;
    gap: clamp(20px, 3vw, 40px);
  }
  @media (max-width: 900px) {
    .brand-shell .brand-project { grid-template-columns: minmax(0, 1fr); }
  }

  /* ── Kit review ───────────────────────────────────────────────────────────
     The last screen before Shopify. The design on the left at a size worth
     looking at, the reckoning on the right: what's in the box, what isn't, and
     what it costs. Two equal columns rather than a narrow sidebar, because the
     supply list is the reason someone is on this page. */

  /* Full page to look at, but the studio is still mounted underneath so Back
     returns to the canvas exactly as it was — nothing saves a design mid-edit.
     Opaque and exactly the height of the window: the columns inside scroll, the
     layer itself doesn't. That's what lets the price and Checkout hold still
     while a long supply list moves past them. */
  .kit-layer {
    position: fixed;
    inset: 0;
    z-index: 300;
    overflow: hidden;
    overscroll-behavior: contain;
    background: var(--brand-paper);
  }
  .kit-layer .kit-page {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }
  /* The wordmark and the heading band keep their full height — they're the only
     thing telling you where you are, and a flex row shrinks by default. */
  .kit-layer .kit-page > .brand-nav,
  .kit-layer .kit-page > .brand-head { flex: 0 0 auto; }

  /* Everything under the heading, and no taller: min-height: 0 is what stops a
     long list sizing this to its content and walking the pinned footer off the
     bottom of the window. */
  .brand-shell .kit-band {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    align-items: stretch;
    background: var(--brand-paper);
  }
  /* A scrollport each, divided by a rule rather than a gap. Reading down the
     supply list shouldn't carry the design it's a list for off the screen, and
     checking the design against the colours shouldn't lose your place in them. */
  .brand-shell .kit-col {
    --kit-l: clamp(18px, 2.2vw, 34px);
    --kit-r: clamp(18px, 2.2vw, 34px);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .brand-shell .kit-col:first-child { --kit-l: var(--brand-gutter); }
  .brand-shell .kit-col:last-child { --kit-r: var(--brand-gutter); }
  .brand-shell .kit-col + .kit-col { border-left: 1px solid var(--brand-ink); }
  .brand-shell .kit-scroll {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-block: clamp(24px, 3vw, 44px);
  }
  /* The price and the way forward, pinned to the bottom of the column. This is
     the last screen before money changes hands and that button is the only exit,
     so it doesn't depend on someone scrolling to find it. Its rule runs the full
     width of the column — the padding is on the contents — so it reads as part of
     the page's structure and not as a box floating over the list. */
  .brand-shell .kit-foot {
    flex: 0 0 auto;
    padding-bottom: clamp(16px, 2vw, 24px);
    background: var(--brand-paper);
    border-top: 1px solid var(--brand-ink);
  }
  .brand-shell .kit-scroll,
  .brand-shell .kit-foot > * {
    padding-left: var(--kit-l);
    padding-right: var(--kit-r);
  }
  /* Give the page back to its own scroller and pin the bar to the window instead.
     Used on a phone, where one column means two stacked scrollports would just be
     two places to get stuck, and in any window too short to divide — a scroll area
     squeezed to nothing would clip the Checkout button, which is the one thing
     this layout exists to keep on screen. */
  @media (max-width: 900px), (max-height: 480px) {
    .kit-layer { overflow-y: auto; }
    .kit-layer .kit-page { height: auto; min-height: 100%; }
    .brand-shell .kit-scroll { overflow-y: visible; }
    .brand-shell .kit-foot {
      position: sticky;
      bottom: 0;
      padding-top: 2px;
    }
  }
  /* Stacked, so the rule between the columns turns and lies down. */
  @media (max-width: 900px) {
    .brand-shell .kit-band { grid-template-columns: minmax(0, 1fr); }
    .brand-shell .kit-col {
      --kit-l: var(--brand-gutter);
      --kit-r: var(--brand-gutter);
    }
    .brand-shell .kit-col + .kit-col {
      border-left: none;
      border-top: 1px solid var(--brand-ink);
    }
  }
  /* One tile today. auto-fit rather than a fixed column so a second tile — a
     generated shot of the finished thing — drops in beside it without a
     layout change, and doesn't leave a hole meanwhile. */
  .brand-shell .kit-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
  }
  .brand-shell .kit-tile {
    margin: 0;
    padding: 16px;
    background: #FFFFFF;
    border: 1px solid var(--brand-ink);
    border-radius: 2px;
  }
  /* Square by default, but capped: on a wide screen an uncapped square preview
     runs far past the supply list beside it and pushes the specs below the fold. */
  .brand-shell .kit-tile-art {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1;
    max-height: 360px;
    overflow: hidden;
  }
  .brand-shell .kit-tile-art > * { max-width: 100%; max-height: 100%; }
  .brand-shell .kit-tile-art img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* The preview tile before there's a preview in it. Cream rather than white, so
     an empty tile reads as a waiting surface instead of a failed image. */
  .brand-shell .kit-tile-blank {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    height: 100%;
    padding: 20px;
    background: var(--brand-cream);
    text-align: center;
  }
  .brand-shell .kit-tile-msg {
    max-width: 30ch;
    font-size: 12px;
    line-height: 1.45;
    color: var(--brand-muted);
  }
  .brand-shell .kit-tile-msg.is-err { color: #B3261E; }
  .brand-shell .kit-tile-cap {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--brand-rule-2);
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--brand-muted-2);
  }
  .brand-shell .kit-group + .kit-group { margin-top: clamp(22px, 2.4vw, 32px); }
  .brand-shell .kit-group-title {
    font-size: var(--brand-display-s);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.015em;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--brand-rule);
  }
  .brand-shell .kit-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .brand-shell .kit-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--brand-rule-2);
    font-size: 13px;
    line-height: 1.35;
  }
  .brand-shell .kit-sw {
    flex: 0 0 auto;
    width: 13px;
    height: 13px;
    border-radius: 3px;
    border: 1px solid rgba(23, 23, 23, 0.18);
    transform: translateY(2px);
  }
  .brand-shell .kit-row-label { flex: 1 1 auto; min-width: 0; }
  .brand-shell .kit-row-qty {
    flex: 0 0 auto;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* The bring-your-own list is the one thing on the page that isn't a promise,
     so it reads a step back from the supplies above it. */
  .brand-shell .kit-list.is-own .kit-row { color: var(--brand-muted); }
  .brand-shell .kit-buy {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-top: 16px;
  }
  .brand-shell .kit-buy-k {
    display: block;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--brand-muted-2);
  }
  .brand-shell .kit-buy-v {
    display: block;
    margin-top: 3px;
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .brand-shell .kit-buy-go { height: 46px; padding: 0 26px; }
  .brand-shell .kit-note {
    margin-top: 12px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--brand-muted);
  }
  .brand-shell .kit-err {
    margin-top: 12px;
    font-size: 12px;
    line-height: 1.5;
    color: #B3261E;
  }
  .brand-shell .brand-section-title {
    font-size: var(--brand-display-m);
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: var(--brand-ink);
  }
  .brand-shell .brand-section-note {
    font-size: var(--brand-body-s);
    line-height: var(--brand-leading-body);
    color: var(--brand-muted);
    max-width: 58ch;
  }
  /* Selected-colour row and photo preview become the focal pair. */
  .brand-shell .pal-suggest-bar {
    display: block;
    min-height: 0;
    padding: 0;
    background: none;
    border-bottom: none;
  }
  .brand-shell .pal-page .pal-from-image {
    align-items: center;
    gap: clamp(18px, 2.4vw, 32px);
    flex-wrap: wrap;
  }
  .brand-shell .pal-page .pal-from-image-preview {
    width: clamp(120px, 13vw, 164px);
    height: clamp(120px, 13vw, 164px);
    border: 1px solid var(--brand-ink);
    outline: none;
  }
  .brand-shell .pal-page .pal-from-image-main { gap: clamp(18px, 2.4vw, 32px); flex-wrap: wrap; }
  .brand-shell .pal-page .pal-from-image-swatches { gap: 10px; }
  .brand-shell .pal-page .pal-from-image-swatch {
    width: clamp(52px, 4.6vw, 66px);
    height: clamp(52px, 4.6vw, 66px);
    box-shadow: inset 0 0 0 1px var(--brand-rule);
  }
  .brand-shell .pal-page .pal-from-image-add {
    width: clamp(52px, 4.6vw, 66px);
    height: clamp(52px, 4.6vw, 66px);
    background: var(--brand-paper);
    border: 1px dashed var(--brand-rule);
    color: var(--brand-ink);
  }
  .brand-shell .pal-page .pal-from-image-add:hover { background: var(--brand-cream); }
  .brand-shell .pal-busy { font-size: var(--brand-body-s); color: var(--brand-muted); padding: 4px 0; }

  /* Conversion controls: same content, presented as a tool block rather than
     as another band of product. */
  .brand-shell .xs-flatten {
    gap: clamp(20px, 2.6vw, 36px);
    padding: 0;
    background: none;
    border-bottom: none;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .brand-shell .xs-flatten-title {
    font-family: var(--brand-font);
    font-size: var(--brand-label);
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--brand-ink);
  }
  .brand-shell .xs-flatten-sub {
    font-family: var(--brand-font);
    font-size: var(--brand-body-s);
    line-height: 1.45;
    color: var(--brand-muted);
    max-width: 62ch;
  }
  .brand-shell .xs-flatten-row { border: 1px solid var(--brand-ink); border-radius: 2px; }
  .brand-shell .xs-flatten-btn {
    height: 36px;
    padding: 0 16px;
    background: var(--brand-paper);
    border-left-color: var(--brand-ink);
    font-family: var(--brand-font);
    font-size: 13px;
    font-weight: 500;
    color: var(--brand-ink);
  }
  .brand-shell .xs-flatten-btn:hover:not(.active) { background: var(--brand-cream); }
  .brand-shell .xs-flatten-btn.active { background: var(--brand-ink); color: var(--brand-paper); }
  .brand-shell .xs-flatten-note {
    font-family: var(--brand-font);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--brand-muted-2);
  }
  .brand-shell .xs-flatten-check {
    font-family: var(--brand-font);
    font-size: var(--brand-body-s);
    font-weight: 500;
    color: var(--brand-ink);
    flex-wrap: wrap;
  }
  .brand-shell .xs-flatten-check-note { font-weight: 400; color: var(--brand-muted); }
  .brand-shell .xs-flatten-preview {
    background: var(--brand-cream);
    border: 1px solid var(--brand-ink);
    border-radius: 0;
  }
  .brand-shell .xs-flatten-empty {
    font-family: var(--brand-font);
    font-size: 13px;
    color: var(--brand-muted);
  }

  /* Suggested palettes: swatches stay the largest thing in the cell. */
  .brand-shell .pal-page .pal-grid,
  .brand-shell .pal-grid { border-bottom: 1px solid var(--brand-ink); gap: 0; }
  .brand-shell .pal-page .pal-card,
  .brand-shell .pal-card {
    align-content: start;
    min-height: 0;
    padding: clamp(22px, 2.2vw, 32px) clamp(20px, 2.2vw, 32px) clamp(24px, 2.4vw, 32px);
    border-right: 1px solid var(--brand-ink);
    border-bottom: 1px solid var(--brand-ink);  /* see .tmpl-card */
    border-radius: 0;
  }
  .brand-shell .pal-page .pal-swatches,
  .brand-shell .pal-swatches {
    height: auto;
    min-height: 0;
    margin-bottom: clamp(18px, 2vw, 26px);
  }
  .brand-shell .pal-page .pal-swatch,
  .brand-shell .pal-swatch {
    width: clamp(46px, 4vw, 60px);
    height: clamp(46px, 4vw, 60px);
    margin-left: -8px;
    box-shadow: inset 0 0 0 1px var(--brand-rule);
  }
  .brand-shell .pal-swatch:first-child { margin-left: 0; }
  .brand-shell .pal-page .pal-card-body,
  .brand-shell .pal-card-body { display: block; padding: 0; }
  .brand-shell .pal-card-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }
  .brand-shell .pal-page .pal-card-meta,
  .brand-shell .pal-card-meta { margin-top: 7px; }
  .brand-shell .pal-card .size-card-arrow { width: 32px; height: 32px; margin-top: 2px; }
  .brand-shell .pal-card .size-card-arrow .ic { width: 19px; height: 19px; }

  /* ── Backing step ────────────────────────────────────────────────────────── */
  .brand-shell.back-page { background: var(--brand-paper); }
  .brand-shell .back-filters {
    justify-content: flex-start;
    min-height: 0;
    padding-block: 16px;
    background: var(--brand-cream);
    border-bottom: 1px solid var(--brand-ink);
  }
  .brand-shell .back-filters .filter-pill { font-family: var(--brand-font); }
  .brand-shell .back-grid .fabric-card { border-color: var(--brand-rule); box-shadow: none; }
  .brand-shell .back-grid .fabric-card.selected { box-shadow: inset 0 0 0 3px var(--brand-ink); }

  /* ── Saved designs ───────────────────────────────────────────────────────
     Kept in place and fully functional; restyled to the same editorial grid. */
  /* The craft band already draws the rule above this section — don't add another. */
  .brand-shell .saved-sec { background: var(--brand-paper); border-top: none; }
  .brand-shell .saved-toolbar { padding: 16px var(--brand-gutter); }
  .brand-shell .saved-head-title {
    font-family: "Bodoni Moda", "Times New Roman", serif;
    font-style: italic;
    font-optical-sizing: auto;
    font-weight: 400;
    font-size: 21px;
    letter-spacing: 0;
    text-transform: none;
    color: var(--brand-ink);
  }
  .brand-shell .saved-count { font-weight: 500; opacity: 0.55; }
  .brand-shell .saved-filter { font-family: var(--brand-font); }
  .brand-shell .saved-grid { border-top: 1px solid var(--brand-ink); }
  .brand-shell .saved-card {
    gap: 14px;
    padding: 22px var(--brand-gutter) 26px;
    background: var(--brand-paper);
    border-right-color: var(--brand-ink);
    transition: background 0.16s;
  }
  .brand-shell .saved-card:hover { background: var(--brand-cream); }
  .brand-shell .saved-card:nth-child(n+5) { border-top-color: var(--brand-ink); }
  .brand-shell .saved-thumb { background: var(--brand-cream); border: none; }
  .brand-shell .saved-name {
    font-family: var(--brand-font);
    font-size: var(--brand-body-s);
    font-weight: 700;
    letter-spacing: -0.008em;
    color: var(--brand-ink);
  }
  .brand-shell .saved-meta {
    font-family: var(--brand-font);
    font-size: 13px;
    font-weight: 400;
    color: var(--brand-muted);
  }
  .brand-shell .saved-empty { font-family: var(--brand-font); font-size: var(--brand-body-s); color: var(--brand-muted); padding: 30px var(--brand-gutter); }
  @media (max-width: 1080px) { .brand-shell .saved-card:nth-child(n+3) { border-top-color: var(--brand-ink); } }
  @media (max-width: 600px) { .brand-shell .saved-card:nth-child(n+2) { border-top-color: var(--brand-ink); } }

  /* ── Footer ──────────────────────────────────────────────────────────────
     Replaces the golden dead band: a flexible paper spacer that absorbs the
     leftover viewport height, then a hairline strip carrying a factual caption
     and a few stitch Xs as margin detail. */
  .brand-shell .brand-spacer {
    flex: 1 1 auto;
    min-height: 0;
    background: var(--brand-paper);
  }
  .brand-shell .brand-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    flex: 0 0 auto;
    padding-block: 16px;
    background: var(--brand-paper);
    border-top: 1px solid var(--brand-ink);
  }
  .brand-shell .brand-footer .brand-xrule { margin-left: auto; }

  /* ── Responsive ──────────────────────────────────────────────────────────
     The bands already collapse 4 → 2 → 1 via the existing media queries; these
     only relax the brand's own spacing and stack the heading pairs. */
  @media (max-height: 820px) {
    .brand-shell .brand-head { padding-block: 16px; }
    .brand-shell .brand-head-wiggle { margin-top: 10px; }
    .brand-shell .brand-head-sub { margin-top: 10px; }
    .brand-shell .land-craft { padding-block: 16px; }
    .brand-shell .land-craft-visual { margin-bottom: 14px; }
    .brand-shell .land-craft-visual img { max-height: min(200px, 24vh); }
  }
  @media (max-width: 1080px) {
    .brand-shell .brand-head-main { display: block; }
    .brand-shell .brand-head-aside { max-width: 52ch; margin-top: 18px; padding-bottom: 0; text-align: left; }
    .brand-shell .brand-head-text:not(.is-wide) { max-width: 30ch; }
  }
  @media (max-width: 900px) {
    .brand-shell .brand-nav { min-height: 62px; }
    .brand-shell .brand-nav-logo img { width: 88px; }
    .brand-shell .brand-nav-note { display: none; }
    .brand-shell .brand-head { padding-block: 24px; }
    .brand-shell .brand-head-text,
    .brand-shell .brand-head-text.is-wide { max-width: none; }
    .brand-shell .brand-utility { align-items: stretch; flex-direction: column; }
    .brand-shell .brand-utility-actions { margin-left: 0; }
    .brand-shell .xs-flatten { gap: 20px; }
    .brand-shell .land-craft-visual img { max-height: 190px; }
    .brand-shell .tmpl-page .tmpl-card-thumb,
    .brand-shell .tmpl-card-thumb,
    .brand-shell .tmpl-page .tmpl-card-thumb.is-ratio,
    .brand-shell .tmpl-card-thumb.is-ratio { height: clamp(170px, 24vh, 230px); }
  }
  @media (max-width: 600px) {
    .brand-shell .brand-head-top { flex-wrap: nowrap; justify-content: space-between; }
    .brand-shell .land-craft { border-left: none; border-top: 1px solid var(--brand-ink); }
    .brand-shell .land-craft:first-child { border-top: none; }
    .brand-shell .size-card { border-left: none; }
    .brand-shell .tmpl-page .tmpl-card,
    .brand-shell .tmpl-card,
    .brand-shell .pal-page .pal-card,
    .brand-shell .pal-card { border-right: none; border-bottom: 1px solid var(--brand-ink); }
    .brand-shell .xs-flatten-preview { width: 100%; }
    .brand-shell .brand-footer { padding-block: 14px; }
  }

  /* ═══════════════════════════════════════════════════════════════════════════
     EDITOR SHELL (.ed-app)
     ───────────────────────────────────────────────────────────────────────────
     The studio layout: a top bar, a canvas stage with floating tools, and
     focused panels. Desktop opens panels from an icon rail on the right; mobile
     opens the same panels as sheets from a bottom tab bar, with the tools in a
     tray docked above it. Built for any studio — the quilt editor is the first
     to mount it — and drawn entirely from the studio tokens above, so it reads
     as the same product. Everything is scoped under .ed-app.
     ═════════════════════════════════════════════════════════════════════════ */
  .ed-app {
    --app-bg: #FDFCF7;
    --surface-card: #FDFCF7;
    --ed-stage-bg: #EEE9E0;
    --ed-float-shadow: 0 4px 16px rgba(23, 23, 23, 0.10);
    --ed-ring: 0 0 0 2px var(--app-bg), 0 0 0 4px var(--metime-black);
    --ed-rail-active-bg: #EFE7DA;
    --ed-rail-active-line: #D9CDB9;
    --ed-tabbar-h: 0px;
    --ed-tray-h: 0px;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    background: var(--app-bg); color: var(--warm-fg); font-family: var(--font-sans);
    user-select: none; -webkit-user-select: none;
  }
  .ed-app input, .ed-app textarea { user-select: text; -webkit-user-select: text; }

  /* Top bar */
  .ed-topbar { flex: none; height: 60px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-bottom: var(--div-border); background: var(--app-bg); position: relative; z-index: 20; }
  .ed-topbar-left { display: flex; align-items: center; gap: 2px; flex: 1 1 0; min-width: 0; }
  .ed-topbar-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex: 1 1 0; min-width: 0; }
  .ed-topbar .brand { margin: 0 6px; }
  .ed-vrule { width: 1px; height: 24px; background: var(--warm-hairline); margin: 0 6px; flex: none; }
  .ed-app .icon-btn.ed-lg { width: 40px; height: 40px; }
  .ed-topbar-link { background: none; border: none; padding: 6px 8px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; line-height: 16px; color: var(--warm-fg); cursor: pointer; white-space: nowrap; text-decoration: underline; text-decoration-color: var(--link-line, currentColor); text-decoration-thickness: 2px; text-underline-offset: 4px; transition: text-decoration-thickness .12s; }
  .ed-topbar-link:hover { text-decoration-thickness: 3px; }
  .ed-topbar-link.is-tomato { --link-line: var(--brand-tomato); }
  .ed-topbar-link.is-olive { --link-line: var(--brand-olive); }
  .ed-topbar-link:focus-visible { outline: 2px solid var(--metime-black); outline-offset: 2px; border-radius: 4px; }
  .ed-more-dots { display: inline-flex; gap: 3px; }
  .ed-more-dots span { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

  /* Body: stage column, optional panel, rail */
  .ed-main { flex: 1; display: flex; min-height: 0; }
  .ed-stage-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ed-stage { flex: 1; position: relative; min-height: 0; overflow: hidden; background: var(--ed-stage-bg); }
  .ed-canvas { position: absolute; inset: 0; }
  .ed-app .coaster-bar { background: var(--app-bg); }

  /* Canvas: zoom 1 fits the whole quilt inside the stage, clear of the tools. */
  .ed-app .canvas-scroll { padding: 76px 92px 32px; container-type: size; }
  .ed-app .canvas-scroll > .canvas-frame {
    width: calc(var(--ed-zoom, 1) * 100%);
    width: calc(var(--ed-zoom, 1) * min(100cqw, 100cqh * var(--ed-ar, 1)));
    box-shadow: 0 1px 2px rgba(23, 23, 23, 0.10), 0 10px 30px rgba(23, 23, 23, 0.08);
  }

  /* Floating cards on the stage */
  .ed-float { background: var(--app-bg); border: 1px solid var(--warm-hairline); border-radius: 8px; box-shadow: var(--ed-float-shadow); }
  .ed-dock { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); z-index: 6; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .ed-app .ed-dock .icon-btn { width: 44px; height: 44px; }
  .ed-palette-pill { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 6; padding: 6px 8px; display: flex; align-items: center; gap: 6px; max-width: calc(100% - 200px); }
  .ed-palette-pill .ed-swatches { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 3px; margin: -3px; }
  .ed-palette-pill .ed-swatches::-webkit-scrollbar { display: none; }
  .ed-palette-pill .ed-swatch { width: 30px; height: 30px; flex: none; }
  /* Tip bubble: the current tool's hint, centered under the design (desktop) or
     on top of the tools tray (mobile). Hidden from its × or the Help panel. */

  .ed-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; }
