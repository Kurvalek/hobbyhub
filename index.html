// ── Supabase config (accounts + saved designs) ─────────────────────────────
// FILL THESE IN. Both come from the Supabase dashboard:
//   Project Settings → API
//     • "Project URL"        → SUPABASE_URL
//     • "anon public" key    → SUPABASE_ANON_KEY   (labeled "Publishable" in
//                              newer dashboards; either one works)
//
// The anon key is PUBLIC/client-safe by design — exactly like the Shopify
// Storefront token below. It only grants what Row Level Security allows, which
// for this app is "a signed-in user's own designs and nothing else". The
// service_role key is the dangerous one: it lives only in Vercel env vars and
// must never appear in this file.
//
// Full setup (email OTP, the {{ .Token }} template edit, the SQL to run) is in
// SUPABASE_SETUP.md.
const SUPABASE_URL = "https://aizynuvwoefxynjsglxr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_gxOtWjKV5k7jXd5rQTiXBA_UzHVTidL";

// ── Shopify Storefront checkout config ─────────────────────────────────────
// FILL THESE IN to connect the studio to your Shopify store. This studio runs
// on its own Vercel domain (not the Shopify storefront), so checkout goes
// through the Storefront API `cartCreate` mutation — the only origin-safe way
// to attach a per-line-item property (`_design_id`) that the fulfillment
// backend reads off the order. After creating the cart we redirect the buyer
// to the returned checkoutUrl.
//
// The Storefront access token below is PUBLIC/client-safe by design (unlike
// the Admin API key) — it's scoped only to unauthenticated storefront reads
// and cart creation, so it's fine to ship in this static page. The kit
// products themselves are mapped in SHOPIFY_KITS in src/services.jsx.
const SHOPIFY_STORE_DOMAIN = "shop.makemetime.com";
// Storefront API access token. Public/client-safe by design, so it ships in the
// page. To rotate: Shopify admin → Settings → Apps and sales channels → Develop
// apps → the app → Storefront API scopes (unauthenticated_write_checkouts,
// unauthenticated_read_checkouts, unauthenticated_read_product_listings).
//
// The kit products must also be PUBLISHED to the sales channel this token
// belongs to. The Storefront API treats an unpublished product as if it were
// deleted — `product(handle:)` returns null — so an unpublished kit shows no
// price and can't be bought, with no error to explain why.
const SHOPIFY_STOREFRONT_TOKEN = "bfff7cb8fba2b3d0cc0359fc5e38d859";
const SHOPIFY_STOREFRONT_API_VERSION = "2025-07";
</script>
