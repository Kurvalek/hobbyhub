<style>
  /* Self-hosted brand type — Söhne (sans) and BC Civitas (display).
     Trial ("TEST") cuts as supplied. The stitch text tool uses Google faces
     instead (Arvo, Cal Sans, Meow Script, Manufacturing Consent, Oleo Script
     Swash Caps, plus Rye for the sampler alphabet). Rye's wedge serifs are
     the classic stitched-sampler letterforms, and they survive being
     rasterized down to ~12 stitches, which most display faces don't. */
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 300; font-display: swap; src: url('fonts/Sohne-Light.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/Sohne-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: italic; font-weight: 400; font-display: swap; src: url('fonts/Sohne-Italic.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/Sohne-Medium.woff2') format('woff2'); }
  /* Design rule: Söhne tops out at Medium — "bold" (600/700) resolves to the Medium cut. */
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/Sohne-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/Sohne-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 300; font-display: swap; src: url('fonts/BCCivitas-Light.woff2') format('woff2'); }
  /* Design rule: BC Civitas headers use the Medium cut, so the default (400) weight loads Medium. */
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/BCCivitas-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/BCCivitas-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/BCCivitas-Semibold.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/BCCivitas-Bold.woff2') format('woff2'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }

  :root {
    /* Ice scale — fills, hovers, highlights, active / disabled */
    --ice-50: #F9FBFE;
    --ice-100: #EDF2FC;
    --ice-200: #CCD6EB;
    --ice-300: #A9BDE6;
    --ice-400: #7A94C9;
    --ice-500: #52658D;
    --ice-600: #3D4E70;
    --ice-700: #2A3752;

    /* metime base palette.
       The studio reads the brand's warm grounds and ink directly, so the editor
       sits in the same room as the setup flow and the kit review page instead of
       the cool near-white it used to. The ice scale below stays exactly as it is:
       it still carries selection, focus and the interaction states, where a cool
       tone is genuinely useful for standing apart from warm fabric and thread. */
    --metime-black: #171717;
    --metime-almost-black: #171717;
    --metime-cream: #F9F7F2;
    --metime-white: #FFFFFF;

    /* metime accent palette */
    --metime-tomato: #E8583A;
    --metime-avocado: #B5BB46;
    --metime-olive: #B9B74B;
    --metime-grapefruit: #FDA198;
    --metime-ice: var(--ice-200);
    --metime-golden: #FBBB3F;

    /* Text and structure (legacy --warm-* names kept so existing rules pick these
       up). Ink at decreasing strength rather than a separate grey ramp, which is
       how the brand builds its hierarchy — and reduced ink stays neutral against
       the warm ground where a cool grey turned slightly blue on it. */
    --warm-fg: var(--metime-black);
    --warm-fg-2: rgba(23, 23, 23, 0.78);
    --warm-muted: rgba(23, 23, 23, 0.66);
    --warm-muted-2: rgba(23, 23, 23, 0.38);
    --warm-placeholder: rgba(23, 23, 23, 0.44);
    --warm-hairline: rgba(23, 23, 23, 0.16);
    --warm-divider-soft: rgba(23, 23, 23, 0.08);
    --warm-hover: #F5EDE1;

    /* Legacy taupe / linen names — now ice aliases so existing var() calls update */
    --color-taupe-900: var(--metime-black);
    --color-taupe-700: var(--ice-600);
    --color-taupe-600: var(--ice-500);
    --color-taupe-500: var(--ice-400);
    --color-taupe-100: var(--ice-200);
    --color-linen-800: var(--ice-200);
    --color-linen-600: var(--ice-100);
    --color-linen-500: var(--ice-200);
    --color-linen-300: var(--ice-100);
    --color-linen-100: var(--ice-50);

    /* metime design system V1 — 04 Buttons and Pills (Figma 19:78). Buttons
       stay black and neutral so the five brand accents are left for filter
       pills, where each filter row takes one accent for all of its pills. */
    --ds-black: #1F1E1D;
    --ds-near-black: #2C2928;
    --ds-gray-600: #5C5955;
    --ds-gray-400: #A8A49C;
    --ds-gray-300: #D1CEC7;
    --ds-gray-200: #E5E2DB;
    --ds-gray-100: #F0EDE7;
    --ds-cream: #F5F3EE;
    --ds-white: #FFFFFF;
    --color-tomato: #E8583A;
    --color-tomato-dark: #3D1007;
    --color-avocado: #B9B74B;
    --color-avocado-dark: #46451B;
    --color-grapefruit: #FDA198;
    --color-grapefruit-dark: #7C3029;
    --color-ice: #CCD6EB;
    --color-ice-dark: #3A599A;
    --color-golden: #FBBB3F;
    --color-golden-dark: #6E4A02;
    --pill-radius: 999px;
    --btn-stroke-w: 1px;
    --btn-focus-shadow: 0 0 0 2px var(--ds-cream), 0 0 0 4px var(--color-tomato);

    /* Primary (filled) button — black fill, cream label. */
    --btn-primary-bg: var(--ds-black);
    --btn-primary-bg-hover: var(--ds-near-black);
    --btn-primary-bg-active: var(--ds-gray-600);
    --btn-primary-bg-disabled: var(--ds-gray-200);
    --btn-primary-fg: var(--ds-cream);
    --btn-primary-fg-active: var(--ds-cream);
    --btn-stroke: var(--ds-black);

    /* Secondary (outline) button — white face, black outline. Shared with
       .brand-btn so a button means the same thing on both sides of Buy kit. */
    --btn-secondary-bg: var(--ds-white);
    --btn-secondary-bg-hover: var(--ds-gray-100);
    --btn-secondary-bg-active: var(--ds-gray-200);
    --btn-secondary-border: var(--ds-black);
    --btn-secondary-fg: var(--ds-black);

    /* Shared button states */
    --btn-disabled-fg: var(--ds-gray-400);
    --btn-disabled-border: var(--ds-gray-300);
    --btn-focus-ring: var(--ice-300);
    --btn-tool-hover: rgba(23, 23, 23, 0.08);

    /* Corner for the square tool controls — icon buttons, the tool rail, nib
       and swatch pickers, upload method cards. Labelled buttons and filter
       pills are fully rounded instead (--pill-radius). Swatches, chips, panels
       and dialogs keep their own radii: those are surfaces and colour samples,
       and rounding them like controls would say they can be pressed. Note
       applyTweaks overwrites this at startup, so the tweak knob is the live value. */
    --btn-radius: 4px;

    /* Surfaces. The artboard stays white on purpose: it is the ground a maker
       judges fabric and thread colour against, and a cream field behind the work
       would warm every swatch sitting on it. */
    --surface-card: #F9F7F2;
    --surface-canvas: var(--metime-white);

    /* Action / accent semantics */
    --action: var(--metime-black);
    --action-hover: var(--ice-500);
    --selection: var(--ice-200);
    --metime-wave: var(--metime-tomato);

    /* Shadows */
    --shadow-sticky: 0 2px 8px rgba(0, 0, 0, 0.08);
    --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.14);

    /* Motion — one easing and two press depths, so every tap and every step
       change moves the same way. Cards get the shallower dip: the setup steps
       lay them out edge to edge with 1px dividers, and a deep dip pulls a
       visible gap open between neighbours. */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --press-scale: 0.96;
    --press-scale-card: 0.985;
    --press-dur: 90ms;
    --step-dur: 150ms;
    --art-dur: 150ms;
    --art-rise: 8px;
    --art-stagger: 30ms;

    /* Fonts. Sans and display both run the brand grotesk so the editor's chrome
       reads as the same product as the pages around it; the display face keeps a
       separate token because it is set bold and tight where the brand headings are.
       There is no mono face: readouts and figures use the sans with tabular numerals. */
    --font-sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;

    /* Type scale (Figma 02 - typography) — used at editorial moments;
       the dense tool UI keeps its smaller working sizes (11/12/13). */
    --text-xs: 12px;
    --text-sm: 14px;
    --text-base: 16px;
    --text-lg: 18px;
    --text-xl: 20px;
    --text-2xl: 24px;
    --text-3xl: 30px;

    /* Tweakable structural tokens (kept for backwards-compat with TweaksPanel) */
    /* The brand builds structure out of hairlines rather than fills or shadows, so
       the panel divisions drop from solid black to the brand's visible rule weight. */
    --div-border: 1px solid rgba(23, 23, 23, 0.22);
    --app-bg: var(--metime-cream);
    --canvas-bg: var(--metime-white);
  }

  /* ── Brand tokens (2026 direction) ────────────────────────────────────────
     Deliberately a NEW namespace rather than a repoint of the --metime-* /
     --ice-* tokens above: both studios read those, and the editor is meant to
     stay exactly as it is. Nothing here has any effect until an element sits
     inside .brand-shell (see the brand layer at the end of this stylesheet). */
  :root {
    --brand-paper:  #F9F7F2;   /* primary page ground */
    --brand-cream:  #F5EDE1;   /* secondary surfaces, inset fields */
    --brand-ink:    #171717;   /* text + controls */
    --brand-olive:  #BBC13F;
    --brand-tomato: #EF5535;
    --brand-lilac:  #ACA6CE;
    --brand-butter: #F0C75E;
    --brand-camel:  #A36C42;
    --brand-blue:   #CBD7ED;

    /* Ink at reduced strength. Hairlines are the main structural device, so
       they get three weights: a visible rule, a quiet divider, and a wash used
       for inset fields sitting on top of a colour panel. */
    --brand-rule:    rgba(23, 23, 23, 0.22);
    --brand-rule-2:  rgba(23, 23, 23, 0.12);
    --brand-wash:    rgba(23, 23, 23, 0.05);
    /* Both cleared against paper AND cream at 4.5:1, since captions and spec
       labels run at 12–13px and the small-text bar applies. Ink below about
       0.61 alpha fails on paper, so these sit deliberately above that. */
    --brand-muted:   rgba(23, 23, 23, 0.72);
    --brand-muted-2: rgba(23, 23, 23, 0.66);

    /* A grotesk, per the brand direction. Helvetica Neue is present on the
       Apple devices this ships to and degrades through Helvetica → Arial;
       metrics are close enough that the tight heading tracking below holds. */
    --brand-font: "Helvetica Neue", Helvetica, Arial, sans-serif;

    /* Display scale. Fluid so a 92px hero on a desktop becomes a 40px hero on
       a phone without a separate breakpoint for every heading. */
    --brand-display-xl: clamp(36px, 5.6vw, 88px);
    --brand-display-l:  clamp(30px, 3.9vw, 54px);
    --brand-display-m:  clamp(25px, 2.5vw, 34px);
    --brand-display-s:  clamp(21px, 1.7vw, 26px);
    --brand-body:       17px;   /* ≥16px per the brief */
    --brand-body-s:     16px;
    --brand-label:      14px;   /* interface labels */
    --brand-eyebrow:    12px;   /* caps micro-label, letterspaced */

    /* Headings run tight; body runs comfortable. */
    --brand-track-display: -0.028em;
    --brand-leading-display: 0.98;
    --brand-leading-body: 1.5;

    --brand-gutter: clamp(20px, 4.2vw, 64px);
  }

  body {
    font-family: var(--font-sans);
    background: var(--metime-cream);
    color: var(--warm-fg);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout */
  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--app-bg); }
  .body { flex: 1; display: grid; grid-template-columns: 52px 1fr 290px; min-height: 0; }
  .panel { overflow-y: auto; border-right: var(--div-border); }
  .panel:last-child { border-right: none; }

  /* Scrollbar */
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-thumb { background: var(--warm-hairline); border-radius: 2px; }

  /* Collapsible right panel.
     Both desktop and mobile collapse the panel to a thin rail (mirroring the
     left tool rail) that keeps the selected color + high-level totals visible.
     Expanding restores the full panel column on desktop, and slides it in as a
     drawer over a backdrop on mobile. */
  .body { position: relative; transition: grid-template-columns .22s ease; }
  .right-panel { position: relative; display: flex; flex-direction: column; background: var(--app-bg); border-left: var(--div-border); }
  /* Higher specificity than .icon-btn so these stay hidden off-mobile regardless
     of source order — otherwise the close button becomes an in-flow grid item
     and pushes the panel to a wrapped column. */
  .icon-btn.rp-close, .icon-btn.xs-rp-close { display: none; }
  .rp-backdrop { display: none; }

  /* Collapsed: swap the full panel for the thin rail (all screen sizes) */
  .body.rp-closed { grid-template-columns: 52px 1fr 52px; }
  .body.rp-closed > .right-panel { display: none; }
  .xs-body.rp-closed > .xs-panel { display: none; }
  .xs-body.rp-closed .xs-materials { right: 16px; }

  /* The thin collapsed rail (rendered only while collapsed, so it shows on
     both desktop and mobile) */
  .rp-rail {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 12px 6px; background: var(--app-bg); flex-shrink: 0; width: 52px;
    border-left: var(--div-border); z-index: 40; overflow: hidden;
  }
  .rp-rail .rail-divider { width: 24px; height: 1px; background: var(--warm-hairline); }

  /* Thin collapsed rail contents (swatch + high-level stats) */
  .rp-rail-swatch { width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.18); cursor: pointer; padding: 0; background: none; box-shadow: 0 1px 2px rgba(0,0,0,0.12); flex-shrink: 0; }
  .rp-rail-swatch.empty { border: 1px dashed var(--warm-hairline); }
  .rp-rail-stat { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; }
  .rp-rail-stat b { font-family: var(--font-display); font-size: 15px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; color: var(--warm-fg); }
  .rp-rail-stat span { font-size: 9px; color: var(--warm-muted); letter-spacing: .03em; }

  @media (max-width: 900px) {
    /* Quilt: expanded overlays a drawer instead of using a grid column
       (collapsed still shows the 52px rail column from the base rules) */
    .body { grid-template-columns: 52px 1fr; }
    .right-panel {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(300px, 88vw); z-index: 130;
      border-left: var(--div-border);
      box-shadow: -12px 0 32px rgba(0,0,0,0.20);
      transform: translateX(0); transition: transform .22s ease;
    }
    .body.rp-closed > .right-panel { display: flex; transform: translateX(105%); box-shadow: none; pointer-events: none; }

    /* Cross-stitch: same treatment (xs-body is flex; the rail is a flex item) */
    .xs-panel {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(300px, 88vw); z-index: 130;
      box-shadow: -12px 0 32px rgba(0,0,0,0.20);
      transform: translateX(0); transition: transform .22s ease;
    }
    .xs-body.rp-closed > .xs-panel { display: flex; transform: translateX(105%); box-shadow: none; pointer-events: none; }
    .xs-materials { right: 16px !important; bottom: 16px; }

    /* Backdrop + floating close button for the expanded drawer */
    .rp-backdrop { display: block; position: absolute; inset: 0; background: rgba(0,0,0,0.32); z-index: 120; }
    .icon-btn.rp-close, .icon-btn.xs-rp-close {
      display: inline-flex; position: absolute; top: 10px; right: 12px; z-index: 140;
      background: var(--metime-white); border: 1px solid var(--warm-hairline); box-shadow: var(--shadow-sticky);
    }
    .icon-btn.rp-close:hover, .icon-btn.xs-rp-close:hover { background: var(--warm-hover); }

    /* The rail owns the toggle on mobile, so drop the header/top-bar copy.
       Higher specificity than .icon-btn so it wins regardless of source order. */
    .icon-btn.rp-toggle-header { display: none; }

    /* Tighten chrome so the canvas keeps as much room as possible
       (studio header/top bar rules live after their base styles, below) */
    .preset-pill { max-width: 200px; }
    .canvas-scroll { padding: 12px; }
    .xs-canvas-wrap { padding: 12px; }
    .size-bar { flex-wrap: wrap; row-gap: 8px; padding: 10px 14px; }
    .size-bar-slider { max-width: none; min-width: 160px; }
  }

  @media (max-width: 560px) {
    .btn { padding: 6px 12px; font-size: 11px; }
    .header-right { gap: 6px; }
    .size-bar-meta { display: none; }
    .xs-title { font-size: 17px; }
    .xs-topbar .btn { padding: 6px 12px; font-size: 11px; }
    .hint-overlay { font-size: 10px; padding: 5px 10px; }
  }

  /* ── Mobile: Canva-style bottom toolbar + bottom sheets ──────────────────
     Mobile-only (<=900px). The vertical rails and the right drawer are replaced
     by a fixed bottom toolbar and slide-up sheets. Everything reuses the
     existing tokens/classes so the look is unchanged — only the layout moves. */
  @media (max-width: 900px) {
    /* Studio chrome must stay on-screen. `.app` / `.xs-app` are 100vh with
       overflow:hidden, but on mobile 100vh can exceed the visible viewport
       (iOS URL bar) so the DOCUMENT becomes the scroller and the top bar
       slides away. Lock that, pin the shell to 100%, and keep the header
       sticky as a backstop if any ancestor still scrolls. */
    html:has(.app), html:has(.xs-app),
    body:has(.app), body:has(.xs-app) {
      overflow: hidden;
      overscroll-behavior: none;
    }
    .app, .xs-app {
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      padding-bottom: calc(58px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }
    .app > header, .xs-app > .xs-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
    }
    /* Center column used to be `.panel { overflow-y:auto }`, so SizeBar
       (and ZoomBar) scrolled away with the canvas. Canvas-scroll is the
       scroller; keep the top chrome in flow. */
    .body { min-height: 0; overflow: hidden; }
    .body > .panel { min-height: 0; overflow: hidden; }
    .xs-body { min-height: 0; }
    .canvas-scroll, .xs-canvas-wrap { overscroll-behavior: contain; }
    /* Single-column body (rails + right drawer are not rendered on mobile). */
    .body, .body.rp-closed { grid-template-columns: 1fr; }

    .mobile-toolbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 150;
      display: flex; align-items: center; gap: 4px; overflow-x: auto;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: var(--app-bg); border-top: var(--div-border);
      box-shadow: 0 -2px 6px rgba(0,0,0,0.08); -webkit-overflow-scrolling: touch;
    }
    .mobile-toolbar::-webkit-scrollbar { display: none; }
    .mobile-toolbar .icon-btn { flex-shrink: 0; width: 40px; height: 40px; }
    .mobile-toolbar-divider { flex-shrink: 0; width: 1px; height: 22px; background: var(--warm-hairline); margin: 0 4px; }
    .mt-swatch { display: block; width: 20px; height: 20px; border-radius: 5px; border: 1px solid rgba(0,0,0,0.18); }
    .mt-swatch.empty { border: 1px dashed var(--warm-hairline); background: transparent; }

    /* Selection toolbars become a contextual bar pinned above the toolbar.
       Reuses the existing .selection-toolbar chrome; overrides the JS-computed
       fixed coords with a bottom-anchored, full-width bar. */
    .selection-toolbar.mobile-selbar {
      position: fixed !important; left: 8px; right: 8px; top: auto !important;
      bottom: calc(66px + env(safe-area-inset-bottom)); visibility: visible !important;
      justify-content: center; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .selection-toolbar.mobile-selbar::after { display: none; }
    .xs-selbar.mobile-selbar {
      position: fixed !important; left: 8px !important; right: 8px !important; top: auto !important;
      bottom: calc(66px + env(safe-area-inset-bottom)) !important; transform: none !important;
      justify-content: center; flex-wrap: wrap; row-gap: 6px;
    }

    /* Bottom sheet chrome. */
    .bottom-sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.32); z-index: 200; }
    .bottom-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
      background: var(--app-bg); border-top: var(--div-border);
      border-radius: 14px 14px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,0.20);
      display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--warm-hairline); margin: 8px auto 2px; flex-shrink: 0; }
    .bottom-sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 12px 6px; flex-shrink: 0; }
    .bottom-sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Center modal dialogs (.overlay) and the cross-stitch fabric picker become
       bottom sheets on mobile. `!important` is required to override the cards'
       inline styles; desktop keeps the centered dialog untouched. */
    .overlay, .xs-picker { align-items: flex-end !important; }
    .overlay > div, .xs-picker-card {
      max-width: none !important; width: 100% !important; margin: 0 !important;
      border-radius: 14px 14px 0 0 !important; max-height: 88vh !important; overflow-y: auto !important;
      padding-bottom: calc(24px + env(safe-area-inset-bottom)) !important;
    }
  }

  /* Header */
  header { padding: 14px 20px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; flex-shrink: 0; background: var(--app-bg); position: relative; z-index: 5; border-bottom: var(--div-border); box-shadow: none; }
  .header-left { display: flex; align-items: center; }
  .header-center { display: flex; align-items: center; justify-content: center; }
  .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

  /* Brand wordmark (metime) — canvas headers use the compact icon on narrow
     screens so Save keeps padding; setup/proj pages keep the full wordmark. */
  .brand { display: inline-flex; align-items: center; color: var(--metime-almost-black); text-decoration: none; line-height: 0; }
  .brand-mark { height: 28px; width: auto; display: block; }
  .brand-icon { display: none; height: 28px; width: 28px; object-fit: contain; }
  @media (max-width: 900px) {
    .app .brand-mark,
    .xs-app .brand-mark { display: none; }
    .app .brand-icon,
    .xs-app .brand-icon { display: block; }
    .app .header-right .btn,
    .xs-app .header-right .btn { white-space: nowrap; }
  }
  @media (max-width: 560px) {
    .app .brand-icon,
    .xs-app .brand-icon { height: 26px; width: 26px; }
  }

  /* Preset selector (header center). A dropdown field, not a button: the same
     4px corner and 1px stroke as the select inputs, and the stroke rather than
     a fill answers hover and open. */
  .preset-pill { display: inline-flex; align-items: center; gap: 8px; box-sizing: border-box; min-height: 30px; padding: 0 10px 0 12px; background: var(--ds-white); border: 1px solid var(--warm-muted-2); border-radius: 4px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--warm-fg); cursor: pointer; transition: border-color .12s, box-shadow .12s; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preset-pill:hover { border-color: var(--ds-black); }
  .preset-pill[aria-expanded="true"] { border-color: var(--ds-black); }
  .preset-pill:focus-visible { outline: none; border-color: var(--ds-black); box-shadow: var(--btn-focus-shadow); }
  .preset-pill .preset-dim { color: var(--warm-muted); font-weight: 400; font-family: var(--font-sans); font-size: 12px; }
  .preset-pill .ic { color: var(--warm-muted); margin-left: 2px; }
  .preset-pill > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  /* Icons (<Icon>): one color at rest; the pastel duotone layer fades in on hover */
  .ic { display: inline-block; flex: none; vertical-align: middle; }

  /* Icon button (used in header + tool rail + popover triggers) */
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--btn-radius); border: 1px solid transparent; background: transparent; color: var(--btn-secondary-fg); cursor: pointer; transition: background .12s, border-color .12s, color .12s, box-shadow .12s, transform var(--press-dur) var(--ease-out); padding: 0; }
  .icon-btn:hover { background: var(--btn-tool-hover); }
  .icon-btn:active { background: var(--btn-secondary-bg-active); }
  .icon-btn:focus-visible { outline: 2px solid var(--metime-black); outline-offset: 2px; box-shadow: none; }
  .icon-btn[aria-pressed="true"], .icon-btn.active { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-stroke); }
  .icon-btn[aria-pressed="true"]:hover, .icon-btn.active:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-stroke); }
  .icon-btn:disabled { color: var(--btn-disabled-fg); cursor: not-allowed; }
  .icon-btn:disabled:hover { background: transparent; }

  /* Toggle switch (pill on/off control) */
  .switch { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-sans); font-size: 12px; color: var(--warm-fg-2); user-select: none; }
  .switch-track { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--color-linen-800); border: 1px solid var(--btn-secondary-border); transition: background .12s, border-color .12s; flex-shrink: 0; }
  .switch-knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--metime-white); box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform .12s; }
  .switch[aria-checked="true"] .switch-track { background: var(--color-taupe-900); border-color: var(--color-taupe-900); }
  .switch[aria-checked="true"] .switch-knob { transform: translateX(14px); }
  .switch:focus-visible { outline: none; }
  .switch:focus-visible .switch-track { box-shadow: 0 0 0 3px var(--btn-focus-ring); }

  /* Left tool rail */
  .tool-rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; background: var(--app-bg); border-right: var(--div-border); }
  .tool-rail .rail-spacer { flex: 1; }
  .tool-rail .rail-divider { width: 24px; height: 1px; background: var(--warm-hairline); margin: 4px 0; }

  /* Popover (anchored floating panel) */
  .popover-backdrop { position: fixed; inset: 0; z-index: 90; background: transparent; }
  .popover { position: fixed; z-index: 91; background: var(--surface-card); border: 1px solid var(--warm-hairline); border-radius: 8px; box-shadow: 0 10px 32px rgba(0,0,0,0.16); font-family: var(--font-sans); }
  .popover-header { padding: 12px 14px 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .popover-title { font-size: 12px; font-weight: 500; color: var(--warm-fg); }
  .popover-body { padding: 4px 14px 14px; }
  .popover-footer { padding: 10px 14px; border-top: 1px solid var(--warm-divider-soft); display: flex; gap: 8px; justify-content: flex-end; }

  /* Disclosures (collapsible sections inside the right column) */
  .disclosure-toggle { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 0; color: var(--warm-muted); font-family: var(--font-sans); font-size: 11px; font-weight: 500; }
  .disclosure-toggle:hover { color: var(--warm-fg); }
  .disclosure-toggle .chev { display: inline-block; transition: transform .12s; font-size: 9px; }
  .disclosure-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }

  /* Right-column section row (compact backing/binding/etc) */
  .stack-row { display: flex; align-items: center; gap: 10px; }
  .stack-row .stack-main { flex: 1; min-width: 0; }
  .edit-link { background: none; border: none; padding: 0 2px; cursor: pointer; color: var(--warm-muted); font-family: var(--font-sans); font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
  .edit-link:hover { color: var(--warm-fg); }

  /* Floating hint pill in canvas */
  .hint-overlay { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--metime-almost-black); color: var(--metime-white); padding: 6px 12px; border-radius: 999px; font-size: 11px; line-height: 1.4; max-width: calc(100% - 32px); display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.18); pointer-events: none; }

  /* Top-of-canvas size bar */
  .size-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 20px; border-bottom: var(--div-border); background: var(--surface-canvas); flex-shrink: 0; }
  .size-bar-slider { display: flex; align-items: center; gap: 12px; flex: 1; max-width: 460px; }
  .size-bar-slider input[type=range] { flex: 1; }
  .size-bar-label { font-size: 11px; color: var(--warm-fg-2); font-weight: 500; white-space: nowrap; }
  .size-bar-value { font-size: 12px; color: var(--warm-fg); min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  .size-bar-meta { display: flex; gap: 16px; font-size: 11px; color: var(--warm-muted); white-space: nowrap; }
  .size-bar-meta span { font-variant-numeric: tabular-nums; }

  /* Pencil/eraser nib ladder. Each button previews its own nib as a square the
     size of the mark it makes, so the row reads without labels. */
  .nib-bar { display: flex; align-items: center; gap: 4px; }
  .nib-bar .size-bar-label { margin-right: 4px; }
  .nib-btn {
    width: 24px; height: 24px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid transparent; border-radius: var(--btn-radius); cursor: pointer;
    color: var(--btn-secondary-fg); transition: background .12s, border-color .12s, color .12s, box-shadow .12s;
  }
  .nib-btn:hover { background: var(--btn-tool-hover); }
  .nib-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .nib-btn.active { background: var(--btn-primary-bg); border-color: var(--btn-stroke); color: var(--btn-primary-fg); }
  .nib-btn.active:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-stroke); }
  .nib-chip { display: block; background: currentColor; border-radius: 1px; }

  /* Coaster set: 4 pages sharing palette/template, edited one at a time. */
  .coaster-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 20px; border-bottom: var(--div-border); background: var(--surface-canvas);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .coaster-tablist {
    display: flex; align-items: stretch;
    border: 1px solid var(--warm-hairline); border-radius: 8px;
    overflow: hidden; background: var(--surface-card);
  }
  .coaster-tab {
    appearance: none; border: none; background: transparent; cursor: pointer;
    padding: 6px 12px; font-family: var(--font-sans); font-size: 12px; font-weight: 500;
    color: var(--warm-muted); border-right: 1px solid var(--warm-hairline); white-space: nowrap;
  }
  .coaster-tab:last-child { border-right: none; }
  .coaster-tab:hover { background: var(--warm-hover); color: var(--warm-fg); }
  .coaster-tab.active { background: var(--metime-almost-black); color: var(--metime-white); }
  .coaster-tab.active:hover { background: var(--metime-almost-black); color: var(--metime-white); }
  .coaster-tab:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--btn-focus-ring); }
  .coaster-copy { flex-shrink: 0; }
  @media (max-width: 900px) {
    .coaster-bar { padding: 8px 14px; }
    .coaster-tab { padding: 6px 9px; font-size: 11px; }
  }

  /* Canvas viewport (scrollable, centered, scaled by zoom).
     `margin: auto` on the child centers a small design and still lets you
     scroll to every edge once zoom makes it larger than the viewport. */
  .canvas-scroll { width: 100%; height: 100%; overflow: auto; display: flex; padding: 24px; box-sizing: border-box; }
  .canvas-scroll > .canvas-frame { flex-shrink: 0; position: relative; background: var(--canvas-bg); margin: auto; }
  .canvas-surface { position: absolute; inset: 0; user-select: none; touch-action: none; }
  .canvas-scroll.is-panning, .xs-canvas-wrap.is-panning { cursor: grab; }
  .canvas-scroll.is-panning:active, .xs-canvas-wrap.is-panning:active { cursor: grabbing; }
  .canvas-scroll.is-panning .canvas-surface, .xs-canvas-wrap.is-panning .xs-canvas { cursor: grab; }

  /* Bottom-of-canvas zoom bar */
  .zoom-bar { display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-top: var(--div-border); background: var(--surface-canvas); flex-shrink: 0; }
  .zoom-bar input[type=range] { flex: 1; max-width: 280px; }
  .zoom-bar-value { font-family: var(--font-sans); font-size: 11px; color: var(--warm-fg-2); min-width: 40px; text-align: right; }

  /* Floating selection toolbar (position+coords are computed in JS, FigJam-style) */
  .selection-toolbar { z-index: 100; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--surface-card); border: 1px solid var(--warm-hairline); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.16); font-size: 12px; white-space: nowrap; pointer-events: auto; }
  .selection-toolbar-divider { display: inline-block; width: 1px; height: 16px; background: var(--warm-hairline); margin: 0 2px; }
  .selection-swatch-btn { display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: transparent; border: 1px solid transparent; border-radius: var(--btn-radius); font: inherit; color: inherit; cursor: pointer; transition: background .12s, border-color .12s; }
  .selection-swatch-btn:hover { background: var(--surface-hover, rgba(0,0,0,0.05)); border-color: var(--warm-hairline); }
  .selection-swatch-preview { width: 14px; height: 14px; border: 1px solid rgba(0,0,0,0.12); border-radius: 2px; flex-shrink: 0; display: block; }
  .selection-swatch-mixed { background: conic-gradient(#E8583A 0deg 90deg, #B5BB46 90deg 180deg, #1A2E4C 180deg 270deg, #E1A92F 270deg 360deg); }
  .selection-swatch-name { font-weight: 500; color: var(--warm-fg); }
  .selection-swatch-meta { color: var(--warm-muted); font-family: var(--font-sans); font-size: 11px; }
  .selection-swatch-btn .ic { color: var(--warm-fg-2); margin-left: 2px; }
  .selection-toolbar::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; }
  .selection-toolbar.above::after { bottom: -5px; border-top: 6px solid var(--surface-card); }
  .selection-toolbar.below::after { top: -5px; border-bottom: 6px solid var(--surface-card); }
  .selection-toolbar.clamped::after { display: none; }

  /* Section labels */
  .label { font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--warm-fg); margin-bottom: 10px; }
  .label-mono { font-family: var(--font-sans); font-size: 10px; letter-spacing: 0.04em; color: var(--warm-muted); }

  /* Cards */
  .card { padding: 16px; border-bottom: var(--div-border); }
  .card:last-child { border-bottom: none; }

  /* Inputs */
  input[type=text], input[type=email], select, textarea {
    width: 100%; padding: 7px 10px; font-size: 13px; font-family: var(--font-sans);
    border: 1px solid var(--warm-hairline); background: var(--surface-card); color: var(--warm-fg); outline: none;
    border-radius: 4px; transition: border-color .15s;
  }
  input[type=text]:focus, input[type=email]:focus, select:focus, textarea:focus { border-color: var(--metime-almost-black); }
  select { appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' width='10' height='10' fill='none' stroke='%238A8580' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--metime-almost-black); cursor: pointer; }
  input[type=checkbox] { accent-color: var(--color-taupe-900); cursor: pointer; }
  input[type=color] { width: 32px; height: 28px; padding: 2px; border: 1px solid var(--warm-hairline); background: none; border-radius: 4px; cursor: pointer; }

  /* Buttons — metime design system V1 (Figma 2095:232).
     Default .btn = Secondary hierarchy, .btn-dark = Primary, .btn-tertiary = Tertiary.
     .btn is the Small size (30px) the dense studio chrome runs at; .btn-md,
     .btn-lg and .btn-cta are Medium (36px), Large (44px) and CTA (52px).
     .btn-sm and .btn-xs are tighter still for inline rows inside panels and popovers. */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; min-height: 30px; padding: 0 14px; font-size: 13px; line-height: 16px; font-family: var(--font-sans); font-weight: 500; letter-spacing: 0.01em; border-radius: var(--pill-radius); cursor: pointer; transition: background .14s, border-color .14s, color .14s, box-shadow .12s, transform var(--press-dur) var(--ease-out); border: var(--btn-stroke-w) solid var(--btn-secondary-border); background: var(--btn-secondary-bg); color: var(--btn-secondary-fg); }
  .btn:hover { background: var(--btn-secondary-bg-hover); border-color: var(--btn-secondary-border); }
  .btn:active { background: var(--btn-secondary-bg-active); }
  .btn:focus-visible { outline: none; box-shadow: var(--btn-focus-shadow); }
  .btn:disabled, .btn[disabled] { background: transparent; border-color: var(--btn-disabled-border); color: var(--btn-disabled-fg); cursor: not-allowed; box-shadow: none; }

  .btn-dark { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-stroke); }
  .btn-dark:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-primary-bg-hover); }
  .btn-dark:active { background: var(--btn-primary-bg-active); border-color: var(--btn-primary-bg-active); color: var(--btn-primary-fg-active); }
  .btn-dark:disabled, .btn-dark[disabled] { background: var(--btn-primary-bg-disabled); border-color: var(--btn-primary-bg-disabled); color: var(--btn-disabled-fg); }

  .btn-md { min-height: 36px; padding: 0 18px; font-size: 14px; gap: 6px; }
  .btn-lg { min-height: 44px; padding: 0 22px; font-size: 16px; gap: 8px; }
  .btn-cta { min-height: 52px; padding: 0 28px; font-size: 18px; gap: 10px; }

  .btn-tertiary { min-height: 0; background: transparent; border: none; border-radius: 6px; padding: 0; color: var(--ds-black); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .btn-tertiary:hover { background: transparent; color: var(--ds-gray-600); }
  .btn-tertiary:active { background: transparent; color: var(--ds-gray-600); }
  .btn-tertiary:disabled, .btn-tertiary[disabled] { background: transparent; color: var(--btn-disabled-fg); }

  .btn-sm { min-height: 26px; padding: 0 12px; font-size: 12px; }
  .btn-xs { min-height: 22px; padding: 0 10px; font-size: 11px; }

  /* Fabric row (clickable color field) */
  .fabric-row { display: flex; gap: 10px; align-items: center; padding: 14px 16px; background: transparent; border: none; border-bottom: var(--div-border); width: 100%; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: background .12s, transform var(--press-dur) var(--ease-out); box-sizing: border-box; }
  .fabric-row:hover { background: var(--warm-hover); }
  .fabric-row:focus-visible { outline: 2px solid var(--selection); outline-offset: -2px; }
  .fabric-row-swatch { width: 28px; height: 28px; border-radius: 4px; flex-shrink: 0; box-sizing: border-box; border: 1px solid var(--warm-hairline); }
  .fabric-row-swatch.empty { border: 1px dashed var(--warm-hairline); background: transparent; }
  .fabric-row-main { flex: 1; min-width: 0; }
  .fabric-row-title { font-size: 12px; font-weight: 500; color: var(--warm-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fabric-row-name { color: var(--warm-muted); font-weight: 400; }
  .fabric-row-detail { font-size: 11px; color: var(--warm-muted); font-family: var(--font-sans); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Color chip */
  .chip { aspect-ratio: 1; border-radius: 4px; border: 1px solid rgba(0,0,0,0.12); cursor: pointer; transition: transform .1s, box-shadow .1s; display: block; width: 100%; }
  .chip:hover { transform: scale(1.06); box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
  .chip.selected { outline: 2pt solid var(--metime-black); outline-offset: 0; box-shadow: none; position: relative; z-index: 2; }

  /* Filter pills — metime design system V1 (Figma 2190:1646). Each filter row
     takes one brand accent, set on the row with a .pills-<accent> class so all
     of its pills always match. Default: accent outline, dark-shade label.
     Hover: accent fill. Selected: accent fill with a dark-shade outline. The
     outline sits inside the 9/18 padding, as Figma's inside stroke does, and
     thins from 2px to 1.5px when selected without changing the pill's size. */
  .pills-tomato     { --pill: var(--color-tomato);     --pill-dark: var(--color-tomato-dark); }
  .pills-avocado    { --pill: var(--color-avocado);    --pill-dark: var(--color-avocado-dark); }
  .pills-grapefruit { --pill: var(--color-grapefruit); --pill-dark: var(--color-grapefruit-dark); }
  .pills-ice        { --pill: var(--color-ice);        --pill-dark: var(--color-ice-dark); }
  .pills-golden     { --pill: var(--color-golden);     --pill-dark: var(--color-golden-dark); }
  .filter-pill {
    --pill-bw: 2px; --pill-py: 9px; --pill-px: 18px;
    display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;
    padding: calc(var(--pill-py) - var(--pill-bw)) calc(var(--pill-px) - var(--pill-bw));
    border: var(--pill-bw) solid var(--pill, var(--color-tomato)); border-radius: var(--pill-radius);
    background: transparent; color: var(--pill-dark, var(--color-tomato-dark));

  /* Grid canvas */

  /* Signed-in account: 24px profile-circle (Figma 7:1132) + email/sign-out menu. */

  }
  .account-menu-out:hover { opacity: 0.7; }

  .auth-code { letter-spacing: 0.35em; font-size: 22px; font-variant-numeric: tabular-nums; text-align: center; font-family: var(--font-sans); }

  /* Info text */

  /* Hint strip */
  .hint-strip { padding: 6px 12px; font-size: 11px; color: var(--warm-muted); display: flex; gap: 12px; flex-wrap: wrap; }

  /* Project selector page */
  .proj-page { display: flex; flex-direction: column; height: 100vh; background: var(--metime-cream); overflow: hidden; }
  .proj-header { padding: 14px 20px; display: flex; align-items: center; gap: 16px; border-bottom: none; box-shadow: none; background-color: var(--metime-cream); background-image: repeating-linear-gradient(to right, var(--metime-almost-black) 0, var(--metime-almost-black) 3px, transparent 3px, transparent 7px); background-repeat: no-repeat; background-size: 100% 1px; background-position: bottom left; flex-shrink: 0; }
  .proj-body { flex: 1; overflow-y: auto; padding: 48px 48px 64px; }
  .proj-intro { margin-bottom: 40px; }
  .proj-heading { font-family: var(--font-display); font-size: 36px; line-height: 1.15; letter-spacing: -0.5px; color: #000000; margin-bottom: 6px; }
  .proj-subheading { font-size: 14px; color: #3D4E70; }
  /* auto-fit (not auto-fill) collapses empty trailing tracks so the cards
     stretch to fill the row on desktop; at narrow widths it still resolves to a
     single column, so mobile stacking is unchanged. max-width keeps cards sane
     on very wide screens. Shared by the craft picker and both size selectors. */
  /* Size grids stay 4 / 2 / 1 across so we never get an orphan 3+1 row;
     cards use 1fr so they expand to fill the row. Craft picker keeps auto-fit. */
  .proj-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 18px; max-width: 1200px; }
  .craft-grid { grid-template-columns: repeat(auto-fit, minmax(188px, 1fr)); max-width: 1200px; }
  @media (max-width: 900px) { .proj-grid:not(.craft-grid) { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .proj-grid:not(.craft-grid) { grid-template-columns: 1fr; } }
  /* Setup-step card box: #707F87 / 4px, matching the palette card (Figma 2138:1989). */
  .proj-card { background: var(--metime-white); border: 1px solid #707F87; border-radius: 4px; overflow: hidden; cursor: pointer; transition: box-shadow 0.15s, transform 0.12s; display: flex; flex-direction: column; }

  .proj-card-thumb { overflow: hidden; background: var(--metime-cream); flex-shrink: 0; }
  .proj-card-thumb svg { display: block; width: 100%; height: auto; }
  .proj-card-thumb.has-photo { aspect-ratio: 4 / 3; }
  .proj-card-thumb.has-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .proj-card-body { padding: 13px 15px 15px; flex: 1; }
  /* Card name / meta scale shared with .pal-card-name / .pal-card-meta. */
  .proj-card-name { font-size: 14px; font-weight: 500; color: #000000; line-height: normal; margin-bottom: 4px; }
  .proj-card-dims { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; margin-bottom: 2px; }
  .proj-card-desc { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; margin-bottom: 8px; }
  .proj-card-cost { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; border-top: 1px solid #707F87; padding-top: 8px; margin-top: 8px; }

  /* Saved designs (Figma Desktop - 4, node 7:1111) — full-bleed bar + 4-col cards.

  .saved-sec { flex: 0 0 auto; background: var(--metime-white); border-top: 1px solid var(--metime-black); }

  .saved-card { display: flex; flex-direction: column; gap: 16px; min-width: 0; padding: 24px 28px; background: var(--metime-white); border: none; border-right: 1px solid var(--metime-black); text-align: left; font: inherit; color: inherit; cursor: pointer; outline: none; -webkit-appearance: none; appearance: none; }
  .saved-card:nth-child(4n) { border-right: none; }
  .saved-card:nth-child(n+5) { border-top: 1px solid var(--metime-black); }
  .saved-card:focus-visible { box-shadow: inset 0 0 0 3px var(--btn-focus-ring); }
  .saved-thumb { display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 317 / 263; overflow: hidden; background: var(--metime-cream); }
  .saved-thumb svg, .saved-thumb canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  .saved-copy { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
  .saved-card-text { min-width: 0; }
  .saved-name { font-family: var(--font-sans); font-size: 16px; font-weight: 500; line-height: 1.2; color: var(--metime-black); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saved-meta { font-family: var(--font-sans); font-size: 13px; font-weight: 300; line-height: 1.3; color: var(--metime-black); margin-top: 4px; }
  .saved-card-arrow { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex-shrink: 0; overflow: visible; opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; }

  @media (max-width: 1080px) {

  /* Landing page (Figma Desktop - 1, node 1:4).

     the golden footer sits under the content instead of pinning over it. */
  .land-page { height: 100%; overflow: auto; background: var(--metime-white); color: var(--metime-black); }
  .land-fill { display: flex; flex-direction: column; min-height: 100%; }

  .land-hero-photo { position: absolute; top: 0; height: 100%; object-fit: cover; object-position: center; pointer-events: none; }

  .land-hero-title { position: absolute; left: 26.46%; width: 47.08%; top: 50%; transform: translateY(-50%); z-index: 3; margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 3vw, 40px); line-height: 1.1; color: var(--metime-white); text-align: center; pointer-events: none; }
  .land-hero::after, .land-footer::before, .land-craft + .land-craft::before {

  .land-craft-visual img { display: block; width: auto; height: auto; max-width: min(320px, 100%); max-height: 100%; object-fit: contain; }

  .land-craft:hover .land-craft-arrow,

  @media (max-width: 900px) {

  /* Quilt "What size?" step (Figma Desktop - 2, node 5:3).

  .size-page { display: flex; flex-direction: column; min-height: 100%; height: 100%; background: var(--metime-white); color: var(--metime-black); overflow: auto; }

  .size-hero { position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; height: 138px; padding: 0 132px; background: var(--metime-grapefruit); border-bottom: 1px solid var(--metime-black); }
  .size-title { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 4.44vw, 64px); line-height: 1.1; color: var(--metime-white); text-align: center; }
  .size-back { position: absolute; left: 41px; top: 50%; transform: translateY(-50%); display: inline-flex; align-items: center; gap: 2px; background: none; border: none; padding: 0; cursor: pointer; color: var(--color-taupe-900); }

  .size-back-label { font-family: var(--font-sans); font-size: 16px; font-weight: 500; line-height: 24px; border-bottom: 1px solid currentColor; }

  .size-row { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--metime-black); }
  /* Grid, not flex: iPad Safari shrinks flex children of <button> to content

    display: grid; grid-template-columns: minmax(0, 1fr); align-content: start;
    width: 100%; padding: 32px 36px 33px; min-width: 0; box-sizing: border-box;
    background: none; border: none; border-left: 1px solid var(--metime-black);
    text-align: left; font: inherit; color: inherit; cursor: pointer;
    outline: none; -webkit-appearance: none; appearance: none;
  }
  .size-card:first-child { border-left: none; }
  .size-card:focus-visible { box-shadow: inset 0 0 0 3px var(--btn-focus-ring); }
  .size-card-visual {
    justify-self: stretch; width: 100%; min-width: 0;

    height: clamp(140px, 21.6vh, 221px); overflow: hidden;

  }

  .size-card-visual svg { display: block; height: 100%; width: auto; max-width: 100%; margin: 0 auto; }
  .size-card-copy {
    display: flex; align-items: center; justify-content: space-between;

    gap: 12px; margin-top: 24px;
  }
  .size-card-text { min-width: 0; }
  .size-card-name { display: block; font-family: var(--font-sans); font-size: 20px; font-weight: 500; line-height: 1.2; color: var(--metime-black); }
  .size-card-dims { display: block; font-family: var(--font-sans); font-size: 16px; font-weight: 400; line-height: 1.3; color: var(--metime-black); margin-top: 6px; }

  .size-card-price { display: block; font-family: var(--font-sans); font-size: 16px; font-weight: 500; line-height: 1.3; color: var(--metime-black); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .size-card-arrow { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; margin-left: auto; overflow: visible; opacity: 0; visibility: hidden; transition: opacity 0.2s ease, visibility 0.2s ease; }
  .size-card:hover .size-card-arrow,
  .size-card:focus-visible .size-card-arrow,
  .pal-page .pal-card:hover .size-card-arrow,
  .pal-page .pal-card:focus-visible .size-card-arrow,
  .tmpl-page .tmpl-card:hover .size-card-arrow,
  .tmpl-page .tmpl-card:focus-visible .size-card-arrow { opacity: 1; visibility: visible; animation: land-craft-arrow-nudge 0.6s ease-in-out infinite alternate; }

  @media (prefers-reduced-motion: reduce) {

    .tmpl-page .tmpl-card:focus-visible .size-card-arrow { animation: none; }
  }

  /* Phones have no hover, so the product-block arrows stay visible. */

    .land-craft-arrow,
    .size-card-arrow,
    .saved-card-arrow,
    .pal-page .pal-card .size-card-arrow,
    .tmpl-page .tmpl-card .size-card-arrow {
      opacity: 1;
      visibility: visible;
      animation: none;
    }

  .size-footer { flex: 1 1 auto; min-height: 96px; background: var(--metime-golden); }

  /* Two-across before one-across: four 20px names in a row need ~230px each. */
  @media (max-width: 1080px) {
    .size-row { grid-template-columns: 1fr 1fr; }
    .size-card:nth-child(odd) { border-left: none; }
    .size-card:nth-child(n+3) { border-top: 1px solid var(--metime-black); }
  }
  @media (max-width: 900px) {
    .size-hero { height: 104px; padding: 0 96px; }
    .size-back { left: 20px; }
    .size-card { padding: 24px 28px; }
    .size-card-visual { height: clamp(120px, 18vh, 200px); }
    .size-footer { min-height: 72px; }
  }
  @media (max-width: 600px) {
    .size-row { grid-template-columns: 1fr; }
    .size-card { border-left: none; }
    .size-card:nth-child(n+2) { border-top: 1px solid var(--metime-black); }
  }

  /* Quilt backing step (Figma Desktop - 5, node 13:1260). */
  .back-page { display: flex; flex-direction: column; min-height: 100%; height: 100%; background: var(--metime-white); color: var(--metime-black); overflow: auto; }
  .size-hero.has-skip { padding: 0 180px; }
  .back-skip {
    position: absolute; right: 41px; top: 50%; transform: translateY(-50%);
    display: inline-flex; align-items: center; justify-content: center;
    box-sizing: border-box; min-width: 0; height: 36px; padding: 0 18px;
    background: var(--btn-secondary-bg); border: var(--btn-stroke-w) solid var(--btn-secondary-border); border-radius: var(--pill-radius);
    font-family: var(--font-sans); font-size: 14px; font-weight: 500; line-height: 1;
    color: var(--btn-secondary-fg); cursor: pointer;
  }
  .back-skip:hover { background: var(--btn-secondary-bg-hover); }
  .back-skip:focus-visible { outline: none; box-shadow: var(--btn-focus-shadow); }
  .back-filters {
    display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
    gap: 10px; flex: 0 0 auto; min-height: 130px; padding: 24px 40px;
    background: var(--metime-white); border-bottom: 1px solid var(--metime-black);
  }
  .back-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 0; flex: 0 0 auto; }
  .back-grid .fabric-card {
    border: none; border-right: 1px solid var(--metime-black); border-bottom: 1px solid var(--metime-black);
    border-radius: 0; box-shadow: none; transform: none;
  }
  .back-grid .fabric-card:hover { box-shadow: none; transform: none; }
  .back-grid .fabric-card:nth-child(8n) { border-right: none; }
  .back-grid .fabric-card.selected { box-shadow: inset 0 0 0 3px var(--metime-black); }
  .back-grid .fabric-thumb { aspect-ratio: 180 / 192; }
  @media (max-width: 1080px) {
    .back-grid { grid-template-columns: repeat(4, 1fr); }
    .back-grid .fabric-card:nth-child(8n) { border-right: 1px solid var(--metime-black); }
    .back-grid .fabric-card:nth-child(4n) { border-right: none; }
  }
  @media (max-width: 900px) {
    .size-hero.has-skip { padding: 0 20px; }
    .back-skip { right: 20px; min-width: 0; height: 36px; padding: 0 12px; font-size: 13px; }
    .back-filters { min-height: 0; padding: 16px 20px; }
  }
  @media (max-width: 600px) {
    .back-grid { grid-template-columns: repeat(2, 1fr); }
    .back-grid .fabric-card:nth-child(4n) { border-right: 1px solid var(--metime-black); }
    .back-grid .fabric-card:nth-child(2n) { border-right: none; }
  }

  /* Quilt palette step (Figma Desktop - 6, node 18:1425). */
  .pal-page { display: flex; flex-direction: column; min-height: 100%; height: 100%; background: var(--metime-white); color: var(--metime-black); overflow: auto; }
  .pal-suggest-bar {
    display: flex; align-items: center; flex: 0 0 auto; min-height: 173px; padding: 24px 40px;
    background: var(--metime-white); border-bottom: 1px solid var(--metime-black);
  }
  .pal-page .pal-from-image {
    display: flex; align-items: center; gap: 24px;
    width: 100%; max-width: none; padding: 0; border: none; border-radius: 0; background: none;
  }
  .pal-page .pal-from-image-preview {
    width: 97px; height: 97px; outline: none; border: 1px solid var(--metime-black);
  }
  .pal-page .pal-from-image-preview-btn {
    padding: 0; margin: 0; background: none; border: none; cursor: zoom-in;
    flex-shrink: 0; line-height: 0;
  }
  .pal-page .pal-from-image-preview-btn:focus-visible {
    outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring);
  }
  .pal-page .pal-from-image-main {
    flex: 1; flex-direction: row; align-items: center; gap: 24px; min-width: 0;
  }
  .pal-page .pal-from-image-swatches { gap: 8px; flex: 1 1 auto; min-width: 0; }
  .pal-page .pal-from-image-swatch { width: 64px; height: 64px; }
  .pal-page .pal-from-image-add {
    width: 64px; height: 64px; border-radius: 32px;
    border: 1px solid rgba(0, 0, 0, 0.5); background: #F5F5F5;
    color: var(--metime-black); font-size: 0;
  }
  .pal-page .pal-from-image-add:hover { background: var(--metime-cream); }
  .pal-page .pal-from-image-use {
    flex: 0 0 auto; min-width: 160px; height: 44px; padding: 0 22px; margin-left: auto;
    border-radius: var(--pill-radius); border: var(--btn-stroke-w) solid var(--btn-stroke);
    background: var(--btn-primary-bg); color: var(--btn-primary-fg);
    font-family: var(--font-sans); font-size: 16px; font-weight: 500; line-height: 1;
    cursor: pointer;
  }
  .pal-page .pal-from-image-use:hover:not(:disabled) { background: var(--btn-primary-bg-hover); border-color: var(--btn-primary-bg-hover); }
  .pal-page .pal-from-image-use:active:not(:disabled) { background: var(--btn-primary-bg-active); border-color: var(--btn-primary-bg-active); }
  .pal-page .pal-from-image-use:disabled { background: var(--btn-primary-bg-disabled); border-color: var(--btn-primary-bg-disabled); color: var(--btn-disabled-fg); cursor: default; }
  /* Photo → chart flattening. Sits under the palette bar because it shapes the
     same generated design, and carries a live chart preview: the setting means
     nothing until you can see what it does to your own photo. */
  .xs-flatten {
    display: flex; align-items: center; gap: 24px; flex: 0 0 auto;
    padding: 20px 40px; background: var(--metime-white); border-bottom: 1px solid var(--metime-black);
  }
  .xs-flatten-main { flex: 1; min-width: 0; }
  .xs-flatten-title { font-family: var(--font-sans); font-size: 15px; font-weight: 500; }
  .xs-flatten-sub { margin-top: 2px; max-width: 64ch; font-size: 13px; line-height: 1.4; color: var(--warm-muted); }
  .xs-flatten-row {
    display: flex; width: fit-content; margin-top: 12px;
    border: 1px solid var(--metime-black); border-radius: 4px; overflow: hidden;
  }
  .xs-flatten-btn {
    height: 34px; padding: 0 16px; border: none; border-left: 1px solid var(--metime-black);
    background: var(--metime-white); color: var(--metime-black);
    font-family: var(--font-sans); font-size: 13px; font-weight: 500; line-height: 1;
    cursor: pointer; transition: background .12s, color .12s;
  }
  .xs-flatten-btn:first-child { border-left: none; }
  .xs-flatten-btn:hover:not(.active) { background: var(--metime-cream); }
  .xs-flatten-btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--btn-focus-ring); }
  .xs-flatten-btn.active { background: var(--ice-500); color: var(--metime-white); border-color: var(--metime-black); }
  .xs-flatten-note { margin-top: 8px; font-family: var(--font-sans); font-size: 11px; color: var(--warm-muted); }
  .xs-flatten-check {
    display: flex; align-items: baseline; gap: 8px; margin-top: 12px;
    font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; user-select: none;
  }
  .xs-flatten-check input { width: 15px; height: 15px; margin: 0; flex: 0 0 auto; accent-color: var(--color-taupe-900); cursor: pointer; }
  .xs-flatten-check-note { font-weight: 400; color: var(--warm-muted); }
  /* Sized for the photo-to-chart reveal rather than for a thumbnail. At the old
     140px a Medium Hoop chart was about one pixel per stitch, so stitches
     arriving one after another read as nothing at all; this also puts the
     smaller presets over the threshold where their counting grid is worth
     drawing (see XS_REVEAL_GRID_MIN). */
  .xs-flatten-preview {
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto; width: 264px; min-height: 264px; padding: 8px; box-sizing: border-box;
    background: var(--metime-cream); border: 1px solid var(--metime-black);
  }
  .xs-flatten-empty { font-family: var(--font-sans); font-size: 11px; line-height: 1.35; text-align: center; color: var(--warm-muted); }
  .pal-page .pal-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: auto;
    gap: 0; width: 100%; flex: 0 0 auto;
  }
  .pal-page .pal-card {
    display: grid; grid-template-columns: minmax(0, 1fr); align-content: space-between;
    align-items: stretch; width: 100%; min-height: 230px; padding: 32px; gap: 0;
    box-sizing: border-box;
    border: none; border-right: 1px solid var(--metime-black); border-bottom: 1px solid var(--metime-black);
    border-radius: 0; box-shadow: none; transform: none;
  }
  .pal-page .pal-card:hover { box-shadow: none; transform: none; }
  .pal-page .pal-card:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--btn-focus-ring); }
  .pal-page .pal-card:nth-child(4n) { border-right: none; }
  .pal-page .pal-swatches { height: auto; min-height: 48px; flex-wrap: nowrap; }
  .pal-page .pal-swatch { width: 48px; height: 48px; margin-left: -10px; flex-shrink: 0; }
  .pal-page .pal-card-body {
    display: flex; align-items: center; justify-content: space-between;
    justify-self: stretch; width: 100%; min-width: 0; gap: 12px; padding: 0;
  }
  .pal-page .pal-card-text { min-width: 0; }
  .pal-page .pal-card-name { font-size: 20px; font-weight: 500; color: var(--metime-black); }
  .pal-page .pal-card-meta { font-size: 16px; font-weight: 300; color: var(--metime-black); margin-top: 5px; }
  @media (max-width: 1080px) {
    .pal-page .pal-grid { grid-template-columns: repeat(2, 1fr); }
    .pal-page .pal-card:nth-child(4n) { border-right: 1px solid var(--metime-black); }
    .pal-page .pal-card:nth-child(2n) { border-right: none; }
  }
  @media (max-width: 900px) {
    .pal-suggest-bar { min-height: 0; padding: 16px 20px; }
    .pal-page .pal-from-image,
    .pal-page .pal-from-image-main { flex-wrap: wrap; }
    .pal-page .pal-from-image-use { margin-left: 0; }
    .pal-page .pal-card { min-height: 0; padding: 24px; }
    .xs-flatten { padding: 16px 20px; gap: 16px; }
  }
  @media (max-width: 600px) {
    .xs-flatten { flex-direction: column; align-items: stretch; }
    .xs-flatten-row { width: 100%; }
    .xs-flatten-btn { flex: 1; padding: 0 8px; }
    .xs-flatten-preview { width: 100%; }
    .pal-page .pal-grid { grid-template-columns: 1fr; }
    .pal-page .pal-card { border-right: none; }
    .pal-page .pal-card:nth-child(2n) { border-right: none; }
    .pal-page .pal-from-image-swatch,
    .pal-page .pal-from-image-add { width: 48px; height: 48px; }
    .pal-page .pal-from-image-add { border-radius: 24px; }
    .pal-page .pal-swatch { width: 48px; height: 48px; }
  }

  /* Template step — same shell as size / backing / palette. */
  .tmpl-page { display: flex; flex-direction: column; min-height: 100%; height: 100%; background: var(--metime-white); color: var(--metime-black); overflow: auto; }
  .tmpl-page .tmpl-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    width: 100%; flex: 0 0 auto;
  }
  .tmpl-page .tmpl-card {
    display: grid; grid-template-columns: minmax(0, 1fr); align-content: start;
    width: 100%; padding: 32px 36px 33px; min-width: 0; box-sizing: border-box;
    background: none; border: none; border-right: 1px solid var(--metime-black); border-bottom: 1px solid var(--metime-black);
    border-radius: 0; box-shadow: none; transform: none;
    text-align: left; font: inherit; color: inherit; cursor: pointer;
    outline: none; -webkit-appearance: none; appearance: none;
  }
  .tmpl-page .tmpl-card:nth-child(4n) { border-right: none; }
  .tmpl-page .tmpl-card:hover { box-shadow: none; transform: none; }
  .tmpl-page .tmpl-card:active { transform: none; }
  .tmpl-page .tmpl-card:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--btn-focus-ring); }
  .tmpl-page .tmpl-card-thumb {
    flex: 0 0 auto; align-self: stretch; width: 100%; min-width: 0;
    display: flex; align-items: center; justify-content: center;
    height: clamp(140px, 21.6vh, 221px); overflow: hidden; background: var(--metime-cream); padding: 0;
  }
  .tmpl-page .tmpl-card-thumb svg {
    display: block; height: 100%; width: auto; max-width: 100%;
  }
  .tmpl-page .tmpl-card-thumb.is-ratio { height: clamp(140px, 21.6vh, 221px); background: var(--metime-cream); }
  .tmpl-page .tmpl-card-thumb.is-ratio svg {
    width: auto; height: 100%; max-width: 100%;
    aspect-ratio: var(--tmpl-ar);
  }
  .tmpl-page .tmpl-card-body {
    display: flex; align-items: center; justify-content: space-between;
    align-self: stretch; width: 100%; min-width: 0;
    gap: 12px; margin-top: 24px; padding: 0;
  }
  .tmpl-page .tmpl-card-text { min-width: 0; }
  .tmpl-page .tmpl-card-name {
    display: block; font-family: var(--font-sans); font-size: 20px; font-weight: 500;
    line-height: 1.2; color: var(--metime-black); margin-bottom: 0;
  }
  .tmpl-page .tmpl-card-desc {
    display: block; font-family: var(--font-sans); font-size: 16px; font-weight: 300;
    line-height: 1.3; color: var(--metime-black); margin-top: 6px;
  }
  .tmpl-upload-bar {
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto; min-height: 0; padding: 24px;
    background: #EDF2FC; border-bottom: 1px solid var(--metime-black);
  }
  .tmpl-upload {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; cursor: default; text-align: center; gap: 16px;
  }
  .tmpl-upload-heading {
    font-family: var(--font-sans); font-size: 20px; font-weight: 500;
    line-height: normal; color: var(--metime-black);
  }
  .tmpl-upload-drop {
    display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px;
    padding: 0; border: none; background: transparent;
    cursor: pointer; text-align: left;
  }
  .tmpl-upload-drop:hover, .tmpl-upload-drop.drag { color: var(--color-taupe-700); }
  .tmpl-upload-title { font-family: var(--font-sans); font-size: 16px; font-weight: 400; line-height: 1.2; color: var(--metime-black); }
  .tmpl-upload-sub { font-family: var(--font-sans); font-size: 14px; font-weight: 400; line-height: 1.3; color: var(--metime-black); margin-top: 6px; }
  .tmpl-upload .pal-upload-pills { justify-content: center; }
  .tmpl-upload .pal-upload-url {
    width: 486px; max-width: 100%; padding: 0; background: transparent; border-radius: 0;
  }
  .tmpl-upload .pal-upload-url-row input {
    height: 40px; padding: 8px; font-size: 16px; border-color: #1F1E1D;
  }
  .tmpl-upload .pal-upload-url-row input::placeholder { color: #7D7A7A; }
  .tmpl-upload .pal-upload-url-row button { height: 40px; font-size: 14px; }
  .tmpl-upload .pal-upload-error { width: 486px; max-width: 100%; }
  .tmpl-upload-result {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    width: 100%; min-width: 0;
  }
  .tmpl-upload-file { display: flex; align-items: stretch; gap: 24px; min-width: 0; }
  .tmpl-upload-preview {
    width: 130px; height: 130px; object-fit: cover; flex-shrink: 0;
    border: 1px solid #1F1E1D; display: block; background: var(--metime-white);
  }
  .tmpl-upload-preview.is-cutout {
    object-fit: contain;
    background-color: var(--ice-100);
    background-image:
      linear-gradient(45deg, var(--ice-200) 25%, transparent 25%),
      linear-gradient(-45deg, var(--ice-200) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--ice-200) 75%),
      linear-gradient(-45deg, transparent 75%, var(--ice-200) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  }
  .tmpl-upload-file-meta { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; min-width: 0; }
  .tmpl-upload-file-name { font-family: var(--font-sans); font-size: 20px; font-weight: 500; line-height: 24px; color: var(--metime-black); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
  .tmpl-upload-file-dims { font-family: var(--font-sans); font-size: 14px; font-weight: 300; line-height: 24px; color: var(--metime-black); }
  .tmpl-upload-result .switch { gap: 16px; font-size: 16px; color: var(--metime-black); }
  .tmpl-upload-copy { flex: 1; min-width: 0; font-family: var(--font-sans); font-size: 16px; font-weight: 400; line-height: 1.3; color: var(--metime-black); }
  .tmpl-upload-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .tmpl-upload-use {
    display: inline-flex; align-items: center; justify-content: center;
    box-sizing: border-box; min-width: 128px; height: 44px; padding: 0 22px;
    border-radius: var(--pill-radius); border: var(--btn-stroke-w) solid var(--btn-stroke);
    background: var(--btn-primary-bg); color: var(--btn-primary-fg);
    font-family: var(--font-sans); font-size: 16px; font-weight: 500; line-height: 1;
    cursor: pointer;
  }
  .tmpl-upload-use:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-primary-bg-hover); }
  .tmpl-upload-use:active { background: var(--btn-primary-bg-active); border-color: var(--btn-primary-bg-active); }
  .tmpl-upload-another {
    display: inline-flex; align-items: center; justify-content: center;
    box-sizing: border-box; min-width: 128px; height: 44px; padding: 0 22px;
    background: var(--btn-secondary-bg); border: var(--btn-stroke-w) solid var(--btn-secondary-border); border-radius: var(--pill-radius);
    font-family: var(--font-sans); font-size: 16px; font-weight: 500; line-height: 1;
    color: var(--btn-secondary-fg); cursor: pointer;
  }
  .tmpl-upload-another:hover { background: var(--btn-secondary-bg-hover); }
  .tmpl-upload-another:active { background: var(--btn-secondary-bg-active); }
  .tmpl-upload-use:focus-visible, .tmpl-upload-another:focus-visible { outline: none; box-shadow: var(--btn-focus-shadow); }
  @media (max-width: 1080px) {
    .tmpl-page .tmpl-grid { grid-template-columns: repeat(2, 1fr); }
    .tmpl-page .tmpl-card:nth-child(4n) { border-right: 1px solid var(--metime-black); }
    .tmpl-page .tmpl-card:nth-child(2n) { border-right: none; }
  }
  @media (max-width: 900px) {
    .tmpl-page .tmpl-card { padding: 24px 28px; }
    .tmpl-upload-bar { min-height: 0; padding: 16px 20px; }
    .tmpl-upload { align-items: stretch; }
    .tmpl-upload-heading { text-align: left; }
    .tmpl-upload-result { flex-wrap: wrap; justify-content: flex-start; }
    .tmpl-upload-file { width: 100%; }
    .tmpl-upload-file-name { max-width: none; }
    .tmpl-upload-actions { margin-left: 0; }
    .pal-upload-drop, .tmpl-upload-drop, .pal-upload-pills { display: none; }
    .pal-upload { width: 100%; max-width: none; }
  }
  @media (max-width: 600px) {
    .tmpl-page .tmpl-grid { grid-template-columns: 1fr; }
    .tmpl-page .tmpl-card { border-right: none; }
    .tmpl-page .tmpl-card:nth-child(2n) { border-right: none; }
  }

  /* Cross-stitch editor */
  .xs-app { display: flex; flex-direction: column; height: 100vh; background: var(--metime-cream); overflow: hidden; }
  .xs-topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--metime-almost-black); background: var(--metime-cream); flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .xs-title { font-family: var(--font-display); font-size: 20px; line-height: 1; color: var(--warm-fg); }
  .xs-topbar-spacer { flex: 1; }
  .xs-ctrl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--warm-fg-2); }
  .xs-titleblock { min-width: 0; }

  /* Mobile studio chrome: one row — back, brand/title, size, Buy kit, menu.
     Must follow the base header/.xs-topbar rules to win at equal specificity. */
  @media (max-width: 900px) {
    .app > header { grid-template-columns: auto minmax(0, 1fr) auto; padding: 10px 12px; gap: 8px; }
    .app > header .header-center { min-width: 0; }
    .app > header .preset-pill { max-width: 100%; }
    .app > header .header-right { gap: 6px; }
    .xs-topbar { gap: 8px; padding: 10px 12px; }
    .xs-topbar-spacer { flex: 1 1 0; min-width: 0; }
    .xs-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .xs-topbar .preset-pill { flex: 0 1 auto; min-width: 0; }
    .app > header .btn-dark, .xs-topbar .btn-dark { padding-left: 12px; padding-right: 12px; }
  }
  @media (max-width: 600px) {
    .xs-titleblock { display: none; }
  }
  @media (max-width: 420px) {
    :is(.app > header, .xs-topbar) .preset-pill { padding-left: 12px; padding-right: 10px; }
    :is(.app > header, .xs-topbar) .preset-pill .preset-dim { display: none; }
    .buy-kit-price { display: none; }
  }

  /* Mobile studio menu (StudioMenu) */
  .studio-menu-btn { width: 40px; height: 40px; flex-shrink: 0; }
  .studio-menu-btn[aria-expanded="true"] { background: var(--btn-tool-hover); }
  .studio-menu { padding: 6px 0; }

  /* Palette selector page */
  .pal-body { max-width: none; }
  /* Setup-step intro — heading row carries the top-right skip (Figma 2151:266) */
  .pal-head-row { display: flex; align-items: center; gap: 16px; }
  .pal-head-row .proj-heading { flex: 1; min-width: 0; margin-bottom: 0; }
  .pal-head-row + .proj-subheading { margin-top: 6px; }
  .pal-body .proj-subheading { font-size: 14px; font-weight: 400; color: #3D4E70; }
  .pal-section { margin-bottom: 36px; }
  .pal-section-head { margin-bottom: 14px; }
  /* Palette-step section labels — Söhne Kräftig 20 / Buch 13 (Figma 2151:261) */
  .pal-section-title { font-size: 20px; font-weight: 500; letter-spacing: 0; color: #000000; }
  .pal-section-sub { font-size: 13px; font-weight: 400; color: #3D4E70; margin-top: 3px; }
  /* Even rows that divide both 6 (DMC) and 12 (Kona) sample counts:
     6 / 4 / 3 / 2 columns. minmax(0,1fr) lets cards share space equally and grow. */
  .pal-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: 1fr;
    gap: 14px;
    width: 100%;
  }
  @media (min-width: 1800px) {
    .pal-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  @media (max-width: 1200px) {
    .pal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .pal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 480px) {
    .pal-grid { grid-template-columns: 1fr; }
  }
  /* Sample palette card — Figma metime design system node 2151:47.
     Sized for up to 8 overlapping 32px swatches plus padding.
     Box border #707F87; swatch stroke = 1pt inset black @ 50%. */
  .pal-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; height: 100%; min-width: 0; box-sizing: border-box;
    padding: 16px 12px 12px; background: var(--metime-white);
    border: 1px solid #707F87; border-radius: 4px;
    cursor: pointer; transition: box-shadow 0.15s, transform 0.12s;
    text-align: left; font: inherit; color: inherit;
  }
  .pal-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.13); transform: translateY(-2px); }
  .pal-card:active { transform: translateY(0); }
  .pal-card.selected { box-shadow: 0 0 0 2px #707F87; }
  .pal-swatches { display: flex; align-items: center; height: 32px; width: 100%; }
  .pal-swatch {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    border: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
    box-sizing: border-box; margin-left: -6px; display: block; position: relative;
  }
  .pal-swatch:first-child { margin-left: 0; }
  .pal-card-body { padding: 10px 0 0; min-width: 0; width: 100%; }
  /* Figma: Söhne Kräftig 14 / Buch 13 */
  .pal-card-name { font-size: 14px; font-weight: 500; color: #000000; line-height: normal; }
  .pal-card-meta { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; margin-top: 4px; }

  /* Upload */
  .pal-upload {
    display: flex; flex-direction: column; align-items: stretch; gap: 10px;
    text-align: left; cursor: default; width: 50%; max-width: 100%; box-sizing: border-box;
  }
  .pal-upload-drop {
    display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px;
    border: 1px dashed #707F87; border-radius: 4px; padding: 10px 14px; text-align: left;
    cursor: pointer; transition: border-color 0.15s, background 0.15s;

  .pal-upload-drop:hover, .pal-upload-drop.drag { border-color: var(--metime-almost-black); background: var(--warm-hover); }

  .pal-upload-sub { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; margin-top: 4px; }

  .pal-upload-hit:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .pal-upload-add { align-self: flex-start; }
