function AuthProvider({ children }) {
  const [user, setUser] = useState(undefined);
  const [authOpen, setAuthOpen] = useState(false);
  const [libraryTick, setLibraryTick] = useState(0);
  const [lastSaved, setLastSaved] = useState(null);
  // Normally settled on the first render, since supabase-js is a synchronous
  // <script> in <head>. It's state rather than a constant so that a slow or
  // late-arriving client can still switch accounts on instead of disabling
  // them for the rest of the page's life.
  const [cloudEnabled, setCloudEnabled] = useState(supabaseConfigured);
  // The one case worth complaining about: real keys, no client.
  const [cloudBlocked, setCloudBlocked] = useState(false);

  const bumpLibrary = useCallback(() => setLibraryTick(t => t + 1), []);

  // Keys are filled in but the global isn't here. Look again for a few seconds,
  // then give up and let the UI say so — falling back to local-only saves in
  // silence is what makes a correctly configured studio look broken. A studio
  // with no keys at all never gets here and is never nagged.
  useEffect(() => {
    if (cloudEnabled || !supabaseKeysPresent()) return;
    const recheck = () => {
      if (!supabaseConfigured()) return false;
      setCloudEnabled(true);
      setCloudBlocked(false);
      return true;
    };
    const poll = setInterval(() => { if (recheck()) clearInterval(poll); }, 250);
    const giveUp = setTimeout(() => {
      clearInterval(poll);
      if (!recheck()) { setCloudBlocked(true); warnSupabaseUnreachable(); }
    }, SUPABASE_LOAD_GRACE_MS);
    return () => { clearInterval(poll); clearTimeout(giveUp); };
  }, [cloudEnabled]);

  const hydrate = useCallback(async (keep) => {
    if (!cloudEnabled) { bumpLibrary(); return; }
    const records = await listCloudDesigns();
    hydrateLocalLibrary(records, keep);
    bumpLibrary();
  }, [bumpLibrary, cloudEnabled]);

  // Everything that has to happen the moment a session exists, in order:
  // claim this device's local designs, finish the save that triggered sign-in,
  // then rebuild the on-device cache from the account. Claiming has to come
  // before hydrating, which overwrites that cache.
  const syncAccount = useCallback(async (account) => {
    if (!account || !cloudEnabled) return;
    let keep = [];
    try {
      const pending = readPendingSave();
      const claim = await claimLocalDesigns(account.id, pending && pending.record && pending.record.id);
      keep = claim.keep;
    } catch (e) {
      console.warn("Could not claim this device's designs:", e);
    }
    try {
      const flushed = await flushPendingSave();
      if (flushed) setLastSaved(flushed);
    } catch (e) {
      console.warn("Could not finish saving after sign-in:", e);
    }
    try {
      await hydrate(keep);
    } catch (e) {
      console.warn("Could not load saved designs:", e);
    }
  }, [hydrate, cloudEnabled]);

  const completeAuth = useCallback(async (nextUser) => {
    setUser(nextUser);
    setAuthOpen(false);
    await syncAccount(nextUser);
  }, [syncAccount]);

  const signOut = useCallback(async () => {
    await logoutUser();
    setUser(null);
    setLastSaved(null);
    // The cache belongs to the account that just left; the designs themselves
    // are safe in Supabase and come back on the next sign-in, anywhere.
    persistSavedQuilts([]);
    persistSavedStitches([]);
    persistSavedPunch([]);
    bumpLibrary();
  }, [bumpLibrary]);

  useEffect(() => {
    if (!cloudEnabled) { setUser(null); return; }
    let cancelled = false;
    (async () => {
      // supabase-js restores (and refreshes) the stored session, which is what
      // makes a returning visit already signed in.
      const me = await fetchMe();
      if (cancelled) return;
      setUser(me);
      if (me) await syncAccount(me);
    })();
    return () => { cancelled = true; };
  }, [syncAccount, cloudEnabled]);

  // Keeps the chip honest if the session ends outside this tab — signing out in
  // another tab, or a refresh token that can no longer be renewed.
  useEffect(() => {
    const client = sb();
    if (!client) return;
    const { data } = client.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") setUser(null);
      else if (session && session.user) setUser(toStudioUser(session.user));
    });
    return () => { if (data && data.subscription) data.subscription.unsubscribe(); };
  }, [cloudEnabled]);

  const value = {
    user: user === undefined ? null : user,
    userReady: user !== undefined,
    // False when Supabase isn't configured: no account wall, no cloud sync, and
    // the on-device library behaves the way it did before accounts existed.
    cloudEnabled,
    // Configured, but the client never showed up — the save UI explains itself
    // instead of pretending nothing happened.
    cloudBlocked,
    // Whether the saved-design drawers should be readable/writable right now.
    libraryOn: !cloudEnabled || !!user,
    authOpen,
    openAuth: () => setAuthOpen(true),
    closeAuth: () => setAuthOpen(false),
    completeAuth,
    signOut,
    libraryTick,
    lastSaved,
    consumeLastSaved: () => setLastSaved(null),
    hydrate,
  };

  return (
    <AuthContext.Provider value={value}>
      {children}
      <AuthOverlay/>
    </AuthContext.Provider>
  );
}

// metime's wiggle: the thread mark carried under the wordmark. Built from
// alternating quadratic arcs rather than shipped as a fixed file so one

// ── Setup: templates + shared photo uploader ───────────────────────────────
// Split a length into `n` near-equal integer segments → [[start,size],…].
function tplSegments(total, n) {
  const segs = []; let acc = 0;
  for (let i = 0; i < n; i++) {
    const size = Math.round(total * (i + 1) / n) - Math.round(total * i / n);
    segs.push([acc, size]); acc += size;
  }
  return segs;
}
// How many "patches" a quilt pattern tiles into, scaled to the grid.
function tplPatchCount(cols, rows) {
  const unit = Math.max(2, Math.round(Math.min(cols, rows) / 8));
  return { nx: Math.max(2, Math.round(cols / unit)), ny: Math.max(2, Math.round(rows / unit)) };
}
const tplKona = n => konaByName(n) || KONA[0];
// The colors a layout will actually sew with: the whole chosen palette when
// there is one, otherwise the named Kona defaults that belong to that chart.
// Cycling the whole list — not just the first two — is what keeps a six-color
// palette from collapsing into the same navy-and-white two-tone on every card.
function tplSwatches(palette, fallbacks) {
  if (palette && palette.length) return palette;
  return fallbacks.map(tplKona);
}
function tplTriPoints(s) {
  const { r, c, w, h } = s;
  if (s.dir === '/') return s.half === 'a'
    ? `${c},${r} ${c + w},${r} ${c},${r + h}`
    : `${c + w},${r} ${c + w},${r + h} ${c},${r + h}`;
  return s.half === 'a'
    ? `${c},${r} ${c + w},${r} ${c + w},${r + h}`
    : `${c},${r} ${c},${r + h} ${c + w},${r + h}`;
}

// Lily's Quilt, a 10×12 baby-blanket plaid: ground bands ('g') crossed by
// vertical ('v') and horizontal ('h') stripes, each crossing its own fabric.
// Sizes are in blocks. The repeat (all but the closing ground band) tiles about
// once per Lily-sized span, so a throw gets more plaid rather than bigger
// patches. Every band keeps at least one block and only the wide bands stretch
// or shrink to fit, because a band rounded away merges its neighbours into one
// stripe. → [[start, size, role], …]
const LILY_COLS = [[1, 'g'], [1, 'v'], [1, 'g'], [3, 'v'], [1, 'g'], [2, 'v'], [1, 'g']];
const LILY_ROWS = [[1, 'g'], [2, 'h'], [1, 'g'], [2, 'h'], [1, 'g'], [2, 'h'], [1, 'g'], [1, 'h'], [1, 'g']];
function lilyBands(bands, total, native) {
  const repeats = Math.max(1, Math.round(total / native));
  const seq = [];
  for (let i = 0; i < repeats; i++) seq.push(...bands.slice(0, -1));
  seq.push(bands[bands.length - 1]);
  // Too small for the full band set (coasters): one-block windowpane.
  if (total < seq.length) {
    const stripe = bands.find(([, role]) => role !== 'g')[1];
    return Array.from({ length: total }, (_, i) => [i, 1, i % 2 ? stripe : 'g']);
  }
  const extra = total - seq.length;
  const wide = seq.reduce((s, [n]) => s + n - 1, 0) || 1;
  const out = [];
  let start = 0, acc = 0;
  for (const [n, role] of seq) {
    const before = Math.round(extra * acc / wide);
    acc += n - 1;
    const size = 1 + Math.round(extra * acc / wide) - before;
    out.push([start, size, role]);
    start += size;
  }
  return out;
}

// Size-adaptive quilt starter layouts. build({cols,rows,palette}) → shapes[]
// (same shape objects the editor paints), so they tile/scale to any chosen
// preset. When `palette` (the colors picked on the palette step) is supplied,
// each layout colors its patches from it; otherwise it uses sensible defaults.
// There's no "Blank" card in the grid — "Skip for now" is the empty-canvas route.
const QUILT_TEMPLATES = [
  {
    id: 'checkerboard', name: 'Checkerboard', desc: 'Alternating squares in two or more fabrics.',
    build: ({ cols, rows, palette }) => {
      // One fabric holds the even squares so it still reads as a checker; the
      // odd squares walk the rest of the palette, which is how a scrappy
      // postage-stamp quilt shows every fabric without losing the grid.
      const colors = tplSwatches(palette, ['Bone', 'Hyacinth', 'Spice', 'Zucchini', 'Flame', 'Lilac']);
      const ground = colors[0];
      const prints = colors.length > 1 ? colors.slice(1) : colors;
      const { nx, ny } = tplPatchCount(cols, rows);
      const sx = tplSegments(cols, nx), sy = tplSegments(rows, ny), out = [];
      sy.forEach(([r, h], ri) => sx.forEach(([c, w], ci) => {
        if (w <= 0 || h <= 0) return;
        const color = (ri + ci) % 2 === 0 ? ground : prints[(ri * 3 + ci) % prints.length];
        out.push({ id: `tpl-${ri}-${ci}`, r, c, w, h, type: 'square', color });
      }));
      return out;
    }
  },
  {
    id: 'plaid', name: 'Plaid', desc: 'Wide and narrow stripes that cross like a woven plaid.',
    build: ({ cols, rows, palette }) => {
      // Ground, one vertical stripe, then (stripe, crossing) pairs for the
      // horizontal bands. Extra palette colors become extra pairs, so a longer
      // palette varies the rows instead of being dropped; a short one lets the
      // crossings fall back to the vertical stripe so it still reads as plaid.
      // The lightest color takes the ground: palettes aren't ordered light to
      // dark, and the plaid only reads when the stripes sit on something pale.
      const swatches = tplSwatches(palette, ['Natural', 'Mustard', 'Creamsicle', 'Terracotta', 'Dusty Blue', 'Tarragon']);
      const lum = c => { const n = parseInt(c.hex.slice(1), 16); return 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255); };
      const ground = swatches.reduce((a, b) => (lum(b) > lum(a) ? b : a));
      const colors = [ground, ...swatches.filter(c => c !== ground)];
      const vert = colors[1] || ground;
      const pairs = [];
      for (let i = 2; i < colors.length; i += 2) pairs.push([colors[i], colors[i + 1] || vert]);
      if (!pairs.length) pairs.push([vert, vert]);
      const xs = lilyBands(LILY_COLS, cols, 10), ys = lilyBands(LILY_ROWS, rows, 12), out = [];
      let stripe = -1;
      ys.forEach(([r, h, rowRole], ri) => {
        if (rowRole === 'h') stripe++;
        const [band, cross] = pairs[Math.max(0, stripe) % pairs.length];
        xs.forEach(([c, w, colRole], ci) => {
          const color = rowRole === 'h' ? (colRole === 'v' ? cross : band) : (colRole === 'v' ? vert : ground);
          out.push({ id: `tpl-${ri}-${ci}`, r, c, w, h, type: 'square', color });
        });
      });
      return out;
    }
  },
  {
    id: 'ninepatch', name: 'Nine-Patch', desc: 'Classic 3×3 blocks in mixed fabrics.',
    build: ({ cols, rows, palette }) => {
      // Ground on the four side-centers, a different print on each corner of
      // the 3×3, and a third on the middle — the usual nine-patch roles, but
      // the prints keep moving so neighbouring blocks don't match.
      const colors = tplSwatches(palette, ['Natural', 'Rich Red', 'Butterscotch', 'Hyacinth', 'Palm', 'Wine']);
      const ground = colors[0];
      const prints = colors.length > 1 ? colors.slice(1) : colors;
      const { nx, ny } = tplPatchCount(cols, rows);
      const sx = tplSegments(cols, nx), sy = tplSegments(rows, ny), out = [];
      sy.forEach(([r, h], ri) => sx.forEach(([c, w], ci) => {
        if (w <= 0 || h <= 0) return;
        const br = ri % 3, bc = ci % 3;
        const corner = br % 2 === 0 && bc % 2 === 0;
        const center = br === 1 && bc === 1;
        let color = ground;
        if (center) color = prints[0];
        else if (corner) color = prints[1 + ((Math.floor(ri / 3) * 2 + Math.floor(ci / 3) + br + bc) % Math.max(1, prints.length - 1))];
        out.push({ id: `tpl-${ri}-${ci}`, r, c, w, h, type: 'square', color });
      }));
      return out;
    }
  },
  {
    id: 'railfence', name: 'Rail Fence', desc: 'Strips that alternate direction by block.',
    build: ({ cols, rows, palette }) => {
      const rails = tplSwatches(palette, ['Butterscotch', 'Dresden Blue', 'Terracotta', 'Peach', 'Hyacinth', 'Zucchini']);
      // Weave in fours even when the palette is longer — a six-wide group on a
      // twelve-patch thumb is one flip, and the fence stops reading as woven.
      const group = Math.min(4, rails.length);
      const { nx, ny } = tplPatchCount(cols, rows);
      const sx = tplSegments(cols, nx), sy = tplSegments(rows, ny), out = [];
      sy.forEach(([r, h], ri) => sx.forEach(([c, w], ci) => {

// the block's majority instead. Repeated, lone stitches melt into the shapes
// around them while any edge with real weight behind it stays put. Bare fabric
// votes like any other color, so the silhouette gets tidied too. Cells outside
// the fitted motif abstain — the margin must not eat into the design.
function xsMajorityPass(grid, W, H, fit) {
  const out = grid.slice(), votes = new Map();
  const x1 = fit.dx + fit.dw, y1 = fit.dy + fit.dh;
  for (let y = fit.dy; y < y1; y++) {
    for (let x = fit.dx; x < x1; x++) {
      votes.clear();
      const self = grid[y * W + x];
      for (let dy = -1; dy <= 1; dy++) {
        const ny = y + dy; if (ny < fit.dy || ny >= y1) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx; if (nx < fit.dx || nx >= x1) continue;
          const k = grid[ny * W + nx];
          // The centre counts double, so an even split keeps what is there.
          votes.set(k, (votes.get(k) || 0) + (dx || dy ? 1 : 2));
        }
      }
      let best = self, bn = votes.get(self) || 0;
      for (const [k, n] of votes) if (n > bn) { bn = n; best = k; }
      out[y * W + x] = best;
    }
  }
  return out;
}

// Absorb islands smaller than `min` stitches into whichever color surrounds
// them most. A three-stitch fleck of its own shade reads as dirt on the chart
// rather than as detail, and costs a thread start and finish to work.
function xsDespeckle(grid, W, H, fit, min) {
  if (min < 2) return;
  const x1 = fit.dx + fit.dw, y1 = fit.dy + fit.dh;
  const seen = new Uint8Array(W * H);
  for (let sy = fit.dy; sy < y1; sy++) {
    for (let sx = fit.dx; sx < x1; sx++) {
      const start = sy * W + sx;
      if (seen[start]) continue;
      const hex = grid[start], region = [start], edge = new Map();
      seen[start] = 1;
      for (let qi = 0; qi < region.length; qi++) {
        const i = region[qi], x = i % W, y = (i - x) / W;
        for (let d = 0; d < 4; d++) {
          const nx = x + (d === 0 ? -1 : d === 1 ? 1 : 0), ny = y + (d === 2 ? -1 : d === 3 ? 1 : 0);
          if (nx < fit.dx || ny < fit.dy || nx >= x1 || ny >= y1) continue;
          const j = ny * W + nx;
          if (grid[j] === hex) { if (!seen[j]) { seen[j] = 1; region.push(j); } }
          else edge.set(grid[j], (edge.get(grid[j]) || 0) + 1);
        }
      }
      if (region.length >= min || !edge.size) continue;
      let best = null, bn = 0;
      for (const [k, n] of edge) if (n > bn) { bn = n; best = k; }
      for (const i of region) grid[i] = best;
    }
  }
}

// Strip the background off a chart that's already been flattened. xsClearGroundField
// only handles a motif exported on ONE flat field, which a photograph never has:
// a strawberry on a tablecloth, a bird against a sky. But by the time the chart
// has been flattened the background is usually down to one or two palette
// colors, so it can be taken the same way — whatever the border ring is mostly
// made of, flooded inward, so a matching color deep inside the subject stays.
//
// Colors are matched with a little slack rather than exactly, so a shade of
// noise along the way doesn't wall the flood off. Anything that fails (a
// close-cropped portrait, where the border IS the subject) rolls back rather
// than handing over a chart with holes punched in it.
const XS_BG_BORDER_SHARE = 0.14;  // share of the border ring to count as background
const XS_BG_MAX_COLORS = 3;       // at most this many colors read as background
const XS_BG_TOL = 40;             // RGB distance still flooded through
const XS_BG_CENTER_MAX = 0.5;     // ...but only if the middle is this much clearer of it
function xsClearEdgeBackground(grid, W, H, fit) {
  const x1 = fit.dx + fit.dw, y1 = fit.dy + fit.dh;
  const ring = [];
  for (let x = fit.dx; x < x1; x++) { ring.push(fit.dy * W + x, (y1 - 1) * W + x); }
  for (let y = fit.dy + 1; y < y1 - 1; y++) { ring.push(y * W + fit.dx, y * W + x1 - 1); }
  const tally = new Map();
  for (const i of ring) if (grid[i]) tally.set(grid[i], (tally.get(grid[i]) || 0) + 1);
  // Crowding the border isn't enough on its own: a cream tablecloth around a
  // cream-mounted hoop is the same color in both places, and a flood that can't
  // tell them apart walks straight through the subject. So a color also has to
  // be scarce in the middle of the motif to be believed as background.
  const mid = new Map();
  const mx0 = fit.dx + Math.floor(fit.dw * 0.25), mx1 = fit.dx + Math.ceil(fit.dw * 0.75);
  const my0 = fit.dy + Math.floor(fit.dh * 0.25), my1 = fit.dy + Math.ceil(fit.dh * 0.75);
  for (let y = my0; y < my1; y++) for (let x = mx0; x < mx1; x++) {
    const v = grid[y * W + x];
    if (v) mid.set(v, (mid.get(v) || 0) + 1);
  }
  const midArea = Math.max(1, (mx1 - mx0) * (my1 - my0));
  const bgHex = [...tally.entries()]
    .filter(([hex, n]) => n >= ring.length * XS_BG_BORDER_SHARE
      && (mid.get(hex) || 0) / midArea <= (n / ring.length) * XS_BG_CENTER_MAX)
    .sort((a, b) => b[1] - a[1]).slice(0, XS_BG_MAX_COLORS).map(([hex]) => hexToRgb(hex));
  if (!bgHex.length) return;
  // A chart only ever holds palette colors, so each one is judged once.
  const verdict = new Map();
  const isBg = hex => {
    if (!hex) return true;                       // already bare fabric — flood through it
    let v = verdict.get(hex);
    if (v === undefined) {
      const c = hexToRgb(hex);
      v = bgHex.some(k => (c.r - k.r) ** 2 + (c.g - k.g) ** 2 + (c.b - k.b) ** 2 <= XS_BG_TOL * XS_BG_TOL);
      verdict.set(hex, v);
    }
    return v;
  };
  const before = grid.slice(), stack = [];
  let cleared = 0;
  const push = (x, y) => {
    if (x < fit.dx || y < fit.dy || x >= x1 || y >= y1) return;
    const i = y * W + x;
    if (grid[i] === null || !isBg(grid[i])) return;
    grid[i] = null; cleared++; stack.push(i);
  };
  for (const i of ring) push(i % W, Math.floor(i / W));
  while (stack.length) {
    const i = stack.pop(), x = i % W, y = (i - x) / W;
    push(x - 1, y); push(x + 1, y); push(x, y - 1); push(x, y + 1);
  }
  if (cleared > fit.dw * fit.dh * XS_FIELD_MAX_CLEAR) for (let i = 0; i < grid.length; i++) grid[i] = before[i];
}

// Sample an <img> into a W×H grid, snapping each cell to the nearest chosen
// color → a ready-to-stitch design (shared by the cross-stitch template step).
// Cells outside the fitted motif are left null: unstitched fabric.
function buildGridFromImage(img, chosen, W, H, { simplify = XS_SIMPLIFY_DEFAULT, removeBg = true } = {}) {
  if (!img || !chosen || !chosen.length) return null;
  const fit = xsFitImageToGrid(img, W, H);
  if (!fit) return null;
  const sampled = xsSampleCells(img, fit, W, H);
  if (!sampled) return null;
  const spec = xsSimplifySpec(simplify);
  // A 40-stitch coaster can't take the blur a 120-stitch hoop can — three
  // passes there would erase the subject — so both knobs scale with the motif.
  const passes = Math.min(spec.blur, Math.max(0, Math.round(Math.min(fit.dw, fit.dh) / 22)));
  const speck = Math.round(spec.speck * (fit.dw * fit.dh) / (70 * 70));
  const soft = xsBlurCells(sampled.rgb, sampled.cover, W, H, passes);
  const bg = xsTrimRect(img).bg;
  const grid = new Array(W * H).fill(null);
  const isField = bg ? new Uint8Array(W * H) : null;
  for (let i = 0; i < W * H; i++) {
    if (sampled.cover[i] < 0.4) continue;
    if (bg) {
      // Read the field off the UNBLURRED sample: blurring bleeds the subject
      // into the margin, and a border cell that no longer matches the field
      // would strand the flood fill and leave the whole ground stitched.
      const dr = sampled.rgb[i * 3] - bg.r, dg = sampled.rgb[i * 3 + 1] - bg.g, db = sampled.rgb[i * 3 + 2] - bg.b;
      if (dr * dr + dg * dg + db * db <= XS_TRIM_TOL * XS_TRIM_TOL) isField[i] = 1;
    }
    const near = nearestInList({ r: soft[i * 3], g: soft[i * 3 + 1], b: soft[i * 3 + 2] }, chosen);
    grid[i] = near ? near.hex : null;
  }
  // Clear the ground before tidying, so the fringe left along the silhouette
  // has bare fabric to be absorbed into.
  if (bg && removeBg) xsClearGroundField(grid, isField, W, H, fit);
  let out = grid;
  for (let p = 0; p < spec.smooth; p++) out = xsMajorityPass(out, W, H, fit);
  // A photograph's background only reads as one color once the chart has been
  // flattened, so this waits until after the smoothing passes — then one more
  // pass tidies the silhouette the flood just cut.
  if (removeBg) {
    xsClearEdgeBackground(out, W, H, fit);
    if (spec.smooth) out = xsMajorityPass(out, W, H, fit);
  }
  xsDespeckle(out, W, H, fit, speck);
  return out;
}

// Shared image intake: file picker, drag-and-drop, clipboard paste, and http(s)
// URL. Always resolves to a same-origin data URL so canvas sampling
// (extractColors / sampleImageHex) works the same as a chosen file.
function isHttpImageUrl(value) {
  try {
    const u = new URL(String(value || '').trim());
    return u.protocol === 'http:' || u.protocol === 'https:';
  } catch (e) { return false; }
}

function fileNameFromUrl(value) {
  try {
    const path = new URL(String(value || '').trim()).pathname.split('/').pop();
    if (path) return decodeURIComponent(path);
  } catch (e) {}
  return 'image';
}

function imageFileFromClipboard(e) {
  const dt = e.clipboardData;
  if (!dt) return null;
  if (dt.files && dt.files.length) {
    for (let i = 0; i < dt.files.length; i++) {
      if (dt.files[i].type && dt.files[i].type.startsWith('image/')) return dt.files[i];
    }
  }
  if (dt.items) {
    for (let i = 0; i < dt.items.length; i++) {
      const it = dt.items[i];
      if (it.kind === 'file' && it.type && it.type.startsWith('image/')) {
        const f = it.getAsFile();
        if (f) return f;
      }
    }
  }
  return null;
}

function plainTextFromClipboard(e) {
  try { return (e.clipboardData && e.clipboardData.getData('text/plain')) || ''; }
  catch (err) { return ''; }
}

function readBlobAsDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => resolve(ev.target.result);
    reader.onerror = () => reject(new Error('Could not read that image.'));
    reader.readAsDataURL(blob);
  });
}

function confirmImageSrc(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(src);
    img.onerror = () => reject(new Error('That URL does not look like an image.'));
    img.src = src;
  });
}

const REMOTE_IMAGE_ERR = "Couldn't load that image. Check the URL, or the site may block it. Try saving the file and dropping it instead.";
const REMOTE_CORS_ERR = "Couldn't read that image (the site blocks it). Try saving the file and dropping it instead.";

function loadImageViaElement(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const cv = document.createElement('canvas');
        cv.width = img.naturalWidth || img.width;
        cv.height = img.naturalHeight || img.height;
        if (!cv.width || !cv.height) { reject(new Error('That URL does not look like an image.')); return; }
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0);
        resolve(cv.toDataURL('image/png'));
      } catch (e) {
        reject(new Error(REMOTE_CORS_ERR));
      }
    };
    img.onerror = () => reject(new Error(REMOTE_IMAGE_ERR));
    img.src = url;
  });
}

function loadRemoteImageSrc(url) {
  const trimmed = String(url || '').trim();
  return fetch(trimmed, { mode: 'cors' })
    .then(res => {
      if (!res.ok) throw new Error('http');
      const ct = ((res.headers.get('content-type') || '').split(';')[0] || '').trim();
      if (ct && !ct.startsWith('image/') && ct !== 'application/octet-stream') throw new Error('not-image');
      return res.blob();
    })
    .then(blob => {
      if (blob.type && !blob.type.startsWith('image/') && blob.type !== 'application/octet-stream') {
        throw new Error('not-image');
      }
      return readBlobAsDataUrl(blob).then(confirmImageSrc);
    })
    .catch(err => {
      if (err && err.message === 'not-image') {
        return Promise.reject(new Error('That URL does not look like an image.'));
      }
      return loadImageViaElement(trimmed);
    });
}

const PASTE_SHORTCUT = (typeof navigator !== 'undefined' && /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || ''))
  ? '⌘V'
  : 'Ctrl+V';

// Knock the edge-connected field off a photo so "Remove background" is a real
// cutout, not just a later chart setting. Floods from the border so a matching
// color inside the subject stays. Returns a PNG data URL, or null if nothing
// is safe to punch (busy photograph, already transparent, or a near-empty result).
const PUNCH_TOL = 38;
const PUNCH_MAX_CLEAR = 0.92;
const PUNCH_MIN_CLEAR = 0.02;
function punchImageBackground(img, { maxDim = 720 } = {}) {
  if (!img || !img.width || !img.height) return null;
  const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  let id; try { id = ctx.getImageData(0, 0, w, h); } catch (e) { return null; }
  const data = id.data, n = w * h;
  const buckets = new Map();
  const addBorder = i => {
    const k = data[i * 4 + 3] < 32 ? 'clear'
      : `${data[i * 4] >> 4},${data[i * 4 + 1] >> 4},${data[i * 4 + 2] >> 4}`;
    buckets.set(k, (buckets.get(k) || 0) + 1);
  };
  for (let x = 0; x < w; x++) { addBorder(x); addBorder((h - 1) * w + x); }
  for (let y = 1; y < h - 1; y++) { addBorder(y * w); addBorder(y * w + w - 1); }
  const borderN = [...buckets.values()].reduce((a, b) => a + b, 0);
  if (!borderN) return null;
  const clearShare = (buckets.get('clear') || 0) / borderN;
  if (clearShare >= 0.6) return null;
  const mid = new Map();
  const mx0 = Math.floor(w * 0.25), mx1 = Math.ceil(w * 0.75);
  const my0 = Math.floor(h * 0.25), my1 = Math.ceil(h * 0.75);
  const midArea = Math.max(1, (mx1 - mx0) * (my1 - my0));
  for (let y = my0; y < my1; y++) {
    for (let x = mx0; x < mx1; x++) {
      const p = (y * w + x) * 4;
      if (data[p + 3] < 32) continue;
      const k = `${data[p] >> 4},${data[p + 1] >> 4},${data[p + 2] >> 4}`;
      mid.set(k, (mid.get(k) || 0) + 1);
    }
  }
  const field = [...buckets.entries()]
    .filter(([k, c]) => k !== 'clear'
      && c / borderN >= 0.12
      && (mid.get(k) || 0) / midArea <= (c / borderN) * 0.5)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([k]) => {
      const [r, g, b] = k.split(',').map(Number);
      return { r: r * 16 + 8, g: g * 16 + 8, b: b * 16 + 8 };
    });
  if (!field.length) return null;
  const tol = PUNCH_TOL * PUNCH_TOL;
  const isField = i => {
    if (data[i * 4 + 3] < 32) return true;
    return field.some(c => {
      const dr = data[i * 4] - c.r, dg = data[i * 4 + 1] - c.g, db = data[i * 4 + 2] - c.b;
      return dr * dr + dg * dg + db * db <= tol;
    });
  };
  const seen = new Uint8Array(n), stack = [];
  const push = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const i = y * w + x;
    if (seen[i] || !isField(i)) return;
    seen[i] = 1; stack.push(i);
  };
  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
  for (let y = 1; y < h - 1; y++) { push(0, y); push(w - 1, y); }
  while (stack.length) {
    const i = stack.pop(), x = i % w, y = (i - x) / w;
    push(x - 1, y); push(x + 1, y); push(x, y - 1); push(x, y + 1);
  }
  let cleared = 0;
  for (let i = 0; i < n; i++) if (seen[i] && data[i * 4 + 3] >= 32) cleared++;
  const opaque = n * (1 - clearShare);
  if (cleared < opaque * PUNCH_MIN_CLEAR || cleared > opaque * PUNCH_MAX_CLEAR) return null;
  for (let i = 0; i < n; i++) if (seen[i]) data[i * 4 + 3] = 0;
  const soft = PUNCH_TOL * 1.6, soft2 = soft * soft;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (seen[i] || data[i * 4 + 3] < 32) continue;
      if (!((x > 0 && seen[i - 1]) || (x < w - 1 && seen[i + 1])
        || (y > 0 && seen[i - w]) || (y < h - 1 && seen[i + w]))) continue;
      let best = Infinity;
      for (const c of field) {
        const dr = data[i * 4] - c.r, dg = data[i * 4 + 1] - c.g, db = data[i * 4 + 2] - c.b;
        const d = dr * dr + dg * dg + db * db;
        if (d < best) best = d;
      }
      if (best < soft2) data[i * 4 + 3] = Math.round(data[i * 4 + 3] * (best / soft2));
    }
  }
  ctx.putImageData(id, 0, 0);
  return cv.toDataURL('image/png');
}

// Drop zone + optional URL field used by PhotoDrop and PhotoUpload so paste/URL
// land in one place. Calls onSrc(dataUrl) — same path as a chosen file.
// Desktop: slim dashed drop row + pills. Mobile: "+ add image" opens a sheet.
// `utility` is the brand shell's compact form: one row of label + source
// buttons, with the whole strip still acting as the drop target. Same handlers
// and same sources as the other variants — only the layout differs.
function PhotoIntakeZone({ variant = 'pal', title, subtitle, onSrc, working = false, workingLabel, extra }) {
  const isMobile = useIsMobile();
  const [drag, setDrag] = useState(false);
  const [error, setError] = useState('');
  const [urlText, setUrlText] = useState('');
  const [showUrl, setShowUrl] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [loading, setLoading] = useState(false);
  const fileRef = useRef(null);
  const cameraRef = useRef(null);
  const urlRef = useRef(null);
  const urlId = useId();
  const busy = loading || working;
  const shownTitle = busy
    ? ((working && workingLabel) ? workingLabel : 'Loading…')
    : (variant === 'tmpl' ? 'Drop an image in this area, or' : 'Drop an image here');
  const ariaLabel = title || shownTitle;
  const isUtility = variant === 'utility';
  const heading = variant === 'tmpl' ? 'Create a design from an image' : null;
  // The utility strip reuses the tmpl drop/pill boxes (and its whole-strip drop
  // handlers), so it counts as `isTmpl` for everything except the heading.
  const isTmpl = variant === 'tmpl' || isUtility;

  const closeMenu = useCallback(() => {
    setMenuOpen(false);
    setShowUrl(false);
    setUrlText('');
    setError('');
  }, []);

  const acceptFile = useCallback(file => {
    if (!file || !file.type || !file.type.startsWith('image/')) {
      setError('Please choose a JPG, PNG, or WebP image.');
      return;
    }
    setError('');
    setShowUrl(false);
    setUrlText('');
    setLoading(true);
    const reader = new FileReader();
    reader.onload = ev => {
      setLoading(false);
      setError('');
      setMenuOpen(false);
      onSrc(ev.target.result, { name: file.name || 'image' });
    };
    reader.onerror = () => { setLoading(false); setError('Could not read that file.'); };
    reader.readAsDataURL(file);
  }, [onSrc]);

  const acceptUrl = useCallback(raw => {
    const url = String(raw || '').trim();
    setUrlText(url);
    setShowUrl(true);
    if (isMobile) setMenuOpen(true);
    if (!isHttpImageUrl(url)) {
      setError('Enter an http(s) image URL.');
      return;
    }
    setError('');
    setLoading(true);
    loadRemoteImageSrc(url)
      .then(src => { setLoading(false); setError(''); setMenuOpen(false); setShowUrl(false); setUrlText(''); onSrc(src, { name: fileNameFromUrl(url) }); })
      .catch(err => { setLoading(false); setError((err && err.message) || REMOTE_IMAGE_ERR); });
  }, [onSrc, isMobile]);

  useEffect(() => {
    const onPaste = e => {
      const file = imageFileFromClipboard(e);
      if (file) { e.preventDefault(); acceptFile(file); return; }
      const target = e.target;
      const tag = target && target.tagName;
      const isField = tag === 'INPUT' || tag === 'TEXTAREA' || (target && target.isContentEditable);
      const isOurs = target && target.closest && target.closest('.pal-upload-url');
      if (isField && !isOurs) return;
      const text = plainTextFromClipboard(e);
      if (text && isHttpImageUrl(text)) {
        e.preventDefault();
        acceptUrl(text);
      }
    };
    document.addEventListener('paste', onPaste);
    return () => document.removeEventListener('paste', onPaste);
  }, [acceptFile, acceptUrl]);

  useEffect(() => {
    if (showUrl && urlRef.current) urlRef.current.focus();
  }, [showUrl]);

  const onDrop = e => {
    e.preventDefault();
    setDrag(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file && file.type && file.type.startsWith('image/')) { acceptFile(file); return; }
    const text = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain') || '').split('\n')[0].trim();
    if (isHttpImageUrl(text)) acceptUrl(text);
  };

  const onFileChange = e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    acceptFile(file);
  };
  const openPicker = () => { if (fileRef.current) fileRef.current.click(); };
  const openCamera = () => { if (cameraRef.current) cameraRef.current.click(); };
  const onHitKey = e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPicker(); }
  };
  const toggleUrlField = () => {
    setShowUrl(open => {
      if (open) setError('');
      return !open;
    });
  };
  const pasteImageFromClipboard = () => {
    if (!navigator.clipboard || typeof navigator.clipboard.read !== 'function') {
      setError(`Press ${PASTE_SHORTCUT} to paste an image.`);
      return;
    }
    navigator.clipboard.read().then(items => {
      for (const item of items) {
        const type = (item.types || []).find(t => t.startsWith('image/'));
        if (!type) continue;
        return item.getType(type).then(blob => {
          const ext = (type.split('/')[1] || 'png').split('+')[0];
          acceptFile(new File([blob], `pasted.${ext}`, { type: blob.type || type }));
        });
      }
      setError(`Press ${PASTE_SHORTCUT} to paste an image.`);
    }).catch(() => {
      setError(`Press ${PASTE_SHORTCUT} to paste an image.`);
    });
  };

  const urlRow = showUrl ? (

  const methodBtn = (key, icon, label, sub, onClick, pressed) => (

  const menu = menuOpen ? (

      sheetClassName="pal-upload-sheet">

        {methodBtn('camera', <IcCamera size={20}/>, 'Take a photo', 'Use your camera.', openCamera)}
        {methodBtn('files', <IcImage size={20}/>, 'Choose from your photos', 'Camera roll or files.', openPicker)}
        {methodBtn('paste', <IcPaste size={20}/>, 'Paste from clipboard', 'Whatever you last copied.', pasteImageFromClipboard)}
        <div className="pal-upload-method-block">
          {methodBtn('url', <IcLink size={20}/>, 'Use an image link', 'Paste a URL to an image.', toggleUrlField, showUrl)}

  if (isUtility) {

        <div className="brand-utility-sub">

    if (isMobile) {

// Reusable photo → palette uploader. Manages its own file/extraction state and
// reports the kept colors + image (+ any option toggles) via onApply. Used by
// the quilt palette page (Kona) and the cross-stitch template page (DMC).
function PhotoUpload({ nearest, idKey = 'name', paletteSize = 8, count = 32, applyLabel = 'Use these colors', hint, options = [], onApply }) {
  const [imgSrc, setImgSrc] = useState(null);
  const [extracted, setExtracted] = useState(null);
  const [pool, setPool] = useState([]);
  const [locked, setLocked] = useState(() => new Set());
  const [busy, setBusy] = useState(false);
  const [opts, setOpts] = useState(() => { const o = {}; options.forEach(d => o[d.key] = d.default ?? false); return o; });
  const imgElRef = useRef(null);
  const idOf = c => c[idKey];

  const ingestSrc = useCallback(src => {
    setBusy(true);
    const img = new Image();
    img.onload = () => {
      imgElRef.current = img;
      const maxDim = 160, scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
      let pixels; try { pixels = ctx.getImageData(0, 0, w, h); } catch (e) { setBusy(false); return; }
      const raw = extractColors(pixels, count), seen = new Set(), colors = [];
      for (const c of raw) { const k = nearest(c); if (k && !seen.has(k[idKey])) { seen.add(k[idKey]); colors.push(k); } }
      setImgSrc(src); setPool(colors); setLocked(new Set());
      setExtracted(colors.slice(0, Math.min(paletteSize, colors.length))); setBusy(false);
    };
    img.onerror = () => setBusy(false);
    img.src = src;
  }, [nearest, idKey, paletteSize, count]);

  const toggleLock = useCallback(id => { setLocked(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }); }, []);
  const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const regenerate = useCallback(() => {
    if (!pool.length) return;
    setExtracted(prev => {
      if (!prev) return prev;
      const lk = new Set(prev.filter(c => locked.has(idOf(c))).map(idOf));
      const fill = shuffle(pool.filter(c => !lk.has(idOf(c)))); let fi = 0;
      return prev.map(c => lk.has(idOf(c)) ? c : (fill[fi++] || c));
    });
  }, [pool, locked]);
  const resetUpload = () => { setImgSrc(null); setExtracted(null); setPool([]); setLocked(new Set()); imgElRef.current = null; };
  const apply = () => {
    if (!extracted || !extracted.length) return;
    const kept = extracted.filter(c => locked.has(idOf(c)));
    const chosen = kept.length ? kept : extracted;
    onApply(chosen, { imgSrc, imgEl: imgElRef.current, options: opts });
  };

  return (
    <section className="pal-section">
      <div className="pal-section-head">
        <div className="pal-section-title">Upload an image</div>
        {hint && <div className="pal-section-sub">{hint}</div>}
      </div>
      {!extracted && (
        <PhotoIntakeZone
          title="Drop an image here or click to browse"
          subtitle="JPG, PNG, or WebP, or paste an image"
          onSrc={ingestSrc}
          working={busy}
          workingLabel="Reading colors…"/>
      )}
      {extracted && (
        <div className="pal-result">
          <img className="pal-result-preview" src={imgSrc} alt="Uploaded reference"/>
          <div className="pal-result-main">
            <div className="pal-section-sub" style={{ marginBottom: 6 }}>{extracted.length} colors found. Check the ones you want to keep (they stay when you regenerate and are the only colors added). Leave all unchecked to use them all.</div>
            <div className="pal-result-swatches">
              {extracted.map(c => {
                const isLocked = locked.has(idOf(c));
                return (
                  <label key={idOf(c)} className={`pal-chip${isLocked ? ' locked' : ''}`} title={c.code ? `DMC ${c.code} · ${c.name}` : `${c.name} ${c.hex}`}>
                    <input type="checkbox" className="pal-chip-check" checked={isLocked} onChange={() => toggleLock(idOf(c))}/>
                    <span className="pal-chip-color" style={{ background: c.hex }}/>
                    <span className="pal-chip-label">{c.code ? `${c.code} ${c.name}` : c.name}</span>
                  </label>
                );
              })}
            </div>
            {options.map(d => (
              <label key={d.key} className="pal-check">
                <input type="checkbox" checked={!!opts[d.key]} onChange={e => setOpts(o => ({ ...o, [d.key]: e.target.checked }))}/>
                {d.label}
              </label>
            ))}
            <div className="pal-actions">
              <button className="pal-btn" onClick={apply}>{applyLabel}</button>
              {pool.length > 1 && (
                <button className="pal-btn secondary" onClick={regenerate} title="Shuffle the palette">
                  <IcShuffle/>
                  Regenerate
                </button>
              )}
              <button className="pal-btn secondary" onClick={resetUpload}>Choose another</button>
            </div>
          </div>
        </div>
      )}
    </section>
  );
}

// Upload-only photo picker for the cross-stitch template step. It just captures
// the image (as a data URL) and hands it forward — NO color extraction here.
// All color work (suggested palette, swapping) happens on the palette step.
function PhotoDrop({ hint, resultHint, useLabel = 'Use this photo', onChoose, layout, extra }) {
  const [imgSrc, setImgSrc] = useState(null);
  const [fileName, setFileName] = useState('image');
  const [fileDims, setFileDims] = useState(null);
  const [removeBg, setRemoveBg] = useState(true);
  const [cutoutSrc, setCutoutSrc] = useState(null);
  const punchGen = useRef(0);
  const ingestSrc = useCallback((src, meta) => {
    const gen = ++punchGen.current;
    setImgSrc(src);
    setFileName((meta && meta.name) || 'image');
    setFileDims(null);
    setCutoutSrc(null);
    const img = new Image();
    img.onload = () => {
      if (gen !== punchGen.current) return;
      setFileDims({ w: img.naturalWidth, h: img.naturalHeight });
      requestAnimationFrame(() => {
        if (gen !== punchGen.current) return;
        setCutoutSrc(punchImageBackground(img));
      });
    };
    img.src = src;
  }, []);
  const reset = () => {
    punchGen.current++;
    setImgSrc(null); setFileName('image'); setFileDims(null); setRemoveBg(true); setCutoutSrc(null);
  };
  const resultCopy = resultHint || "We'll suggest a palette from this photo on the next step and use it to guide your design.";
  const displaySrc = removeBg && cutoutSrc ? cutoutSrc : imgSrc;
  const confirm = () => onChoose(displaySrc || imgSrc, { removeBg, name: fileName });
  // Brand shell: one compact strip. Empty state offers the sources; once an
  // image is in, the same strip becomes the confirm row. Same actions as the
  // `bar` layout, just folded into a single line of furniture.
  if (layout === 'utility') {
    return (
      <section className="brand-utility brand-bleed">
        {!imgSrc ? (
          <PhotoIntakeZone
            variant="utility"
            title="Start from your own image"
            subtitle={hint}
            extra={extra}
            onSrc={ingestSrc}/>
        ) : (
          <div className="brand-utility-result">
            <img className={`tmpl-upload-preview${removeBg && cutoutSrc ? ' is-cutout' : ''}`}
              src={displaySrc} alt="Uploaded reference"/>
            <div className="brand-utility-result-meta">
              <div className="tmpl-upload-file-name">{fileName}</div>
              <BrandSpecs rows={[{ k: 'Source', v: fileDims ? `${fileDims.w} × ${fileDims.h} px` : null }]}/>
              <Switch checked={removeBg} onChange={setRemoveBg} label="Remove background"/>
            </div>
            <div className="brand-utility-actions">
              <button type="button" className="tmpl-upload-use" onClick={confirm}>{useLabel}</button>
              <button type="button" className="tmpl-upload-another" onClick={reset}>Choose another</button>
            </div>
          </div>
        )}
      </section>
    );
  }
  if (layout === 'bar') {
    return (
      <section className="tmpl-upload-bar">
        {!imgSrc ? (
          <PhotoIntakeZone
            variant="tmpl"
            title="Drop an image in this area, or"
            subtitle={hint || 'JPG, PNG, or WebP, or paste an image'}
            onSrc={ingestSrc}/>
        ) : (
          <div className="tmpl-upload-result">
            <div className="tmpl-upload-file">
              <img className={`tmpl-upload-preview${removeBg && cutoutSrc ? ' is-cutout' : ''}`}
                src={displaySrc} alt="Uploaded reference"/>
              <div className="tmpl-upload-file-meta">
                <div>
                  <div className="tmpl-upload-file-name">{fileName}</div>
                  <div className="tmpl-upload-file-dims">{fileDims ? `${fileDims.w}px × ${fileDims.h}px` : ''}</div>
                </div>
                <Switch checked={removeBg} onChange={setRemoveBg} label="Remove background"/>
              </div>
            </div>
            <div className="tmpl-upload-actions">
              <button type="button" className="tmpl-upload-use" onClick={confirm}>{useLabel}</button>
              <button type="button" className="tmpl-upload-another" onClick={reset}>Choose another</button>
            </div>
          </div>
        )}
      </section>
    );
  }
  return (
    <section className="pal-section">
      <div className="pal-section-head">
        <div className="pal-section-title">Upload a photo</div>
        {hint && <div className="pal-section-sub">{hint}</div>}
      </div>
      {!imgSrc ? (
        <PhotoIntakeZone
          title="Drop a photo here or click to browse"
          subtitle="JPG, PNG, or WebP, or paste an image"
          onSrc={ingestSrc}/>
      ) : (
        <div className="pal-result">
          <img className="pal-result-preview" src={imgSrc} alt="Uploaded reference"/>
          <div className="pal-result-main">
            <div className="pal-section-sub" style={{ marginBottom: 12 }}>{resultCopy}</div>
            <div className="pal-actions">
              <button className="pal-btn" onClick={() => onChoose(imgSrc)}>{useLabel}</button>
              <button className="pal-btn secondary" onClick={reset}>Choose another</button>
            </div>
          </div>
        </div>
      )}
    </section>
  );
}

// Thumbnails render the actual template output (built at a small size). When a
// palette is supplied it previews the template in those colors, matching what
// the studio will build when the template is selected.
function QuiltTemplateThumb({ tpl, preset, palette }) {
  const cols = 12, rows = Math.max(4, Math.round(12 * (preset.h / preset.w)));
  const shapes = useMemo(() => tpl.build({ cols, rows, palette }), [tpl, cols, rows, palette]);
  return (
    <svg viewBox={`0 0 ${cols} ${rows}`} width="100%" preserveAspectRatio="xMidYMid meet" style={{ display: 'block', background: 'var(--metime-cream)' }}>
      <rect width={cols} height={rows} fill="var(--metime-cream)"/>
      {shapes.map((s, i) => s.type === 'tri'
        ? <polygon key={i} points={tplTriPoints(s)} fill={s.color.hex}/>
        : <rect key={i} x={s.c} y={s.r} width={s.w} height={s.h} fill={s.color.hex}/>)}
      <rect width={cols} height={rows} fill="none" stroke="rgba(0,0,0,0.12)" strokeWidth="0.1"/>
    </svg>
  );
}
function StitchTemplateThumb({ tpl, preset }) {
  // Preview at (roughly) the real stitch resolution so detailed image-derived
  // charts stay legible — capped so huge canvases don't render 14k+ SVG rects.
  const w = Math.min(90, preset.w), h = Math.max(4, Math.round(w * (preset.h / preset.w)));
  const grid = useMemo(() => tpl.build({ w, h }), [tpl, w, h]);
  // A set template builds a mosaic of all four coasters, so the card is bigger
  // than the canvas that was asked for.
  const out = tpl.outSize ? tpl.outSize({ w, h }) : { w, h };
  return (
    <svg viewBox={`0 0 ${out.w} ${out.h}`} width="100%" preserveAspectRatio="xMidYMid meet" style={{ display: 'block' }}>
      {grid.map((hex, i) => hex ? <rect key={i} x={i % out.w} y={Math.floor(i / out.w)} width={1} height={1} fill={hex}/> : null)}
      <rect width={out.w} height={out.h} fill="none" stroke="rgba(0,0,0,0.12)" strokeWidth="0.08"/>
    </svg>
  );
}

// Quilt template step (template-only; the photo uploader lives on the palette page).
function TemplateSelector({ preset, palette, onChoose, onSkip, onBack }) {
  const p = PRESETS.find(x => x.name === preset) || PRESETS[0];
  return (
    <TemplateStep
      title="Choose a starting point"
        eyebrow={<BrandEyebrow step={4} label={`Quilting · Step 4 of ${BRAND_STEPS.quilt}`}/>}

}

// Grid-craft template step: pick a template OR upload a photo. No color
// selection here — the photo is carried forward and all color work (suggested
// palette from the photo, sample palettes) happens on the next (palette) step.
function CrossStitchTemplateSelector({ preset, onChoose, onSkip, onBack, craft = 'cross-stitch' }) {
  const cfg = CRAFT_STUDIO[craft];
  const craftLabel = BRAND_CRAFT_LABEL[craft] || cfg.label;
  const uploadNode = (
    <PhotoDrop
      layout="utility"
      hint="JPG, PNG or WebP. We'll suggest a palette from it on the next step."
      onChoose={(imgSrc, extras) => onChoose({ template: null, photo: imgSrc, removeBg: !extras || extras.removeBg !== false })}/>
  );
  return (
    <TemplateStep
      title="Choose a starting point"
      eyebrow={<BrandEyebrow step={2} label={`${craftLabel} · Step 2 of ${BRAND_STEPS[craft] || 3}`}/>}
      sub={`A chart to build on, your own image, or a blank canvas. Every ${cfg.unit} stays editable in the studio.`}
      footNote={`${craftLabel} · ${preset.name}`}
      onBack={onBack}
      templates={stitchTemplatesFor(preset, craft)}
      renderThumb={t => <StitchTemplateThumb tpl={t} preset={preset}/>}
      metaOf={t => [
        // A set's w/h span the whole mosaic; what the maker stitches is one
        // panel, four times over, so that's what the card quotes.
        t.set
          ? { k: 'Chart', v: `${t.set.w} × ${t.set.h} ${cfg.unitPlural} · set of ${t.set.cols * t.set.rows}` }
          : { k: 'Chart', v: t.w > 0 && t.h > 0 ? `${t.w} × ${t.h} ${cfg.unitPlural}` : null },
      ]}
      uploadNode={uploadNode}
      onChoose={t => onChoose({ template: t, photo: null })}
      onSkip={onSkip}/>
  );
}

// ── Quilt: backing fabric step ─────────────────────────────────────────────
// Ruby Star Society backing fabrics for the quilt "Pick a backing fabric" step.
// HOW IMAGES ARE SOURCED: full-res swatches live under
// assets/fabrics/<collection>/<file>.jpg. Compact 256px thumbs (used by the
// grid, hex sample, and palette extract) live under assets/fabrics-thumbs/ —
// regenerate with `npm run gen:fabric-thumbs`. The list of collections and files
// is generated into assets/fabrics-manifest.js (window.RSS_COLLECTIONS) — see the
// banner in that file for how to regenerate. Each collection carries `cats`
// (theme filters) which every flattened fabric inherits.
// Any card whose image fails to load hides itself (see FabricCard's onError), so
// a broken/missing asset never leaves a broken image or breaks the page.
// TO ADD OR EDIT FABRICS: drop images into assets/fabrics/<collection>/ and
// regenerate the manifest (do not hand-edit the flattened list below).
const FABRIC_CATEGORIES = [
  { id: 'top',      label: 'Top fabrics' },
  { id: 'simple',   label: 'Simple' },
  { id: 'florals',  label: 'Florals' },
  { id: 'animals',  label: 'Animals' },
  { id: 'food',     label: 'Food' },
  { id: 'nature',   label: 'Nature' },
  { id: 'holidays', label: 'Holidays' },
  { id: 'novelty',  label: 'Novelty' },
];
const TOP_FABRIC_LIMIT = 16;
const RUBY_STAR_FABRICS = (window.RSS_COLLECTIONS || []).flatMap(c =>
  c.files.map(f => ({
    name: c.label,
    collection: c.slug,
    cats: c.cats,
    // filenames contain spaces — encode so the URL resolves
    image: encodeURI(`assets/fabrics/${c.slug}/${f}`),
    // Compact 256px JPEG for the grid / hex sample / palette extract
    // (generated by tools/gen-fabric-thumbs.mjs). Falls back to full image
    // if a thumb is missing.
    thumb: encodeURI(`assets/fabrics-thumbs/${c.slug}/${f}`),
  }))
);
// Curated "Top fabrics" row: one swatch from each collection, first 16.
// Placeholder until we have a real featured list.
function pickTopFabrics(list, limit) {
  const seen = new Set(), picks = [];
  for (const f of list) {
    if (seen.has(f.collection)) continue;
    seen.add(f.collection);
    picks.push(f);
    if (picks.length === limit) return picks;
  }
  for (const f of list) {
    if (picks.includes(f)) continue;
    picks.push(f);
    if (picks.length === limit) break;
  }
  return picks;
}
const TOP_FABRICS = pickTopFabrics(RUBY_STAR_FABRICS, TOP_FABRIC_LIMIT);

// Compact 256px JPEG sibling of a full-res fabric URL, or null for uploads /
// data URLs. Lets older saved quilts (no `backing.thumb`) still hit the
// thumbnails generated by tools/gen-fabric-thumbs.mjs.
function fabricThumbFor(image) {
  if (!image || typeof image !== 'string' || image.startsWith('data:')) return null;
  const marker = 'assets/fabrics/';
  const i = image.indexOf(marker);
  if (i === -1 || image.indexOf('assets/fabrics-thumbs/') !== -1) return null;
  return image.slice(0, i) + 'assets/fabrics-thumbs/' + image.slice(i + marker.length);
}

// Average a representative hex color from a loaded image. Draws to a small
// offscreen canvas and averages the visible pixels; guards against canvas taint
// (cross-origin images without CORS headers) with try/catch, falling back to a
// neutral hex so a chosen backing always yields a usable color.
function sampleImageHex(img) {
  try {
    const maxDim = 48, scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 125) continue; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
    if (!n) return '#C9BFB2';
    return rgbToHex(r / n, g / n, b / n);
  } catch (e) { return '#C9BFB2'; }
}

// Load a fabric image, sample a representative hex, and emit the backing
// record `{ name, hex, image, thumb }`. Prefer the compact thumb for sampling
// so we don't re-decode a multi‑MB print just to average a 48px canvas.
function chooseBackingFromImage(name, image, thumb, onChoose) {
  const src = thumb || image;
  const img = new Image();
  img.onload = () => onChoose({ name, hex: sampleImageHex(img), image, thumb: thumb || image });
  img.onerror = () => onChoose({ name, hex: '#C9BFB2', image, thumb: thumb || image });
  img.src = src;
}

function fabricFullSrc(fabric) {
  if (!fabric) return null;
  return fabric.image || fabric.thumb || fabricThumbFor(fabric.image) || null;
}

// Full-res (or hex) enlarge overlay. `onUse` turns it into a confirm step when
// choosing; omit it for inspect-only (current backing in the studio). Pass
// `fabrics` (the visible category) to page through neighbors without closing.
function FabricEnlargeOverlay({ fabric, fabrics, onClose, onUse, useLabel = 'Use this fabric' }) {
  const list = (fabrics && fabrics.length) ? fabrics : (fabric ? [fabric] : []);
  const start = Math.max(0, list.findIndex(f => fabric && (f.image === fabric.image || f === fabric)));
  const [idx, setIdx] = useState(start);
  useEffect(() => { setIdx(start); }, [start]);
  const current = list[idx] || fabric;
  const canSlide = list.length > 1;
  const step = dir => setIdx(i => (i + dir + list.length) % list.length);

  useEffect(() => {
    if (!canSlide) return undefined;
    const onKey = e => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [canSlide, list.length]);

  useEffect(() => {
    if (!canSlide) return;
    [list[(idx + 1) % list.length], list[(idx - 1 + list.length) % list.length]].forEach(f => {
      const preload = fabricFullSrc(f);
      if (preload) { const img = new Image(); img.src = preload; }
    });
  }, [idx, canSlide, list]);

  if (!current) return null;
  const src = fabricFullSrc(current);
  return (
    <div className="overlay overlay-lift" onClick={onClose}>
      <div className="fabric-enlarge" onClick={e => e.stopPropagation()}>
        <div className="fabric-enlarge-head">
          <div className="fabric-enlarge-name">{current.name}</div>
          {canSlide && <div className="fabric-enlarge-count">{idx + 1} of {list.length}</div>}
          <button type="button" onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--warm-muted)',display:'flex'}} aria-label="Close"><IcX/></button>
        </div>
        <div className="fabric-enlarge-stage">
          {canSlide && (
            <button type="button" className="fabric-enlarge-nav is-prev" onClick={() => step(-1)} aria-label="Previous fabric">
              <IcCaretL/>
            </button>
          )}
          {src
            ? <img className="fabric-enlarge-img" src={src} alt={current.name}/>
            : <div className="fabric-enlarge-swatch" style={{ background: current.hex || '#C9BFB2' }}/>}
          {canSlide && (
            <button type="button" className="fabric-enlarge-nav is-next" onClick={() => step(1)} aria-label="Next fabric">
              <IcCaretR/>
            </button>
          )}
        </div>
        {onUse && (
          <div className="fabric-enlarge-actions">
            <button type="button" className="btn" onClick={onClose}>Cancel</button>
            <button type="button" className="btn btn-dark" onClick={() => onUse(current)}>{useLabel}</button>
          </div>
        )}
      </div>
    </div>
  );
}

// A single fabric swatch card. Compact (image-only, name in tooltip) so the grid
// can stay dense. Hides itself if its image can't load so a broken/missing asset
// never leaves an empty broken-image box on the page.
function FabricCard({ fab, onChoose, selected, eager }) {
  const [hidden, setHidden] = useState(false);
  if (hidden) return null;
  return (
    <button className={`fabric-card${selected ? ' selected' : ''}`} onClick={() => onChoose(fab)} title={`Use "${fab.name}"`}>
      <img className="fabric-thumb" src={fab.thumb || fab.image} alt={fab.name}
        loading={eager ? "eager" : "lazy"} decoding="async" fetchPriority={eager ? "high" : "low"}
        onError={e => {
          // Prefer thumb; if it's missing, fall back to the full image once.
          if (fab.thumb && e.currentTarget.src.indexOf('fabrics-thumbs') !== -1) {
            e.currentTarget.src = fab.image;
            return;
          }
          setHidden(true);
        }}/>
    </button>
  );
}

// Shared catalog: filters + Ruby Star grid + optional upload. Used by the setup
// step and the in-studio backing overlay so there's only one picker UI.
function BackingFabricPicker({ onPickFab, onPickUpload, current, uploadHint, uploadResultHint, layout = 'compact', showUpload = true }) {
  const [cat, setCat] = useState('top');
  const cats = useMemo(() => FABRIC_CATEGORIES.filter(c =>
    c.id === 'top' || RUBY_STAR_FABRICS.some(f => f.cats.includes(c.id))
  ), []);
  const shown = useMemo(() => {
    if (cat === 'top') return TOP_FABRICS;
    return RUBY_STAR_FABRICS.filter(f => f.cats.includes(cat));
  }, [cat]);
  const page = layout === 'page';
  return (
    <>
      <div className={`${page ? 'back-filters' : 'fabric-filters'} pills-ice`} role="tablist" aria-label="Fabric category">
        {cats.map(c => (
          <button
            key={c.id}
            type="button"
            role="tab"
            aria-selected={cat === c.id}
            className={`fabric-filter filter-pill${cat === c.id ? ' active' : ''}`}
            onClick={() => setCat(c.id)}>
            {c.label}
          </button>
        ))}
      </div>
      <div className={page ? 'back-grid' : 'fabric-grid'}>
        {shown.map((f, i) => (
          <FabricCard
            key={`${f.image}-${i}`}
            fab={f}
            eager={i < 8}
            selected={!!(current && current.image === f.image)}
            onChoose={fab => onPickFab(fab, shown)}/>
        ))}
      </div>
      {showUpload && (
        <PhotoDrop
          hint={uploadHint}
          resultHint={uploadResultHint}
          onChoose={onPickUpload}/>
      )}
    </>
  );
}

// Quilt backing-fabric step: pick a Ruby Star print or upload your own fabric.
// Whatever is chosen is loaded, a representative hex is sampled, and we emit
// { name, hex, image } — the palette step then pulls a Kona palette from it.
function QuiltBackingSelector({ preset, onChoose, onSkip, onBack }) {
  // Local swatches are same-origin, so no crossOrigin needed — sampleImageHex
  // can read the pixels and the palette step gets a real auto-suggestion.
  const [inspect, setInspect] = useState(null);
  const apply = (name, image, thumb) => chooseBackingFromImage(name, image, thumb, onChoose);
  return (
    <div className="back-page brand-shell">
      <BrandNav/>
      <BrandHead
        tone="cream"
        back={<BrandBack onBack={onBack}/>}
        actions={<button type="button" className="back-skip" onClick={onSkip}>Skip for now</button>}
        eyebrow={<BrandEyebrow step={2} label={`Quilting · Step 2 of ${BRAND_STEPS.quilt}`}/>}
        title="Pick a backing fabric"
        wide
        sub="It also seeds the palette we suggest on the next step, so pick something you like the colors of."/>
      <BackingFabricPicker
        layout="page"
        showUpload={false}
        onPickFab={(fab, list) => setInspect({ fabric: fab, fabrics: list })}
        onPickUpload={imgSrc => apply('Your fabric', imgSrc)}/>
      <BrandFooter note="Quilting · backing fabric"/>
      {inspect && (
        <FabricEnlargeOverlay
          fabric={inspect.fabric}
          fabrics={inspect.fabrics}
          onClose={() => setInspect(null)}
          onUse={fab => apply(fab.name, fab.image, fab.thumb)}/>
      )}
    </div>
  );
}

// Suggested palettes extracted from a fabric swatch / photo cap out here.
const SUGGESTED_PALETTE_MAX = 6;
// Cross stitch shades with more flosses, so it keeps its own (larger) cap.
const CROSS_STITCH_PALETTE_MAX = 10;

// Suggested palette from an image (Figma 2138:2019). Circles remove on click;
// on touch, first tap arms (shows ×) and second tap deletes. + opens the picker.
function ImagePaletteEditor({ photo, alt, colors, colorKey, titleOf, onRemove, onAdd, onUse, onPreviewClick, useLabel = 'Use this palette', maxColors = SUGGESTED_PALETTE_MAX, layout = 'card' }) {
  const isMobile = useIsMobile();
  const [armedIdx, setArmedIdx] = useState(null);
  const addRef = useRef(null);
  const bar = layout === 'bar';
  const reduced = usePrefersReducedMotion();

  // The suggested colors are all known at once, but they land one after another
  // so the palette reads as something lifted out of the photo. A single shot:
  // once the row is up, `risen` sits at Infinity and every swatch is simply
  // present — otherwise removing one would send the rest away and bring them
  // back, and a swatch added later would never arrive at all.
  const [risen, setRisen] = useState(0);
  useEffect(() => {
    const n = colors.length;
    if (reduced || !n) { setRisen(Infinity); return undefined; }
    let i = 0;
    const id = setInterval(() => {
      i += 1;
      setRisen(i >= n ? Infinity : i);
      if (i >= n) clearInterval(id);
    }, XS_SWATCH_STAGGER_MS);
    return () => clearInterval(id);
  }, []);

  useEffect(() => { setArmedIdx(null); }, [colors.length]);
  useEffect(() => {
    if (armedIdx === null) return undefined;
    const onDoc = e => {
      if (e.target.closest && e.target.closest('.pal-from-image-swatch')) return;
      setArmedIdx(null);
    };
    document.addEventListener('pointerdown', onDoc);
    return () => document.removeEventListener('pointerdown', onDoc);
  }, [armedIdx]);

  const onSwatchClick = i => {
    if (isMobile) {
      if (armedIdx === i) { onRemove(i); setArmedIdx(null); }
      else setArmedIdx(i);
      return;
    }
    onRemove(i);
  };

  const preview = <img className="pal-from-image-preview" src={photo} alt={alt}/>;

  return (
    <div className="pal-from-image">
      {onPreviewClick
        ? <button type="button" className="pal-from-image-preview-btn" onClick={onPreviewClick} title="View fabric large" aria-label={`View ${alt} large`}>{preview}</button>
        : preview}
      <div className="pal-from-image-main">
        <div className="pal-from-image-swatches">
          {colors.map((c, i) => (
            <button
              key={`${colorKey(c)}-${i}`}
              type="button"
              className={`pal-from-image-swatch${armedIdx === i ? ' armed' : ''}${i < risen ? '' : ' rising'}`}
              style={{ background: c.hex }}
              title={titleOf(c)}
              aria-label={isMobile && armedIdx === i ? `Remove ${titleOf(c)}` : titleOf(c)}
              onClick={() => onSwatchClick(i)}>
              <span className="pal-from-image-x" aria-hidden="true"><IcX/></span>
            </button>
          ))}
          {colors.length < maxColors && (
            <button
              ref={addRef}
              type="button"
              className="pal-from-image-add"
              title="Add a color"
              aria-label="Add a color"
              onClick={() => onAdd(addRef)}>
              {bar ? <IcPlus size={24}/> : '+'}
            </button>
          )}
        </div>
        <button type="button" className={bar ? 'pal-from-image-use' : 'btn btn-dark pal-from-image-use'} disabled={!colors.length} onClick={onUse}>
          {useLabel}
        </button>
      </div>
    </div>
  );
}

// ── Quilt: palette selector ────────────────────────────────────────────────
// Mirrors CrossStitchPaletteSelector. Backing was chosen on the previous step;
// if it carries an image we extract an editable suggested Kona palette from it
// (remove/add via KonaPicker). Sample palettes remain available. Returns
// ONLY the palette (backing is already set upstream).
function PaletteSelector({ presetName, backing, onChoose, onSkip, onBack }) {
  const samples = useMemo(() => SUGGESTED_PALETTES.map(p => ({ name: p.name, colors: resolvePalette(p) })), []);
  // Prefer the compact thumb for extract + preview (full-res only for uploads
  // that have no thumb, or older saves without one).
  const photo = backing && (backing.thumb || fabricThumbFor(backing.image) || backing.image);
  const [sugg, setSugg] = useState([]);
  const [ready, setReady] = useState(!photo);
  const [swapIdx, setSwapIdx] = useState(null);
  const [inspect, setInspect] = useState(false);
  const swapAnchor = useRef(null);

  useEffect(() => {
    if (!photo) { setSugg([]); setReady(true); return; }
    let cancelled = false;
    setReady(false);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (cancelled) return;
      const maxDim = 160, scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
      let pixels; try { pixels = ctx.getImageData(0, 0, w, h); } catch (e) { setReady(true); return; }
      const raw = extractColors(pixels, 24), seen = new Set(), colors = [];
      for (const c of raw) { const k = nearestKona(c); if (k && !seen.has(k.name)) { seen.add(k.name); colors.push(k); } }
      setSugg(colors.slice(0, SUGGESTED_PALETTE_MAX));
      setReady(true);
    };
    img.onerror = () => setReady(true);
    img.src = photo;
    return () => { cancelled = true; };
  }, [photo]);

  const pickSwap = c => setSugg(prev => { const n = [...prev]; if (swapIdx >= n.length) n.push(c); else n[swapIdx] = c; return n; });
  const removeAt = i => setSugg(prev => prev.filter((_, j) => j !== i));

  return (
    <div className="pal-page brand-shell">
      <BrandNav/>
      <BrandHead
        tone="lilac"
        wide
        back={<BrandBack onBack={onBack}/>}
        actions={<button type="button" className="back-skip" onClick={onSkip}>Skip for now</button>}
        eyebrow={<BrandEyebrow step={3} label={`Quilting · Step 3 of ${BRAND_STEPS.quilt}`}/>}
        title="Find your palette."
        sub="Every swatch here is a real Kona cotton we can cut for you."/>
      {photo && (
        <BrandSection
          title="Your backing"
          note="Lifted from the fabric you picked. Tap a color to drop it.">
          {!ready ? (
            <div className="pal-busy">Reading colors from your fabric…</div>
          ) : (
            <div className="pal-suggest-bar">
              <ImagePaletteEditor
                layout="bar"
                photo={photo}
                alt="Your backing fabric"
                colors={sugg}
                colorKey={c => c.name}
                titleOf={c => c.name}
                onRemove={removeAt}
                onAdd={ref => { swapAnchor.current = ref.current; setSwapIdx(sugg.length); }}
                onUse={() => onChoose(sugg)}
                onPreviewClick={fabricFullSrc(backing) ? () => setInspect(true) : undefined}/>
            </div>
          )}
        </BrandSection>
      )}
      <BrandSection
        title={photo ? 'Or start from a suggested palette' : 'Suggested palettes'}
        note="Curated Kona cottons that work together. You can change any of them in the studio."/>

function GridSizeThumb({ preset, craft }) {
  const theme = (GRID_SIZE_THEMES[craft] || {})[preset.name] || { c1:"#2C3E50", c2:"#EDF2FC" };
  if (/hoop/i.test(preset.name)) {
    return (
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="92" fill={theme.c2} stroke={theme.c1} strokeWidth="12"/>
      </svg>
    );
  }
  const aspect = preset.h / preset.w;
  const W = 200, H = Math.max(40, Math.round(W * aspect));
  const cellSize = W / 5;
  const cols = Math.ceil(W / cellSize);
  const rows = Math.ceil(H / cellSize);
  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      cells.push(
        <rect key={`${r}-${c}`}
          x={c * cellSize} y={r * cellSize}
          width={cellSize} height={cellSize}
          fill={(r + c) % 2 === 0 ? theme.c1 : theme.c2}/>
      );
    }
  }
  return (
    <svg viewBox={`0 0 ${W} ${H}`} xmlns="http://www.w3.org/2000/svg">
      {cells}
      <rect width={W} height={H} fill="none" stroke="rgba(0,0,0,0.15)" strokeWidth="1"/>
    </svg>
  );
}

      setSugg(colors.slice(0, cfg.paletteMax));

  },

const XS_FONTS = {
  serif:    { label: "Serif",     family: '"Arvo", serif',                         weight: 700 },
  sans:     { label: "Sans",      family: '"Cal Sans", sans-serif',                weight: 400 },
  script:   { label: "Script",    family: '"Meow Script", cursive',                weight: 400 },
  sampler:  { label: "Sampler",   family: '"Rye", serif',                          weight: 400 },
  oldstyle: { label: "Old Style", family: '"Manufacturing Consent", serif',        weight: 400 },

// Line pitch for multi-line text, in stitches. Tighter than a typographic
// leading would be: at this size the gap is counted in whole stitches, and
// anything looser reads as separate blocks rather than one stitched verse.
function xsLineHeight(sizeCells) { return Math.max(sizeCells + 2, Math.round(sizeCells * 1.35)); }
// Render text to an offscreen canvas at 1px-per-stitch and return the list of
// [dx,dy] cell offsets that are "on" — i.e. the text as stitches. Newlines
// stack as centered lines, since a long phrase can't fit one line on a hoop
// and sampler layouts read centered anyway.
function rasterizeText(text, font, sizeCells) {
  if (!text) return [];
  const f = XS_FONTS[font] || XS_FONTS.sans;
  const size = Math.max(6, sizeCells);
  const fontStr = `${f.weight} ${size}px ${f.family}`;
  const lines = String(text).split('\n').map(s => s.trim());
  if (!lines.some(Boolean)) return [];
  const cv = document.createElement('canvas');
  let ctx = cv.getContext('2d');
  ctx.font = fontStr;
  const lineH = xsLineHeight(size);
  const metrics = lines.map(ln => {
    const m = ctx.measureText(ln || ' ');
    return {
      w: Math.ceil(m.width),
      asc: Math.ceil(m.actualBoundingBoxAscent || size * 0.8),
      desc: Math.ceil(m.actualBoundingBoxDescent || size * 0.25),
    };
  });
  // Baselines march down by lineH from the first line's ascent; the canvas has
  // to reach the lowest descender of any line, not just the last one.
  const base0 = metrics[0].asc + 1;
  const w = Math.max(1, Math.max(...metrics.map(m => m.w)) + 2);
  const h = Math.max(1, Math.max(...metrics.map((m, i) => base0 + i * lineH + m.desc)) + 1);
  cv.width = w; cv.height = h;
  ctx = cv.getContext('2d');
  ctx.font = fontStr;
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#000';
  lines.forEach((ln, i) => { if (ln) ctx.fillText(ln, w / 2, base0 + i * lineH); });
  let data;
  try { data = ctx.getImageData(0, 0, w, h).data; } catch (e) { return []; }
  const out = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { if (data[(y * w + x) * 4 + 3] >= 128) out.push([x, y]); }
  return out;
}
// Text tool controls, shared by the desktop panel and the mobile sheet so the
