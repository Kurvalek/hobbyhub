<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>metime</title>
<link rel="icon" type="image/png" href="assets/metime-icon.png"/>
<link rel="apple-touch-icon" href="assets/metime-icon.png"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@7.9.0/css/iconoir.css" rel="stylesheet"/>
<style>
  /* Self-hosted brand type — Söhne (sans + mono) and BC Civitas (display).
     Trial ("TEST") cuts as supplied. Dancing Script (Google) is kept only for
     the cross-stitch text tool's optional script style. */
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 300; font-display: swap; src: url('fonts/Sohne-Light.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/Sohne-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: italic; font-weight: 400; font-display: swap; src: url('fonts/Sohne-Italic.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/Sohne-Medium.woff2') format('woff2'); }
  /* Design rule: Söhne tops out at Medium — "bold" (600/700) resolves to the Medium cut. */
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/Sohne-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/Sohne-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/SohneMono-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/SohneMono-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 300; font-display: swap; src: url('fonts/BCCivitas-Light.woff2') format('woff2'); }
  /* Design rule: BC Civitas headers use the Medium cut, so the default (400) weight loads Medium. */
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/BCCivitas-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/BCCivitas-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/BCCivitas-Semibold.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/BCCivitas-Bold.woff2') format('woff2'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }

  :root {
    /* metime base palette */
    --metime-black: #000000;
    --metime-almost-black: #2E2925;
    --metime-cream: #F5F3EE;
    --metime-white: #FFFFFF;

    /* metime accent palette (kept available for future profile UI) */
    --metime-tomato: #E8583A;
    --metime-avocado: #B5BB46;
    --metime-grapefruit: #FDA198;
    --metime-ice: #CCD6EB;
    --metime-golden: #FBBB3F;

    /* Warm-tinted neutrals — derived to read warm against the cream base */
    --warm-fg: #2E2925;
    --warm-fg-2: #5C544A;
    /* --warm-muted darkened from #8A8580 to meet WCAG AA (4.5:1) for body text
       on both the cream (#F5F3EE) and white card surfaces. */
    --warm-muted: #6E6862;
    /* --warm-muted-2 / --warm-placeholder are reserved for non-text use
       (borders, disabled icons, native input placeholders). */
    --warm-muted-2: #B5AFA6;
    --warm-placeholder: #CFC9BE;
    --warm-hairline: #E2DDD2;
    --warm-divider-soft: #EFE9DD;
    --warm-hover: #EFE9DD;

    /* Button design system (Figma: metime — design system, node 20-1371) */
    --color-taupe-900: #120F06;
    --color-taupe-700: #3D3625;
    --color-taupe-600: #544D3A;
    --color-taupe-500: #6B644F;
    --color-taupe-100: #CEC9BE;
    --color-linen-800: #D5D1BD;
    --color-linen-600: #E9E7D9;
    --color-linen-500: #F2F1E7;
    --color-linen-300: #F7F6F0;
    --color-linen-100: #FDFCFA;

    /* Primary (filled) button */
    --btn-primary-bg: var(--color-taupe-900);
    --btn-primary-bg-hover: var(--color-taupe-600);
    --btn-primary-bg-active: var(--color-taupe-700);
    --btn-primary-bg-disabled: var(--color-linen-600);
    --btn-primary-fg: var(--metime-white);
    --btn-primary-fg-active: var(--color-taupe-100);

    /* Secondary (outline) button */
    --btn-secondary-bg: var(--color-linen-100);
    --btn-secondary-bg-hover: var(--color-linen-300);
    --btn-secondary-bg-active: var(--color-linen-500);
    --btn-secondary-border: var(--color-linen-800);
    --btn-secondary-fg: var(--color-taupe-900);

    /* Shared button states */
    --btn-disabled-fg: var(--color-taupe-500);
    --btn-focus-ring: var(--color-taupe-100);
    /* Pale taupe wash for icon/tool button hover (reads consistently over cream or white). */
    --btn-tool-hover: rgba(18, 15, 6, 0.08);

    /* Surfaces */
    --surface-card: var(--metime-white);
    --surface-canvas: var(--metime-white);

    /* Action / accent semantics */
    --action: var(--metime-black);
    --action-hover: var(--metime-almost-black);
    --selection: #CCD6EB;
    --metime-wave: var(--metime-tomato);

    /* Shadows tuned to warm bg */
    --shadow-sticky: 0 2px 8px rgba(46,41,37,0.08);
    --shadow-modal: 0 8px 32px rgba(46,41,37,0.14);

    /* Fonts — Söhne (body/sans), BC Civitas (display), Söhne Mono (mono). */
    --font-sans: 'Söhne', sans-serif;
    --font-display: 'BC Civitas', serif;
    --font-mono: 'Söhne Mono', monospace;

    /* Type scale (Figma 02 - typography) — used at editorial moments;
       the dense tool UI keeps its smaller working sizes (11/12/13). */
    --text-xs: 12px;
    --text-sm: 14px;
    --text-base: 16px;
    --text-lg: 18px;
    --text-xl: 20px;
    --text-2xl: 24px;
    --text-3xl: 30px;

    /* Tweakable structural tokens (kept for backwards-compat with TweaksPanel) */
    --div-border: 1px solid var(--metime-almost-black);
    --app-bg: var(--metime-cream);
    --canvas-bg: var(--metime-white);
  }

  body {
    font-family: var(--font-sans);
    background: var(--metime-cream);
    color: var(--warm-fg);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout */
  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--app-bg); }
  .body { flex: 1; display: grid; grid-template-columns: 52px 1fr 290px; min-height: 0; }
  .panel { overflow-y: auto; border-right: var(--div-border); }
  .panel:last-child { border-right: none; }

  /* Scrollbar */
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-thumb { background: var(--warm-hairline); border-radius: 2px; }

  /* Collapsible right panel.
     Both desktop and mobile collapse the panel to a thin rail (mirroring the
     left tool rail) that keeps the selected color + high-level totals visible.
     Expanding restores the full panel column on desktop, and slides it in as a
     drawer over a backdrop on mobile. */
  .body { position: relative; transition: grid-template-columns .22s ease; }
  .right-panel { position: relative; display: flex; flex-direction: column; background: var(--metime-white); border-left: 1px solid var(--metime-almost-black); }
  /* Higher specificity than .icon-btn so these stay hidden off-mobile regardless
     of source order — otherwise the close button becomes an in-flow grid item
     and pushes the panel to a wrapped column. */
  .icon-btn.rp-close, .icon-btn.xs-rp-close { display: none; }
  .rp-backdrop { display: none; }

  /* Collapsed: swap the full panel for the thin rail (all screen sizes) */
  .body.rp-closed { grid-template-columns: 52px 1fr 52px; }
  .body.rp-closed > .right-panel { display: none; }
  .xs-body.rp-closed > .xs-panel { display: none; }
  .xs-body.rp-closed .xs-materials { right: 16px; }

  /* The thin collapsed rail (rendered only while collapsed, so it shows on
     both desktop and mobile) */
  .rp-rail {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 12px 6px; background: var(--app-bg); flex-shrink: 0; width: 52px;
    border-left: 1px solid var(--metime-almost-black); z-index: 40; overflow: hidden;
  }
  .rp-rail .rail-divider { width: 24px; height: 1px; background: var(--warm-hairline); }

  /* Thin collapsed rail contents (swatch + high-level stats) */
  .rp-rail-swatch { width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(46,41,37,0.18); cursor: pointer; padding: 0; background: none; box-shadow: 0 1px 2px rgba(46,41,37,0.12); flex-shrink: 0; }
  .rp-rail-swatch.empty { border: 1px dashed var(--warm-hairline); }
  .rp-rail-stat { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; }
  .rp-rail-stat b { font-family: var(--font-display); font-size: 15px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; color: var(--warm-fg); }
  .rp-rail-stat span { font-size: 9px; color: var(--warm-muted); letter-spacing: .03em; }

  @media (max-width: 900px) {
    /* Quilt: expanded overlays a drawer instead of using a grid column
       (collapsed still shows the 52px rail column from the base rules) */
    .body { grid-template-columns: 52px 1fr; }
    .right-panel {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(300px, 88vw); z-index: 130;
      border-left: 1px solid var(--metime-almost-black);
      box-shadow: -12px 0 32px rgba(46,41,37,0.20);
      transform: translateX(0); transition: transform .22s ease;
    }
    .body.rp-closed > .right-panel { display: flex; transform: translateX(105%); box-shadow: none; pointer-events: none; }

    /* Cross-stitch: same treatment (xs-body is flex; the rail is a flex item) */
    .xs-panel {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(300px, 88vw); z-index: 130;
      box-shadow: -12px 0 32px rgba(46,41,37,0.20);
      transform: translateX(0); transition: transform .22s ease;
    }
    .xs-body.rp-closed > .xs-panel { display: flex; transform: translateX(105%); box-shadow: none; pointer-events: none; }
    .xs-materials { right: 16px !important; bottom: 16px; }

    /* Backdrop + floating close button for the expanded drawer */
    .rp-backdrop { display: block; position: absolute; inset: 0; background: rgba(46,41,37,0.32); z-index: 120; }
    .icon-btn.rp-close, .icon-btn.xs-rp-close {
      display: inline-flex; position: absolute; top: 10px; right: 12px; z-index: 140;
      background: var(--metime-white); border: 1px solid var(--warm-hairline); box-shadow: var(--shadow-sticky);
    }
    .icon-btn.rp-close:hover, .icon-btn.xs-rp-close:hover { background: var(--warm-hover); }

    /* The rail owns the toggle on mobile, so drop the header/top-bar copy.
       Higher specificity than .icon-btn so it wins regardless of source order. */
    .icon-btn.rp-toggle-header { display: none; }

    /* Tighten chrome so the canvas keeps as much room as possible */
    header { padding: 12px 14px; gap: 10px; }
    .xs-topbar { flex-wrap: wrap; row-gap: 8px; padding: 10px 14px; }
    .xs-topbar-spacer { flex-basis: 100%; height: 0; }
    .preset-pill { max-width: 200px; }
    .canvas-scroll { padding: 12px; }
    .xs-canvas-wrap { padding: 12px; }
    .size-bar { flex-wrap: wrap; row-gap: 8px; padding: 10px 14px; }
    .size-bar-slider { max-width: none; min-width: 160px; }
  }

  @media (max-width: 560px) {
    header { grid-template-columns: auto 1fr auto; padding: 10px 12px; gap: 8px; }
    .header-center { display: none; }
    .btn { padding: 6px 12px; font-size: 11px; }
    .header-right { gap: 6px; }
    .size-bar-meta { display: none; }
    .xs-title { font-size: 17px; }
    .xs-topbar .btn { padding: 6px 12px; font-size: 11px; }
    .hint-overlay { font-size: 10px; padding: 5px 10px; }
  }

  /* ── Mobile: Canva-style bottom toolbar + bottom sheets ──────────────────
     Mobile-only (<=900px). The vertical rails and the right drawer are replaced
     by a fixed bottom toolbar and slide-up sheets. Everything reuses the
     existing tokens/classes so the look is unchanged — only the layout moves. */
  @media (max-width: 900px) {
    /* Give the canvas room so the fixed bottom toolbar never covers it. */
    .app, .xs-app { padding-bottom: calc(58px + env(safe-area-inset-bottom)); box-sizing: border-box; }
    /* Single-column body (rails + right drawer are not rendered on mobile). */
    .body, .body.rp-closed { grid-template-columns: 1fr; }

    .mobile-toolbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 150;
      display: flex; align-items: center; gap: 4px; overflow-x: auto;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: var(--app-bg); border-top: 1px solid var(--metime-almost-black);
      box-shadow: 0 -2px 6px rgba(46,41,37,0.08); -webkit-overflow-scrolling: touch;
    }
    .mobile-toolbar::-webkit-scrollbar { display: none; }
    .mobile-toolbar .icon-btn { flex-shrink: 0; width: 40px; height: 40px; }
    .mobile-toolbar-divider { flex-shrink: 0; width: 1px; height: 22px; background: var(--warm-hairline); margin: 0 4px; }
    .mt-swatch { display: block; width: 20px; height: 20px; border-radius: 5px; border: 1px solid rgba(46,41,37,0.18); }
    .mt-swatch.empty { border: 1px dashed var(--warm-hairline); background: transparent; }

    /* Selection toolbars become a contextual bar pinned above the toolbar.
       Reuses the existing .selection-toolbar chrome; overrides the JS-computed
       fixed coords with a bottom-anchored, full-width bar. */
    .selection-toolbar.mobile-selbar {
      position: fixed !important; left: 8px; right: 8px; top: auto !important;
      bottom: calc(66px + env(safe-area-inset-bottom)); visibility: visible !important;
      justify-content: center; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .selection-toolbar.mobile-selbar::after { display: none; }
    .xs-selbar.mobile-selbar {
      position: fixed !important; left: 8px !important; right: 8px !important; top: auto !important;
      bottom: calc(66px + env(safe-area-inset-bottom)) !important; transform: none !important;
      justify-content: center; flex-wrap: wrap; row-gap: 6px;
    }

    /* Bottom sheet chrome. */
    .bottom-sheet-backdrop { position: fixed; inset: 0; background: rgba(46,41,37,0.32); z-index: 200; }
    .bottom-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
      background: var(--metime-white); border-top: 1px solid var(--metime-almost-black);
      border-radius: 14px 14px 0 0; box-shadow: 0 -8px 32px rgba(46,41,37,0.20);
      display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--warm-hairline); margin: 8px auto 2px; flex-shrink: 0; }
    .bottom-sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 12px 6px; flex-shrink: 0; }
    .bottom-sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Center modal dialogs (.overlay) and the cross-stitch fabric picker become
       bottom sheets on mobile. `!important` is required to override the cards'
       inline styles; desktop keeps the centered dialog untouched. */
    .overlay, .xs-picker { align-items: flex-end !important; }
    .overlay > div, .xs-picker-card {
      max-width: none !important; width: 100% !important; margin: 0 !important;
      border-radius: 14px 14px 0 0 !important; max-height: 88vh !important; overflow-y: auto !important;
      padding-bottom: calc(24px + env(safe-area-inset-bottom)) !important;
    }
  }

  /* Header */
  header { padding: 14px 20px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; flex-shrink: 0; background: var(--app-bg); position: relative; z-index: 5; border-bottom: 1px solid var(--metime-almost-black); box-shadow: 0 2px 6px rgba(46,41,37,0.08); }
  .header-left { display: flex; align-items: center; }
  .header-center { display: flex; align-items: center; justify-content: center; }
  .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

  /* Brand wordmark (metime) — canvas headers use the compact icon on narrow
     screens so Save keeps padding; setup/proj pages keep the full wordmark. */
  .brand { display: inline-flex; align-items: center; color: var(--metime-almost-black); text-decoration: none; line-height: 0; }
  .brand-mark { height: 28px; width: auto; display: block; }
  .brand-icon { display: none; height: 28px; width: 28px; object-fit: contain; }
  @media (max-width: 900px) {
    .app .brand-mark,
    .xs-app .brand-mark { display: none; }
    .app .brand-icon,
    .xs-app .brand-icon { display: block; }
    .app .header-right .btn,
    .xs-app .header-right .btn { white-space: nowrap; }
  }
  @media (max-width: 560px) {
    .app .brand-icon,
    .xs-app .brand-icon { height: 26px; width: 26px; }
  }

  /* Preset pill (header center) */
  .preset-pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 16px; background: var(--surface-card); border: 1px solid var(--warm-hairline); border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--warm-fg); cursor: pointer; transition: all .12s; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preset-pill:hover { border-color: var(--warm-muted-2); background: var(--warm-hover); }
  .preset-pill[aria-expanded="true"] { border-color: var(--metime-almost-black); }
  .preset-pill .preset-dim { color: var(--warm-muted); font-weight: 400; font-family: var(--font-mono); font-size: 12px; }
  .preset-pill .caret { display: inline-block; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid var(--warm-muted); margin-left: 2px; }

  /* Icon button (used in header + tool rail + popover triggers) */
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 4px; border: 1px solid transparent; background: transparent; color: var(--btn-secondary-fg); cursor: pointer; transition: background .12s, border-color .12s, color .12s, box-shadow .12s; padding: 0; }
  .icon-btn:hover { background: var(--btn-tool-hover); }
  .icon-btn:active { background: var(--btn-secondary-bg-active); }
  .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .icon-btn[aria-pressed="true"], .icon-btn.active { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-primary-bg); }
  .icon-btn[aria-pressed="true"]:hover, .icon-btn.active:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-primary-bg-hover); }
  .icon-btn:disabled { color: var(--btn-disabled-fg); cursor: not-allowed; }
  .icon-btn:disabled:hover { background: transparent; }

  /* Toggle switch (pill on/off control) */
  .switch { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-sans); font-size: 12px; color: var(--warm-fg-2); user-select: none; }
  .switch-track { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--color-linen-800); border: 1px solid var(--btn-secondary-border); transition: background .12s, border-color .12s; flex-shrink: 0; }
  .switch-knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--metime-white); box-shadow: 0 1px 2px rgba(46,41,37,0.25); transition: transform .12s; }
  .switch[aria-checked="true"] .switch-track { background: var(--color-taupe-900); border-color: var(--color-taupe-900); }
  .switch[aria-checked="true"] .switch-knob { transform: translateX(14px); }
  .switch:focus-visible { outline: none; }
  .switch:focus-visible .switch-track { box-shadow: 0 0 0 3px var(--btn-focus-ring); }

  /* Left tool rail */
  .tool-rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; background: var(--app-bg); border-right: var(--div-border); }
  .tool-rail .rail-spacer { flex: 1; }
  .tool-rail .rail-divider { width: 24px; height: 1px; background: var(--warm-hairline); margin: 4px 0; }

  /* Popover (anchored floating panel) */
  .popover-backdrop { position: fixed; inset: 0; z-index: 90; background: transparent; }
  .popover { position: fixed; z-index: 91; background: var(--surface-card); border: 1px solid var(--warm-hairline); border-radius: 8px; box-shadow: 0 10px 32px rgba(46,41,37,0.16); font-family: var(--font-sans); }
  .popover-header { padding: 12px 14px 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .popover-title { font-size: 12px; font-weight: 500; color: var(--warm-fg); }
  .popover-body { padding: 4px 14px 14px; }
  .popover-footer { padding: 10px 14px; border-top: 1px solid var(--warm-divider-soft); display: flex; gap: 8px; justify-content: flex-end; }

  /* Disclosures (collapsible sections inside the right column) */
  .disclosure-toggle { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 0; color: var(--warm-muted); font-family: var(--font-sans); font-size: 11px; font-weight: 500; }
  .disclosure-toggle:hover { color: var(--warm-fg); }
  .disclosure-toggle .chev { display: inline-block; transition: transform .12s; font-size: 9px; }
  .disclosure-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }

  /* Right-column section row (compact backing/binding/etc) */
  .stack-row { display: flex; align-items: center; gap: 10px; }
  .stack-row .stack-main { flex: 1; min-width: 0; }
  .edit-link { background: none; border: none; padding: 0 2px; cursor: pointer; color: var(--warm-muted); font-family: var(--font-sans); font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
  .edit-link:hover { color: var(--warm-fg); }

  /* Floating hint pill in canvas */
  .hint-overlay { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--metime-almost-black); color: var(--metime-white); padding: 6px 12px; border-radius: 999px; font-size: 11px; line-height: 1.4; max-width: calc(100% - 32px); display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; box-shadow: 0 4px 16px rgba(46,41,37,0.18); pointer-events: none; }

  /* Top-of-canvas size bar */
  .size-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 20px; border-bottom: var(--div-border); background: var(--surface-canvas); flex-shrink: 0; }
  .size-bar-slider { display: flex; align-items: center; gap: 12px; flex: 1; max-width: 460px; }
  .size-bar-slider input[type=range] { flex: 1; }
  .size-bar-label { font-size: 11px; color: var(--warm-fg-2); font-weight: 500; white-space: nowrap; }
  .size-bar-value { font-size: 12px; color: var(--warm-fg); min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  .size-bar-meta { display: flex; gap: 16px; font-size: 11px; color: var(--warm-muted); white-space: nowrap; }
  .size-bar-meta span { font-variant-numeric: tabular-nums; }

  /* Canvas viewport (scrollable, centered, scaled by zoom) */
  .canvas-scroll { width: 100%; height: 100%; overflow: auto; display: flex; align-items: safe center; justify-content: safe center; padding: 24px; box-sizing: border-box; }
  .canvas-scroll > .canvas-frame { flex-shrink: 0; position: relative; background: var(--canvas-bg); }
  .canvas-surface { position: absolute; inset: 0; user-select: none; touch-action: none; }

  /* Bottom-of-canvas zoom bar */
  .zoom-bar { display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-top: var(--div-border); background: var(--surface-canvas); flex-shrink: 0; }
  .zoom-bar input[type=range] { flex: 1; max-width: 280px; }
  .zoom-bar-value { font-family: var(--font-mono); font-size: 11px; color: var(--warm-fg-2); min-width: 40px; text-align: right; }

  /* Floating selection toolbar (position+coords are computed in JS, FigJam-style) */
  .selection-toolbar { z-index: 100; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--surface-card); border: 1px solid var(--warm-hairline); border-radius: 8px; box-shadow: 0 6px 18px rgba(46,41,37,0.16); font-size: 12px; white-space: nowrap; pointer-events: auto; }
  .selection-toolbar-divider { display: inline-block; width: 1px; height: 16px; background: var(--warm-hairline); margin: 0 2px; }
  .selection-swatch-btn { display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: transparent; border: 1px solid transparent; border-radius: 5px; font: inherit; color: inherit; cursor: pointer; transition: background .12s, border-color .12s; }
  .selection-swatch-btn:hover { background: var(--surface-hover, rgba(46,41,37,0.05)); border-color: var(--warm-hairline); }
  .selection-swatch-preview { width: 14px; height: 14px; border: 1px solid rgba(46,41,37,0.12); border-radius: 2px; flex-shrink: 0; display: block; }
  .selection-swatch-mixed { background: conic-gradient(#E8583A 0deg 90deg, #B5BB46 90deg 180deg, #1A2E4C 180deg 270deg, #E1A92F 270deg 360deg); }
  .selection-swatch-name { font-weight: 500; color: var(--warm-fg); }
  .selection-swatch-meta { color: var(--warm-muted); font-family: var(--font-mono); font-size: 11px; }
  .selection-swatch-caret { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid var(--warm-fg-2); margin-left: 2px; }
  .selection-toolbar::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; }
  .selection-toolbar.above::after { bottom: -5px; border-top: 6px solid var(--surface-card); }
  .selection-toolbar.below::after { top: -5px; border-bottom: 6px solid var(--surface-card); }
  .selection-toolbar.clamped::after { display: none; }

  /* Section labels */
  .label { font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--warm-fg); margin-bottom: 10px; }
  .label-mono { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--warm-muted); }

  /* Cards */
  .card { padding: 16px; border-bottom: var(--div-border); }
  .card:last-child { border-bottom: none; }

  /* Inputs */
  input[type=text], select {
    width: 100%; padding: 7px 10px; font-size: 13px; font-family: var(--font-sans);
    border: 1px solid var(--warm-hairline); background: var(--surface-card); color: var(--warm-fg); outline: none;
    border-radius: 4px; transition: border-color .15s;
  }
  input[type=text]:focus, select:focus { border-color: var(--metime-almost-black); }
  select { appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238A8580' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--metime-almost-black); cursor: pointer; }
  input[type=checkbox] { accent-color: var(--color-taupe-900); cursor: pointer; }
  input[type=color] { width: 32px; height: 28px; padding: 2px; border: 1px solid var(--warm-hairline); background: none; border-radius: 4px; cursor: pointer; }

  /* Buttons — metime design system (Figma node 20-1371).
     Default .btn = Secondary hierarchy, .btn-dark = Primary, .btn-tertiary = Tertiary. */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; font-size: 12px; line-height: 16px; font-family: var(--font-sans); font-weight: 500; border-radius: 4px; cursor: pointer; transition: background .12s, border-color .12s, color .12s, box-shadow .12s; border: 1px solid var(--btn-secondary-border); background: var(--btn-secondary-bg); color: var(--btn-secondary-fg); }
  .btn:hover { background: var(--btn-secondary-bg-hover); border-color: var(--btn-secondary-border); }
  .btn:active { background: var(--btn-secondary-bg-active); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .btn:disabled, .btn[disabled] { background: transparent; border-color: var(--btn-secondary-border); color: var(--btn-disabled-fg); cursor: not-allowed; box-shadow: none; }

  .btn-dark { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-primary-bg); }
  .btn-dark:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-primary-bg-hover); }
  .btn-dark:active { background: var(--btn-primary-bg-active); border-color: var(--btn-primary-bg-active); color: var(--btn-primary-fg-active); }
  .btn-dark:disabled, .btn-dark[disabled] { background: var(--btn-primary-bg-disabled); border-color: var(--btn-primary-bg-disabled); color: var(--btn-disabled-fg); }

  .btn-tertiary { background: transparent; border: none; border-bottom: 1px solid var(--color-taupe-900); border-radius: 0; padding: 0 0 1px; color: var(--color-taupe-900); }
  .btn-tertiary:hover { background: transparent; border-bottom-color: var(--color-taupe-600); color: var(--color-taupe-600); }
  .btn-tertiary:active { background: transparent; border-bottom-color: var(--color-taupe-700); color: var(--color-taupe-700); }
  .btn-tertiary:disabled, .btn-tertiary[disabled] { border-bottom-color: var(--btn-disabled-fg); color: var(--btn-disabled-fg); }

  .btn-sm { padding: 4px 10px; font-size: 11px; }
  .btn-xs { padding: 3px 8px; font-size: 11px; }

  /* Fabric row (clickable color field) */
  .fabric-row { display: flex; gap: 10px; align-items: center; padding: 14px 16px; background: transparent; border: none; border-bottom: var(--div-border); width: 100%; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: background .12s; box-sizing: border-box; }
  .fabric-row:hover { background: var(--warm-hover); }
  .fabric-row:focus-visible { outline: 2px solid var(--selection); outline-offset: -2px; }
  .fabric-row-swatch { width: 28px; height: 28px; border-radius: 4px; flex-shrink: 0; box-sizing: border-box; border: 1px solid var(--warm-hairline); }
  .fabric-row-swatch.empty { border: 1px dashed var(--warm-hairline); background: transparent; }
  .fabric-row-main { flex: 1; min-width: 0; }
  .fabric-row-title { font-size: 12px; font-weight: 500; color: var(--warm-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fabric-row-name { color: var(--warm-muted); font-weight: 400; }
  .fabric-row-detail { font-size: 11px; color: var(--warm-muted); font-family: var(--font-mono); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Color chip */
  .chip { aspect-ratio: 1; border-radius: 4px; border: 1px solid rgba(46,41,37,0.12); cursor: pointer; transition: transform .1s, box-shadow .1s; display: block; width: 100%; }
  .chip:hover { transform: scale(1.06); box-shadow: 0 2px 8px rgba(46,41,37,0.18); }
  .chip.selected { outline: 3px solid var(--selection); outline-offset: 3px; box-shadow: 0 0 0 1px rgba(46,41,37,0.18) inset, 0 2px 6px rgba(46,41,37,0.12); position: relative; z-index: 2; }

  /* Tag pills */
  .pill { padding: 3px 8px; font-size: 11px; border-radius: 2px; cursor: pointer; border: 1px solid var(--warm-hairline); background: var(--surface-card); color: var(--warm-fg-2); transition: all .12s; }
  .pill.active { background: var(--action); color: var(--metime-white); border-color: var(--action); }
  .pill:not(.active):hover { background: var(--warm-hover); }

  /* Grid canvas */
  .grid-wrap { position: relative; }

  /* Row in materials list */
  .mat-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--warm-divider-soft); }
  .mat-row:last-child { border-bottom: none; }

  /* Slider row */
  .slider-row { display: flex; flex-direction: column; gap: 4px; }
  .slider-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--warm-fg-2); }
  .slider-label span:last-child { font-weight: 500; color: var(--warm-fg); font-variant-numeric: tabular-nums; }

  /* Overlay */
  .overlay { position: fixed; inset: 0; background: rgba(46,41,37,0.32); z-index: 100; display: flex; align-items: center; justify-content: center; }

  /* Info text */
  .muted { color: var(--warm-muted); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

  /* Hint strip */
  .hint-strip { padding: 6px 12px; font-size: 11px; color: var(--warm-muted); display: flex; gap: 12px; flex-wrap: wrap; }

  /* Project selector page */
  .proj-page { display: flex; flex-direction: column; height: 100vh; background: var(--metime-cream); overflow: hidden; }
  .proj-header { padding: 14px 20px; display: flex; align-items: center; gap: 16px; border-bottom: none; box-shadow: none; background-color: var(--metime-cream); background-image: repeating-linear-gradient(to right, var(--metime-almost-black) 0, var(--metime-almost-black) 3px, transparent 3px, transparent 7px); background-repeat: no-repeat; background-size: 100% 1px; background-position: bottom left; flex-shrink: 0; }
  .proj-body { flex: 1; overflow-y: auto; padding: 48px 48px 64px; }
  .proj-intro { margin-bottom: 40px; }
  .proj-heading { font-family: var(--font-display); font-size: 36px; line-height: 1.15; letter-spacing: -0.5px; color: #25211e; margin-bottom: 6px; }
  .proj-subheading { font-size: 14px; color: #3c3833; }
  /* auto-fit (not auto-fill) collapses empty trailing tracks so the cards
     stretch to fill the row on desktop; at narrow widths it still resolves to a
     single column, so mobile stacking is unchanged. max-width keeps cards sane
     on very wide screens. Shared by the craft picker and both size selectors. */
  /* Size grids stay 4 / 2 / 1 across so we never get an orphan 3+1 row;
     cards use 1fr so they expand to fill the row. Craft picker keeps auto-fit. */
  .proj-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 18px; max-width: 1200px; }
  .craft-grid { grid-template-columns: repeat(auto-fit, minmax(188px, 1fr)); max-width: 1200px; }
  @media (max-width: 900px) { .proj-grid:not(.craft-grid) { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .proj-grid:not(.craft-grid) { grid-template-columns: 1fr; } }
  /* Setup-step card box: #707F87 / 4px, matching the palette card (Figma 2138:1989). */
  .proj-card { background: var(--metime-white); border: 1px solid #707F87; border-radius: 4px; overflow: hidden; cursor: pointer; transition: box-shadow 0.15s, transform 0.12s; display: flex; flex-direction: column; }
  .proj-card:hover { box-shadow: 0 8px 24px rgba(46,41,37,0.13); transform: translateY(-2px); }
  .proj-card:active { transform: translateY(0); }
  .proj-card-thumb { overflow: hidden; background: var(--metime-cream); flex-shrink: 0; }
  .proj-card-thumb svg { display: block; width: 100%; height: auto; }
  .proj-card-thumb.has-photo { aspect-ratio: 4 / 3; }
  .proj-card-thumb.has-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .proj-card-body { padding: 13px 15px 15px; flex: 1; }
  /* Card name / meta scale shared with .pal-card-name / .pal-card-meta. */
  .proj-card-name { font-size: 14px; font-weight: 500; color: #25211e; line-height: normal; margin-bottom: 4px; }
  .proj-card-dims { font-size: 13px; font-weight: 400; color: #3c3833; line-height: normal; margin-bottom: 2px; }
  .proj-card-desc { font-size: 13px; font-weight: 400; color: #3c3833; line-height: normal; margin-bottom: 8px; }
  .proj-card-cost { font-size: 13px; font-weight: 400; color: #3c3833; line-height: normal; border-top: 1px solid #707F87; padding-top: 8px; margin-top: 8px; }
  .proj-card.is-soon { opacity: 0.55; cursor: default; }
  .proj-card.is-soon:hover { box-shadow: none; transform: none; }

  /* Saved designs section (landing page) */
  .saved-sec { margin-top: 40px; border-top: 1px solid #707F87; padding-top: 24px; }
  .saved-head { display: flex; align-items: center; gap: 8px; background: none; border: none; padding: 0; cursor: pointer; color: #25211e; }
  /* Section label matches .pal-section-title (Söhne Kräftig 20). */
  .saved-head-title { font-family: var(--font-sans); font-size: 20px; font-weight: 500; line-height: normal; color: #25211e; display: flex; align-items: center; gap: 8px; }
  .saved-count { font-size: 13px; font-weight: 400; color: #3c3833; background: var(--metime-white); border: 1px solid #707F87; border-radius: 999px; padding: 1px 8px; }
  .saved-chev { display: flex; color: #3c3833; transition: transform 0.15s; }
  .saved-chev.is-open { transform: rotate(180deg); }
  .saved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
  .saved-card { display: flex; align-items: center; gap: 12px; background: var(--metime-white); border: 1px solid #707F87; border-radius: 4px; padding: 10px; cursor: pointer; transition: box-shadow 0.15s, transform 0.12s; }
  .saved-card:hover { box-shadow: 0 6px 18px rgba(46,41,37,0.12); transform: translateY(-2px); }
  .saved-card:active { transform: translateY(0); }
  .saved-thumb { width: 56px; height: 56px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #707F87; border-radius: 4px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .saved-thumb svg, .saved-thumb canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  .saved-info { flex: 1; min-width: 0; }
  .saved-name { font-size: 14px; font-weight: 500; color: #25211e; line-height: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saved-meta { font-size: 13px; font-weight: 400; color: #3c3833; line-height: normal; margin-top: 4px; }
  .saved-badge { display: inline-block; font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: #25211e; }

  /* Cross-stitch editor */
  .xs-app { display: flex; flex-direction: column; height: 100vh; background: var(--metime-cream); overflow: hidden; }
  .xs-topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--metime-almost-black); background: var(--metime-cream); flex-shrink: 0; box-shadow: 0 2px 6px rgba(46,41,37,0.08); }
  .xs-title { font-family: var(--font-display); font-size: 20px; line-height: 1; color: var(--warm-fg); }
  .xs-sub { font-size: 12px; color: var(--warm-muted); font-family: var(--font-mono); }
  .xs-topbar-spacer { flex: 1; }
  .xs-ctrl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--warm-fg-2); }
  .xs-body { flex: 1; display: flex; min-height: 0; position: relative; }
  .xs-rail { display: flex; flex-direction: column; gap: 6px; padding: 12px 8px; border-right: 1px solid var(--metime-almost-black); background: var(--metime-cream); flex-shrink: 0; }
  /* Cross-stitch tools share the .icon-btn design-system treatment so both canvases match. */
  .xs-tool { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; background: transparent; border-radius: 4px; cursor: pointer; color: var(--btn-secondary-fg); transition: background .12s, border-color .12s, color .12s, box-shadow .12s; padding: 0; }
  .xs-tool:hover { background: var(--btn-tool-hover); }
  .xs-tool:active { background: var(--btn-secondary-bg-active); }
  .xs-tool:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .xs-tool.active { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-primary-bg); }
  .xs-tool.active:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-primary-bg-hover); }
  .xs-canvas-wrap { flex: 1; overflow: auto; display: flex; align-items: safe center; justify-content: safe center; padding: 24px; background: var(--metime-cream); min-width: 0; }
  .xs-canvas { background: #fff; box-shadow: 0 4px 20px rgba(46,41,37,0.15); image-rendering: pixelated; touch-action: none; }
  .xs-panel { width: 264px; flex-shrink: 0; border-left: 1px solid var(--metime-almost-black); background: var(--metime-white); display: flex; flex-direction: column; min-height: 0; }
  .xs-panel-head { padding: 14px 16px 8px; }
  .xs-panel-title { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--warm-fg-2); text-transform: uppercase; }
  .xs-current { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--warm-divider-soft); }
  .xs-current-chip { width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(46,41,37,0.15); flex-shrink: 0; }
  .xs-swatches { flex: 1; overflow-y: auto; padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 8px; align-content: start; }
  .xs-swatch { position: relative; aspect-ratio: 1; border-radius: 6px; border: 1px solid rgba(46,41,37,0.15); cursor: pointer; transition: transform .1s; }
  .xs-swatch:hover { transform: scale(1.08); }
  .xs-swatch.active { outline: 2px solid var(--metime-almost-black); outline-offset: 1px; }
  .xs-add { margin: 0 16px 14px; padding: 8px; border: 1px dashed var(--warm-muted); background: none; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--warm-fg-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .xs-add:hover { border-color: var(--metime-almost-black); color: var(--warm-fg); }
  .xs-picker { position: fixed; inset: 0; background: rgba(46,41,37,0.28); display: flex; align-items: center; justify-content: center; z-index: 60; }
  .xs-picker-card { background: #fff; border-radius: 10px; width: 460px; max-width: calc(100vw - 32px); max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(46,41,37,0.2); overflow: hidden; }
  .xs-picker-list { overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
  .xs-picker-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .xs-picker-item:hover { background: var(--metime-cream); border-color: var(--warm-hairline); }
  .xs-picker-dot { width: 20px; height: 20px; border-radius: 4px; border: 1px solid rgba(46,41,37,0.15); flex-shrink: 0; }
  .xs-picker-code { font-size: 12px; font-weight: 600; color: var(--warm-fg); }
  .xs-picker-name { font-size: 10px; color: var(--warm-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xs-materials { position: absolute; bottom: 16px; right: 280px; width: 232px; background: var(--metime-white); border: 1px solid var(--warm-hairline); border-radius: 10px; box-shadow: 0 6px 24px rgba(46,41,37,0.16); overflow: hidden; z-index: 20; }
  .xs-materials-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; cursor: pointer; user-select: none; }
  .xs-materials-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 14px 12px; }
  .xs-materials-num { font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1; font-family: var(--font-display); }
  .xs-materials-list { border-top: 1px solid var(--warm-divider-soft); max-height: 180px; overflow-y: auto; }
  .xs-materials-row { display: flex; align-items: center; gap: 8px; padding: 6px 14px; }
  .xs-materials-dot { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(46,41,37,0.15); flex-shrink: 0; }

  /* Palette selector page */
  .pal-body { max-width: none; }
  /* Setup-step intro — heading row carries the top-right skip (Figma 2151:266) */
  .pal-head-row { display: flex; align-items: center; gap: 16px; }
  .pal-head-row .proj-heading { flex: 1; min-width: 0; margin-bottom: 0; }
  .pal-head-row + .proj-subheading { margin-top: 6px; }
  .pal-body .proj-subheading { font-size: 14px; font-weight: 400; color: #3c3833; }
  .pal-section { margin-bottom: 36px; }
  .pal-section-head { margin-bottom: 14px; }
  /* Palette-step section labels — Söhne Kräftig 20 / Buch 13 (Figma 2151:261) */
  .pal-section-title { font-size: 20px; font-weight: 500; letter-spacing: 0; color: #25211e; }
  .pal-section-sub { font-size: 13px; font-weight: 400; color: #3c3833; margin-top: 3px; }
  /* Even rows that divide both 6 (DMC) and 12 (Kona) sample counts:
     6 / 4 / 3 / 2 columns. minmax(0,1fr) lets cards share space equally and grow. */
  .pal-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: 1fr;
    gap: 14px;
    width: 100%;
  }
  @media (min-width: 1800px) {
    .pal-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }

  @media (max-width: 1200px) {
    .pal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .pal-grid { grid-template-columns: 1fr; }

  /* Sample palette card — Figma metime design system node 2151:47.
     Sized for up to 8 overlapping 32px swatches plus padding.
     Box border #707F87; swatch stroke = 1pt inset black @ 50%. */
  .pal-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; height: 100%; min-width: 0; box-sizing: border-box;
    padding: 16px 12px 12px; background: var(--metime-white);
    border: 1px solid #707F87; border-radius: 4px;

  }
  .pal-card:hover { box-shadow: 0 8px 24px rgba(46,41,37,0.13); transform: translateY(-2px); }
  .pal-card:active { transform: translateY(0); }
  .pal-card.selected { box-shadow: 0 0 0 2px #707F87; }
  .pal-swatches { display: flex; align-items: center; height: 32px; width: 100%; }
  .pal-swatch {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    border: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
    box-sizing: border-box; margin-left: -6px; display: block; position: relative;

  .pal-upload { border: 1px dashed #707F87; border-radius: 4px; padding: 28px 24px; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; background: var(--metime-white); width: 50%; max-width: 100%; box-sizing: border-box; }

  .tmpl-card { background: var(--metime-white); border: 1px solid #707F87; border-radius: 4px; overflow: hidden; cursor: pointer; transition: box-shadow 0.15s, transform 0.12s; text-align: left; font: inherit; color: inherit; padding: 0; }
  .tmpl-card:hover { box-shadow: 0 8px 24px rgba(46,41,37,0.13); transform: translateY(-2px); }

  .tmpl-card-thumb { background: var(--metime-cream); height: 230px; display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; }
  .tmpl-card-thumb svg { display: block; width: 100%; height: 100%; }
  /* Templates that know their own grid size (--tmpl-ar = width/height, set per
     card) preview at that proportion instead of inside a fixed box, so a 30x120
     bookmark chart reads as a tall strip. Height is capped at --tmpl-thumb-h and
     the strip is centered, keeping cards a sane size; no plate behind the art. */
  .tmpl-card-thumb.is-ratio { background: none; height: auto; }
  .tmpl-card-thumb.is-ratio svg { width: min(100%, calc(var(--tmpl-thumb-h, 300px) * var(--tmpl-ar))); height: auto; aspect-ratio: var(--tmpl-ar); }
  .tmpl-card-body { padding: 12px 15px 15px; }
  .tmpl-card-name { font-size: 14px; font-weight: 500; color: #25211e; line-height: normal; margin-bottom: 4px; }

  /* Back link — tertiary text style (Figma Button Tertiary Medium): Söhne Kräftig 14, taupe-900.

  .back-link {

  .pal-suggest-add { width: 44px; height: 44px; border-radius: 8px; border: 1px dashed var(--warm-muted); background: none; color: var(--warm-fg-2); font-size: 20px; line-height: 1; cursor: pointer; }
  .pal-suggest-add:hover { border-color: var(--metime-almost-black); color: var(--warm-fg); }

  /* Backing-fabric picker: theme filters + dense swatch grid. Filters share the

  .fabric-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .fabric-filter { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 6px; border: 1px solid #707F87; background: var(--metime-white); color: #25211e; font-family: var(--font-sans); font-size: 14px; font-weight: 500; line-height: normal; cursor: pointer; transition: background .12s, border-color .12s, color .12s; }
  .fabric-filter:not(.active):hover { background: var(--color-linen-300); }
  .fabric-filter.active { background: var(--action); border-color: var(--metime-almost-black); color: var(--metime-white); }
  .fabric-filter-count { font-size: 13px; font-weight: 400; opacity: 0.7; }
  .fabric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .fabric-card { padding: 0; border: 1px solid #707F87; border-radius: 4px; overflow: hidden; cursor: pointer; background: var(--metime-white); font: inherit; transition: box-shadow .15s, transform .12s; }
  .fabric-card:hover { box-shadow: 0 6px 18px rgba(46,41,37,0.13); transform: translateY(-2px); }

  /* Mobile-friendly project setup screens (size / template / palette steps). */
  @media (max-width: 640px) {

<body>
<div id="root"></div>
<script src="assets/fabrics-manifest.js"></script>
<script src="assets/stitch-templates-data.js"></script>
<script type="text/babel">
const { useState, useMemo, useRef, useEffect, useLayoutEffect, useCallback } = React;

// ── Shopify Storefront checkout config ─────────────────────────────────────
// FILL THESE IN to connect the studio to your Shopify store. This studio runs
// on its own Vercel domain (not the Shopify storefront), so checkout goes
// through the Storefront API `cartCreate` mutation — the only origin-safe way
// to attach a per-line-item property (`_design_id`) that the fulfillment
// backend reads off the order. After creating the cart we redirect the buyer
// to the returned checkoutUrl.
//
// The Storefront access token below is PUBLIC/client-safe by design (unlike
// the Admin API key) — it's scoped only to unauthenticated storefront reads
// and cart creation, so it's fine to ship in this static page.
//
// The kit entries below hold PRODUCT GIDs (not variant GIDs). Each flat-price
// kit is a single-variant product, so we store the product GID (easy to read
// off the admin URL — the number in Products → the kit → .../products/NUMBER)
// and let the code resolve that product's first/default variant at checkout
// time via the Storefront API (see resolveVariantId below). The product GID
// looks like "gid://shopify/Product/1234567890".
const SHOPIFY_STORE_DOMAIN = "0kfj40-r8.myshopify.com";
// ⬇︎ THE ONLY FIELD LEFT TO FILL IN. Paste your Storefront API access token
// here. To create one: Shopify admin → Settings → Apps and sales channels →
// Develop apps → create an app → Storefront API scopes (enable
// unauthenticated_write_checkouts, unauthenticated_read_checkouts, and
// unauthenticated_read_product_listings) → Install app → copy the Storefront
// API access token. This token is public/client-safe, so it's fine here.
const SHOPIFY_STOREFRONT_TOKEN = "YOUR_PUBLIC_STOREFRONT_ACCESS_TOKEN";
const SHOPIFY_STOREFRONT_API_VERSION = "2025-07";
// Map from kit type to its Shopify PRODUCT GID. The first variant of each
// product is resolved on demand (and cached) at checkout time.
const SHOPIFY_KIT_PRODUCTS = {
  "quilt": "gid://shopify/Product/9579160666333",
  "cross-stitch": "gid://shopify/Product/9579160600797",
};
// Line-item property carried into the Shopify order; the fulfillment backend
// keys off this exact name to trace a kit back to its design.
const DESIGN_ID_ATTRIBUTE = "_design_id";

// True until the placeholders above are replaced with real values. When still
// unconfigured, the checkout button falls back to the save-only behavior so
// the app keeps working before Shopify is wired up.
function shopifyConfigured(type) {
  const product = SHOPIFY_KIT_PRODUCTS[type];
  return (
    !!SHOPIFY_STORE_DOMAIN && !SHOPIFY_STORE_DOMAIN.startsWith("your-store") &&
    !!SHOPIFY_STOREFRONT_TOKEN && !SHOPIFY_STOREFRONT_TOKEN.startsWith("YOUR_") &&
    !!product && !product.includes("REPLACE_WITH")
  );
}

// Session cache of product GID → resolved variant GID, so repeat checkouts in
// the same page load don't re-query the Storefront API.
const shopifyVariantCache = new Map();

// Resolves a product GID to its first/default variant GID via the Storefront
// API. Single-variant kit products have exactly one variant, which is the one
// we add to the cart. Results are memoized in shopifyVariantCache. Throws a
// clear error if the product or its variant can't be found.
async function resolveVariantId(productGid) {
  if (shopifyVariantCache.has(productGid)) return shopifyVariantCache.get(productGid);
  const endpoint = `https://${SHOPIFY_STORE_DOMAIN}/api/${SHOPIFY_STOREFRONT_API_VERSION}/graphql.json`;
  const query = `
    query($id: ID!) {
      product(id: $id) {
        variants(first: 1) { nodes { id } }
      }
    }`;
  const res = await fetch(endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Shopify-Storefront-Access-Token": SHOPIFY_STOREFRONT_TOKEN,
    },
    body: JSON.stringify({ query, variables: { id: productGid } }),
  });
  if (!res.ok) throw new Error(`Shopify variant lookup failed (HTTP ${res.status})`);
  const body = await res.json();
  if (body.errors && body.errors.length) {
    throw new Error(body.errors[0].message || "Shopify GraphQL error");
  }
  const product = body.data && body.data.product;
  if (!product) throw new Error("Shopify product not found — check the product GID");
  const nodes = product.variants && product.variants.nodes;
  const variantId = nodes && nodes[0] && nodes[0].id;
  if (!variantId) throw new Error("Shopify product has no purchasable variant");
  shopifyVariantCache.set(productGid, variantId);
  return variantId;
}

// Creates a Shopify cart with a single kit line item that carries the studio
// design id as a line-item attribute, and resolves to the hosted checkout URL.
// Throws on userErrors or network/HTTP failure so callers can surface a clear
// inline error instead of silently dropping the design link.
async function addKitToShopifyCart({ variantId, designId }) {
  const endpoint = `https://${SHOPIFY_STORE_DOMAIN}/api/${SHOPIFY_STOREFRONT_API_VERSION}/graphql.json`;
  const query = `
    mutation cartCreate($input: CartInput!) {
      cartCreate(input: $input) {
        cart { checkoutUrl }
        userErrors { field message }
      }
    }`;
  const variables = {
    input: {
      lines: [{
        merchandiseId: variantId,
        quantity: 1,
        attributes: [{ key: DESIGN_ID_ATTRIBUTE, value: designId }],
      }],
    },
  };
  const res = await fetch(endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Shopify-Storefront-Access-Token": SHOPIFY_STOREFRONT_TOKEN,
    },
    body: JSON.stringify({ query, variables }),
  });
  if (!res.ok) throw new Error(`Shopify cart create failed (HTTP ${res.status})`);
  const body = await res.json();
  if (body.errors && body.errors.length) {
    throw new Error(body.errors[0].message || "Shopify GraphQL error");
  }
  const result = body.data && body.data.cartCreate;
  if (result && result.userErrors && result.userErrors.length) {
    throw new Error(result.userErrors[0].message || "Shopify cart error");
  }
  const checkoutUrl = result && result.cart && result.cart.checkoutUrl;
  if (!checkoutUrl) throw new Error("Shopify cart create failed (no checkout URL)");
  return checkoutUrl;
}

// ── Saved-quilt persistence (device-local, survives refresh/close) ─────────
// Quilts are stored in the browser's localStorage under a versioned key so we
// can migrate the shape later without clobbering older saves.
const QUILTS_KEY = "metime.savedQuilts.v1";
function loadSavedQuilts() {
  try {
    const raw = localStorage.getItem(QUILTS_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.warn("Could not read saved quilts:", e);
    return [];
  }
}
function persistSavedQuilts(quilts) {
  try {
    localStorage.setItem(QUILTS_KEY, JSON.stringify(quilts));
    return true;
  } catch (e) {
    // Most likely QuotaExceededError (localStorage is ~5MB per origin).
    console.warn("Could not save quilts:", e);
    return false;
  }
}

const STITCHES_KEY = "metime.savedStitches.v1";
function loadSavedStitches() {
  try {
    const raw = localStorage.getItem(STITCHES_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    console.warn("Could not read saved designs:", e);
    return [];
  }
}
function persistSavedStitches(designs) {
  try {
    localStorage.setItem(STITCHES_KEY, JSON.stringify(designs));
    return true;
  } catch (e) {

// ── Design-store API (server-side, powers checkout) ────────────────────────
// POSTs a finished design to /api/designs (same-origin serverless function)
// and resolves to the server's opaque design id. That id is the handle a
// Shopify order will carry (as a cart attribute) so a purchased kit can be
// traced back to the exact design, long after this device's localStorage is
// gone.
async function saveDesignToApi(type, data) {
  const res = await fetch("/api/designs", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, data }),
  });
  if (!res.ok) throw new Error(`design save failed (HTTP ${res.status})`);
  const body = await res.json();
  if (!body || typeof body.id !== "string") throw new Error("design save failed (bad response)");
  return body.id;
}

// Serializes a design for the API: drops local-only fields (`id`, `apiId`,
// `bgImage`) and any embedded photo data — a photo backing stores its image
// as a ~500 KB data URL in `backing.image`, which the server never renders
// and which blows past the API's payload cap (photo fabrics keep small asset
// URLs, which pass through untouched). Returns a fresh object; the saved
// design is never mutated.
function apiSafeDesign(design) {
  const { id: _id, apiId: _apiId, bgImage: _bgImage, ...data } = design;
  const stripPhoto = (o) => {
    if (!o || typeof o !== "object") return o;
    if (typeof o.image === "string" && o.image.startsWith("data:")) {
      const { image: _image, ...rest } = o;
      return rest;
    }
    return o;
  };
  if (data.backing) data.backing = stripPhoto(data.backing);
  if (data.binding) data.binding = stripPhoto(data.binding);
  if (Array.isArray(data.pinned)) data.pinned = data.pinned.map(stripPhoto);
  return data;
}

// Renders a design to a PDF on the server (POST /api/render) and triggers a
// download in the browser. `doc` is "chart" (quilt: template + per-piece cut
// list) or "instructions" (assembly steps). No upload/storage round-trip —
// the design travels in the request body.
async function downloadDesignPdf(type, design, doc) {
  const data = apiSafeDesign(design);
  const res = await fetch("/api/render", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, data, doc }),
  });
  if (!res.ok) throw new Error(`render failed (HTTP ${res.status})`);
  const blob = await res.blob();
  const cd = res.headers.get("Content-Disposition") || "";
  const m = cd.match(/filename="([^"]+)"/);
  const filename = (m && m[1]) || `${(design.name || type).toString().replace(/[^a-z0-9]+/gi, "-").toLowerCase()}-${doc}.pdf`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Checkout button shared by the quilt and cross-stitch preview modals. On
// click it (1) sends the design to the design-store API once and remembers the
// returned id via onSaved (persisted as `apiId` on the saved entry, so a
// design is never uploaded twice), then (2) creates a Shopify cart whose kit
// line item carries that id as the `_design_id` attribute and redirects to the
// hosted checkout. Local-only fields and embedded photo data are stripped via
// apiSafeDesign so the upload stays under the API's payload cap. If Shopify
// isn't configured yet (placeholders untouched), it falls back to save-only so
// the app still works.
function KitCheckoutButton({ type, design, savedId, onSaved }) {
  const [state, setState] = useState(savedId ? { status: "done", id: savedId } : { status: "idle" });
  const busy = state.status === "saving" || state.status === "redirecting";
  // Uploads the design if not already saved and returns its api id.
  const ensureSaved = async () => {
    if (savedId) return savedId;
    if (state.status === "done" && state.id) return state.id;
    const data = apiSafeDesign(design);
    const id = await saveDesignToApi(type, data);
    if (onSaved) onSaved(id);
    return id;
  };
  const submit = async () => {
    if (busy) return;
    setState({ status: "saving" });
    let designId;
    try {
      designId = await ensureSaved();
    } catch (e) {
      console.warn("Design save failed:", e);
      setState({ status: "error", message: "Couldn't reach the kit service — try again" });
      return;
    }
    // Not connected to Shopify yet — keep the design saved and stop here.
    if (!shopifyConfigured(type)) {
      setState({ status: "done", id: designId });
      return;
    }
    setState({ status: "redirecting", id: designId });
    try {
      // Resolve the product GID to its first/default variant (cached), then
      // create the cart with that variant carrying the design id.
      const variantId = await resolveVariantId(SHOPIFY_KIT_PRODUCTS[type]);
      const checkoutUrl = await addKitToShopifyCart({ variantId, designId });
      window.location.href = checkoutUrl;
    } catch (e) {
      console.warn("Shopify checkout failed:", e);
      setState({ status: "error", id: designId, message: "Checkout isn't set up yet — your design is saved (Kit ID " + designId + ")" });
    }
  };
  const label = state.status === "saving" ? "Saving…"
    : state.status === "redirecting" ? "Opening checkout…"
    : state.status === "done" ? "Saved for checkout ✓"
    : "Add to cart";
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
      <button className="btn btn-dark" disabled={busy}
        style={{ display: "flex", alignItems: "center", gap: 6, padding: "10px 20px", fontSize: 13, opacity: busy ? 0.7 : 1 }}
        onClick={submit}>
        <i className="iconoir-cart" style={{ fontSize: 16 }}/>
        {label}
      </button>
      {state.status === "done" && (
        <div style={{ fontSize: 11, color: "var(--warm-muted)", fontVariantNumeric: "tabular-nums" }}>
          Kit ID {state.id}
        </div>
      )}
      {state.status === "error" && (
        <div style={{ fontSize: 11, color: "#B23A34" }}>{state.message || "Couldn't reach the kit service — try again"}</div>
      )}
    </div>
  );
}

// Two "Download PDF" buttons for a quilt: the cut list & template, and the
// assembly instructions. Both hit /api/render (server-side HTML → PDF); each
// manages its own busy state so a slow render doesn't block the other.
function QuiltPdfButtons({ design }) {
  const [busy, setBusy] = useState(null); // "chart" | "instructions" | null
  const [error, setError] = useState(null);
  const go = async (doc) => {
    if (busy) return;
    setBusy(doc); setError(null);
    try {
      await downloadDesignPdf("quilt", design, doc);
    } catch (e) {
      console.warn("PDF download failed:", e);
      setError("Couldn't generate the PDF — please try again in a moment.");
    } finally {
      setBusy(null);
    }
  };
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
      <div className="label" style={{ fontSize: 11 }}>Download for making</div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button className="btn btn-sm" disabled={!!busy} style={{ opacity: busy && busy !== "chart" ? 0.6 : 1 }}
          onClick={() => go("chart")}>
          {busy === "chart" ? "Preparing…" : "Cut list & template"}
        </button>
        <button className="btn btn-sm" disabled={!!busy} style={{ opacity: busy && busy !== "instructions" ? 0.6 : 1 }}
          onClick={() => go("instructions")}>
          {busy === "instructions" ? "Preparing…" : "Instructions"}
        </button>
      </div>
      {error && <div style={{ fontSize: 11, color: "#B23A34" }}>{error}</div>}
    </div>
  );
}

// Compact, run-length-encoded grid so saved designs stay small in localStorage.
function serializeGrid(cells) {
  const colors = [], cidx = new Map(), vals = new Array(cells.length);
  for (let i = 0; i < cells.length; i++) {
    const h = cells[i];
    if (!h) { vals[i] = 0; continue; }
    let ix = cidx.get(h);
    if (ix === undefined) { ix = colors.length; colors.push(h); cidx.set(h, ix); }
    vals[i] = ix + 1;
  }
  const runs = [];
  let i = 0;
  while (i < vals.length) { let j = i + 1; while (j < vals.length && vals[j] === vals[i]) j++; runs.push((j - i) + '.' + vals[i]); i = j; }
  return { colors, rle: runs.join('|') };
}
function deserializeGrid(g, len) {
  const cells = new Array(len).fill(null);
  if (!g || !g.rle) return cells;
  let i = 0;
  for (const run of g.rle.split('|')) {
    const dot = run.indexOf('.');
    const c = +run.slice(0, dot), v = +run.slice(dot + 1);
    for (let k = 0; k < c && i < len; k++) { if (v > 0) cells[i] = g.colors[v - 1] || null; i++; }
  }
  return cells;
}
// Tally filled stitches per floss color for the materials readout.
function computeStitchStats(cells, W, H, pal) {
  const map = new Map();
  let total = 0;
  for (const h of cells) {
    if (!h) continue;
    total++;
    map.set(h, (map.get(h) || 0) + 1);
  }
  const byHex = new Map((pal || []).map(c => [c.hex, c]));
  const colors = Array.from(map.entries()).map(([hex, count]) => {
    const dmc = byHex.get(hex) || DMC.find(c => c.hex === hex) || { code: "?", name: "Custom", hex };
    return { hex, code: dmc.code, name: dmc.name, count };
  }).sort((a, b) => b.count - a.count);
  return { total, possible: W * H, colors };
}

// reuse the same group-filter pills as the Kona (quilt) library.
function colorGroup(hex) {

// ── Palette helpers ─────────────────────────────────────────────────────────
const konaByName = name => KONA.find(c => c.name === name);
function resolvePalette(pal) {
  return pal.colors.map(konaByName).filter(Boolean);
}
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
}
function rgbToHex(r, g, b) {
  const c = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0');
  return `#${c(r)}${c(g)}${c(b)}`.toUpperCase();
}
// Closest fabric in the KONA library to an arbitrary RGB color.
function nearestKona({ r, g, b }) {
  let best = null, bd = Infinity;
  for (const c of KONA) {
    const k = hexToRgb(c.hex);
    const d = (r - k.r) ** 2 + (g - k.g) ** 2 + (b - k.b) ** 2;
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}
// Median-cut color quantization → top `count` colors, sorted by population.
function extractColors(imageData, count) {
  const data = imageData.data, pixels = [];
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 125) continue;
    pixels.push([data[i], data[i + 1], data[i + 2]]);
  }
  if (!pixels.length) return [];
  const rangeOf = b => {
    let mn = [255, 255, 255], mx = [0, 0, 0];
    for (const p of b) for (let c = 0; c < 3; c++) { if (p[c] < mn[c]) mn[c] = p[c]; if (p[c] > mx[c]) mx[c] = p[c]; }
    return Math.max(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]);
  };
  const widestChannel = b => {
    let mn = [255, 255, 255], mx = [0, 0, 0];
    for (const p of b) for (let c = 0; c < 3; c++) { if (p[c] < mn[c]) mn[c] = p[c]; if (p[c] > mx[c]) mx[c] = p[c]; }
    const r = mx[0] - mn[0], g = mx[1] - mn[1], bl = mx[2] - mn[2];
    return r >= g && r >= bl ? 0 : g >= bl ? 1 : 2;
  };
  let buckets = [pixels];
  while (buckets.length < count) {
    buckets.sort((a, b) => rangeOf(b) - rangeOf(a));
    const big = buckets.shift();
    if (!big || big.length < 2) { if (big) buckets.unshift(big); break; }
    const ch = widestChannel(big);
    big.sort((x, y) => x[ch] - y[ch]);
    const mid = Math.floor(big.length / 2);
    buckets.push(big.slice(0, mid), big.slice(mid));
  }
  return buckets.map(b => {
    const n = b.length;
    let r = 0, g = 0, bl = 0;
    for (const p of b) { r += p[0]; g += p[1]; bl += p[2]; }
    return { r: r / n, g: g / n, b: bl / n, hex: rgbToHex(r / n, g / n, bl / n), pop: n };
  }).sort((a, b) => b.pop - a.pop);
}
