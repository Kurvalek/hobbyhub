// ── Canvas pinch / ctrl-wheel zoom (shared by quilt + cross-stitch) ───────
// Zoom is applied by resizing content; pan is the scroll container. Pinch and
// ctrl/cmd+wheel update zoom while anchoring the focal point under the fingers
// (or cursor). Two-finger drag also pans. Drawing tools must bail while a
// multi-touch gesture is active — call isGestureActive() from pointer handlers.
function clampZoom(z) {
  return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +(+z).toFixed(3)));
}
function useCanvasPinchZoom(scrollRef, zoom, onZoomChange, onGestureStart) {
  const zoomRef = useRef(zoom);
  const pointersRef = useRef(new Map());
  const pinchRef = useRef(null);
  const pendingScrollRef = useRef(null);
  const activeRef = useRef(false);
  const onZoomChangeRef = useRef(onZoomChange);
  const onGestureStartRef = useRef(onGestureStart);

  useEffect(() => { zoomRef.current = zoom; }, [zoom]);
  useEffect(() => { onZoomChangeRef.current = onZoomChange; }, [onZoomChange]);
  useEffect(() => { onGestureStartRef.current = onGestureStart; }, [onGestureStart]);

  useLayoutEffect(() => {
    const p = pendingScrollRef.current;
    if (!p) return;
    pendingScrollRef.current = null;
    p.el.scrollLeft = p.left;
    p.el.scrollTop = p.top;
  }, [zoom]);

  useEffect(() => {
    const el = scrollRef.current;
    if (!el || !onZoomChange) return undefined;

    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

    const setZoomAnchored = (nextZoom, clientX, clientY) => {
      const prev = zoomRef.current;
      const z = clampZoom(nextZoom);
      if (Math.abs(z - prev) < 0.001) return;
      const rect = el.getBoundingClientRect();
      const vx = clientX - rect.left;
      const vy = clientY - rect.top;
      pendingScrollRef.current = {
        el,
        left: (el.scrollLeft + vx) * (z / prev) - vx,
        top: (el.scrollTop + vy) * (z / prev) - vy,
      };
      zoomRef.current = z;
      onZoomChangeRef.current(z);
    };

    const beginPinch = () => {
      const pts = [...pointersRef.current.values()];
      if (pts.length < 2) return;
      pinchRef.current = {
        startDist: Math.max(1, dist(pts[0], pts[1])),
        startZoom: zoomRef.current,
        lastMid: mid(pts[0], pts[1]),
      };
      if (!activeRef.current) {
        activeRef.current = true;
        onGestureStartRef.current?.();
      }
    };

    const onPointerDown = (e) => {
      if (e.pointerType === 'mouse') return;
      pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointersRef.current.size >= 2) {
        beginPinch();
        e.preventDefault();
      }
    };

    const onPointerMove = (e) => {
      if (!pointersRef.current.has(e.pointerId)) return;
      pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointersRef.current.size < 2 || !pinchRef.current) return;
      e.preventDefault();
      const pts = [...pointersRef.current.values()];
      const m = mid(pts[0], pts[1]);
      const p = pinchRef.current;
      el.scrollLeft += p.lastMid.x - m.x;
      el.scrollTop += p.lastMid.y - m.y;
      p.lastMid = m;
      setZoomAnchored(p.startZoom * (dist(pts[0], pts[1]) / p.startDist), m.x, m.y);
    };

    const endPointer = (e) => {
      if (!pointersRef.current.has(e.pointerId)) return;
      pointersRef.current.delete(e.pointerId);
      if (pointersRef.current.size >= 2) {
        beginPinch();
      } else {
        pinchRef.current = null;
        if (pointersRef.current.size === 0) activeRef.current = false;
      }
    };

    const onWheel = (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      const factor = Math.exp(-e.deltaY * 0.01);
      setZoomAnchored(zoomRef.current * factor, e.clientX, e.clientY);
    };

    // Safari page-zoom gesture — keep it from hijacking the canvas.
    const onGesture = (e) => { e.preventDefault(); };

    el.addEventListener('pointerdown', onPointerDown, true);
    el.addEventListener('pointermove', onPointerMove, true);
    el.addEventListener('pointerup', endPointer, true);
    el.addEventListener('pointercancel', endPointer, true);
    el.addEventListener('wheel', onWheel, { passive: false });
    el.addEventListener('gesturestart', onGesture, { passive: false });
    el.addEventListener('gesturechange', onGesture, { passive: false });

    return () => {
      el.removeEventListener('pointerdown', onPointerDown, true);
      el.removeEventListener('pointermove', onPointerMove, true);
      el.removeEventListener('pointerup', endPointer, true);
      el.removeEventListener('pointercancel', endPointer, true);
      el.removeEventListener('wheel', onWheel);
      el.removeEventListener('gesturestart', onGesture);
      el.removeEventListener('gesturechange', onGesture);
    };
  }, [scrollRef, onZoomChange]);

  const isGestureActive = useCallback(() => activeRef.current, []);
  return { isGestureActive };
}

// ── ZoomBar (bottom of center canvas panel) ───────────────────────────────
function ZoomBar({ zoom, onZoomChange, onReset, onStep }) {
  const pct = Math.round(zoom * 100);
  return (
    <div className="zoom-bar">
      <button
        className="icon-btn"
        style={{ width:24, height:24, fontSize:14, lineHeight:1 }}
        onClick={()=>onStep(-ZOOM_STEP)}
        disabled={zoom <= ZOOM_MIN}
        title="Zoom out (Ctrl/Cmd -)">−</button>
      <input
        type="range"
        min={ZOOM_MIN}
        max={ZOOM_MAX}
        step={ZOOM_STEP}
        value={zoom}
        onChange={e => onZoomChange(+e.target.value)}/>
      <button
        className="icon-btn"
        style={{ width:24, height:24, fontSize:14, lineHeight:1 }}
        onClick={()=>onStep(+ZOOM_STEP)}
        disabled={zoom >= ZOOM_MAX}
        title="Zoom in (Ctrl/Cmd +)">+</button>
      <span className="zoom-bar-value">{pct}%</span>
      <button
        className="btn btn-xs"
        onClick={onReset}
        disabled={zoom === 1}
        title="Reset zoom (Ctrl/Cmd 0)">1:1</button>
    </div>
  );
}

// ── Switch (reusable pill on/off toggle) ──────────────────────────────────
function Switch({ checked, onChange, label, title }) {
  return (
    <button
      type="button"
      role="switch"
      aria-checked={checked}
      className="switch"
      title={title}
      onClick={() => onChange(!checked)}>
      <span className="switch-track"><span className="switch-knob"/></span>
      {label && <span className="switch-label">{label}</span>}
    </button>
  );
}

// ── SizeBar (top of center canvas panel) ──────────────────────────────────
function SizeBar({ bs, minBs = 2, maxBs, onBsChange, fw, fh, cols, rows, onUndo, undoDisabled, onClear, clearDisabled }) {
  return (
    <div className="size-bar">
      <div className="size-bar-slider">
        <span className="size-bar-label">Block size</span>
        <input
          type="range"
          min={minBs}
          max={maxBs}
          step={1}
          value={bs}
          onChange={e => onBsChange(+e.target.value)}/>
        <span className="size-bar-value">{bs}"</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
        <div className="size-bar-meta">
          <span>cut {bs + SEAM}"</span>
          <span>{cols} × {rows} blocks</span>
          <span>{fw}" × {fh}"</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <button className="icon-btn" onClick={onUndo} disabled={undoDisabled} title="Undo (⌘Z)"><IcUndo/></button>
          <button className="btn" onClick={onClear} disabled={clearDisabled} title="Clear the quilt">Clear</button>
        </div>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────
function App({ initialPreset = "Throw", initialPalette = null, initialBacking = null, initialQuilt = null, initialTemplate = null, onBack }) {
  const _initP = PRESETS.find(x => x.name === initialPreset) || PRESETS.find(x => x.name === "Throw") || PRESETS[0];
  // Clamp the starting block size to what this preset allows (Coaster tops out
  // at 2" and can go to 1"), so the size control opens in a coherent range.
  const _initMinBs = initialPreset === 'Coaster' ? 1 : 2;
  const _initMaxBs = Math.max(_initMinBs, Math.min(12, Math.floor(Math.min(_initP.w, _initP.h) / 2)));
  const _initBs = Math.max(_initMinBs, Math.min(_initMaxBs, 3));
  const _initCols = Math.min(MAX, Math.max(2, Math.round(_initP.w / _initBs)));
  const _initRows = Math.min(MAX, Math.max(2, Math.round(_initP.h / _initBs)));
  const [cols, setCols] = useState(_initCols);
  const [rows, setRows] = useState(_initRows);
  const [bs, setBs] = useState(_initBs);
  const [panelOpen, setPanelOpen] = useState(() => (typeof window === 'undefined' || window.innerWidth > 900));
  const isMobile = useIsMobile();
  // Mobile bottom-sheet router: null | 'palette' | 'size' | 'fabrics' | 'pattern' | 'materials'
  const [sheet, setSheet] = useState(null);
  const [shapes, _setShapes] = useState(() =>
    (initialTemplate && typeof initialTemplate.build === 'function')
      ? initialTemplate.build({ cols: _initCols, rows: _initRows, palette: initialPalette })
      : []);
  const historyRef = useRef([]);
  const setShapes = useCallback(updater => {
    _setShapes(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      historyRef.current.push(prev);
      if (historyRef.current.length > 100) historyRef.current.shift();
      return next;
    });
  }, []);
  const undo = useCallback(() => {
    if (historyRef.current.length === 0) return;
    const prev = historyRef.current.pop();
    _setShapes(prev);
    setSelIds(new Set());
  }, []);
  const [selIds, setSelIds] = useState(new Set());
  const [color, setColor] = useState(
    (initialPalette && initialPalette[0]) || KONA.find(c=>c.name==="Navy") || KONA[0]
  );
  const [tool, setTool] = useState("paint");
  const [search, setSearch] = useState("");
  const [grp, setGrp] = useState("All");
  const [customs, setCustoms] = useState([]);
  const [pinned, setPinned] = useState(
    (initialPalette && initialPalette.length) ? initialPalette : [
      KONA.find(c=>c.name==="White"), KONA.find(c=>c.name==="Black"),
      KONA.find(c=>c.name==="Natural"), KONA.find(c=>c.name==="Navy"),
      KONA.find(c=>c.name==="Rich Red"), KONA.find(c=>c.name==="Mustard"),
    ].filter(Boolean)
  );
  const [preset, setPreset] = useState(initialPreset);
  const [backing, setBacking] = useState(initialBacking);
  const [binding, setBinding] = useState(null);
  const [qPattern, setQPattern] = useState("none");
  const [qSpacing, setQSpacing] = useState(2);
  const [qColor, setQColor] = useState({ name:"White", hex:"#fff" });
  const [showQ, setShowQ] = useState(true);
  const [confirmClear, setConfirmClear] = useState(false);
  const [savedQuilts, setSavedQuilts] = useState(loadSavedQuilts);
  const [saveError, setSaveError] = useState("");
  // Persist to the browser whenever the collection changes so quilts survive
  // refreshes, closing the tab, and coming back later on this device.
  useEffect(() => {
    const ok = persistSavedQuilts(savedQuilts);
    setSaveError(ok ? "" : "Couldn't save — this device's storage may be full.");
  }, [savedQuilts]);
  const [showSave, setShowSave] = useState(false);
  const [saveName, setSaveName] = useState("");
  const [viewQuilt, setViewQuilt] = useState(null);
  const [showMyQuilts, setShowMyQuilts] = useState(false);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  // Id of the saved quilt currently open on the canvas (null for an unsaved
  // design). Lets "Save" update in place instead of spawning a duplicate.
  const [currentQuiltId, setCurrentQuiltId] = useState(null);
  const [justSaved, setJustSaved] = useState(false);
  const savedFlashRef = useRef(null);
  const flashSaved = useCallback(() => {
    setJustSaved(true);
    if (savedFlashRef.current) clearTimeout(savedFlashRef.current);
    savedFlashRef.current = setTimeout(() => setJustSaved(false), 1600);
  }, []);
  const currentQuilt = savedQuilts.find(q => q.id === currentQuiltId) || null;
  // Snapshot every piece of editor state we persist. `id`/`name` are supplied
  // by the caller so the same builder serves both "save new" and "update".
  const buildQuiltRecord = (id, name) => ({
    id, name, shapes: [...shapes], cols, rows, bs, preset, backing, binding, pinned: [...pinned],
    qPattern, qSpacing, qColor, showQ, materials: { ...materials }, fw, fh, backCalc, bindCalc, grandTotal,
    updatedAt: Date.now(),
  });
  const saveNewQuilt = () => {
    const name = saveName.trim(); if (!name) return;
    const id = Date.now();
    setSavedQuilts(p => [buildQuiltRecord(id, name), ...p]);
    setCurrentQuiltId(id);
    setShowSave(false); setSaveName('');
    flashSaved();
  };
  const updateCurrentQuilt = () => {
    if (currentQuiltId == null) return;
    setSavedQuilts(p => p.map(x => x.id === currentQuiltId ? buildQuiltRecord(currentQuiltId, x.name) : x));
    flashSaved();
  };

  // Restore a saved quilt back onto the editor canvas. Rebuilds every piece of
  // editor state we persisted so the design opens exactly as it was saved.
  const loadQuilt = useCallback((q) => {
    if (!q) return;
    setCurrentQuiltId(q.id ?? null);
    historyRef.current = [];
    _setShapes(Array.isArray(q.shapes) ? q.shapes : []);
    setSelIds(new Set());
    if (typeof q.cols === 'number') setCols(q.cols);
    if (typeof q.rows === 'number') setRows(q.rows);
    if (typeof q.bs === 'number') setBs(q.bs);
    if (q.preset) setPreset(q.preset);
    setBacking(q.backing || null);
    setBinding(q.binding || null);
    // Palette: prefer the saved "My palette", else rebuild it from the colors
    // actually used in the design (covers quilts saved before palette storage).
    let pal = Array.isArray(q.pinned) ? q.pinned.filter(Boolean) : [];
    if (!pal.length && Array.isArray(q.shapes)) {
      const seen = new Set();
      pal = [];
      for (const s of q.shapes) {
        if (s && s.color && s.color.hex && !seen.has(s.color.hex)) {
          seen.add(s.color.hex);
          pal.push(s.color);
        }
      }
    }
    if (pal.length) setPinned(pal);
    if (q.qPattern) setQPattern(q.qPattern);
    if (typeof q.qSpacing === 'number') setQSpacing(q.qSpacing);
    if (q.qColor) setQColor(q.qColor);
    if (typeof q.showQ === 'boolean') setShowQ(q.showQ);
    setViewQuilt(null);
    setShowMyQuilts(false);
    setConfirmDeleteId(null);
  }, []);
  // When launched from the landing page's saved list, drop that quilt onto the
  // canvas immediately.
  useEffect(() => { if (initialQuilt) loadQuilt(initialQuilt); }, []);
  const [showHints, setShowHints] = useState(false);
  // The library popover doubles as a fabric picker. `picker` is null when
  // closed, otherwise an object describing the active picker config:
  //   { onPick?, onClear?, showMyPalette?, title? }
  // (Empty object => default paint behaviour from the My palette + button.)
  const [picker, setPicker] = useState(null);
  const helpAnchor = useRef(null);
  const libraryAnchorRef = useRef(null);
  const backingRowRef = useRef(null);
  const bindingRowRef = useRef(null);

  const openLibrary = useCallback((anchorRef) => {
    if (anchorRef && anchorRef.current) libraryAnchorRef.current = anchorRef.current;
    setPicker({});
  }, []);

  // Generic "color picker" popover with the My palette section pinned at the
  // top. Used for fabrics (backing/binding) and the thread color.
  const openColorPicker = useCallback((anchorRef, onPick, onClear, title) => {
    if (anchorRef && anchorRef.current) libraryAnchorRef.current = anchorRef.current;
    setPicker({ onPick, onClear, showMyPalette: true, title });
  }, []);

  const closePicker = useCallback(() => setPicker(null), []);

  const handleSwapTriColors = useCallback(() => {
    const sel = shapes.filter(s => selIds.has(s.id));
    const pids = new Set();
    for (const s of sel) if (s.pairId) pids.add(s.pairId);
    if (pids.size === 0) return;
    const colorByPair = new Map();
    for (const s of shapes) if (s.pairId && pids.has(s.pairId)) {
      if (!colorByPair.has(s.pairId)) colorByPair.set(s.pairId, {});
      colorByPair.get(s.pairId)[s.half] = s.color;
    }
    setShapes(p => p.map(s => {
      if (!s.pairId || !pids.has(s.pairId)) return s;
      const c = colorByPair.get(s.pairId);
      return { ...s, color: s.half === 'a' ? c.b : c.a };
    }));
  }, [shapes, selIds, setShapes]);

  const swapDisabled = useMemo(() => {
    if (selIds.size === 0) return true;
    return !shapes.some(s => selIds.has(s.id) && s.type === 'tri' && s.pairId);
  }, [shapes, selIds]);

  useEffect(() => {
    const handleKey = e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
        e.preventDefault();
        undo();
      }
    };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [undo]);

  const [zoom, setZoom] = useState(1);
  const adjustZoom = useCallback(delta => {
    setZoom(z => Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, +(z + delta).toFixed(2))));
  }, []);
  const resetZoom = useCallback(() => setZoom(1), []);

  useEffect(() => {
    const onKey = e => {
      if (!(e.metaKey || e.ctrlKey)) return;
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      if (e.key === '=' || e.key === '+') { e.preventDefault(); adjustZoom(+ZOOM_STEP); }
      else if (e.key === '-' || e.key === '_') { e.preventDefault(); adjustZoom(-ZOOM_STEP); }
      else if (e.key === '0') { e.preventDefault(); resetZoom(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [adjustZoom, resetZoom]);

  // Dismiss the selection (and its floating toolbar) when the user mouses down
  // anywhere outside the canvas frame, the toolbar itself, popovers, or modals.
  useEffect(() => {
    if (selIds.size === 0) return undefined;
    const onDown = e => {
      const t = e.target;
      if (!(t instanceof Element)) return;
      if (t.closest('.canvas-frame, .selection-toolbar, .popover, .popover-backdrop, .overlay, .my-palette')) return;
      setSelIds(new Set());
    };
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [selIds.size]);

  const allColors = useMemo(()=>[...customs,...KONA],[customs]);
  const filtered = useMemo(()=>{
    let l=allColors;
    if(grp!=="All") l=l.filter(c=>c.group===grp);
    if(search.trim()){const q=search.toLowerCase();l=l.filter(c=>c.name.toLowerCase().includes(q)||(c.code&&c.code.includes(q)));}
    return l;
  },[allColors,grp,search]);

  useEffect(()=>{
    setShapes(p=>p.map(s=>({...s,r:Math.min(s.r,rows-1),c:Math.min(s.c,cols-1),h:Math.max(1,Math.min(s.h,rows-Math.min(s.r,rows-1))),w:Math.max(1,Math.min(s.w,cols-Math.min(s.c,cols-1)))})));
    setSelIds(new Set());
  },[rows,cols]);

  // Kit fabric multiplier: e.g. a Coaster kit ships enough material for 4
  // (the user still designs only one). We pass this qty into the yardage
  // calcs so the extra units nest across the fabric width instead of naively
  // multiplying a full-width single-piece yardage by 4.
  const kitQty = (PRESETS.find(x=>x.name===preset)?.kitQty) || 1;

  const materials = useMemo(()=>{
    const map=new Map();
    const add=(col,amt)=>{if(!col)return;if(!map.has(col.name))map.set(col.name,{...col,count:0});map.get(col.name).count+=amt;};
    for(const s of shapes){
      const area=s.h*s.w;
      if(s.type==='tri') add(s.color,area*0.5);
      else add(s.color,area);
    }
    const items=Array.from(map.values()).map(c=>({...c,...calcYardage(c.count,bs,kitQty)})).sort((a,b)=>b.count-a.count);
    const total=shapes.reduce((sum,s)=>sum+(s.type==='tri'?s.h*s.w*0.5:s.h*s.w),0);
    return{items,total,possible:rows*cols,yards:items.reduce((s,x)=>s+x.yards,0)};
  },[shapes,bs,rows,cols,kitQty]);

  const fw=cols*bs, fh=rows*bs;
  const backCalc=useMemo(()=>calcBacking(fw,fh,kitQty),[fw,fh,kitQty]);
  const bindCalc=useMemo(()=>calcBinding(fw,fh,kitQty),[fw,fh,kitQty]);
  const grandTotal=materials.yards+(backing?backCalc.yards:0)+(binding?bindCalc.yards:0);

  // Smallest allowed block size. Most quilts stop at 2" blocks, but Coasters
  // are small enough that 1" blocks are useful, so we relax the floor there.
  const minBsFor = name => (name === 'Coaster' ? 1 : 2);
  const minBs = useMemo(() => minBsFor(preset), [preset]);

  const maxBs = useMemo(() => {
    const p = PRESETS.find(x => x.name === preset);
    if (!p) return 12;
    return Math.max(minBs, Math.min(12, Math.floor(Math.min(p.w, p.h) / 2)));
  }, [preset, minBs]);

  const applyPreset = name => {
    setPreset(name);
    const p = PRESETS.find(x => x.name === name);
    if (!p) return;
    const presetMinBs = minBsFor(name);
    const presetMaxBs = Math.max(presetMinBs, Math.min(12, Math.floor(Math.min(p.w, p.h) / 2)));
    const v = Math.max(presetMinBs, Math.min(presetMaxBs, bs));
    if (v !== bs) setBs(v);
    setCols(Math.min(MAX, Math.max(2, Math.round(p.w / v))));
    setRows(Math.min(MAX, Math.max(2, Math.round(p.h / v))));
  };

  const handleBsChange = newBs => {
    const v = Math.max(minBs, Math.min(maxBs, Math.round(newBs)));
    setBs(v);
    const p = PRESETS.find(x => x.name === preset);
    if (!p) return;
    setCols(Math.min(MAX, Math.max(2, Math.round(p.w / v))));
    setRows(Math.min(MAX, Math.max(2, Math.round(p.h / v))));
  };

  return (
    <div className="app">

      {/* Header */}
      <header>
        <div className="header-left" style={{display:'flex',alignItems:'center',gap:8}}>
          {onBack && (
            <button className="icon-btn" onClick={onBack} title="Back to projects" style={{marginRight:2}}>
              <i className="iconoir-arrow-left" style={{fontSize:18}}/>
            </button>
          )}
          <a className="brand" href="/" aria-label="metime — home">
            <MetimeLogo/>
          </a>
        </div>
        <div className="header-center">
          <PresetPill
            preset={preset}
            fw={fw} fh={fh}
            onApply={applyPreset}/>
        </div>
        <div className="header-right">
          <button className="icon-btn rp-toggle-header" aria-expanded={panelOpen} aria-controls="quilt-detail-panel"
            title={panelOpen ? 'Hide details panel' : 'Show details panel'}
            onClick={()=>setPanelOpen(v=>!v)}>
            <IcPanel/>
          </button>
          {savedQuilts.length>0 && (
            <button className="btn" style={{display:'flex',alignItems:'center',gap:5}} onClick={()=>setShowMyQuilts(true)}>
              <IcBook/> My quilts ({savedQuilts.length})
            </button>
          )}
          {currentQuilt ? (
            <>
              <button className="btn" title="Save as a new copy"
                onClick={()=>{setSaveName(((currentQuilt.name||'')+' copy').trim());setShowSave(true);}}>
                Save as…
              </button>
              <button className="btn btn-dark" title={`Update “${currentQuilt.name}”`} onClick={updateCurrentQuilt}>
                {justSaved ? 'Saved ✓' : 'Save'}
              </button>
            </>
          ) : (
            <button className="btn btn-dark" onClick={()=>{setSaveName('');setShowSave(true);}}>
              {justSaved ? 'Saved ✓' : 'Save quilt'}
            </button>
          )}
        </div>
      </header>

      {/* Body */}
      <div className={`body${panelOpen ? '' : ' rp-closed'}`}>

        {/* Left tool rail (desktop only; mobile uses the bottom toolbar) */}
        {!isMobile && (
          <ToolRail
            tool={tool}
            setTool={setTool}
            onToggleHints={()=>setShowHints(v=>!v)}
            hintsOn={showHints}
            helpRef={helpAnchor}/>
        )}

        {/* Center: canvas */}
        <div className="panel" style={{display:'flex',flexDirection:'column',background:'var(--app-bg)',borderRight:'none'}}>
          <SizeBar
            bs={bs}
            minBs={minBs}
            maxBs={maxBs}
            onBsChange={handleBsChange}
            fw={fw} fh={fh}
            cols={cols} rows={rows}
            onUndo={undo}
            undoDisabled={historyRef.current.length === 0}
            onClear={()=>setConfirmClear(true)}
            clearDisabled={shapes.length === 0}/>
          <div style={{flex:1,minHeight:0,position:'relative'}}>
            <GridCanvas cols={cols} rows={rows} shapes={shapes} setShapes={setShapes}
              selIds={selIds} setSelIds={setSelIds}
              tool={tool} selectedColor={color}
              quiltPattern={qPattern} quiltSpacing={qSpacing} quiltColor={qColor} showQuilting={showQ}
              zoom={zoom} onZoomChange={setZoom} pinned={pinned} isMobile={isMobile}/>
            {showHints && (
              <div className="hint-overlay">
                <span>Click to select · Drag to marquee</span>
                <span>·</span>
                <span>Shift+click to add/remove</span>
                <span>·</span>
                <span>Arrow keys to move · Delete to remove</span>
                <span>·</span>
                <span>Drag handles to resize · F to flip triangles</span>
              </div>
            )}
          </div>
          <ZoomBar
            zoom={zoom}
            onZoomChange={setZoom}
            onReset={resetZoom}
            onStep={adjustZoom}/>
        </div>

        {/* Right column (desktop only; mobile uses the bottom toolbar + sheets) */}
        {!isMobile && (<>
        {panelOpen && <div className="rp-backdrop" onClick={()=>setPanelOpen(false)}/>}
        {panelOpen && (
          <button className="rp-close icon-btn" title="Close panel" aria-label="Close panel" onClick={()=>setPanelOpen(false)}>
            <IcX/>
          </button>
        )}
        {!panelOpen && (
          <div className="rp-rail">
            <button className="icon-btn" aria-expanded={false} aria-controls="quilt-detail-panel"
              title="Expand details panel" aria-label="Expand details panel" onClick={()=>setPanelOpen(true)}>
              <IcPanel/>
            </button>
            <div className="rail-divider"/>
            <button className={`rp-rail-swatch${color ? '' : ' empty'}`} onClick={()=>setPanelOpen(true)}
              title={color ? `Current color: ${color.name}` : 'No color selected'}
              style={color ? {background:color.hex} : undefined}/>
            <div className="rp-rail-stat">
              <b>{Math.round(grandTotal * 10) / 10}</b>
              <span>yd</span>
            </div>
          </div>
        )}
        <div id="quilt-detail-panel" className="panel right-panel">
          <MyPaletteCard
            color={color}
            pinned={pinned}
            setPinned={setPinned}
            setColor={setColor}
            selIds={selIds}
            setShapes={setShapes}
            onOpenLibrary={openLibrary}/>
          <FabricRow
            ref={backingRowRef}
            label="Backing"
            fabric={backing}
            detail={backing ? `${backCalc.backingW}"×${backCalc.backingH}" · ${backCalc.widths}w · ${fmtY(backCalc.yards)}` : ''}
            onClick={() => openColorPicker(
              backingRowRef,
              setBacking,
              backing ? () => setBacking(null) : null,
              'Backing fabric')}/>
          <FabricRow
            ref={bindingRowRef}
            label="Binding"
            fabric={binding}
            detail={binding ? `${bindCalc.strips} strips · ${bindCalc.perimeter}" perim. · ${fmtY(bindCalc.yards)}` : ''}
            onClick={() => openColorPicker(
              bindingRowRef,
              setBinding,
              binding ? () => setBinding(null) : null,
              'Binding fabric')}/>
          <QuiltPatternBlock
            qPattern={qPattern} setQPattern={setQPattern}
            qSpacing={qSpacing} setQSpacing={setQSpacing}
            qColor={qColor} setQColor={setQColor}
            onPickColor={openColorPicker}
            showQ={showQ} setShowQ={setShowQ}/>
          <MaterialsBlock materials={materials} grandTotal={grandTotal} fmtY={fmtY}/>
          <div style={{borderTop:'1px solid var(--warm-divider-soft)',flex:1,overflowY:'auto'}}>
            <div style={{padding:'10px 16px 4px'}}>
              <div className="label">Quilt top · by color</div>
            </div>
            {materials.items.length===0 ? (
              <div style={{padding:'12px 16px',fontSize:12,color:'var(--warm-muted)',fontStyle:'italic'}}>Draw shapes to see your fabric list.</div>
            ) : materials.items.map(item=>(
              <div key={item.name} className="mat-row">
                <div style={{width:26,height:26,background:item.hex,border:'1px solid rgba(46,41,37,0.10)',borderRadius:3,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                  <div style={{fontSize:11,color:'var(--warm-muted)',fontFamily:'var(--font-mono)'}}>{item.count} pcs · {item.strips} strip{item.strips!==1?'s':''}</div>
                </div>
                <div style={{fontSize:14,fontWeight:600,fontVariantNumeric:'tabular-nums',color:'var(--warm-fg)'}}>{fmtY(item.yards)}</div>
              </div>
            ))}
            <div style={{padding:'12px 16px',fontSize:11,color:'var(--warm-muted)',lineHeight:1.6}}>
              Assumes 40" WOF, ¼" seam allowance. Backing adds 4" per side. Binding: 2.5" double-fold strips. Add 10–15% for shrinkage.
            </div>
          </div>
        </div>
        </>)}

        {/* Mobile bottom toolbar (Canva-style): tools + extras that open sheets */}
        {isMobile && (
          <MobileToolbar items={[
            { id:'select', label:'Select', icon:<IcCursor/>, active: tool==='select', onClick:()=>setTool('select') },
            { id:'paint', label:'Square', icon:<IcSquare/>, active: tool==='paint', onClick:()=>setTool('paint') },
            { id:'hst', label:'Triangle', icon:<IcTri/>, active: tool==='hst', onClick:()=>setTool('hst') },
            { id:'d1', divider:true },
            { id:'palette', label:'My palette', active: sheet==='palette',
              icon:<span className={`mt-swatch${color?'':' empty'}`} style={color?{background:color.hex}:undefined}/>,
              onClick:()=>setSheet(s=>s==='palette'?null:'palette') },
            { id:'size', label:'Quilt size', icon:<IcRuler/>, active: sheet==='size', onClick:()=>setSheet(s=>s==='size'?null:'size') },
            { id:'fabrics', label:'Backing & binding', icon:<IcTiles/>, active: sheet==='fabrics', onClick:()=>setSheet(s=>s==='fabrics'?null:'fabrics') },
            { id:'pattern', label:'Quilt pattern', icon:<IcGrid/>, active: sheet==='pattern', onClick:()=>setSheet(s=>s==='pattern'?null:'pattern') },
            { id:'materials', label:'Materials', icon:<IcList/>, active: sheet==='materials', onClick:()=>setSheet(s=>s==='materials'?null:'materials') },
            { id:'d2', divider:true },
            { id:'hints', label: showHints?'Hide hints':'Show hints', icon:<IcHelp/>, active: showHints, onClick:()=>setShowHints(v=>!v) },
          ]}/>
        )}
      </div>

      {/* Mobile bottom sheets (desktop shows this content in the right panel). */}
      {isMobile && sheet === 'palette' && (
        <BottomSheet onClose={()=>setSheet(null)} title="My palette">
          <MyPaletteCard color={color} pinned={pinned} setPinned={setPinned} setColor={setColor}
            selIds={selIds} setShapes={setShapes} onOpenLibrary={openLibrary}/>
        </BottomSheet>
      )}
      {isMobile && sheet === 'size' && (
        <BottomSheet onClose={()=>setSheet(null)} title="Quilt size">
          <div style={{ padding: '4px 6px 12px' }}>
            {PRESETS.map(p => (
              <button key={p.name} onClick={()=>{ applyPreset(p.name); setSheet(null); }}
                style={{ display:'flex', justifyContent:'space-between', alignItems:'center', width:'100%',
                  padding:'11px 12px', borderRadius:6, border:'none',
                  background: preset===p.name ? 'var(--warm-hover)' : 'transparent', cursor:'pointer',
                  fontFamily:'var(--font-sans)', fontSize:14, color:'var(--warm-fg)', textAlign:'left' }}>
                <span style={{ fontWeight: preset===p.name ? 500 : 400 }}>{p.name}</span>
                <span style={{ fontFamily:'var(--font-mono)', fontSize:12, color:'var(--warm-muted)' }}>{p.w}" × {p.h}"</span>
              </button>
            ))}
          </div>
        </BottomSheet>
      )}
      {isMobile && sheet === 'fabrics' && (
        <BottomSheet onClose={()=>setSheet(null)} title="Backing & binding">
          <FabricRow ref={backingRowRef} label="Backing" fabric={backing}
            detail={backing ? `${backCalc.backingW}"×${backCalc.backingH}" · ${backCalc.widths}w · ${fmtY(backCalc.yards)}` : ''}
            onClick={() => openColorPicker(backingRowRef, setBacking, backing ? () => setBacking(null) : null, 'Backing fabric')}/>
          <FabricRow ref={bindingRowRef} label="Binding" fabric={binding}
            detail={binding ? `${bindCalc.strips} strips · ${bindCalc.perimeter}" perim. · ${fmtY(bindCalc.yards)}` : ''}
            onClick={() => openColorPicker(bindingRowRef, setBinding, binding ? () => setBinding(null) : null, 'Binding fabric')}/>
        </BottomSheet>
      )}
      {isMobile && sheet === 'pattern' && (
        <BottomSheet onClose={()=>setSheet(null)} title="Quilt pattern">
          <QuiltPatternBlock qPattern={qPattern} setQPattern={setQPattern} qSpacing={qSpacing} setQSpacing={setQSpacing}
            qColor={qColor} setQColor={setQColor} onPickColor={openColorPicker} showQ={showQ} setShowQ={setShowQ}/>
        </BottomSheet>
      )}
      {isMobile && sheet === 'materials' && (
        <BottomSheet onClose={()=>setSheet(null)} title="Materials">
          <MaterialsBlock materials={materials} grandTotal={grandTotal} fmtY={fmtY}/>
          <div style={{borderTop:'1px solid var(--warm-divider-soft)'}}>
            <div style={{padding:'10px 16px 4px'}}><div className="label">Quilt top · by color</div></div>
            {materials.items.length===0 ? (
              <div style={{padding:'12px 16px',fontSize:12,color:'var(--warm-muted)',fontStyle:'italic'}}>Draw shapes to see your fabric list.</div>
            ) : materials.items.map(item=>(
              <div key={item.name} className="mat-row">
                <div style={{width:26,height:26,background:item.hex,border:'1px solid rgba(46,41,37,0.10)',borderRadius:3,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                  <div style={{fontSize:11,color:'var(--warm-muted)',fontFamily:'var(--font-mono)'}}>{item.count} pcs · {item.strips} strip{item.strips!==1?'s':''}</div>
                </div>
                <div style={{fontSize:14,fontWeight:600,fontVariantNumeric:'tabular-nums',color:'var(--warm-fg)'}}>{fmtY(item.yards)}</div>
              </div>
            ))}
          </div>
        </BottomSheet>
      )}

      {/* Library popover. Anchored to whatever invoked it (My palette + or a
          fabric row); doubles as a fabric picker when `picker.onPick` is set. */}
      {picker && libraryAnchorRef.current && (
        <LibraryPopover
          anchorRef={libraryAnchorRef}
          onClose={closePicker}
          search={search} setSearch={setSearch}
          grp={grp} setGrp={setGrp}
          filtered={filtered}
          color={color} setColor={setColor}
          selIds={selIds} setShapes={setShapes}
          customs={customs} setCustoms={setCustoms}
          setPinned={setPinned}
          allColors={allColors}
          pinned={pinned}
          showMyPalette={picker.showMyPalette}
          onPick={picker.onPick}
          onClear={picker.onClear}
          title={picker.title}
          isMobile={isMobile}/>
      )}

      {/* Clear confirm */}
      {confirmClear && (
        <div className="overlay" onClick={()=>setConfirmClear(false)}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:'#FFFFFF',border:'1px solid #E2DDD2',borderRadius:8,padding:24,maxWidth:340,width:'100%',margin:16,boxShadow:'0 8px 32px rgba(46,41,37,0.14)'}}>
            <div style={{fontWeight:400,fontSize:24,marginBottom:8,fontFamily:"var(--font-display)",lineHeight:1.1}}>Clear the quilt?</div>
            <div style={{fontSize:13,color:'#5C544A',marginBottom:20,lineHeight:1.5}}>This will remove all shapes from your design. This cannot be undone.</div>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <button className="btn" onClick={()=>setConfirmClear(false)}>Cancel</button>
              <button className="btn btn-dark" onClick={()=>{setShapes([]);setSelIds(new Set());setConfirmClear(false);}}>Clear all</button>
            </div>
          </div>
        </div>
      )}

      {/* Save dialog */}
      {showSave && (
        <div className="overlay" onClick={()=>setShowSave(false)}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:'#FFFFFF',border:'1px solid #E2DDD2',borderRadius:8,padding:24,maxWidth:380,width:'100%',margin:16,boxShadow:'0 8px 32px rgba(46,41,37,0.14)'}}>
            <div style={{fontWeight:400,fontSize:24,marginBottom:16,fontFamily:"var(--font-display)",lineHeight:1.1}}>{currentQuilt?'Save a copy':'Save your quilt'}</div>
            <input type="text" placeholder="Give your quilt a name…" value={saveName} onChange={e=>setSaveName(e.target.value)}
              autoFocus onKeyDown={e=>{if(e.key==='Enter')saveNewQuilt();}}
              style={{marginBottom:16}}/>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <button className="btn" onClick={()=>setShowSave(false)}>Cancel</button>
              <button className="btn btn-dark" onClick={saveNewQuilt}>Save</button>
            </div>
          </div>
        </div>
      )}

      {/* My quilts list */}
      {showMyQuilts && (
        <div className="overlay" onClick={()=>setShowMyQuilts(false)}>
          <div onClick={e=>e.stopPropagation()}
            style={{background:'#FFFFFF',border:'1px solid #E2DDD2',borderRadius:8,padding:24,maxWidth:500,width:'100%',margin:16,boxShadow:'0 8px 32px rgba(46,41,37,0.14)',maxHeight:'80vh',overflowY:'auto'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
              <div style={{fontWeight:400,fontSize:24,fontFamily:"var(--font-display)",lineHeight:1.1}}>My quilts</div>
              <button onClick={()=>setShowMyQuilts(false)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--warm-muted)',display:'flex'}}><IcX/></button>
            </div>
            {saveError && (
              <div style={{fontSize:12,color:'var(--metime-tomato)',background:'#FBECE8',border:'1px solid #F3C9BF',borderRadius:6,padding:'8px 10px',marginBottom:12}}>{saveError}</div>
            )}
            {savedQuilts.length===0 ? (
              <div style={{fontSize:13,color:'var(--warm-muted)',fontStyle:'italic',padding:'20px 0',textAlign:'center'}}>No saved quilts yet</div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                {savedQuilts.map(q=>(
                  <div key={q.id} style={{display:'flex',gap:12,alignItems:'center',padding:12,border:'1px solid #E2DDD2',borderRadius:6,cursor:'pointer',transition:'background .1s'}}
                    onClick={()=>{setViewQuilt(q);setShowMyQuilts(false);}} title="Preview"
                    onMouseEnter={e=>e.currentTarget.style.background='#EFE9DD'}
                    onMouseLeave={e=>e.currentTarget.style.background='#FFFFFF'}>
                    <div style={{width:64,height:64,flexShrink:0,position:'relative',background:'#FFFFFF',borderRadius:4,overflow:'hidden'}}>
                      <svg viewBox={`0 0 ${q.cols} ${q.rows}`} width="64" height="64" preserveAspectRatio="xMidYMid meet">
                        {q.shapes.map((s,i)=>s.type==='tri'?(
                          <polygon key={i} points={s.dir==='/'?(s.half==='a'?`${s.c},${s.r} ${s.c+s.w},${s.r} ${s.c},${s.r+s.h}`:`${s.c+s.w},${s.r} ${s.c+s.w},${s.r+s.h} ${s.c},${s.r+s.h}`):(s.half==='a'?`${s.c},${s.r} ${s.c+s.w},${s.r} ${s.c+s.w},${s.r+s.h}`:`${s.c},${s.r} ${s.c},${s.r+s.h} ${s.c+s.w},${s.r+s.h}`)} fill={s.color.hex}/>
                        ):<rect key={i} x={s.c} y={s.r} width={s.w} height={s.h} fill={s.color.hex} stroke="rgba(46,41,37,0.08)" strokeWidth="0.05"/>)}
                      </svg>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:500,fontSize:14,marginBottom:2}}>{q.name}</div>
                      <div style={{fontSize:12,color:'var(--warm-muted)'}}>{q.fw}" × {q.fh}" · {q.preset !== 'Custom' ? q.preset : 'Custom size'}</div>
                      <div style={{fontSize:12,color:'var(--warm-muted)'}}>{q.materials.items.length} color{q.materials.items.length!==1?'s':''} · {fmtY(q.grandTotal)} total</div>
                    </div>
                    {confirmDeleteId===q.id ? (
                      <div style={{display:'flex',gap:6,alignItems:'center'}} onClick={e=>e.stopPropagation()}>
                        <button className="btn btn-sm" onClick={()=>setConfirmDeleteId(null)}>Cancel</button>
                        <button className="btn btn-sm btn-dark" onClick={()=>{setSavedQuilts(p=>p.filter(x=>x.id!==q.id));setConfirmDeleteId(null);}}>Delete</button>
                      </div>
                    ) : (
                      <div style={{display:'flex',gap:2,alignItems:'center'}}>
                        <button title="Delete quilt"
                          onClick={e=>{e.stopPropagation();setConfirmDeleteId(q.id);}}
                          style={{background:'none',border:'none',cursor:'pointer',color:'var(--warm-muted)',display:'flex',padding:4}}
                          onMouseEnter={e=>e.currentTarget.style.color='var(--metime-tomato)'}
                          onMouseLeave={e=>e.currentTarget.style.color='var(--warm-muted)'}><IcTrash/></button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Quilt preview */}
      {viewQuilt && (()=>{
        const q = viewQuilt;
        const allItems = [
          ...q.materials.items.map(m=>({type:'Quilt top',name:m.name,hex:m.hex,detail:`${m.count} pcs · ${m.strips} strip${m.strips!==1?'s':''}`,yards:m.yards})),
          ...(q.backing ? [{type:'Backing',name:q.backing.name,hex:q.backing.hex,detail:`${q.backCalc.backingW}"×${q.backCalc.backingH}" · ${q.backCalc.widths}w`,yards:q.backCalc.yards}] : []),
          ...(q.binding ? [{type:'Binding',name:q.binding.name,hex:q.binding.hex,detail:`${q.bindCalc.strips} strips · ${q.bindCalc.perimeter}" perim.`,yards:q.bindCalc.yards}] : []),
        ];
        return (
          <div className="overlay" onClick={()=>setViewQuilt(null)}>
            <div onClick={e=>e.stopPropagation()}
              style={{background:'#FFFFFF',border:'1px solid #E2DDD2',borderRadius:8,maxWidth:720,width:'100%',margin:16,boxShadow:'0 8px 32px rgba(46,41,37,0.14)',maxHeight:'90vh',overflowY:'auto'}}>

              {/* Top bar */}
              <div style={{padding:'20px 24px 16px',borderBottom:'1px solid #EFE9DD',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div>
                  <div style={{fontWeight:400,fontSize:24,fontFamily:"var(--font-display)",lineHeight:1.1}}>{q.name}</div>
                  <div style={{fontSize:13,color:'var(--warm-muted)',marginTop:2}}>{q.fw}" × {q.fh}" · {q.preset !== 'Custom' ? q.preset : 'Custom size'} · {q.bs}" blocks</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <button className="btn" onClick={()=>loadQuilt(q)}>Open on canvas</button>
                  <button onClick={()=>setViewQuilt(null)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--warm-muted)',display:'flex'}}><IcX/></button>
                </div>
              </div>

              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:0}}>
                {/* Preview */}
                <div style={{padding:24,borderRight:'1px solid #EFE9DD',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <div style={{width:'100%',maxWidth:320,background:'#FFFFFF',borderRadius:4,overflow:'hidden',border:'1px solid #E2DDD2'}}>
                    <svg viewBox={`0 0 ${q.cols} ${q.rows}`} width="100%" preserveAspectRatio="xMidYMid meet" style={{display:'block'}}>
                      <rect width={q.cols} height={q.rows} fill="#FFFFFF"/>
                      {Array.from({length:q.cols+1},(_,i)=><line key={`v${i}`} x1={i} y1={0} x2={i} y2={q.rows} stroke="#EFE9DD" strokeWidth="0.04"/>)}
                      {Array.from({length:q.rows+1},(_,i)=><line key={`h${i}`} x1={0} y1={i} x2={q.cols} y2={i} stroke="#EFE9DD" strokeWidth="0.04"/>)}
                      {q.shapes.map((s,i)=>s.type==='tri'?(
                        <polygon key={i} points={s.dir==='/'?(s.half==='a'?`${s.c},${s.r} ${s.c+s.w},${s.r} ${s.c},${s.r+s.h}`:`${s.c+s.w},${s.r} ${s.c+s.w},${s.r+s.h} ${s.c},${s.r+s.h}`):(s.half==='a'?`${s.c},${s.r} ${s.c+s.w},${s.r} ${s.c+s.w},${s.r+s.h}`:`${s.c},${s.r} ${s.c},${s.r+s.h} ${s.c+s.w},${s.r+s.h}`)} fill={s.color.hex}/>
                      ):<rect key={i} x={s.c} y={s.r} width={s.w} height={s.h} fill={s.color.hex} stroke="rgba(46,41,37,0.08)" strokeWidth="0.05"/>)}
                    </svg>
                  </div>
                </div>

                {/* Supplies list */}
                <div style={{display:'flex',flexDirection:'column'}}>
                  <div style={{padding:'16px 20px 8px'}}>
                    <div className="label" style={{marginBottom:4}}>Supplies list</div>
                    <div style={{fontSize:12,color:'var(--warm-muted)'}}>{allItems.length} item{allItems.length!==1?'s':''}</div>
                  </div>
                  <div style={{flex:1,overflowY:'auto',maxHeight:320}}>
                    {allItems.map((item,i)=>(
                      <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 20px',borderBottom:'1px solid #EFE9DD'}}>
                        <div style={{width:24,height:24,background:item.hex,border:'1px solid rgba(46,41,37,0.10)',borderRadius:3,flexShrink:0}}/>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontSize:12,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                          <div style={{fontSize:11,color:'var(--warm-muted)'}}>{item.type} · {item.detail}</div>
                        </div>
                        <div style={{fontSize:13,fontWeight:600,fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap'}}>{fmtY(item.yards)}</div>
                      </div>
                    ))}

function applyTweaks(t) {
  const b = `${t.borderWidth}px solid ${t.borderColor}`;
  const root = document.documentElement;
  root.style.setProperty('--div-border', b);
  root.style.setProperty('--app-bg', t.appBg);
  root.style.setProperty('--canvas-bg', t.canvasBg);
  let s = document.getElementById('_tweak_s');
  if (!s) { s = document.createElement('style'); s.id = '_tweak_s'; document.head.appendChild(s); }
  s.textContent = `.btn, input[type=text], select, .chip { border-radius: ${t.radius}px !important; } .pill { border-radius: 2px !important; } body { background: ${t.appBg}; }`;
}

function QuiltThumb({ preset }) {
  const theme = PRESET_THEMES[preset.name] || { c1:"#2C3E50", c2:"#8FAABF" };
  const aspect = preset.h / preset.w;
  const W = 200, H = Math.round(W * aspect);
  const cellSize = Math.max(8, Math.min(16, Math.round(W / 14)));
  const cols = Math.ceil(W / cellSize);
  const rows = Math.ceil(H / cellSize);
  const cells = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const even = (r + c) % 2 === 0;
      cells.push(
        <rect key={`${r}-${c}`}
          x={c * cellSize} y={r * cellSize}
          width={cellSize} height={cellSize}
          fill={even ? theme.c1 : theme.c2}/>
      );
    }
  }
  return (
    <svg viewBox={`0 0 ${W} ${H}`} xmlns="http://www.w3.org/2000/svg">
      {cells}
      <rect width={W} height={H} fill="none" stroke="rgba(46,41,37,0.15)" strokeWidth="1"/>
    </svg>
  );
}

function ProjectCard({ preset, onSelect }) {
  const theme = PRESET_THEMES[preset.name] || {};
  const kitQty = preset.kitQty || 1;
  const backYards = calcBacking(preset.w, preset.h, kitQty).yards;
  const bindYards = calcBinding(preset.w, preset.h, kitQty).yards;
  const bs = 3;
  const cols = Math.min(MAX, Math.round(preset.w / bs));
  const rows = Math.min(MAX, Math.round(preset.h / bs));
  const topYards = calcYardage(Math.ceil(cols * rows / 2), bs, kitQty).yards * 2;
  const estCost = Math.ceil((topYards + backYards + bindYards) * 13 / 5) * 5;
  const image = PRESET_IMAGES[preset.name];

  return (
    <div className="proj-card" onClick={() => onSelect(preset.name)} role="button" tabIndex={0}
      onKeyDown={e => e.key === 'Enter' && onSelect(preset.name)}>
      {image

    </div>
  );
}

// ── Setup: templates + shared photo uploader ───────────────────────────────
// Split a length into `n` near-equal integer segments → [[start,size],…].
function tplSegments(total, n) {
  const segs = []; let acc = 0;
  for (let i = 0; i < n; i++) {
    const size = Math.round(total * (i + 1) / n) - Math.round(total * i / n);
    segs.push([acc, size]); acc += size;
  }
  return segs;
}
// How many "patches" a quilt pattern tiles into, scaled to the grid.
function tplPatchCount(cols, rows) {
  const unit = Math.max(2, Math.round(Math.min(cols, rows) / 8));
  return { nx: Math.max(2, Math.round(cols / unit)), ny: Math.max(2, Math.round(rows / unit)) };
}
const tplKona = n => konaByName(n) || KONA[0];
// Pick the i-th color from the chosen palette, falling back to a named Kona
// default when there's no palette or it's shorter than the template needs.
// This lets a template "wear" the palette the user picked on the palette step
// while still looking right (two-/three-tone) for a skipped or short palette.
const tplColor = (palette, i, fallbackName) =>
  (palette && palette[i]) ? palette[i] : tplKona(fallbackName);
function tplTriPoints(s) {
  const { r, c, w, h } = s;
  if (s.dir === '/') return s.half === 'a'
    ? `${c},${r} ${c + w},${r} ${c},${r + h}`
    : `${c + w},${r} ${c + w},${r + h} ${c},${r + h}`;
  return s.half === 'a'
    ? `${c},${r} ${c + w},${r} ${c + w},${r + h}`
    : `${c},${r} ${c},${r + h} ${c + w},${r + h}`;
}

// Size-adaptive quilt starter layouts. build({cols,rows,palette}) → shapes[]
// (same shape objects the editor paints), so they tile/scale to any chosen
// preset. When `palette` (the colors picked on the palette step) is supplied,
// each layout colors its patches from it; otherwise it uses sensible defaults.
const QUILT_TEMPLATES = [
  { id: 'blank', name: 'Blank', desc: 'Start from an empty canvas.', build: () => [] },
  {
    id: 'checkerboard', name: 'Checkerboard', desc: 'Alternating two-color squares.',
    build: ({ cols, rows, palette }) => {
      const a = tplColor(palette, 0, 'Navy'), b = tplColor(palette, 1, 'White');
      const { nx, ny } = tplPatchCount(cols, rows);
      const sx = tplSegments(cols, nx), sy = tplSegments(rows, ny), out = [];
      sy.forEach(([r, h], ri) => sx.forEach(([c, w], ci) => {
        if (w > 0 && h > 0) out.push({ id: `tpl-${ri}-${ci}`, r, c, w, h, type: 'square', color: (ri + ci) % 2 ? a : b });
      }));
      return out;
    }
  },
  {
    id: 'ninepatch', name: 'Nine-Patch', desc: 'Classic 3×3 patchwork, tiled.',
    build: ({ cols, rows, palette }) => {
      const a = tplColor(palette, 0, 'Rich Red'), b = tplColor(palette, 1, 'White');
      const { nx, ny } = tplPatchCount(cols, rows);
      const sx = tplSegments(cols, nx), sy = tplSegments(rows, ny), out = [];
      sy.forEach(([r, h], ri) => sx.forEach(([c, w], ci) => {
        if (w > 0 && h > 0) out.push({ id: `tpl-${ri}-${ci}`, r, c, w, h, type: 'square', color: ((ri % 3) + (ci % 3)) % 2 === 0 ? a : b });
      }));
      return out;
    }
  },
  {
    id: 'railfence', name: 'Rail Fence', desc: 'Woven strips of three fabrics.',
    build: ({ cols, rows, palette }) => {
      const rails = [tplColor(palette, 0, 'Navy'), tplColor(palette, 1, 'Mustard'), tplColor(palette, 2, 'Natural')];
      const { nx, ny } = tplPatchCount(cols, rows);
      const sx = tplSegments(cols, nx), sy = tplSegments(rows, ny), out = [];
      sy.forEach(([r, h], ri) => sx.forEach(([c, w], ci) => {
        const horiz = (Math.floor(ri / 3) + Math.floor(ci / 3)) % 2 === 0;
        const idx = (horiz ? ri : ci) % 3;
        if (w > 0 && h > 0) out.push({ id: `tpl-${ri}-${ci}`, r, c, w, h, type: 'square', color: rails[idx] });
      }));
      return out;
    }
  },
  {
    id: 'hst', name: 'Half-Square Triangles', desc: 'A grid of two-tone triangle blocks.',
    build: ({ cols, rows, palette }) => {
      const a = tplColor(palette, 0, 'Navy'), b = tplColor(palette, 1, 'White');
      const { nx, ny } = tplPatchCount(cols, rows);
      const sx = tplSegments(cols, nx), sy = tplSegments(rows, ny), out = [];
      sy.forEach(([r, h], ri) => sx.forEach(([c, w], ci) => {
        if (w <= 0 || h <= 0) return;
        const pid = `hst-${ri}-${ci}`, flip = (ri + ci) % 2 === 0;
        out.push({ id: pid + 'a', r, c, w, h, type: 'tri', color: flip ? a : b, dir: '/', half: 'a', pairId: pid });
        out.push({ id: pid + 'b', r, c, w, h, type: 'tri', color: flip ? b : a, dir: '/', half: 'b', pairId: pid });
      }));
      return out;
    }
  },
];

// Distinct DMC color objects present in a cell-hex grid (for palette pre-seed).
function xsColorsFromGrid(grid) {
  if (!grid) return [];
  const seen = new Set(), out = [];
  for (const hex of grid) { if (hex && !seen.has(hex)) { seen.add(hex); const d = DMC.find(c => c.hex === hex); if (d) out.push(d); } }
  return out;
}
// Size-catered cross-stitch starter charts. Real chart data lives in
// assets/stitch-templates-data.js (window.STITCH_TEMPLATE_DATA) — baked from the
// curated inspiration images by tools/gen-stitch-templates.mjs. Each entry is a
// canonical W×H chart (colors + RLE); build({w,h}) decodes it once and nearest-
// neighbour resamples to the requested size, so a single chart scales to every
// preset that offers it.
function xsDecodeChart(entry) {
  if (entry._grid) return entry._grid;                       // memoized native grid
  const grid = new Array(entry.w * entry.h).fill(null);
  let pos = 0;
  for (const tok of entry.rle.split(' ')) {
    const dot = tok.indexOf('.');
    const idx = parseInt(tok.slice(0, dot), 36), run = parseInt(tok.slice(dot + 1), 36);
    const hex = idx ? entry.colors[idx - 1] : null;
    for (let k = 0; k < run; k++) grid[pos++] = hex;
  }
  entry._grid = grid;
  return grid;
}
// Nearest-neighbour resample a src (sw×sh) hex/null grid to dw×dh.
function xsResampleGrid(src, sw, sh, dw, dh) {
  if (sw === dw && sh === dh) return src.slice();
  const out = new Array(dw * dh).fill(null);
  for (let y = 0; y < dh; y++) {
    const sy = Math.min(sh - 1, Math.floor((y + 0.5) * sh / dh));
    for (let x = 0; x < dw; x++) {
      const sx = Math.min(sw - 1, Math.floor((x + 0.5) * sw / dw));
      out[y * dw + x] = src[sy * sw + sx];
    }
  }
  return out;
}
// There's no "Blank" card in the grid — "Skip for now" is the empty-grid route.
// w/h are the chart's own stitch counts — the template picker uses them to
// preview each chart at its true proportion (a 30x120 bookmark as a tall strip).
const CROSS_STITCH_TEMPLATES = (window.STITCH_TEMPLATE_DATA || []).map(entry => ({
  id: entry.id, name: entry.name, desc: entry.desc, presets: entry.presets,
  w: entry.w, h: entry.h,
  build: ({ w, h }) => xsResampleGrid(xsDecodeChart(entry), entry.w, entry.h, w, h),
}));
// Size-catered charts offered for a given preset.
function stitchTemplatesFor(preset) {
  const name = preset && preset.name;
  return CROSS_STITCH_TEMPLATES.filter(t => !t.presets || t.presets.includes(name));
}

// ── Dressing a template chart in the user's palette ────────────────────────
// Templates ship in metime brand colors (snapped to their nearest DMC floss —
// see tools/gen-stitch-templates.mjs). Picking a palette on the next step has to
// override those defaults without flattening the design, so we map the chart's
// colors onto the palette by role instead of just recoloring cell by cell.
// Relative luminance, 0–1.
function xsLuma(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
}
// The chart's colors in role order: most-stitched first.
function xsGridRoles(grid) {
  const counts = new Map();
  for (const hex of grid) if (hex) counts.set(hex, (counts.get(hex) || 0) + 1);
  return [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([hex, count]) => ({ hex, count }));
}
// Re-dress a template design in `palette` (an array of DMC color objects):
//   • a stitched ground — the top color, when it covers most of the chart —
//     stays a ground: it takes the palette color closest to it in luminance, so
//     linen stays light and a dark field stays dark, and then sits out the rest;
//   • which of the remaining palette colors get used is decided by dominance,
//     walking the palette in the order the user sees it, so a design that needs
//     fewer colors than the palette offers takes its leading ones;
//   • which motif color gets which is decided by tone: both lists are sorted by
//     luminance and paired off, so the design's light/dark structure — and with
//     it the contrast that makes the motif read — survives the swap;
//   • a palette shorter than the design cycles rather than dropping colors, so
//     motif detail is never lost, just carried in fewer tones.
function xsRecolorGrid(grid, palette) {
  if (!grid || !palette || !palette.length) return grid;
  const roles = xsGridRoles(grid);
  const pal = palette.map(c => c && c.hex).filter(Boolean);
  if (!roles.length || !pal.length) return grid;
  const map = new Map();
  let motifs = roles, pool = pal;
  if (roles[0].count > grid.length * 0.35) {
    const groundLuma = xsLuma(roles[0].hex);
    const ground = pal.reduce((best, h) =>
      Math.abs(xsLuma(h) - groundLuma) < Math.abs(xsLuma(best) - groundLuma) ? h : best, pal[0]);
    const rest = pal.filter(h => h !== ground);
    // A one-color palette leaves nothing for the motif, so the ground keeps its
    // default rather than flattening the design into a single block of color.
    map.set(roles[0].hex, rest.length ? ground : roles[0].hex);
    motifs = roles.slice(1);
    pool = rest.length ? rest : pal;
  }
  if (motifs.length) {
    const byLuma = arr => [...arr].sort((a, b) => xsLuma(a) - xsLuma(b));
    const tones = byLuma(motifs.map((_, i) => pool[i % pool.length]));
    byLuma(motifs.map(r => r.hex)).forEach((hex, i) => map.set(hex, tones[i]));
  }
  return grid.map(hex => hex ? (map.get(hex) || hex) : null);
}

// Sample an <img> into a W×H grid, snapping each cell to the nearest chosen
// color → a ready-to-stitch design (shared by the cross-stitch template step).
function buildGridFromImage(img, chosen, W, H) {
  if (!img || !chosen || !chosen.length) return null;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const scale = Math.max(W / img.width, H / img.height);
  const sw = W / scale, sh = H / scale, sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  let data; try { data = ctx.getImageData(0, 0, W, H).data; } catch (e) { return null; }
  const grid = new Array(W * H).fill(null);
  for (let i = 0; i < W * H; i++) {
    if (data[i * 4 + 3] < 100) continue;
    const near = nearestInList({ r: data[i * 4], g: data[i * 4 + 1], b: data[i * 4 + 2] }, chosen);
    grid[i] = near ? near.hex : null;
  }
  return grid;
}

// Reusable photo → palette uploader. Manages its own file/extraction state and
// reports the kept colors + image (+ any option toggles) via onApply. Used by
// the quilt palette page (Kona) and the cross-stitch template page (DMC).
function PhotoUpload({ nearest, idKey = 'name', paletteSize = 8, count = 32, applyLabel = 'Use these colors', hint, options = [], onApply }) {
  const [imgSrc, setImgSrc] = useState(null);
  const [extracted, setExtracted] = useState(null);
  const [pool, setPool] = useState([]);
  const [locked, setLocked] = useState(() => new Set());
  const [busy, setBusy] = useState(false);
  const [drag, setDrag] = useState(false);
  const [opts, setOpts] = useState(() => { const o = {}; options.forEach(d => o[d.key] = d.default ?? false); return o; });
  const fileRef = useRef(null);
  const imgElRef = useRef(null);
  const idOf = c => c[idKey];

  const handleFile = useCallback(file => {
    if (!file || !file.type.startsWith('image/')) return;
    setBusy(true);
    const reader = new FileReader();
    reader.onload = ev => {
      const src = ev.target.result;
      const img = new Image();
      img.onload = () => {
        imgElRef.current = img;
        const maxDim = 160, scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
        let pixels; try { pixels = ctx.getImageData(0, 0, w, h); } catch (e) { setBusy(false); return; }
        const raw = extractColors(pixels, count), seen = new Set(), colors = [];
        for (const c of raw) { const k = nearest(c); if (k && !seen.has(k[idKey])) { seen.add(k[idKey]); colors.push(k); } }
        setImgSrc(src); setPool(colors); setLocked(new Set());
        setExtracted(colors.slice(0, Math.min(paletteSize, colors.length))); setBusy(false);
      };
      img.onerror = () => setBusy(false);
      img.src = src;
    };
    reader.readAsDataURL(file);
  }, [nearest, idKey, paletteSize, count]);

  const toggleLock = useCallback(id => { setLocked(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }); }, []);
  const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const regenerate = useCallback(() => {
    if (!pool.length) return;
    setExtracted(prev => {
      if (!prev) return prev;
      const lk = new Set(prev.filter(c => locked.has(idOf(c))).map(idOf));
      const fill = shuffle(pool.filter(c => !lk.has(idOf(c)))); let fi = 0;
      return prev.map(c => lk.has(idOf(c)) ? c : (fill[fi++] || c));
    });
  }, [pool, locked]);
  const resetUpload = () => { setImgSrc(null); setExtracted(null); setPool([]); setLocked(new Set()); imgElRef.current = null; fileRef.current && (fileRef.current.value = ''); };
  const apply = () => {
    if (!extracted || !extracted.length) return;
    const kept = extracted.filter(c => locked.has(idOf(c)));
    const chosen = kept.length ? kept : extracted;
    onApply(chosen, { imgSrc, imgEl: imgElRef.current, options: opts });
  };

  return (
    <section className="pal-section">
      <div className="pal-section-head">
        <div className="pal-section-title">Upload an image</div>
        {hint && <div className="pal-section-sub">{hint}</div>}
      </div>
      {!extracted && (
        <div className={`pal-upload${drag ? ' drag' : ''}`}
          onClick={() => fileRef.current && fileRef.current.click()}
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={e => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }}>
          <div className="pal-upload-icon"><IcImage size={28}/></div>
          <div className="pal-upload-title">{busy ? 'Reading colors…' : 'Drop an image here or click to browse'}</div>
          <div className="pal-upload-sub">JPG, PNG, or WebP</div>
          <input ref={fileRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={e => handleFile(e.target.files[0])}/>
        </div>
      )}
      {extracted && (
        <div className="pal-result">
          <img className="pal-result-preview" src={imgSrc} alt="Uploaded reference"/>
          <div className="pal-result-main">
            <div className="pal-section-sub" style={{ marginBottom: 6 }}>{extracted.length} colors found — check the ones you want to keep (they stay when you regenerate and are the only colors added). Leave all unchecked to use them all.</div>
            <div className="pal-result-swatches">
              {extracted.map(c => {
                const isLocked = locked.has(idOf(c));
                return (
                  <label key={idOf(c)} className={`pal-chip${isLocked ? ' locked' : ''}`} title={c.code ? `DMC ${c.code} · ${c.name}` : `${c.name} ${c.hex}`}>
                    <input type="checkbox" className="pal-chip-check" checked={isLocked} onChange={() => toggleLock(idOf(c))}/>
                    <span className="pal-chip-color" style={{ background: c.hex }}/>
                    <span className="pal-chip-label">{c.code ? `${c.code} ${c.name}` : c.name}</span>
                  </label>
                );
              })}
            </div>
            {options.map(d => (
              <label key={d.key} className="pal-check">
                <input type="checkbox" checked={!!opts[d.key]} onChange={e => setOpts(o => ({ ...o, [d.key]: e.target.checked }))}/>
                {d.label}
              </label>
            ))}
            <div className="pal-actions">
              <button className="pal-btn" onClick={apply}>{applyLabel}</button>
              {pool.length > 1 && (
                <button className="pal-btn secondary" onClick={regenerate} title="Shuffle the palette">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                  </svg>
                  Regenerate
                </button>
              )}
              <button className="pal-btn secondary" onClick={resetUpload}>Choose another</button>
            </div>
          </div>
        </div>
      )}
    </section>
  );
}

// Thumbnails render the actual template output (built at a small size). When a
// palette is supplied it previews the template in those colors, matching what
// the studio will build when the template is selected.
function QuiltTemplateThumb({ tpl, preset, palette }) {
  const cols = 12, rows = Math.max(4, Math.round(12 * (preset.h / preset.w)));
  const shapes = useMemo(() => tpl.build({ cols, rows, palette }), [tpl, cols, rows, palette]);
  return (
    <svg viewBox={`0 0 ${cols} ${rows}`} width="100%" preserveAspectRatio="xMidYMid meet" style={{ display: 'block', background: 'var(--metime-cream)' }}>
      <rect width={cols} height={rows} fill="var(--metime-cream)"/>
      {shapes.map((s, i) => s.type === 'tri'
        ? <polygon key={i} points={tplTriPoints(s)} fill={s.color.hex}/>
        : <rect key={i} x={s.c} y={s.r} width={s.w} height={s.h} fill={s.color.hex}/>)}
      <rect width={cols} height={rows} fill="none" stroke="rgba(46,41,37,0.12)" strokeWidth="0.1"/>
    </svg>
  );
}
function StitchTemplateThumb({ tpl, preset }) {
  // Preview at (roughly) the real stitch resolution so detailed image-derived
  // charts stay legible — capped so huge canvases don't render 14k+ SVG rects.
  const w = Math.min(90, preset.w), h = Math.max(4, Math.round(w * (preset.h / preset.w)));
  const grid = useMemo(() => tpl.build({ w, h }), [tpl, w, h]);
  return (
    <svg viewBox={`0 0 ${w} ${h}`} width="100%" preserveAspectRatio="xMidYMid meet" style={{ display: 'block' }}>
      {grid.map((hex, i) => hex ? <rect key={i} x={i % w} y={Math.floor(i / w)} width={1} height={1} fill={hex}/> : null)}
      <rect width={w} height={h} fill="none" stroke="rgba(46,41,37,0.12)" strokeWidth="0.08"/>
    </svg>
  );
}

// ── Quilt: backing fabric step ─────────────────────────────────────────────
// Ruby Star Society backing fabrics for the quilt "Pick a backing fabric" step.
// HOW IMAGES ARE SOURCED: full-res swatches live under
// assets/fabrics/<collection>/<file>.jpg. Compact 256px thumbs (used by the
// grid, hex sample, and palette extract) live under assets/fabrics-thumbs/ —
// regenerate with `npm run gen:fabric-thumbs`. The list of collections and files
// is generated into assets/fabrics-manifest.js (window.RSS_COLLECTIONS) — see the
// banner in that file for how to regenerate. Each collection carries `cats`
// (theme filters) which every flattened fabric inherits.
// Any card whose image fails to load hides itself (see FabricCard's onError), so
// a broken/missing asset never leaves a broken image or breaks the page.
// TO ADD OR EDIT FABRICS: drop images into assets/fabrics/<collection>/ and
// regenerate the manifest (do not hand-edit the flattened list below).
const FABRIC_CATEGORIES = [
  { id: 'all',      label: 'All' },
  { id: 'simple',   label: 'Simple' },
  { id: 'florals',  label: 'Florals' },
  { id: 'animals',  label: 'Animals' },
  { id: 'food',     label: 'Food' },
  { id: 'nature',   label: 'Nature' },
  { id: 'holidays', label: 'Holidays' },
  { id: 'novelty',  label: 'Novelty' },
];
const RUBY_STAR_FABRICS = (window.RSS_COLLECTIONS || []).flatMap(c =>
  c.files.map(f => ({
    name: c.label,
    collection: c.slug,
    cats: c.cats,
    // filenames contain spaces — encode so the URL resolves
    image: encodeURI(`assets/fabrics/${c.slug}/${f}`),
    // Compact 256px JPEG for the grid / hex sample / palette extract
    // (generated by tools/gen-fabric-thumbs.mjs). Falls back to full image
    // if a thumb is missing.
    thumb: encodeURI(`assets/fabrics-thumbs/${c.slug}/${f}`),
  }))
);

// Compact 256px JPEG sibling of a full-res fabric URL, or null for uploads /
// data URLs. Lets older saved quilts (no `backing.thumb`) still hit the
// thumbnails generated by tools/gen-fabric-thumbs.mjs.
function fabricThumbFor(image) {
  if (!image || typeof image !== 'string' || image.startsWith('data:')) return null;
  const marker = 'assets/fabrics/';
  const i = image.indexOf(marker);
  if (i === -1 || image.indexOf('assets/fabrics-thumbs/') !== -1) return null;
  return image.slice(0, i) + 'assets/fabrics-thumbs/' + image.slice(i + marker.length);
}

// Average a representative hex color from a loaded image. Draws to a small
// offscreen canvas and averages the visible pixels; guards against canvas taint
// (cross-origin images without CORS headers) with try/catch, falling back to a
// neutral hex so a chosen backing always yields a usable color.
function sampleImageHex(img) {
  try {
    const maxDim = 48, scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    let r = 0, g = 0, b = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 125) continue; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
    if (!n) return '#C9BFB2';
    return rgbToHex(r / n, g / n, b / n);
  } catch (e) { return '#C9BFB2'; }
}

// A single fabric swatch card. Compact (image-only, name in tooltip) so the grid

// Quilt backing-fabric step: pick a Ruby Star print or upload your own fabric.
// Whatever is chosen is loaded, a representative hex is sampled, and we emit

function QuiltBackingSelector({ preset, onChoose, onSkip, onBack }) {
  const [cat, setCat] = useState('all');
  // Local swatches are same-origin, so no crossOrigin needed — sampleImageHex
  // can read the pixels and the palette step gets a real auto-suggestion.
  // Prefer the compact thumb for hex sampling so we don't re-decode a multi‑MB
  // print just to average a 48px canvas. Keep `image` as the full path for
  // anything that still wants it; palette extract uses `thumb` too.
  const chooseFromImage = (name, image, thumb) => {
    const src = thumb || image;
    const img = new Image();
    img.onload = () => onChoose({ name, hex: sampleImageHex(img), image, thumb: thumb || image });

    ...c,

  const shown = useMemo(

  return (

          </div>

// Mirrors CrossStitchPaletteSelector. Backing was chosen on the previous step;
// if it carries an image we extract an editable suggested Kona palette from it
// (remove/add via KonaPicker). Sample palettes remain available. Returns
// ONLY the palette (backing is already set upstream).
function PaletteSelector({ presetName, backing, onChoose, onSkip, onBack }) {
  const samples = useMemo(() => SUGGESTED_PALETTES.map(p => ({ name: p.name, colors: resolvePalette(p) })), []);
  // Prefer the compact thumb for extract + preview (full-res only for uploads
  // that have no thumb, or older saves without one).
  const photo = backing && (backing.thumb || fabricThumbFor(backing.image) || backing.image);
  const [sugg, setSugg] = useState([]);
  const [ready, setReady] = useState(!photo);
  const [swapIdx, setSwapIdx] = useState(null);
  const swapAnchor = useRef(null);

  useEffect(() => {
    if (!photo) { setSugg([]); setReady(true); return; }
    let cancelled = false;
    setReady(false);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (cancelled) return;
      const maxDim = 160, scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
      let pixels; try { pixels = ctx.getImageData(0, 0, w, h); } catch (e) { setReady(true); return; }
      const raw = extractColors(pixels, 24), seen = new Set(), colors = [];
      for (const c of raw) { const k = nearestKona(c); if (k && !seen.has(k.name)) { seen.add(k.name); colors.push(k); } }
      setSugg(colors.slice(0, SUGGESTED_PALETTE_MAX));
      setReady(true);
    };
    img.onerror = () => setReady(true);
    img.src = photo;
    return () => { cancelled = true; };
  }, [photo]);

  const pickSwap = c => setSugg(prev => { const n = [...prev]; if (swapIdx >= n.length) n.push(c); else n[swapIdx] = c; return n; });
  const removeAt = i => setSugg(prev => prev.filter((_, j) => j !== i));

  return (
    <div className="proj-page">
      <header className="proj-header">
        <a className="brand" href="/" aria-label="metime — home"><MetimeLogo/></a>
      </header>
      <div className="proj-body pal-body">
        <button className="back-link" onClick={onBack}><IcCaretL/><span>Back</span></button>
        <div className="proj-intro">
          <div className="pal-head-row">
            <h1 className="proj-heading">Pick a palette</h1>
            <button type="button" className="pal-skip-btn" onClick={onSkip}>Skip for now</button>
          </div>
          <p className="proj-subheading">Pick the fabric colors you would like to use for your {presetName}. You can always change these later.</p>
        </div>

        {photo && (
          <section className="pal-section">
            <div className="pal-section-head">
              <div className="pal-section-title">Suggested palette</div>
            </div>
            {!ready ? (
              <div className="pal-busy">Reading colors from your fabric…</div>
            ) : (
              <ImagePaletteEditor
                photo={photo}
                alt="Your backing fabric"
                colors={sugg}
                colorKey={c => c.name}
                titleOf={c => c.name}
                onRemove={removeAt}
                onAdd={ref => { swapAnchor.current = ref.current; setSwapIdx(sugg.length); }}
                onUse={() => onChoose(sugg)}/>
            )}
          </section>
        )}

        <section className="pal-section">
          <div className="pal-section-head">
            <div className="pal-section-title">Sample palettes</div>
            <div className="pal-section-sub">Curated fabric combinations to get you going fast.</div>
          </div>
          <div className="pal-grid">
            {samples.map(s => (
              <button key={s.name} className="pal-card" onClick={() => onChoose(s.colors)}>
                <div className="pal-swatches">
                  {s.colors.map((c, i) => (
                    <span key={i} className="pal-swatch" style={{ background: c.hex, zIndex: i + 1 }} title={c.name}/>
                  ))}
                </div>
                <div className="pal-card-body">
                  <div className="pal-card-name">{s.name}</div>
                  <div className="pal-card-meta">{s.colors.length} fabrics</div>
                </div>

        <section className="pal-section pal-skip-row">
          <button type="button" className="pal-skip-btn" onClick={onSkip}>Skip for now</button>

      </div>
      {swapIdx !== null && (

      )}

  );
}
