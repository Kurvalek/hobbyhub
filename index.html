<style>
  /* Self-hosted brand type — Söhne (sans + mono) and BC Civitas (display).
     Trial ("TEST") cuts as supplied. Dancing Script (Google) is kept only for
     the cross-stitch text tool's optional script style. */
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 300; font-display: swap; src: url('fonts/Sohne-Light.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/Sohne-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: italic; font-weight: 400; font-display: swap; src: url('fonts/Sohne-Italic.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/Sohne-Medium.woff2') format('woff2'); }
  /* Design rule: Söhne tops out at Medium — "bold" (600/700) resolves to the Medium cut. */
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/Sohne-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/Sohne-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/SohneMono-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Söhne Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/SohneMono-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 300; font-display: swap; src: url('fonts/BCCivitas-Light.woff2') format('woff2'); }
  /* Design rule: BC Civitas headers use the Medium cut, so the default (400) weight loads Medium. */
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/BCCivitas-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/BCCivitas-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/BCCivitas-Semibold.woff2') format('woff2'); }
  @font-face { font-family: 'BC Civitas'; font-style: normal; font-weight: 700; font-display: swap; src: url('fonts/BCCivitas-Bold.woff2') format('woff2'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }

  :root {
    /* Ice scale — fills, hovers, highlights, active / disabled */
    --ice-50: #F9FBFE;
    --ice-100: #EDF2FC;
    --ice-200: #CCD6EB;
    --ice-300: #A9BDE6;
    --ice-400: #7A94C9;
    --ice-500: #52658D;
    --ice-600: #3D4E70;
    --ice-700: #2A3752;

    /* metime base palette */
    --metime-black: #000000;
    --metime-almost-black: #000000;
    --metime-cream: var(--ice-50);
    --metime-white: #FFFFFF;

    /* metime accent palette */
    --metime-tomato: #E8583A;
    --metime-avocado: #B5BB46;
    --metime-olive: #B9B74B;
    --metime-grapefruit: #FDA198;
    --metime-ice: var(--ice-200);
    --metime-golden: #FBBB3F;

    /* Cool neutrals (legacy --warm-* names kept so existing rules pick up ice) */
    --warm-fg: var(--metime-black);
    --warm-fg-2: var(--ice-600);
    --warm-muted: var(--ice-500);
    --warm-muted-2: var(--ice-300);
    --warm-placeholder: var(--ice-400);
    --warm-hairline: var(--ice-200);
    --warm-divider-soft: var(--ice-100);
    --warm-hover: var(--ice-200);

    /* Legacy taupe / linen names — now ice aliases so existing var() calls update */
    --color-taupe-900: var(--metime-black);
    --color-taupe-700: var(--ice-600);
    --color-taupe-600: var(--ice-500);
    --color-taupe-500: var(--ice-400);
    --color-taupe-100: var(--ice-200);
    --color-linen-800: var(--ice-200);
    --color-linen-600: var(--ice-100);
    --color-linen-500: var(--ice-200);
    --color-linen-300: var(--ice-100);
    --color-linen-100: var(--ice-50);

    /* Primary (filled) button — black stroke stays; ice fills on hover / active / disabled */
    --btn-primary-bg: var(--metime-black);
    --btn-primary-bg-hover: var(--ice-500);
    --btn-primary-bg-active: var(--ice-600);
    --btn-primary-bg-disabled: var(--ice-100);
    --btn-primary-fg: var(--metime-white);
    --btn-primary-fg-active: var(--ice-50);
    --btn-stroke: var(--metime-black);

    /* Secondary (outline) button */
    --btn-secondary-bg: var(--metime-white);
    --btn-secondary-bg-hover: var(--ice-100);
    --btn-secondary-bg-active: var(--ice-200);
    --btn-secondary-border: var(--metime-black);
    --btn-secondary-fg: var(--metime-black);

    /* Shared button states */
    --btn-disabled-fg: var(--ice-400);
    --btn-focus-ring: var(--ice-300);
    --btn-tool-hover: rgba(82, 101, 141, 0.16);

    /* Surfaces */
    --surface-card: var(--metime-white);
    --surface-canvas: var(--metime-white);

    /* Action / accent semantics */
    --action: var(--metime-black);
    --action-hover: var(--ice-500);
    --selection: var(--ice-200);
    --metime-wave: var(--metime-tomato);

    /* Shadows */
    --shadow-sticky: 0 2px 8px rgba(0, 0, 0, 0.08);
    --shadow-modal: 0 8px 32px rgba(0, 0, 0, 0.14);

    /* Motion — one easing and two press depths, so every tap and every step
       change moves the same way. Cards get the shallower dip: the setup steps
       lay them out edge to edge with 1px dividers, and a deep dip pulls a
       visible gap open between neighbours. */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --press-scale: 0.96;
    --press-scale-card: 0.985;
    --press-dur: 90ms;
    --step-dur: 260ms;

    /* Fonts — Söhne (body/sans), BC Civitas (display), Söhne Mono (mono). */
    --font-sans: 'Söhne', sans-serif;
    --font-display: 'BC Civitas', serif;
    --font-mono: 'Söhne Mono', monospace;

    /* Type scale (Figma 02 - typography) — used at editorial moments;
       the dense tool UI keeps its smaller working sizes (11/12/13). */
    --text-xs: 12px;
    --text-sm: 14px;
    --text-base: 16px;
    --text-lg: 18px;
    --text-xl: 20px;
    --text-2xl: 24px;
    --text-3xl: 30px;

    /* Tweakable structural tokens (kept for backwards-compat with TweaksPanel) */
    --div-border: 1px solid var(--metime-almost-black);
    --app-bg: var(--metime-cream);
    --canvas-bg: var(--metime-white);
  }

  body {
    font-family: var(--font-sans);
    background: var(--metime-cream);
    color: var(--warm-fg);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout */
  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--app-bg); }
  .body { flex: 1; display: grid; grid-template-columns: 52px 1fr 290px; min-height: 0; }
  .panel { overflow-y: auto; border-right: var(--div-border); }
  .panel:last-child { border-right: none; }

  /* Scrollbar */
  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-thumb { background: var(--warm-hairline); border-radius: 2px; }

  /* Collapsible right panel.
     Both desktop and mobile collapse the panel to a thin rail (mirroring the
     left tool rail) that keeps the selected color + high-level totals visible.
     Expanding restores the full panel column on desktop, and slides it in as a
     drawer over a backdrop on mobile. */
  .body { position: relative; transition: grid-template-columns .22s ease; }
  .right-panel { position: relative; display: flex; flex-direction: column; background: var(--metime-white); border-left: 1px solid var(--metime-almost-black); }
  /* Higher specificity than .icon-btn so these stay hidden off-mobile regardless
     of source order — otherwise the close button becomes an in-flow grid item
     and pushes the panel to a wrapped column. */
  .icon-btn.rp-close, .icon-btn.xs-rp-close { display: none; }
  .rp-backdrop { display: none; }

  /* Collapsed: swap the full panel for the thin rail (all screen sizes) */
  .body.rp-closed { grid-template-columns: 52px 1fr 52px; }
  .body.rp-closed > .right-panel { display: none; }
  .xs-body.rp-closed > .xs-panel { display: none; }
  .xs-body.rp-closed .xs-materials { right: 16px; }

  /* The thin collapsed rail (rendered only while collapsed, so it shows on
     both desktop and mobile) */
  .rp-rail {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 12px 6px; background: var(--app-bg); flex-shrink: 0; width: 52px;
    border-left: 1px solid var(--metime-almost-black); z-index: 40; overflow: hidden;
  }
  .rp-rail .rail-divider { width: 24px; height: 1px; background: var(--warm-hairline); }

  /* Thin collapsed rail contents (swatch + high-level stats) */
  .rp-rail-swatch { width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.18); cursor: pointer; padding: 0; background: none; box-shadow: 0 1px 2px rgba(0,0,0,0.12); flex-shrink: 0; }
  .rp-rail-swatch.empty { border: 1px dashed var(--warm-hairline); }
  .rp-rail-stat { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; }
  .rp-rail-stat b { font-family: var(--font-display); font-size: 15px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; color: var(--warm-fg); }
  .rp-rail-stat span { font-size: 9px; color: var(--warm-muted); letter-spacing: .03em; }

  @media (max-width: 900px) {
    /* Quilt: expanded overlays a drawer instead of using a grid column
       (collapsed still shows the 52px rail column from the base rules) */
    .body { grid-template-columns: 52px 1fr; }
    .right-panel {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(300px, 88vw); z-index: 130;
      border-left: 1px solid var(--metime-almost-black);
      box-shadow: -12px 0 32px rgba(0,0,0,0.20);
      transform: translateX(0); transition: transform .22s ease;
    }
    .body.rp-closed > .right-panel { display: flex; transform: translateX(105%); box-shadow: none; pointer-events: none; }

    /* Cross-stitch: same treatment (xs-body is flex; the rail is a flex item) */
    .xs-panel {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(300px, 88vw); z-index: 130;
      box-shadow: -12px 0 32px rgba(0,0,0,0.20);
      transform: translateX(0); transition: transform .22s ease;
    }
    .xs-body.rp-closed > .xs-panel { display: flex; transform: translateX(105%); box-shadow: none; pointer-events: none; }
    .xs-materials { right: 16px !important; bottom: 16px; }

    /* Backdrop + floating close button for the expanded drawer */
    .rp-backdrop { display: block; position: absolute; inset: 0; background: rgba(0,0,0,0.32); z-index: 120; }
    .icon-btn.rp-close, .icon-btn.xs-rp-close {
      display: inline-flex; position: absolute; top: 10px; right: 12px; z-index: 140;
      background: var(--metime-white); border: 1px solid var(--warm-hairline); box-shadow: var(--shadow-sticky);
    }
    .icon-btn.rp-close:hover, .icon-btn.xs-rp-close:hover { background: var(--warm-hover); }

    /* The rail owns the toggle on mobile, so drop the header/top-bar copy.
       Higher specificity than .icon-btn so it wins regardless of source order. */
    .icon-btn.rp-toggle-header { display: none; }

    /* Tighten chrome so the canvas keeps as much room as possible */
    header { padding: 12px 14px; gap: 10px; }
    .xs-topbar { flex-wrap: wrap; row-gap: 8px; padding: 10px 14px; }
    .xs-topbar-spacer { flex-basis: 100%; height: 0; }
    .preset-pill { max-width: 200px; }
    .canvas-scroll { padding: 12px; }
    .xs-canvas-wrap { padding: 12px; }
    .size-bar { flex-wrap: wrap; row-gap: 8px; padding: 10px 14px; }
    .size-bar-slider { max-width: none; min-width: 160px; }
  }

  @media (max-width: 560px) {
    header { grid-template-columns: auto 1fr auto; padding: 10px 12px; gap: 8px; }
    .header-center { display: none; }
    .btn { padding: 6px 12px; font-size: 11px; }
    .header-right { gap: 6px; }
    .size-bar-meta { display: none; }
    .xs-title { font-size: 17px; }
    .xs-topbar .btn { padding: 6px 12px; font-size: 11px; }
    .hint-overlay { font-size: 10px; padding: 5px 10px; }
  }

  /* ── Mobile: Canva-style bottom toolbar + bottom sheets ──────────────────
     Mobile-only (<=900px). The vertical rails and the right drawer are replaced
     by a fixed bottom toolbar and slide-up sheets. Everything reuses the
     existing tokens/classes so the look is unchanged — only the layout moves. */
  @media (max-width: 900px) {
    /* Studio chrome must stay on-screen. `.app` / `.xs-app` are 100vh with
       overflow:hidden, but on mobile 100vh can exceed the visible viewport
       (iOS URL bar) so the DOCUMENT becomes the scroller and the top bar
       slides away. Lock that, pin the shell to 100%, and keep the header
       sticky as a backstop if any ancestor still scrolls. */
    html:has(.app), html:has(.xs-app),
    body:has(.app), body:has(.xs-app) {
      overflow: hidden;
      overscroll-behavior: none;
    }
    .app, .xs-app {
      height: 100%;
      max-height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      padding-bottom: calc(58px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }
    .app > header, .xs-app > .xs-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
    }
    /* Center column used to be `.panel { overflow-y:auto }`, so SizeBar
       (and ZoomBar) scrolled away with the canvas. Canvas-scroll is the
       scroller; keep the top chrome in flow. */
    .body { min-height: 0; overflow: hidden; }
    .body > .panel { min-height: 0; overflow: hidden; }
    .xs-body { min-height: 0; }
    .canvas-scroll, .xs-canvas-wrap { overscroll-behavior: contain; }
    /* Single-column body (rails + right drawer are not rendered on mobile). */
    .body, .body.rp-closed { grid-template-columns: 1fr; }

    .mobile-toolbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 150;
      display: flex; align-items: center; gap: 4px; overflow-x: auto;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: var(--app-bg); border-top: 1px solid var(--metime-almost-black);
      box-shadow: 0 -2px 6px rgba(0,0,0,0.08); -webkit-overflow-scrolling: touch;
    }
    .mobile-toolbar::-webkit-scrollbar { display: none; }
    .mobile-toolbar .icon-btn { flex-shrink: 0; width: 40px; height: 40px; }
    .mobile-toolbar-divider { flex-shrink: 0; width: 1px; height: 22px; background: var(--warm-hairline); margin: 0 4px; }
    .mt-swatch { display: block; width: 20px; height: 20px; border-radius: 5px; border: 1px solid rgba(0,0,0,0.18); }
    .mt-swatch.empty { border: 1px dashed var(--warm-hairline); background: transparent; }

    /* Selection toolbars become a contextual bar pinned above the toolbar.
       Reuses the existing .selection-toolbar chrome; overrides the JS-computed
       fixed coords with a bottom-anchored, full-width bar. */
    .selection-toolbar.mobile-selbar {
      position: fixed !important; left: 8px; right: 8px; top: auto !important;
      bottom: calc(66px + env(safe-area-inset-bottom)); visibility: visible !important;
      justify-content: center; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .selection-toolbar.mobile-selbar::after { display: none; }
    .xs-selbar.mobile-selbar {
      position: fixed !important; left: 8px !important; right: 8px !important; top: auto !important;
      bottom: calc(66px + env(safe-area-inset-bottom)) !important; transform: none !important;
      justify-content: center; flex-wrap: wrap; row-gap: 6px;
    }

    /* Bottom sheet chrome. */
    .bottom-sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.32); z-index: 200; }
    .bottom-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
      background: var(--metime-white); border-top: 1px solid var(--metime-almost-black);
      border-radius: 14px 14px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,0.20);
      display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
    }
    .bottom-sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--warm-hairline); margin: 8px auto 2px; flex-shrink: 0; }
    .bottom-sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 12px 6px; flex-shrink: 0; }
    .bottom-sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }

    /* Center modal dialogs (.overlay) and the cross-stitch fabric picker become
       bottom sheets on mobile. `!important` is required to override the cards'
       inline styles; desktop keeps the centered dialog untouched. */
    .overlay, .xs-picker { align-items: flex-end !important; }
    .overlay > div, .xs-picker-card {
      max-width: none !important; width: 100% !important; margin: 0 !important;
      border-radius: 14px 14px 0 0 !important; max-height: 88vh !important; overflow-y: auto !important;
      padding-bottom: calc(24px + env(safe-area-inset-bottom)) !important;
    }
  }

  /* Header */
  header { padding: 14px 20px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; flex-shrink: 0; background: var(--app-bg); position: relative; z-index: 5; border-bottom: 1px solid var(--metime-almost-black); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .header-left { display: flex; align-items: center; }
  .header-center { display: flex; align-items: center; justify-content: center; }
  .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }

  /* Brand wordmark (metime) — canvas headers use the compact icon on narrow
     screens so Save keeps padding; setup/proj pages keep the full wordmark. */
  .brand { display: inline-flex; align-items: center; color: var(--metime-almost-black); text-decoration: none; line-height: 0; }
  .brand-mark { height: 28px; width: auto; display: block; }
  .brand-icon { display: none; height: 28px; width: 28px; object-fit: contain; }
  @media (max-width: 900px) {
    .app .brand-mark,
    .xs-app .brand-mark { display: none; }
    .app .brand-icon,
    .xs-app .brand-icon { display: block; }
    .app .header-right .btn,
    .xs-app .header-right .btn { white-space: nowrap; }
  }
  @media (max-width: 560px) {
    .app .brand-icon,
    .xs-app .brand-icon { height: 26px; width: 26px; }
  }

  /* Preset pill (header center) */
  .preset-pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 16px; background: var(--surface-card); border: 1px solid var(--warm-hairline); border-radius: 999px; font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--warm-fg); cursor: pointer; transition: all .12s; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preset-pill:hover { border-color: var(--warm-muted-2); background: var(--warm-hover); }
  .preset-pill[aria-expanded="true"] { border-color: var(--metime-almost-black); }
  .preset-pill .preset-dim { color: var(--warm-muted); font-weight: 400; font-family: var(--font-mono); font-size: 12px; }
  .preset-pill .caret { display: inline-block; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid var(--warm-muted); margin-left: 2px; }

  /* Icon button (used in header + tool rail + popover triggers) */
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 4px; border: 1px solid transparent; background: transparent; color: var(--btn-secondary-fg); cursor: pointer; transition: background .12s, border-color .12s, color .12s, box-shadow .12s, transform var(--press-dur) var(--ease-out); padding: 0; }
  .icon-btn:hover { background: var(--btn-tool-hover); }
  .icon-btn:active { background: var(--btn-secondary-bg-active); }
  .icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .icon-btn[aria-pressed="true"], .icon-btn.active { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-stroke); }
  .icon-btn[aria-pressed="true"]:hover, .icon-btn.active:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-stroke); }
  .icon-btn:disabled { color: var(--btn-disabled-fg); cursor: not-allowed; }
  .icon-btn:disabled:hover { background: transparent; }

  /* Toggle switch (pill on/off control) */
  .switch { display: inline-flex; align-items: center; gap: 8px; background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-sans); font-size: 12px; color: var(--warm-fg-2); user-select: none; }
  .switch-track { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--color-linen-800); border: 1px solid var(--btn-secondary-border); transition: background .12s, border-color .12s; flex-shrink: 0; }
  .switch-knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--metime-white); box-shadow: 0 1px 2px rgba(0,0,0,0.25); transition: transform .12s; }
  .switch[aria-checked="true"] .switch-track { background: var(--color-taupe-900); border-color: var(--color-taupe-900); }
  .switch[aria-checked="true"] .switch-knob { transform: translateX(14px); }
  .switch:focus-visible { outline: none; }
  .switch:focus-visible .switch-track { box-shadow: 0 0 0 3px var(--btn-focus-ring); }

  /* Left tool rail */
  .tool-rail { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; background: var(--app-bg); border-right: var(--div-border); }
  .tool-rail .rail-spacer { flex: 1; }
  .tool-rail .rail-divider { width: 24px; height: 1px; background: var(--warm-hairline); margin: 4px 0; }

  /* Popover (anchored floating panel) */
  .popover-backdrop { position: fixed; inset: 0; z-index: 90; background: transparent; }
  .popover { position: fixed; z-index: 91; background: var(--surface-card); border: 1px solid var(--warm-hairline); border-radius: 8px; box-shadow: 0 10px 32px rgba(0,0,0,0.16); font-family: var(--font-sans); }
  .popover-header { padding: 12px 14px 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .popover-title { font-size: 12px; font-weight: 500; color: var(--warm-fg); }
  .popover-body { padding: 4px 14px 14px; }
  .popover-footer { padding: 10px 14px; border-top: 1px solid var(--warm-divider-soft); display: flex; gap: 8px; justify-content: flex-end; }

  /* Disclosures (collapsible sections inside the right column) */
  .disclosure-toggle { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 0; color: var(--warm-muted); font-family: var(--font-sans); font-size: 11px; font-weight: 500; }
  .disclosure-toggle:hover { color: var(--warm-fg); }
  .disclosure-toggle .chev { display: inline-block; transition: transform .12s; font-size: 9px; }
  .disclosure-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }

  /* Right-column section row (compact backing/binding/etc) */
  .stack-row { display: flex; align-items: center; gap: 10px; }
  .stack-row .stack-main { flex: 1; min-width: 0; }
  .edit-link { background: none; border: none; padding: 0 2px; cursor: pointer; color: var(--warm-muted); font-family: var(--font-sans); font-size: 11px; font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
  .edit-link:hover { color: var(--warm-fg); }

  /* Floating hint pill in canvas */
  .hint-overlay { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: var(--metime-almost-black); color: var(--metime-white); padding: 6px 12px; border-radius: 999px; font-size: 11px; line-height: 1.4; max-width: calc(100% - 32px); display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; box-shadow: 0 4px 16px rgba(0,0,0,0.18); pointer-events: none; }

  /* Top-of-canvas size bar */
  .size-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 20px; border-bottom: var(--div-border); background: var(--surface-canvas); flex-shrink: 0; }
  .size-bar-slider { display: flex; align-items: center; gap: 12px; flex: 1; max-width: 460px; }
  .size-bar-slider input[type=range] { flex: 1; }
  .size-bar-label { font-size: 11px; color: var(--warm-fg-2); font-weight: 500; white-space: nowrap; }
  .size-bar-value { font-size: 12px; color: var(--warm-fg); min-width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  .size-bar-meta { display: flex; gap: 16px; font-size: 11px; color: var(--warm-muted); white-space: nowrap; }
  .size-bar-meta span { font-variant-numeric: tabular-nums; }

  /* Pencil/eraser nib ladder. Each button previews its own nib as a square the
     size of the mark it makes, so the row reads without labels. */
  .nib-bar { display: flex; align-items: center; gap: 4px; }
  .nib-bar .size-bar-label { margin-right: 4px; }
  .nib-btn {
    width: 24px; height: 24px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer;
    color: var(--btn-secondary-fg); transition: background .12s, border-color .12s, color .12s, box-shadow .12s;
  }
  .nib-btn:hover { background: var(--btn-tool-hover); }
  .nib-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .nib-btn.active { background: var(--btn-primary-bg); border-color: var(--btn-stroke); color: var(--btn-primary-fg); }
  .nib-btn.active:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-stroke); }
  .nib-chip { display: block; background: currentColor; border-radius: 1px; }

  /* Coaster set: 4 pages sharing palette/template, edited one at a time. */
  .coaster-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 20px; border-bottom: var(--div-border); background: var(--surface-canvas);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .coaster-tablist {
    display: flex; align-items: stretch;
    border: 1px solid var(--warm-hairline); border-radius: 8px;
    overflow: hidden; background: var(--surface-card);
  }
  .coaster-tab {
    appearance: none; border: none; background: transparent; cursor: pointer;
    padding: 6px 12px; font-family: var(--font-sans); font-size: 12px; font-weight: 500;
    color: var(--warm-muted); border-right: 1px solid var(--warm-hairline); white-space: nowrap;
  }
  .coaster-tab:last-child { border-right: none; }
  .coaster-tab:hover { background: var(--warm-hover); color: var(--warm-fg); }
  .coaster-tab.active { background: var(--metime-almost-black); color: var(--metime-white); }
  .coaster-tab.active:hover { background: var(--metime-almost-black); color: var(--metime-white); }
  .coaster-tab:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--btn-focus-ring); }
  .coaster-copy { flex-shrink: 0; }
  @media (max-width: 900px) {
    .coaster-bar { padding: 8px 14px; }
    .coaster-tab { padding: 6px 9px; font-size: 11px; }
  }

  /* Canvas viewport (scrollable, centered, scaled by zoom).
     `margin: auto` on the child centers a small design and still lets you
     scroll to every edge once zoom makes it larger than the viewport. */
  .canvas-scroll { width: 100%; height: 100%; overflow: auto; display: flex; padding: 24px; box-sizing: border-box; }
  .canvas-scroll > .canvas-frame { flex-shrink: 0; position: relative; background: var(--canvas-bg); margin: auto; }
  .canvas-surface { position: absolute; inset: 0; user-select: none; touch-action: none; }
  .canvas-scroll.is-panning, .xs-canvas-wrap.is-panning { cursor: grab; }
  .canvas-scroll.is-panning:active, .xs-canvas-wrap.is-panning:active { cursor: grabbing; }
  .canvas-scroll.is-panning .canvas-surface, .xs-canvas-wrap.is-panning .xs-canvas { cursor: grab; }

  /* Bottom-of-canvas zoom bar */
  .zoom-bar { display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-top: var(--div-border); background: var(--surface-canvas); flex-shrink: 0; }
  .zoom-bar input[type=range] { flex: 1; max-width: 280px; }
  .zoom-bar-value { font-family: var(--font-mono); font-size: 11px; color: var(--warm-fg-2); min-width: 40px; text-align: right; }

  /* Floating selection toolbar (position+coords are computed in JS, FigJam-style) */
  .selection-toolbar { z-index: 100; display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--surface-card); border: 1px solid var(--warm-hairline); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.16); font-size: 12px; white-space: nowrap; pointer-events: auto; }
  .selection-toolbar-divider { display: inline-block; width: 1px; height: 16px; background: var(--warm-hairline); margin: 0 2px; }
  .selection-swatch-btn { display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: transparent; border: 1px solid transparent; border-radius: 5px; font: inherit; color: inherit; cursor: pointer; transition: background .12s, border-color .12s; }
  .selection-swatch-btn:hover { background: var(--surface-hover, rgba(0,0,0,0.05)); border-color: var(--warm-hairline); }
  .selection-swatch-preview { width: 14px; height: 14px; border: 1px solid rgba(0,0,0,0.12); border-radius: 2px; flex-shrink: 0; display: block; }
  .selection-swatch-mixed { background: conic-gradient(#E8583A 0deg 90deg, #B5BB46 90deg 180deg, #1A2E4C 180deg 270deg, #E1A92F 270deg 360deg); }
  .selection-swatch-name { font-weight: 500; color: var(--warm-fg); }
  .selection-swatch-meta { color: var(--warm-muted); font-family: var(--font-mono); font-size: 11px; }
  .selection-swatch-caret { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid var(--warm-fg-2); margin-left: 2px; }
  .selection-toolbar::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; }
  .selection-toolbar.above::after { bottom: -5px; border-top: 6px solid var(--surface-card); }
  .selection-toolbar.below::after { top: -5px; border-bottom: 6px solid var(--surface-card); }
  .selection-toolbar.clamped::after { display: none; }

  /* Section labels */
  .label { font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--warm-fg); margin-bottom: 10px; }
  .label-mono { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--warm-muted); }

  /* Cards */
  .card { padding: 16px; border-bottom: var(--div-border); }
  .card:last-child { border-bottom: none; }

  /* Inputs */
  input[type=text], input[type=email], select {
    width: 100%; padding: 7px 10px; font-size: 13px; font-family: var(--font-sans);
    border: 1px solid var(--warm-hairline); background: var(--surface-card); color: var(--warm-fg); outline: none;
    border-radius: 4px; transition: border-color .15s;
  }
  input[type=text]:focus, input[type=email]:focus, select:focus { border-color: var(--metime-almost-black); }
  select { appearance: none; -webkit-appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238A8580' stroke-width='1.5' fill='none' stroke-linecap='round'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px; cursor: pointer; }
  input[type=range] { width: 100%; accent-color: var(--metime-almost-black); cursor: pointer; }
  input[type=checkbox] { accent-color: var(--color-taupe-900); cursor: pointer; }
  input[type=color] { width: 32px; height: 28px; padding: 2px; border: 1px solid var(--warm-hairline); background: none; border-radius: 4px; cursor: pointer; }

  /* Buttons — metime design system (Figma node 20-1371).
     Default .btn = Secondary hierarchy, .btn-dark = Primary, .btn-tertiary = Tertiary. */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; font-size: 12px; line-height: 16px; font-family: var(--font-sans); font-weight: 500; border-radius: 4px; cursor: pointer; transition: background .12s, border-color .12s, color .12s, box-shadow .12s, transform var(--press-dur) var(--ease-out); border: 1px solid var(--btn-secondary-border); background: var(--btn-secondary-bg); color: var(--btn-secondary-fg); }
  .btn:hover { background: var(--btn-secondary-bg-hover); border-color: var(--btn-secondary-border); }
  .btn:active { background: var(--btn-secondary-bg-active); }
  .btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .btn:disabled, .btn[disabled] { background: transparent; border-color: var(--btn-secondary-border); color: var(--btn-disabled-fg); cursor: not-allowed; box-shadow: none; }

  .btn-dark { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-stroke); }
  .btn-dark:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-stroke); }
  .btn-dark:active { background: var(--btn-primary-bg-active); border-color: var(--btn-stroke); color: var(--btn-primary-fg-active); }
  .btn-dark:disabled, .btn-dark[disabled] { background: var(--btn-primary-bg-disabled); border-color: var(--btn-stroke); color: var(--btn-disabled-fg); }

  .btn-tertiary { background: transparent; border: none; border-bottom: 1px solid var(--color-taupe-900); border-radius: 0; padding: 0 0 1px; color: var(--color-taupe-900); }
  .btn-tertiary:hover { background: transparent; border-bottom-color: var(--color-taupe-600); color: var(--color-taupe-600); }
  .btn-tertiary:active { background: transparent; border-bottom-color: var(--color-taupe-700); color: var(--color-taupe-700); }
  .btn-tertiary:disabled, .btn-tertiary[disabled] { border-bottom-color: var(--btn-disabled-fg); color: var(--btn-disabled-fg); }

  .btn-sm { padding: 4px 10px; font-size: 11px; }
  .btn-xs { padding: 3px 8px; font-size: 11px; }

  /* Fabric row (clickable color field) */
  .fabric-row { display: flex; gap: 10px; align-items: center; padding: 14px 16px; background: transparent; border: none; border-bottom: var(--div-border); width: 100%; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: background .12s, transform var(--press-dur) var(--ease-out); box-sizing: border-box; }
  .fabric-row:hover { background: var(--warm-hover); }
  .fabric-row:focus-visible { outline: 2px solid var(--selection); outline-offset: -2px; }
  .fabric-row-swatch { width: 28px; height: 28px; border-radius: 4px; flex-shrink: 0; box-sizing: border-box; border: 1px solid var(--warm-hairline); }
  .fabric-row-swatch.empty { border: 1px dashed var(--warm-hairline); background: transparent; }
  .fabric-row-main { flex: 1; min-width: 0; }
  .fabric-row-title { font-size: 12px; font-weight: 500; color: var(--warm-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fabric-row-name { color: var(--warm-muted); font-weight: 400; }
  .fabric-row-detail { font-size: 11px; color: var(--warm-muted); font-family: var(--font-mono); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Color chip */
  .chip { aspect-ratio: 1; border-radius: 4px; border: 1px solid rgba(0,0,0,0.12); cursor: pointer; transition: transform .1s, box-shadow .1s; display: block; width: 100%; }
  .chip:hover { transform: scale(1.06); box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
  .chip.selected { outline: 2pt solid var(--metime-black); outline-offset: 0; box-shadow: none; position: relative; z-index: 2; }

  /* Tag pills */
  .pill { padding: 3px 8px; font-size: 11px; border-radius: 2px; cursor: pointer; border: 1px solid var(--warm-hairline); background: var(--surface-card); color: var(--warm-fg-2); transition: all .12s; }
  .pill.active { background: var(--action); color: var(--metime-white); border-color: var(--action); }
  .pill:not(.active):hover { background: var(--warm-hover); }

  /* Grid canvas */
  .grid-wrap { position: relative; }

  /* Row in materials list */
  .mat-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--warm-divider-soft); }
  .mat-row:last-child { border-bottom: none; }

  /* Slider row */
  .slider-row { display: flex; flex-direction: column; gap: 4px; }
  .slider-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--warm-fg-2); }
  .slider-label span:last-child { font-weight: 500; color: var(--warm-fg); font-variant-numeric: tabular-nums; }

  /* Overlay */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.32); z-index: 100; display: flex; align-items: center; justify-content: center; }

  /* Signed-in account: 24px profile-circle (Figma 7:1132) + email/sign-out menu. */
  .account-menu { position: relative; z-index: 20; }
  .account-menu-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; padding: 0; border: none; background: none;
    color: var(--metime-black); cursor: pointer; line-height: 0;
  }
  .account-menu-btn i { font-size: 24px; width: 24px; height: 24px; line-height: 24px; }
  .account-menu-btn:hover { opacity: 0.7; }
  .account-menu-btn:focus-visible { outline: 2px solid var(--metime-black); outline-offset: 4px; }
  .account-menu-pop {
    position: absolute; top: calc(100% + 10px); right: 0;
    min-width: 200px; max-width: min(280px, calc(100vw - 32px));
    padding: 12px 14px; background: var(--metime-white);
    border: 1px solid var(--metime-black); border-radius: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14);
  }
  .account-menu-email {
    font-family: var(--font-sans); font-size: 13px; font-weight: 400; line-height: 1.3;
    color: var(--warm-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .account-menu-out {
    display: inline-flex; margin-top: 10px; padding: 0; background: none; border: none;
    border-bottom: 1px solid currentColor; border-radius: 0;
    font-family: var(--font-sans); font-size: 13px; font-weight: 500; line-height: 1.2;
    color: var(--metime-black); cursor: pointer;
  }
  .account-menu-out:hover { opacity: 0.7; }
  .account-menu-out:focus-visible { outline: 2px solid var(--metime-black); outline-offset: 3px; }
  .auth-code { letter-spacing: 0.35em; font-size: 22px; font-variant-numeric: tabular-nums; text-align: center; font-family: var(--font-mono); }

  /* Info text */
  .muted { color: var(--warm-muted); }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

  /* Hint strip */
  .hint-strip { padding: 6px 12px; font-size: 11px; color: var(--warm-muted); display: flex; gap: 12px; flex-wrap: wrap; }

  /* Project selector page */
  .proj-page { display: flex; flex-direction: column; height: 100vh; background: var(--metime-cream); overflow: hidden; }
  .proj-header { padding: 14px 20px; display: flex; align-items: center; gap: 16px; border-bottom: none; box-shadow: none; background-color: var(--metime-cream); background-image: repeating-linear-gradient(to right, var(--metime-almost-black) 0, var(--metime-almost-black) 3px, transparent 3px, transparent 7px); background-repeat: no-repeat; background-size: 100% 1px; background-position: bottom left; flex-shrink: 0; }
  .proj-body { flex: 1; overflow-y: auto; padding: 48px 48px 64px; }
  .proj-intro { margin-bottom: 40px; }
  .proj-heading { font-family: var(--font-display); font-size: 36px; line-height: 1.15; letter-spacing: -0.5px; color: #000000; margin-bottom: 6px; }
  .proj-subheading { font-size: 14px; color: #3D4E70; }
  /* auto-fit (not auto-fill) collapses empty trailing tracks so the cards
     stretch to fill the row on desktop; at narrow widths it still resolves to a
     single column, so mobile stacking is unchanged. max-width keeps cards sane
     on very wide screens. Shared by the craft picker and both size selectors. */
  /* Size grids stay 4 / 2 / 1 across so we never get an orphan 3+1 row;
     cards use 1fr so they expand to fill the row. Craft picker keeps auto-fit. */
  .proj-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; gap: 18px; max-width: 1200px; }
  .craft-grid { grid-template-columns: repeat(auto-fit, minmax(188px, 1fr)); max-width: 1200px; }
  @media (max-width: 900px) { .proj-grid:not(.craft-grid) { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .proj-grid:not(.craft-grid) { grid-template-columns: 1fr; } }
  /* Setup-step card box: #707F87 / 4px, matching the palette card (Figma 2138:1989). */
  .proj-card { background: var(--metime-white); border: 1px solid #707F87; border-radius: 4px; overflow: hidden; cursor: pointer; transition: box-shadow 0.15s, transform 0.12s; display: flex; flex-direction: column; }
  .proj-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.13); transform: translateY(-2px); }
  .proj-card:active { transform: translateY(0); }
  .proj-card-thumb { overflow: hidden; background: var(--metime-cream); flex-shrink: 0; }
  .proj-card-thumb svg { display: block; width: 100%; height: auto; }
  .proj-card-thumb.has-photo { aspect-ratio: 4 / 3; }
  .proj-card-thumb.has-photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .proj-card-body { padding: 13px 15px 15px; flex: 1; }
  /* Card name / meta scale shared with .pal-card-name / .pal-card-meta. */
  .proj-card-name { font-size: 14px; font-weight: 500; color: #000000; line-height: normal; margin-bottom: 4px; }
  .proj-card-dims { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; margin-bottom: 2px; }
  .proj-card-desc { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; margin-bottom: 8px; }
  .proj-card-cost { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; border-top: 1px solid #707F87; padding-top: 8px; margin-top: 8px; }
  .proj-card.is-soon { opacity: 0.55; cursor: default; }
  .proj-card.is-soon:hover { box-shadow: none; transform: none; }

  /* Saved designs (Figma Desktop - 4, node 7:1111) — full-bleed bar + 4-col cards.
     Lives as a sibling of .land-main so the viewport-locked landing flex
     cannot clip the grid under the golden footer. */
  .saved-sec { flex: 0 0 auto; background: var(--metime-white); border-top: 1px solid var(--metime-black); }
  .saved-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding: 16px 40px; }
  .saved-head { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0; cursor: pointer; color: var(--metime-black); }
  .saved-head:focus-visible { outline: 2px solid var(--metime-black); outline-offset: 4px; }
  .saved-head-title { font-family: var(--font-sans); font-size: 16px; font-weight: 500; line-height: 1.2; color: var(--metime-black); }
  .saved-count { font-weight: 300; }
  .saved-chev { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; color: var(--metime-black); transition: transform 0.15s; }
  .saved-chev i { font-size: 16px; }
  .saved-chev.is-open { transform: rotate(180deg); }

  /* Template step — same shell as size / backing / palette. */

  .tmpl-upload-file-name { font-family: var(--font-sans); font-size: 20px; font-weight: 500; line-height: 24px; color: var(--metime-black); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
  .tmpl-upload-file-dims { font-family: var(--font-sans); font-size: 14px; font-weight: 300; line-height: 24px; color: var(--metime-black); }

  @media (max-width: 600px) {
    .tmpl-page .tmpl-grid { grid-template-columns: 1fr; }
    .tmpl-page .tmpl-card { border-right: none; }
    .tmpl-page .tmpl-card:nth-child(2n) { border-right: none; }

  /* Cross-stitch editor */
  .xs-app { display: flex; flex-direction: column; height: 100vh; background: var(--metime-cream); overflow: hidden; }
  .xs-topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--metime-almost-black); background: var(--metime-cream); flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  .xs-title { font-family: var(--font-display); font-size: 20px; line-height: 1; color: var(--warm-fg); }
  .xs-sub { font-size: 12px; color: var(--warm-muted); font-family: var(--font-mono); }
  .xs-topbar-spacer { flex: 1; }
  .xs-ctrl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--warm-fg-2); }
  .xs-body { flex: 1; display: flex; min-height: 0; position: relative; }
  .xs-rail { display: flex; flex-direction: column; gap: 6px; padding: 12px 8px; border-right: 1px solid var(--metime-almost-black); background: var(--metime-cream); flex-shrink: 0; }
  /* Cross-stitch tools share the .icon-btn design-system treatment so both canvases match. */
  .xs-tool { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; background: transparent; border-radius: 4px; cursor: pointer; color: var(--btn-secondary-fg); transition: background .12s, border-color .12s, color .12s, box-shadow .12s, transform var(--press-dur) var(--ease-out); padding: 0; }
  .xs-tool:hover { background: var(--btn-tool-hover); }
  .xs-tool:active { background: var(--btn-secondary-bg-active); }
  .xs-tool:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .xs-tool.active { background: var(--btn-primary-bg); color: var(--btn-primary-fg); border-color: var(--btn-stroke); }
  .xs-tool.active:hover { background: var(--btn-primary-bg-hover); border-color: var(--btn-stroke); }
  .xs-canvas-wrap { flex: 1; overflow: auto; display: flex; padding: 24px; background: var(--metime-cream); min-width: 0; }
  .xs-canvas { background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,0.15); image-rendering: pixelated; touch-action: none; margin: auto; flex-shrink: 0; }
  .xs-panel { width: 264px; flex-shrink: 0; border-left: 1px solid var(--metime-almost-black); background: var(--metime-white); display: flex; flex-direction: column; min-height: 0; }
  .xs-panel-head { padding: 14px 16px 8px; }
  .xs-panel-title { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--warm-fg-2); text-transform: uppercase; }
  .xs-current { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--warm-divider-soft); }
  .xs-current-chip { width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.15); flex-shrink: 0; }
  .xs-swatches { flex: 1; overflow-y: auto; padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 8px; align-content: start; }
  .xs-swatch { position: relative; aspect-ratio: 1; border-radius: 6px; border: 1px solid rgba(0,0,0,0.15); cursor: pointer; transition: transform .1s; }
  .xs-swatch:hover { transform: scale(1.08); }
  .xs-swatch.active { outline: 2pt solid var(--metime-black); outline-offset: 0; }
  .xs-add { margin: 0 16px 14px; padding: 8px; border: 1px dashed var(--warm-muted); background: none; border-radius: 8px; cursor: pointer; font-size: 12px; color: var(--warm-fg-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .xs-add:hover { border-color: var(--metime-almost-black); color: var(--warm-fg); }
  .xs-picker { position: fixed; inset: 0; background: rgba(0,0,0,0.28); display: flex; align-items: center; justify-content: center; z-index: 60; }
  .xs-picker-card { background: #fff; border-radius: 10px; width: 460px; max-width: calc(100vw - 32px); max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.2); overflow: hidden; }
  .xs-picker-list { overflow-y: auto; padding: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
  .xs-picker-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .xs-picker-item:hover { background: var(--metime-cream); border-color: var(--warm-hairline); }
  .xs-picker-dot { width: 20px; height: 20px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.15); flex-shrink: 0; }
  .xs-picker-code { font-size: 12px; font-weight: 600; color: var(--warm-fg); }
  .xs-picker-name { font-size: 10px; color: var(--warm-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xs-materials { position: absolute; bottom: 16px; right: 280px; width: 232px; background: var(--metime-white); border: 1px solid var(--warm-hairline); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,0.16); overflow: hidden; z-index: 20; }
  .xs-materials-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; cursor: pointer; user-select: none; }
  .xs-materials-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 14px 12px; }
  .xs-materials-num { font-size: 26px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1; font-family: var(--font-display); }
  .xs-materials-list { border-top: 1px solid var(--warm-divider-soft); max-height: 180px; overflow-y: auto; }
  .xs-materials-row { display: flex; align-items: center; gap: 8px; padding: 6px 14px; }
  .xs-materials-dot { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.15); flex-shrink: 0; }

  /* Palette selector page */
  .pal-body { max-width: none; }
  /* Setup-step intro — heading row carries the top-right skip (Figma 2151:266) */
  .pal-head-row { display: flex; align-items: center; gap: 16px; }
  .pal-head-row .proj-heading { flex: 1; min-width: 0; margin-bottom: 0; }
  .pal-head-row + .proj-subheading { margin-top: 6px; }
  .pal-body .proj-subheading { font-size: 14px; font-weight: 400; color: #3D4E70; }
  .pal-section { margin-bottom: 36px; }
  .pal-section-head { margin-bottom: 14px; }
  /* Palette-step section labels — Söhne Kräftig 20 / Buch 13 (Figma 2151:261) */
  .pal-section-title { font-size: 20px; font-weight: 500; letter-spacing: 0; color: #000000; }
  .pal-section-sub { font-size: 13px; font-weight: 400; color: #3D4E70; margin-top: 3px; }
  /* Even rows that divide both 6 (DMC) and 12 (Kona) sample counts:
     6 / 4 / 3 / 2 columns. minmax(0,1fr) lets cards share space equally and grow. */
  .pal-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-auto-rows: 1fr;
    gap: 14px;
    width: 100%;
  }
  @media (min-width: 1800px) {
    .pal-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  @media (max-width: 1200px) {
    .pal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .pal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 480px) {
    .pal-grid { grid-template-columns: 1fr; }
  }
  /* Sample palette card — Figma metime design system node 2151:47.
     Sized for up to 8 overlapping 32px swatches plus padding.
     Box border #707F87; swatch stroke = 1pt inset black @ 50%. */
  .pal-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    width: 100%; height: 100%; min-width: 0; box-sizing: border-box;
    padding: 16px 12px 12px; background: var(--metime-white);
    border: 1px solid #707F87; border-radius: 4px;
    cursor: pointer; transition: box-shadow 0.15s, transform 0.12s;
    text-align: left; font: inherit; color: inherit;
  }
  .pal-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.13); transform: translateY(-2px); }
  .pal-card:active { transform: translateY(0); }
  .pal-card.selected { box-shadow: 0 0 0 2px #707F87; }
  .pal-swatches { display: flex; align-items: center; height: 32px; width: 100%; }
  .pal-swatch {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    border: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
    box-sizing: border-box; margin-left: -6px; display: block; position: relative;
  }
  .pal-swatch:first-child { margin-left: 0; }
  .pal-card-body { padding: 10px 0 0; min-width: 0; width: 100%; }
  /* Figma: Söhne Kräftig 14 / Buch 13 */
  .pal-card-name { font-size: 14px; font-weight: 500; color: #000000; line-height: normal; }
  .pal-card-meta { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; margin-top: 4px; }

  /* Upload */
  .pal-upload {
    display: flex; flex-direction: column; align-items: stretch; gap: 10px;
    text-align: left; cursor: default; width: 50%; max-width: 100%; box-sizing: border-box;
  }
  .pal-upload-drop {
    display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px;
    border: 1px dashed #707F87; border-radius: 4px; padding: 10px 14px; text-align: left;
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
    background: var(--metime-white);
  }
  .pal-upload-drop:hover, .pal-upload-drop.drag { border-color: var(--metime-almost-black); background: var(--warm-hover); }
  .pal-upload-icon { color: #3D4E70; display: inline-flex; flex-shrink: 0; }
  .pal-upload-title { font-size: 14px; font-weight: 500; color: #000000; line-height: normal; }
  .pal-upload-sub { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; margin-top: 4px; }
  .pal-upload-hit { cursor: pointer; }
  .pal-upload-hit:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .pal-upload-add { align-self: flex-start; }
  .pal-upload-sheet .popover-title {
    font-family: var(--font-sans); font-size: 16px; font-weight: 500; color: var(--metime-black);
  }
  .pal-upload-sheet .bottom-sheet-head { padding: 4px 16px 8px; }
  .pal-upload-sheet-body { display: flex; flex-direction: column; gap: 8px; padding: 4px 16px 16px; }
  .pal-upload-sheet-hint { font-family: var(--font-sans); font-size: 13px; font-weight: 400; color: var(--warm-muted); line-height: 1.35; margin: -2px 0 4px; }
  .pal-upload-method {
    display: flex; align-items: flex-start; gap: 12px; width: 100%;
    padding: 12px 14px; text-align: left; cursor: pointer;
    font: inherit; color: inherit;
    background: var(--metime-white); border: 1px solid var(--metime-black); border-radius: 6px;
  }
  .pal-upload-method:hover { background: var(--color-linen-300); }
  .pal-upload-method[aria-pressed="true"] { background: var(--metime-ice); border-color: var(--metime-almost-black); }
  .pal-upload-method:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .pal-upload-method:disabled { opacity: 0.5; cursor: default; }
  .pal-upload-method-icon { display: inline-flex; flex-shrink: 0; color: var(--metime-almost-black); margin-top: 1px; }
  .pal-upload-method-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pal-upload-method-title { font-family: var(--font-sans); font-size: 14px; font-weight: 500; color: var(--metime-black); line-height: 1.25; }
  .pal-upload-method-sub { font-family: var(--font-sans); font-size: 12px; font-weight: 400; color: var(--warm-muted); line-height: 1.3; }
  .pal-upload-method-block { display: flex; flex-direction: column; gap: 8px; }
  .pal-upload-method-block .pal-upload-url { padding: 0; background: transparent; border-radius: 0; }
  .pal-upload-method-block .pal-upload-url-row { flex-direction: column; }
  .pal-upload-method-block .pal-upload-url-row button { width: 100%; }
  .bottom-sheet-backdrop.is-lift { z-index: 240; }
  .bottom-sheet.is-lift { z-index: 241; }
  .pal-upload-pills { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: flex-start; }
  .pal-upload-pill {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 32px; padding: 0 24px;
    font-family: var(--font-sans); font-size: 16px; font-weight: 400; line-height: 1;
    color: var(--metime-black); background: var(--metime-ice);
    border: none; border-radius: 8px; cursor: pointer;
  }
  .pal-upload-pill:hover { background: #A9BDE6; }
  .pal-upload-pill[aria-pressed="true"] { background: #A9BDE6; }
  .pal-upload-pill:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .pal-upload-pill-kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 28px; height: 18px; padding: 0 5px;
    font-family: var(--font-sans); font-size: 11px; font-weight: 500; line-height: 1;
    color: var(--metime-black); background: transparent;
    border: 1px solid var(--metime-black); border-radius: 4px;
  }
  .pal-upload-url {
    position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    width: 100%; padding: 10px; box-sizing: border-box;
    background: var(--color-linen-500); border-radius: 6px;
    cursor: default; text-align: left;
  }
  .pal-upload-url-label {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .pal-upload-url-row { display: flex; gap: 6px; width: 100%; }
  .pal-upload-url-row input {
    flex: 1; min-width: 0; height: 32px; padding: 0 10px;
    font-family: var(--font-sans); font-size: 13px; font-weight: 400;
    border: 1px solid var(--metime-black); border-radius: 4px;
    background: var(--metime-white); color: var(--warm-fg);
  }
  .pal-upload-url-row input:focus { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .pal-upload-url-row input:disabled { opacity: 0.6; }
  .pal-upload-url-row button {
    flex-shrink: 0; height: 32px; padding: 0 12px;
    font-family: var(--font-sans); font-size: 12px; font-weight: 500;
    border: 1px solid var(--metime-black); border-radius: 4px;
    background: var(--metime-white); color: var(--metime-black); cursor: pointer;
  }
  .pal-upload-url-row button:hover:not(:disabled) { background: var(--warm-hover); }
  .pal-upload-url-row button:disabled { opacity: 0.45; cursor: default; }
  .err-msg {
    background: var(--metime-grapefruit); color: var(--metime-white);
    border-radius: 4px; padding: 8px 10px;
    font-family: var(--font-sans); font-weight: 400; line-height: 1.35;
  }
  .pal-upload-error {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 12px; padding: 8px 10px;
  }
  .pal-result { display: flex; gap: 20px; align-items: flex-start; background: var(--metime-white); border: 1px solid #707F87; border-radius: 4px; padding: 16px; }
  /* outline (not a border) so the stroke paints over the image content */
  .pal-result-preview { width: 120px; height: 120px; object-fit: cover; flex-shrink: 0; display: block; box-sizing: border-box; border: none; outline: 1px solid rgba(0, 0, 0, 0.5); outline-offset: -1px; }
  .pal-result-main { flex: 1; min-width: 0; }
  .pal-result-swatches { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 14px; }

  /* Suggested palette from image — Figma metime design system node 2151:24 */
  .pal-from-image {
    display: flex; gap: 20px; align-items: flex-start;
    background: var(--metime-white); border: 1px solid #707F87;
    border-radius: 4px; padding: 25px 16px 16px; box-sizing: border-box;
    width: fit-content; max-width: 100%;
  }
  .pal-from-image-preview {
    width: 100px; height: 100px; object-fit: cover; flex-shrink: 0;
    border: none; display: block; box-sizing: border-box;
    background-color: var(--ice-100);
    background-image:
      linear-gradient(45deg, var(--ice-200) 25%, transparent 25%),
      linear-gradient(-45deg, var(--ice-200) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--ice-200) 75%),
      linear-gradient(-45deg, transparent 75%, var(--ice-200) 75%);
    background-size: 12px 12px;
    background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    /* outline (not inset box-shadow) so the stroke paints over the image content */
    outline: 1px solid rgba(0, 0, 0, 0.5); outline-offset: -1px;
  }
  .pal-from-image-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
  .pal-from-image-swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pal-from-image-swatch {
    position: relative; width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0;
    border: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.5);
    box-sizing: border-box; padding: 0; cursor: pointer; overflow: hidden;
  }
  .pal-from-image-x {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(245, 243, 238, 0.72); color: var(--metime-almost-black);
    opacity: 0; transition: opacity .12s; pointer-events: none;
  }
  .pal-from-image-x svg { width: 22px; height: 22px; }
  @media (hover: hover) and (pointer: fine) {
    .pal-from-image-swatch:hover .pal-from-image-x { opacity: 1; }
  }
  .pal-from-image-swatch.armed .pal-from-image-x { opacity: 1; }
  .pal-from-image-add {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    border: 1px dashed var(--ice-400); background: var(--metime-white);
    color: #3D4E70; font-size: 20px; line-height: 1; font-weight: 400;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; font-family: inherit;
  }
  .pal-from-image-add:hover { background: var(--warm-hover); }
  .pal-from-image-use {
    padding: 13px 24px; border-radius: 6px; font-size: 15px; font-weight: 500; line-height: normal;
  }
  .pal-chip { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .pal-chip-check { width: 14px; height: 14px; accent-color: var(--color-taupe-900); cursor: pointer; margin: 0; }
  .pal-chip-color { width: 34px; height: 34px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.12); transition: box-shadow 0.12s, border-color 0.12s; }
  .pal-chip.locked .pal-chip-color { border-color: var(--metime-almost-black); box-shadow: 0 0 0 2px var(--metime-almost-black); }
  .pal-chip-label { font-size: 10px; color: var(--warm-muted); font-family: var(--font-mono); }
  .pal-chip.locked .pal-chip-label { color: var(--warm-fg); font-weight: 500; }
  .pal-check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--warm-fg); cursor: pointer; margin-bottom: 14px; user-select: none; }
  .pal-check input { width: 15px; height: 15px; accent-color: var(--color-taupe-900); cursor: pointer; }
  .pal-actions { display: flex; gap: 10px; align-items: center; }
  /* Same box as .pal-skip-btn: 6px radius, 10/18 padding, Söhne Kräftig 14. */
  .pal-btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 6px; font: inherit; font-size: 14px; font-weight: 500; line-height: normal; cursor: pointer; border: 1px solid var(--metime-almost-black); background: var(--action); color: var(--metime-white); transition: background 0.12s, transform var(--press-dur) var(--ease-out); }
  .pal-btn:hover { background: var(--action-hover); }
  .pal-btn.secondary { background: var(--metime-white); border-color: var(--metime-black); color: #000000; }
  .pal-btn.secondary:hover { background: var(--color-linen-300); }
  .pal-skip-row { display: flex; justify-content: flex-end; margin-top: 8px; margin-bottom: 0; }
  /* Skip for now — Figma 2151:263; box border overridden to #707F87 */
  .pal-skip-btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 10px 18px; border-radius: 6px;
    border: 1px solid var(--metime-black); background: var(--metime-white);
    color: #000000; font-family: var(--font-sans); font-size: 14px; font-weight: 500;
    line-height: normal; cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s, transform var(--press-dur) var(--ease-out);
  }
  .pal-skip-btn:hover { background: var(--color-linen-300); }
  .pal-skip-btn:active { background: var(--color-linen-500); }
  .pal-skip-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .pal-busy { font-size: 13px; color: var(--warm-muted); padding: 8px 0; }

  /* Template selector */
  .tmpl-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 900px) { .tmpl-grid { grid-template-columns: repeat(2, 1fr); } }
  .tmpl-card { background: var(--metime-white); border: 1px solid #707F87; border-radius: 4px; overflow: hidden; cursor: pointer; transition: box-shadow 0.15s, transform 0.12s; text-align: left; font: inherit; color: inherit; padding: 0; }
  .tmpl-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.13); transform: translateY(-2px); }
  .tmpl-card:active { transform: translateY(0); }
  .tmpl-card-thumb { background: var(--metime-cream); height: 230px; display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; }
  .tmpl-card-thumb svg { display: block; width: 100%; height: 100%; }
  /* Templates that know their own grid size (--tmpl-ar = width/height, set per
     card) preview at that proportion instead of inside a fixed box, so a 30x120
     bookmark chart reads as a tall strip. Height is capped at --tmpl-thumb-h and
     the strip is centered, keeping cards a sane size; no plate behind the art. */
  .tmpl-card-thumb.is-ratio { background: none; height: auto; }
  .tmpl-card-thumb.is-ratio svg { width: min(100%, calc(var(--tmpl-thumb-h, 300px) * var(--tmpl-ar))); height: auto; aspect-ratio: var(--tmpl-ar); }
  .tmpl-card-body { padding: 12px 15px 15px; }
  .tmpl-card-name { font-size: 14px; font-weight: 500; color: #000000; line-height: normal; margin-bottom: 4px; }
  .tmpl-card-desc { font-size: 13px; font-weight: 400; color: #3D4E70; line-height: normal; }
  /* Back link — tertiary text style (Figma Button Tertiary Medium): Söhne Kräftig 14, taupe-900.
     Chevron sits outside the underline so only the label is underlined. */
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-sans); font-size: 14px; font-weight: 500; line-height: 20px;
    color: var(--color-taupe-900); cursor: pointer;
    border: none; border-radius: 0;
    background: none; padding: 0; margin-bottom: 14px;
  }
  .back-link svg { width: 16px; height: 16px; flex-shrink: 0; }
  .back-link span { border-bottom: 1px solid currentColor; padding-bottom: 1px; }
  .back-link:hover { color: var(--color-taupe-600); }
  .back-link:active { color: var(--color-taupe-700); }

  /* Editable "suggested palette" (photo → palette step): swap or remove each floss. */
  .pal-suggest { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; align-items: flex-start; }
  .pal-suggest-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pal-suggest-swatch { width: 44px; height: 44px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.15); cursor: pointer; padding: 0; transition: transform .1s; }
  .pal-suggest-swatch:hover { transform: scale(1.06); }
  .pal-suggest-rm { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; border: none; background: var(--metime-black); color: var(--metime-white); font-size: 11px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .pal-suggest-code { font-size: 10px; color: var(--warm-muted); font-family: var(--font-mono); }
  .pal-suggest-add { width: 44px; height: 44px; border-radius: 8px; border: 1px dashed var(--warm-muted); background: none; color: var(--warm-fg-2); font-size: 20px; line-height: 1; cursor: pointer; }
  .pal-suggest-add:hover { border-color: var(--metime-almost-black); color: var(--warm-fg); }

  /* Backing-fabric picker: theme filters + dense swatch grid. Filters share the
     .pal-skip-btn box (white / #707F87 / 6px / Söhne Kräftig 14). */
  .fabric-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .fabric-filter { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 6px; border: 1px solid var(--metime-black); background: var(--metime-white); color: #000000; font-family: var(--font-sans); font-size: 14px; font-weight: 500; line-height: normal; cursor: pointer; transition: background .12s, border-color .12s, color .12s, transform var(--press-dur) var(--ease-out); }
  .fabric-filter:not(.active):hover { background: var(--color-linen-300); }
  .fabric-filter.active { background: var(--action); border-color: var(--metime-almost-black); color: var(--metime-white); }
  .fabric-filter-count { font-size: 13px; font-weight: 400; opacity: 0.7; }
  .fabric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .fabric-card { padding: 0; border: 1px solid #707F87; border-radius: 4px; overflow: hidden; cursor: pointer; background: var(--metime-white); font: inherit; transition: box-shadow .15s, transform .12s; }
  .fabric-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.13); transform: translateY(-2px); }
  .fabric-card:active { transform: translateY(0); }
  .fabric-card.selected { box-shadow: 0 0 0 2px var(--metime-almost-black); }
  .fabric-thumb { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }

  /* Full-res fabric enlarge (studio swatch + picker confirm). Sits above
     bottom sheets so it still works from the mobile fabrics sheet. */
  .overlay-lift { z-index: 220; }
  .fabric-enlarge {
    background: var(--metime-white); border: 1px solid #CCD6EB; border-radius: 8px;
    padding: 20px 24px; max-width: min(720px, calc(100vw - 32px)); width: 100%;
    max-height: 90vh; overflow: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.14);
    box-sizing: border-box;
  }
  .fabric-enlarge-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .fabric-enlarge-name { font-family: var(--font-display); font-size: 24px; font-weight: 400; line-height: 1.1; color: #000000; min-width: 0; }
  .fabric-enlarge-img {
    display: block; width: 100%; max-height: min(70vh, 640px); object-fit: contain;
    background: var(--metime-cream); border: 1px solid #707F87; border-radius: 4px;
  }
  .fabric-enlarge-swatch {
    width: 100%; max-height: min(70vh, 640px); aspect-ratio: 1; border: 1px solid #707F87; border-radius: 4px;
  }
  .fabric-enlarge-stage { position: relative; }
  .fabric-enlarge-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 1;
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; padding: 0;
    background: var(--metime-white); border: 1px solid var(--metime-black); border-radius: 4px;
    color: var(--metime-black); cursor: pointer;
  }
  .fabric-enlarge-nav.is-prev { left: 8px; }
  .fabric-enlarge-nav.is-next { right: 8px; }
  .fabric-enlarge-nav:hover { background: #EDF2FC; }
  .fabric-enlarge-nav:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--btn-focus-ring); }
  .fabric-enlarge-count {
    font-family: var(--font-sans); font-size: 13px; font-weight: 400;
    color: #3D4E70; white-space: nowrap; margin-left: auto; margin-right: 8px;
  }
  .fabric-enlarge-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  /* In-studio backing picker (reuses the setup catalog). */
  .backing-picker-dialog {
    background: var(--metime-white); border: 1px solid #CCD6EB; border-radius: 8px;
    max-width: 860px; width: 100%; margin: 16px; max-height: 90vh;
    box-shadow: 0 8px 32px rgba(0,0,0,0.14); display: flex; flex-direction: column;
    overflow: hidden; box-sizing: border-box;
  }
  .backing-picker-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 20px 24px 12px; border-bottom: 1px solid #EDF2FC; flex-shrink: 0;
  }
  .backing-picker-title { font-family: var(--font-display); font-size: 24px; font-weight: 400; line-height: 1.1; color: #000000; }
  .backing-picker-body { overflow-y: auto; padding: 20px 24px 24px; flex: 1; min-height: 0; }
  .backing-picker-dialog .pal-upload { width: 100%; max-width: 360px; }
  .backing-current {
    display: block; width: 100%; margin: 0 0 20px; padding: 0; border: 1px solid #707F87;
    border-radius: 4px; overflow: hidden; background: var(--metime-white); cursor: zoom-in;
    font: inherit; color: inherit; text-align: left;
  }
  .backing-current:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.13); }
  .backing-current-img { display: block; width: 100%; height: 220px; object-fit: cover; }
  .backing-current-caption { padding: 10px 12px; font-size: 13px; color: #3D4E70; }
  .fabric-row-swatch.can-enlarge { cursor: zoom-in; }
  .fabric-row-swatch.can-enlarge:hover { outline: 2px solid var(--selection); outline-offset: 1px; }

  /* Mobile-friendly project setup screens (size / template / palette steps). */
  @media (max-width: 640px) {
    .fabric-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .fabric-filters { gap: 6px; }
    .fabric-filter { padding: 8px 14px; font-size: 13px; }
    .proj-body { padding: 24px 16px 56px; }
    .proj-heading { font-size: 28px; }
    .proj-intro { margin-bottom: 28px; }
    .pal-head-row { flex-direction: column; align-items: flex-start; gap: 12px; }
    .pal-section { margin-bottom: 28px; }
    .pal-section-title { font-size: 18px; }
    .pal-upload { width: 100%; max-width: none; }
    .tmpl-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; --tmpl-thumb-h: 240px; }
    .tmpl-page .tmpl-grid { gap: 0; }
    .pal-grid { gap: 12px; }
    .pal-result { flex-direction: column; gap: 14px; }
    .pal-result-preview { width: 100%; height: 160px; }
    .pal-actions { flex-wrap: wrap; }
    .pal-from-image { flex-direction: column; gap: 16px; padding: 14px; width: 100%; }
    .pal-from-image-preview { width: 100%; height: auto; aspect-ratio: 1; max-width: 220px; }
    .pal-from-image-main { gap: 20px; width: 100%; }
    .pal-from-image-swatch, .pal-from-image-add { width: 48px; height: 48px; }
    .pal-from-image-add { font-size: 20px; }
    .pal-from-image-use { width: 100%; justify-content: center; }
    .backing-current-img { height: 160px; }
    .fabric-enlarge-name, .backing-picker-title { font-size: 22px; }
  }

  /* ── Press feedback ────────────────────────────────────────────────────────
     Everything pickable dips under the pointer so a tap reads as a press
     before the next screen arrives. These rules sit last in the sheet on
     purpose: the band-card steps flatten the boxed-card hover lift with
     `transform: none`, and the dip has to land after that to win. Cards
     marked "coming soon" aren't pickable, so they stay put. */
  .size-card, .land-craft, .saved-card, .back-skip, .saved-filter {
    transition: transform var(--press-dur) var(--ease-out);
  }
  .btn:active, .icon-btn:active, .xs-tool:active, .pill:active, .chip:active,
  .fabric-row:active, .fabric-filter:active, .saved-filter:active,
  .pal-btn:active, .pal-skip-btn:active, .pal-suggest-swatch:active {
    transform: scale(var(--press-scale));
  }
  /* Already centered on its own transform, so the dip has to compose with it. */
  .back-skip:active { transform: translateY(-50%) scale(var(--press-scale)); }

  /* On the boxed cards the dip replaces the hover lift rather than stacking on
     it, since a bare scale() drops the hover's translateY. */
  .proj-card:not(.is-soon):active, .pal-card:active, .tmpl-card:active, .fabric-card:active,
  .size-card:active, .land-craft:not(.is-soon):active, .saved-card:active,
  .pal-page .pal-card:active, .tmpl-page .tmpl-card:active, .back-grid .fabric-card:active {
    transform: scale(var(--press-scale-card));
  }

  /* ── Step-to-step transitions ──────────────────────────────────────────────
     Every setup step is its own component, so React remounts the page root
     when the step changes and this enter animation runs once per screen.
     <html> carries the direction of travel (set in Root from STEP_DEPTH) so
     Back slides in from the other side. Translate only, never scale: the
     studios measure their canvas on mount and a scale would report the wrong
     size. */
  .land-page, .size-page, .back-page, .pal-page, .tmpl-page, .app, .xs-app {
    --step-from: 16px;
    animation: step-in var(--step-dur) var(--ease-out) both;
  }
  /* Only the offset flips, so the reduced-motion `animation: none` below stays
     the single animation declaration and doesn't have to out-specify this. */
  :root[data-nav="back"] .land-page,
  :root[data-nav="back"] .size-page,
  :root[data-nav="back"] .back-page,
  :root[data-nav="back"] .pal-page,
  :root[data-nav="back"] .tmpl-page,
  :root[data-nav="back"] .app,
  :root[data-nav="back"] .xs-app { --step-from: -16px; }

  @keyframes step-in {
    from { opacity: 0; transform: translate3d(var(--step-from), 0, 0); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --press-scale: 1; --press-scale-card: 1; }
    .land-page, .size-page, .back-page, .pal-page, .tmpl-page, .app, .xs-app {
      animation: none;
    }
  }
</style>

const { useState, useMemo, useRef, useEffect, useLayoutEffect, useCallback, useId, createContext, useContext } = React;
const AuthContext = createContext(null);

// ── Supabase config (accounts + saved designs) ─────────────────────────────
// FILL THESE IN. Both come from the Supabase dashboard:

//     • "anon public" key    → SUPABASE_ANON_KEY   (labeled "Publishable" in

// The anon key is PUBLIC/client-safe by design — exactly like the Shopify
// Storefront token below. It only grants what Row Level Security allows, which
// for this app is "a signed-in user's own designs and nothing else". The
// service_role key is the dangerous one: it lives only in Vercel env vars and
// must never appear in this file.
//
// Full setup (email OTP, the {{ .Token }} template edit, the SQL to run) is in
// SUPABASE_SETUP.md.
const SUPABASE_URL = "https://aizynuvwoefxynjsglxr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_gxOtWjKV5k7jXd5rQTiXBA_UzHVTidL";

// True once the placeholders above are replaced. Kept separate from the CDN
// check below because the two failures deserve very different treatment: never
// filling these in is a choice, whereas filling them in and getting local-only
// saves anyway is a bug the person can't see.
function supabaseKeysPresent() {

    !!SUPABASE_URL && !SUPABASE_URL.includes("YOUR-PROJECT-REF") &&

}

// True once the UMD bundle in <head> has run. It's a synchronous <script>, so
// this is settled before any of the app code below executes — but a blocked or
// failed request leaves the global missing forever, hence the recheck in
// AuthProvider rather than a single snapshot at startup.
function supabaseClientLoaded() {

}

// True only once the placeholders above are replaced AND the CDN client loaded.
// Same defensive pattern as shopifyConfigured(): with Supabase unconfigured the
// studio keeps working exactly as it did before accounts existed — designs save
// to this device's localStorage and nothing ever asks for an email.
function supabaseConfigured() {

}

// How long to keep looking for the CDN global before calling it a loss. Only
// reached when the keys are real, so the wait costs nothing for a studio that

const SUPABASE_LOAD_GRACE_MS = 5000;

// Said once, loudly, and only when the keys are real: a studio with a working

let _warnedNoClient = false;
function warnSupabaseUnreachable() {

    "[metime] Supabase is configured but supabase-js never loaded, so accounts " +
